# Fictional locations, values, resistance classes, contracts and year schedule.
profile = "windstorm-europe-research-v1"
annual_schedule_basis = "explicit_user_scenario_not_calibrated"
seed = 2026
bounds = [-5, 45, 16, 56]
hazard_source = "ERA5_StormFootprint_Database_Europe_Winter_1995-2015.nc"
year_ids = [1, 2, 3]

[responses.weak]
path = "CURVES_feuerstein_koks.csv"
sha256 = "d960e67ab726815974feb08e5850054d7fac2873ea5bb3b02956e6262da7fd81"
kind = "construction_percent_deterministic"
column = "weakest outbuilding"

[responses.strong]
path = "CURVES_feuerstein_koks.csv"
sha256 = "d960e67ab726815974feb08e5850054d7fac2873ea5bb3b02956e6262da7fd81"
kind = "construction_percent_deterministic"
column = "strong brick structure"

[[buildings]]
building_id = "synthetic-London"
policy_id = "London"
country = "GB"
dependence_group = "London"
response_id = "weak"
longitude = -0.12
latitude = 51.5
