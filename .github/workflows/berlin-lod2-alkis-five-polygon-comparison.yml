name: Berlin 2022 LoD2 height vs current ALKIS five-polygon topology

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_lod2_alkis_five_polygon_comparison_v0.py
      - tests/test_berlin_lod2_alkis_five_polygon_comparison_v0.py
      - .github/workflows/berlin-lod2-alkis-five-polygon-comparison.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-lod2-alkis-five-polygon-comparison.yml

permissions:
  contents: read

concurrency:
  group: berlin-two-provider-building-height-topology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-height-and-alkis-sample:
    name: Two source 5-feature height and building IoU audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exactly reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install reviewed Shapely and projected CRS libraries
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Offline fake source and ambiguous split geometry regressions
        run: python -m unittest tests.test_berlin_lod2_alkis_five_polygon_comparison_v0 -v
      - name: Two official fixed original samples, no provider feature output
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_lod2_alkis_five_polygon_comparison_v0 --live
