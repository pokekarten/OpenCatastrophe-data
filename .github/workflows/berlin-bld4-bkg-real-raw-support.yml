name: Berlin real BLD4 buildings x BKG raw-raster support

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_bld4_bkg_original_raw_cell_support_v0.py
      - tests/test_berlin_bld4_bkg_original_raw_cell_support_v0.py
      - .github/workflows/berlin-bld4-bkg-real-raw-support.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-bld4-bkg-real-raw-support.yml

permissions:
  contents: read

concurrency:
  group: berlin-bld4-bkg-raw-support-${{ github.ref }}
  cancel-in-progress: false

jobs:
  polygon-source-support:
    name: Independent BLD4 to real raw BKG pixels (aggregate only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed original-source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.12 for pinned rasterio 1.5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Review-pinned raster and projected polygon runtimes
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt rasterio==1.5.0
          python -m pip check
          python -c 'import rasterio, numpy, pyproj, shapely; print("EPSG and polygon runtime verified")'
      - name: Offline synthetic raw positive, valid zero and masked area conservation
        run: |
          python -m unittest tests.test_berlin_bld4_bkg_original_raw_cell_support_v0 -v
          python -m unittest tests.test_berlin_bld4_synthetic_flood_cell_join_v0 -v
      - name: Strict original CAT1/CAT2 + one Berlin ALKIS WFS + one 47MB BKG TIFF
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/berlin-bkg-raw-support"
          mkdir -m 700 "$root"
          trap 'rm -rf "$root"' EXIT
          geofile="$root/deu-adm1-original.geojson"
          nutsfile="$root/deu-nuts2021-10M-original.json"
          geodb="$root/berlin-geo.cat.sqlite"
          nutsdb="$root/berlin-nuts.cat.sqlite"
          bld="$root/berlin-five.cat.sqlite"
          tiff="$root/bkg-kostra-original.tif"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 120 --retry 0 --max-filesize 7340032 \
            --output "$geofile" \
            'https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/DEU/ADM1/geoBoundaries-DEU-ADM1.geojson'
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 90 --retry 0 --max-filesize 500000 \
            --output "$nutsfile" \
            'https://raw.githubusercontent.com/eurostat/Nuts2json/8186be451525164ea24b43560cb943fda7c5520c/pub/v2/2021/4326/10M/nutsrg_1.json'
          python -m research_runners.geoboundaries_deu_adm1_cat_sqlite_v0 \
            --original-geojson "$geofile" --output "$geodb" > /dev/null
          python -m research_runners.geoboundaries_deu_adm1_nuts2021_crosswalk_v0 \
            --geo-original "$geofile" --nuts2021-original "$nutsfile" \
            --nuts-scale 10M --output "$nutsdb" > /dev/null
          python -m research_runners.berlin_alkis_gebaeude_five_feature_join_v0 \
            --live --cat1 "$geodb" --cat2 "$nutsdb" \
            --cat4-output "$bld" > /dev/null
          # One exact BKG TIFF GET, strict 70 MiB cap. Never echo provider bytes.
          python - "$tiff" <<'PY'
          import sys
          from pathlib import Path
          from research_runners.probe_bkg_berlin_kostra_direct_tiff_v0 import download_exact_source
          from research_runners.berlin_bld4_bkg_original_raw_cell_support_v0 import (
              FULL_ORIGINAL_BKG_BYTES, FULL_ORIGINAL_BKG_SHA256,
          )
          receipt=download_exact_source(Path(sys.argv[1]))
          if (receipt["source_original_bytes"] != FULL_ORIGINAL_BKG_BYTES or
                  receipt["source_full_tiff_sha256_locally_calculated"] != FULL_ORIGINAL_BKG_SHA256):
              raise SystemExit("BLOCKED: original BKG TIFF changed since independent receipt")
          print("PASS: exact original BKG TIFF full SHA and size independently matched")
          PY
          python -m research_runners.berlin_bld4_bkg_original_raw_cell_support_v0 \
            --buildings "$bld" --original-bkg-tiff "$tiff"
          # Provider TIFF, BLD4 polygons and CAT1/CAT2 sources deleted by trap.
