name: Agent Action Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# Only owner-authorized action requests share the semantic serialization lane.
# Unrelated/untrusted comments get a unique group and therefore cannot queue in
# front of authorized requests. Authorized requests are queued (up to GitHub's
# bounded queue) so simultaneous hourly slots are serialized rather than dropped.
# This does not serialize normal CI or other agents.
concurrency:
  group: agent-action-dispatch-${{ github.event.comment.user.login == github.event.repository.owner.login && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '<!-- oc-action-request-v1 -->') && 'authorized-v1' || github.event.comment.id }}
  cancel-in-progress: false
  queue: max

jobs:
  validate-request:
    name: Validate and classify authorized action request
    if: >-
      contains(github.event.comment.body, '<!-- oc-action-request-v1 -->') &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      result_json: ${{ steps.prepare-result.outputs.result_json }}
      execution_sha: ${{ steps.prepare-result.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed CEMS GeoTIFF profile dependency set
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cems-geotiff-profile.txt
      - name: Verify CEMS GeoTIFF profile dependency consistency
        run: python -m pip check
      # The mask-value layer adds only the frozen Issue #823 full-raster inventory
      # action and delegates every earlier action to the reviewed #816 profile layer.
      # It reacquires exactly the two #809 mask objects on trusted main, stores them
      # ephemerally, inventories every pixel via the merged block-window profiler,
      # publishes only bounded counts/digests, and keeps numeric mask semantics,
      # per-cell correctness, benchmark/publication/model authority outside the action.
      # The compatibility chain therefore still includes the prior module-mode
      # entrypoints as audit breadcrumbs (they are not invoked here):
      # python -m scripts.prepare_agent_action_result_cems_mask_profiles
      # python -m scripts.post_agent_action_result_cems_mask_profiles
      # python -m scripts.prepare_agent_action_result_cems_masks
      # python -m scripts.post_agent_action_result_cems_masks
      # python -m scripts.prepare_agent_action_result_cems_rp10_profile
      # python -m scripts.post_agent_action_result_cems_rp10_profile
      # python -m scripts.prepare_agent_action_result_cems_rp10
      # python -m scripts.post_agent_action_result_cems_rp10
      # prepare_agent_action_result_cems_rp10.py and post_agent_action_result_cems_rp10.py,
      # then prepare_agent_action_result_country_risk.py and
      # post_agent_action_result_country_risk.py for earlier actions.
      # Compatibility therefore still covers the repository-owned frozen DWD worker;
      # the publisher still delegates to `python scripts/post_agent_action_result.py`.
      # No URL, filename, provider, mask kind, reader, parser, output, window geometry
      # or cardinality cap comes from the comment. All authorized network actions
      # remain in this one serialized owner-only lane.
      - name: Prepare bounded action result
        id: prepare-result
        env:
          OC_ACTION_COMMENT_BODY: ${{ github.event.comment.body }}
          OC_ACTION_TRIGGER_ISSUE: ${{ github.event.issue.number }}
          OC_ACTION_SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
          OC_ACTION_REPOSITORY: ${{ github.repository }}
          OC_ACTION_RUN_ID: ${{ github.run_id }}
          OC_ACTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          OC_ACTION_GITHUB_TOKEN: ${{ github.token }}
        run: |
          EXECUTION_SHA="$(git rev-parse HEAD)"
          RESULT_JSON="$(python -m scripts.prepare_agent_action_result_cems_mask_values \
            --comment-body-env OC_ACTION_COMMENT_BODY \
            --expected-issue "$OC_ACTION_TRIGGER_ISSUE" \
            --source-comment-id "$OC_ACTION_SOURCE_COMMENT_ID" \
            --execution-sha "$EXECUTION_SHA" \
            --run-id "$OC_ACTION_RUN_ID" \
            --run-attempt "$OC_ACTION_RUN_ATTEMPT" \
            --repository "$OC_ACTION_REPOSITORY" \
            --github-token-env OC_ACTION_GITHUB_TOKEN)"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  report-result:
    name: Publish validated action result
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Revalidate and publish canonical result comment
        env:
          OC_ACTION_RESULT_JSON: ${{ needs.validate-request.outputs.result_json }}
          OC_ACTION_TRIGGER_ISSUE: ${{ github.event.issue.number }}
          OC_ACTION_REPOSITORY: ${{ github.repository }}
          OC_ACTION_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.post_agent_action_result_cems_mask_values
          --result-env OC_ACTION_RESULT_JSON
          --repository "$OC_ACTION_REPOSITORY"
          --expected-issue "$OC_ACTION_TRIGGER_ISSUE"
          --github-token-env OC_ACTION_GITHUB_TOKEN
