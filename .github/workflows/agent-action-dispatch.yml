name: Agent Action Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: agent-action-request-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate authorized action request
    if: >-
      contains(github.event.comment.body, '<!-- oc-action-request-v1 -->') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate strict request contract
        env:
          OC_ACTION_COMMENT_BODY: ${{ github.event.comment.body }}
          OC_ACTION_TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: >-
          python scripts/validate_agent_action_request.py
          --comment-body-env OC_ACTION_COMMENT_BODY
          --expected-issue "$OC_ACTION_TRIGGER_ISSUE"
