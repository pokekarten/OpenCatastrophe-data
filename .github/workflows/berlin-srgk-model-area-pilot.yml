name: Berlin SRGK official model-area fixed-pilot spatial coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srgk_model_area_pilot_coverage_v0.py
      - tests/test_berlin_srgk_model_area_pilot_coverage_v0.py
      - .github/workflows/berlin-srgk-model-area-pilot.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-model-area-pilot.yml

permissions:
  contents: read

jobs:
  bounded-model-area:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Reviewed geometry checker dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
          python -m pip check
      - name: Offline adversarial two-source metadata/geometry tests
        run: python -m unittest tests.test_berlin_srgk_model_area_pilot_coverage_v0 -v
      # One reviewed main-only diagnostic retry: hash both original bounded
      # WFS bodies if returned model polygons do not intersect fixed pilot.
      # A negative or unfiltered provider response must remain a failed run.
      - name: Two fixed bounded original Berlin SRGK WFS requests
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_model_area_pilot_coverage_v0 --live
