name: Temporary taxonomy port check

on:
  push:
    branches:
      - agent/363-taxonomy-action-port

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run repository definition of done
        run: python scripts/check_all.py
