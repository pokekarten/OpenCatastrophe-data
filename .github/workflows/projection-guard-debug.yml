name: Projection guard debug

on:
  push:
    branches:
      - agent/218-projection-family-guard

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact guard output
        shell: bash
        run: |
          python scripts/check_projection_families.py > projection-guard-debug.txt 2>&1 || true
          python -m unittest tests.test_check_projection_families -v >> projection-guard-debug.txt 2>&1 || true
      - name: Commit diagnostic output
        shell: bash
        run: |
          git add projection-guard-debug.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture projection guard diagnostics'
          git push
