name: PPRI polygon topology research preflight

on:
  push:
    branches: [main]
    paths:
      - "research_runners/ppri_polygon_geometry_preflight_v0.py"
      - "tests/test_ppri_polygon_geometry_preflight_v0.py"
      - ".github/workflows/ppri-polygon-topology-research.yml"
  pull_request:
    paths:
      - "research_runners/ppri_polygon_geometry_preflight_v0.py"
      - "tests/test_ppri_polygon_geometry_preflight_v0.py"
      - ".github/workflows/ppri-polygon-topology-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppri-topology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    name: Shapely 2.1.2 original-response topology validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install exact required spatial geometry dependency
        run: |
          python -m pip install --disable-pip-version-check --no-input shapely==2.1.2
          python -m pip check
          python -c "import shapely; assert shapely.__version__ == '2.1.2'"
      - name: Execute offline synthetic topology and provenance tests
        run: python -m unittest tests.test_ppri_polygon_geometry_preflight_v0 -v
