name: One-time verified branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact verified obsolete branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch='agent/600-merge-tree-work'
          expected_sha='80217d2d2254403194cb480f9ebb18877b9827a7'
          owner="${GH_REPO%%/*}"
          default_branch="$(gh api "/repos/$GH_REPO" --jq '.default_branch')"
          [[ "$branch" != "$default_branch" ]]
          current_sha="$(gh api "/repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$current_sha" == "$expected_sha" ]]
          enc="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
          protected="$(gh api "/repos/$GH_REPO/branches/$enc" --jq '.protected')"
          [[ "$protected" == 'false' ]]
          prs="$(gh api -X GET "/repos/$GH_REPO/pulls" -f state=open -f "head=$owner:$branch" -f per_page=100 --jq 'length')"
          [[ "$prs" == '0' ]]
          ahead="$(gh api "/repos/$GH_REPO/compare/$default_branch...$enc" --jq '.ahead_by')"
          [[ "$ahead" == '0' ]]
          current_sha2="$(gh api "/repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
          [[ "$current_sha2" == "$expected_sha" ]]
          gh api --silent -X DELETE "/repos/$GH_REPO/git/refs/heads/$branch"
          echo "DELETED $branch $expected_sha"