# TEMPORARY single-push original NOAA SWPC provider shape verification.
# Remove this workflow after inspecting original-source outcome. The durable
# approved 18-source workflow is not widened or modified by this experiment.
name: NOAA 2026 RTSW exactly one reviewed original-source GET
on:
  push:
    branches:
      - research/noaa-swpc-rtsw-2026-shape-gate-20261113
    paths:
      - ".github/workflows/research-noaa-swpc-single-origin-20261113.yml"
permissions:
  contents: read
jobs:
  one-noaa-swpc-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Synthetic provider schema and rights-contract tests only
        run: python3 -m unittest tests.test_probe_fixed_public_sources_v0 -v
      - name: One original NOAA SWPC RTSW 2026 magnetometer public HTTPS GET
        run: python3 -m scripts.probe_fixed_public_sources_v0 --source noaa.swpc.real-time-solar-wind
