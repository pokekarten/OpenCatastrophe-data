name: Historical CAT Provider CSV Byte Receipts

on:
  pull_request:
    paths:
      - ".github/workflows/historical-cat-provider-csv-receipts.yml"
      - "research/historical_cat_csv_provider_receipts_20261031.json"
      - "scripts/verify_historical_cat_csv_provider_receipts.py"
      - "research_runners/historical_cat_benchmark_csv_preflight_v0.py"
      - "tests/test_verify_historical_cat_csv_provider_receipts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-cat-csv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-provider-source-bytes:
    name: Reproduce versioned CSV provider receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Recheck synthetic boundary tests
        run: python -m unittest tests.test_verify_historical_cat_csv_provider_receipts -v
      - name: Recheck original publisher bytes against exact SHA-256 and profile
        run: |
          python scripts/verify_historical_cat_csv_provider_receipts.py --fetch --output "$RUNNER_TEMP/historical-cat-csv-provider-check.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"historical-cat-csv-provider-check.json"; r=json.loads(p.read_text()); assert len(r["results"]) == 2 and r["source_admitted"] is False; print("PASS: both pinned original provider CSVs independently validated; no source rows saved")'
