name: Historical CAT Provider CSV Byte Receipts

on:
  pull_request:
    paths:
      - ".github/workflows/historical-cat-provider-csv-receipts.yml"
      - "research_runners/historical_cat_csv_provider_receipt_v0.py"
      - "scripts/verify_historical_cat_csv_provider_receipts.py"
      - "research_runners/historical_cat_benchmark_csv_preflight_v0.py"
      - "research_runners/historical_country_year_availability_v0.py"
      - "tests/test_historical_country_year_availability_v0.py"
      - "tests/test_verify_historical_cat_csv_provider_receipts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-cat-csv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-provider-source-bytes:
    name: Reproduce versioned CSV provider receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Recheck synthetic boundary tests
        run: python -m unittest tests.test_verify_historical_cat_csv_provider_receipts tests.test_historical_country_year_availability_v0 -v
      - name: Recheck original publisher bytes against exact SHA-256 and profile
        run: |
          python scripts/verify_historical_cat_csv_provider_receipts.py --fetch --output "$RUNNER_TEMP/historical-cat-csv-provider-check.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"historical-cat-csv-provider-check.json"; r=json.loads(p.read_text()); assert len(r["results"]) == 2 and r["source_admitted"] is False; a=r["historical_country_year_availability"]; assert a["event_count"]==2780 and a["source_admitted"] is False and a["insured_loss_created"] is False and a["asset_exposure_created"] is False; assert a["event_count"] == a["event_count_outside_2001_2025_eligibility"]+a["event_count_with_exact_country_prior_year_indicator"]+a["event_count_without_exact_country_prior_year_indicator"]; print("PASS: pinned original CSVs and non-loss country/year overlap; no provider rows saved")'
