name: ESRM20 Event Hazard Dependency Profiles

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-event-hazard-dependency-profiles-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-dependency-profile:
    name: Execute exact trusted-main dependency profile
    if: >-
      github.event.issue.number == 429 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-event-hazard-dependency-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile exact Group1/Group2 root
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_EVENT_HAZARD_DEP_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-event-hazard-dependency-profile.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_event_hazard_dependency_profiles_action.py \
            --comment-body-env OC_EVENT_HAZARD_DEP_REQUEST \
            --expected-issue 429 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-dependency-profile:
    name: Publish bounded dependency metadata
    needs: [execute-dependency-profile]
    if: >-
      needs.execute-dependency-profile.result == 'success' &&
      needs.execute-dependency-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-dependency-profile.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-dependency-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-event-hazard-dependency-profile-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-event-hazard-dependency-profile-result-v1" and
            (.action == "esrm20_event_hazard_group1_dependencies" or .action == "esrm20_event_hazard_group2_dependencies") and
            .source_issue == 429 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .dependency_inventory_authorized == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .profile != null and
              .profile.dependency_inventory_authorized == false and
              .profile.external_bytes_persisted == false and
              .profile.publication_authorized == false
            else
              .failure_class == "acquisition_failure" and .profile == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/dependency-profile-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/429/comments" \
            --input "$RUNNER_TEMP/dependency-profile-comment.json"
