name: DWD CatRaRE W3 fixed 4KiB range
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_dwd_catrare_w3_range_v0.py"
      - "tests/test_probe_dwd_catrare_w3_range_v0.py"
      - ".github/workflows/dwd-catrare-w3-range.yml"
permissions:
  contents: read
jobs:
  range:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Offline exact W3 v2026.01 and 4KiB rights gate
        run: python3 -m unittest tests.test_probe_dwd_catrare_w3_range_v0 -v
      - name: Original DWD CSV 4096-byte Range probe, no provider-byte persistence
        run: python3 scripts/probe_dwd_catrare_w3_range_v0.py
