name: P-COLD temporal frequency tournament

on:
  push:
    branches:
      - research-run/pcold-v3-source-lock-20260908-sol56
    paths:
      - .github/workflows/pcold-temporal-tournament.yml

permissions:
  contents: write

jobs:
  execute-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen scientific runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 openpyxl==3.1.5
      - name: Verify pre-target source-lock receipts and frozen code
        shell: bash
        run: |
          set -euo pipefail
          test -f research-results/pcold-v3-source-lock-v0.json
          test -f research-results/pcold-v3-id-date-quality-v0.json
          test -f research-results/pcold-v3-date-component-lock-v1.json
          python -m py_compile research-scripts/pcold_temporal_frequency_tournament.py tests/test_pcold_temporal_frequency_tournament.py
          python -m unittest tests.test_pcold_temporal_frequency_tournament -v
      - name: Execute frozen chronological target once
        shell: bash
        run: |
          set -euo pipefail
          python research-scripts/pcold_temporal_frequency_tournament.py
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          p=Path('research-results/pcold-temporal-frequency-tournament-v0.json')
          r=json.loads(p.read_text())
          script=Path('research-scripts/pcold_temporal_frequency_tournament.py')
          test=Path('tests/test_pcold_temporal_frequency_tournament.py')
          r['execution']['runner_sha256']=hashlib.sha256(script.read_bytes()).hexdigest()
          r['execution']['runner_git_blob']=subprocess.check_output(['git','rev-parse','HEAD:research-scripts/pcold_temporal_frequency_tournament.py'],text=True).strip()
          r['execution']['focused_test_sha256']=hashlib.sha256(test.read_bytes()).hexdigest()
          r['execution']['focused_test_git_blob']=subprocess.check_output(['git','rev-parse','HEAD:tests/test_pcold_temporal_frequency_tournament.py'],text=True).strip()
          r['execution']['source_lock_v0_git_blob']=subprocess.check_output(['git','rev-parse','HEAD:research-results/pcold-v3-source-lock-v0.json'],text=True).strip()
          r['execution']['date_lock_v1_git_blob']=subprocess.check_output(['git','rev-parse','HEAD:research-results/pcold-v3-date-component-lock-v1.json'],text=True).strip()
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('RESULT_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Commit durable result receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-results/pcold-temporal-frequency-tournament-v0.json
          git commit -m 'Research: record frozen P-COLD temporal frequency result'
          git push origin HEAD:${GITHUB_REF_NAME}
