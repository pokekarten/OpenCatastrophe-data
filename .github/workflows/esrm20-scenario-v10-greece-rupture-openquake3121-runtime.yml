name: ESRM20 Greece Rupture OpenQuake 3.12.1 Runtime

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-greece-rupture-oq3121-runtime-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main OQ 3.12.1 rupture request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-scenario-v10-greece-rupture-oq3121-runtime-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main and fixed runtime identity
        id: fence
        env:
          OC_OQ3121_RUPTURE_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_scenario_v10_greece_rupture_openquake3121_runtime_action.py \
            --comment-body-env OC_OQ3121_RUPTURE_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-runtime:
    name: Run exact OQ 3.12.1 native rupture ingestion
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up host validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prove complete issue-local dedup before external activity
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_scenario_v10_greece_rupture_openquake3121_runtime_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Fetch exact model-era OpenQuake v3.12.1 source
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_COMMIT: 0bb8441aa202cd6ec075bf2044dd4aaeb26919b9
        run: |
          set -euo pipefail
          OQ_ROOT="$RUNNER_TEMP/oq-engine"
          git init "$OQ_ROOT"
          git -C "$OQ_ROOT" remote add origin https://github.com/gem/oq-engine.git
          git -C "$OQ_ROOT" fetch --depth=1 origin \
            refs/tags/v3.12.1:refs/tags/v3.12.1
          OBSERVED="$(git -C "$OQ_ROOT" rev-parse 'refs/tags/v3.12.1^{commit}')"
          test "$OBSERVED" = "$OQ_COMMIT"
          git -C "$OQ_ROOT" checkout --detach "$OBSERVED"
          test -z "$(git -C "$OQ_ROOT" status --porcelain=v1)"

      - name: Build observed OQ 3.12.1 execution container
        if: steps.dedup.outputs.skip != 'true'
        id: image
        run: |
          set -euo pipefail
          BASE_IMAGE="openquake/engine:3.12.1"
          docker pull "$BASE_IMAGE"
          BASE_REPO_DIGEST="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          printf '%s\n' "$BASE_REPO_DIGEST" |
            grep -Eq '^openquake/engine@sha256:[0-9a-f]{64}$'

          DOCKERFILE="$RUNNER_TEMP/Dockerfile.oq3121-runtime"
          cat > "$DOCKERFILE" <<EOF
          FROM $BASE_REPO_DIGEST
          USER root
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          COPY --chown=root:root oq-engine /oq-engine
          RUN git config --system --add safe.directory /oq-engine
          USER openquake
          EOF

          docker build --pull=false \
            --file "$DOCKERFILE" \
            --tag oc-oq3121-greece-rupture:local \
            "$RUNNER_TEMP"
          IMAGE_ID="$(docker image inspect \
            --format='{{.Id}}' oc-oq3121-greece-rupture:local)"
          printf '%s\n' "$IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Verify exact runtime before provider access
        if: steps.dedup.outputs.skip != 'true'
        env:
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
          OQ_COMMIT: 0bb8441aa202cd6ec075bf2044dd4aaeb26919b9
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /opt/openquake/bin/python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e PYTHONPATH=/oq-engine \
            -e OC_OQ_CHECKOUT_ROOT=/oq-engine \
            "$IMAGE_ID" \
            -c '
          import inspect
          import pathlib
          import subprocess
          from openquake import baselib
          from openquake.commonlib import readinput
          root = pathlib.Path("/oq-engine").resolve()
          source = pathlib.Path(inspect.getfile(readinput)).resolve()
          source.relative_to(root)
          assert baselib.__version__.startswith("3.12.1"), baselib.__version__
          observed = subprocess.check_output(
              ["git", "-C", "/oq-engine", "rev-parse", "HEAD"], text=True
          ).strip()
          assert observed == "0bb8441aa202cd6ec075bf2044dd4aaeb26919b9", observed
          '

      - name: Reacquire exact rupture and run native ingestion
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_OQ3121_RUPTURE_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
          RESULT_PATH: ${{ runner.temp }}/eq1-oq3121-runtime/result.json
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/eq1-oq3121-runtime"
          mkdir -p "$OUTPUT_DIR"
          : > "$OUTPUT_DIR/result.json"
          chmod 0666 "$OUTPUT_DIR/result.json"

          docker run --rm \
            --entrypoint /opt/openquake/bin/python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e PYTHONPATH=/oq-engine:/workspace \
            -e OC_OQ_CHECKOUT_ROOT=/oq-engine \
            -e OC_OQ3121_RUPTURE_REQUEST \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$OUTPUT_DIR:/output" \
            -w /workspace \
            "$IMAGE_ID" \
            scripts/run_esrm20_scenario_v10_greece_rupture_openquake3121_runtime_action.py \
            --comment-body-env OC_OQ3121_RUPTURE_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --image-digest "$IMAGE_ID" \
            --output /output/result.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_scenario_v10_greece_rupture_openquake3121_runtime_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          target = os.environ["EXECUTION_SHA"]
          if subject._validate_terminal_result(result) != target:
              raise SystemExit("native runtime result execution identity drifted")
          if (
              result.get("external_bytes_persisted") is not False
              or result.get("publication_authorized") is not False
              or result.get("model_use_authorized") is not False
          ):
              raise SystemExit("native runtime result widened authority")
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/eq1-oq3121-runtime/result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 6900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-runtime:
    name: Publish bounded OQ 3.12.1 native rupture result
    needs: [validate-request, execute-runtime]
    if: >-
      needs.execute-runtime.result == 'success' &&
      needs.execute-runtime.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence bounded result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-runtime.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-scenario-v10-greece-rupture-oq3121-runtime-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-scenario-v10-greece-rupture-oq3121-runtime-result-v1" and
            .action == "esrm20_scenario_v10_greece_rupture_oq3121_runtime" and
            .source_issue == 285 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .openquake_tag == "v3.12.1" and
            .openquake_commit == "0bb8441aa202cd6ec075bf2044dd4aaeb26919b9" and
            .openquake_image == "openquake/engine:3.12.1" and
            .parser_path == "openquake.commonlib.readinput.get_rupture" and
            (.runtime_image_digest | test("^sha256:[0-9a-f]{64}$")) and
            .output_payload_bytes_read == false and
            .external_bytes_persisted == false and
            .event_location_inference_authorized == false and
            .scenario_selection_authorized == false and
            .site_gsim_compatibility_established == false and
            .numerical_hazard_agreement_established == false and
            .vulnerability_compatibility_established == false and
            .reference_run_established == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (
              if .status == "pass" then
                .failure_stage == null and
                .failure_code == null and
                .provider_file_bytes_read == true and
                .byte_identity_verified == true and
                .openquake_source_path_verified == true and
                .legacy_nrml_04_native_acceptance_verified == true and
                .single_plane_native_conversion_verified == true and
                .rupture_class == "BaseRupture" and
                .surface_class == "PlanarSurface" and
                (.openquake_version | startswith("3.12.1"))
              elif .status == "blocked" then
                (.failure_stage as $stage | ["acquisition","byte_identity","openquake_runtime"] | index($stage) != null) and
                .openquake_source_path_verified == false and
                .legacy_nrml_04_native_acceptance_verified == false and
                .single_plane_native_conversion_verified == false and
                .rupture_class == null and
                .surface_class == null and
                .openquake_version == null
              else
                false
              end
            )
          ' >/dev/null

          BODY="$(printf '%s\n%s' "$RESULT_MARKER" "$RESULT_JSON")"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/285/comments" \
            -f body="$BODY" \
            >/dev/null
