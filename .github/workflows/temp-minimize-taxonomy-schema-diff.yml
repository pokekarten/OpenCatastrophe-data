name: Temporary minimize taxonomy schema diff

on:
  push:
    branches:
      - agent/363-taxonomy-action-port

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild schemas from trusted-main formatting without semantic drift
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          BASE = '4e7e869b7188fe204d2354454ff17e86c003f0cc'
          ACTION = 'efehr_kosovo_taxonomy_identity'

          def base_text(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{BASE}:{path}'], text=True)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          def indented_json(value: object, spaces: int) -> str:
              prefix = ' ' * spaces
              return '\n'.join(prefix + line for line in json.dumps(value, indent=2, ensure_ascii=False).splitlines())

          def def_entry(name: str, value: object) -> str:
              lines = json.dumps(value, indent=2, ensure_ascii=False).splitlines()
              return f'    {json.dumps(name)}: {lines[0]}\n' + '\n'.join('    ' + line for line in lines[1:])

          request_path = Path('schemas/agent-action-request-v1.schema.json')
          request_target = json.loads(request_path.read_text(encoding='utf-8'))
          request_base_text = base_text(str(request_path))
          request_base = json.loads(request_base_text)
          request = request_base_text

          request = replace_once(
              request,
              f'  "$comment": {json.dumps(request_base["$comment"])},',
              f'  "$comment": {json.dumps(request_target["$comment"])},',
              'request comment',
          )
          old_enum_line = next(
              line for line in request_base_text.splitlines()
              if line.strip().startswith('"action": {"enum":')
          )
          new_enum_line = '    "action": {"enum": ' + json.dumps(request_target['properties']['action']['enum']) + '},'
          request = replace_once(request, old_enum_line, new_enum_line, 'request action enum')

          taxonomy_request_indexes = [
              index for index, rule in enumerate(request_target['allOf'])
              if rule.get('if', {}).get('properties', {}).get('action', {}).get('const') == ACTION
          ]
          if len(taxonomy_request_indexes) != 1:
              raise SystemExit('expected one taxonomy request rule')
          taxonomy_index = taxonomy_request_indexes[0]
          taxonomy_rule = request_target['allOf'][taxonomy_index]
          if taxonomy_index >= len(request_target['allOf']) - 1:
              raise SystemExit('taxonomy request rule unexpectedly has no following reviewed rule')
          next_rule = request_target['allOf'][taxonomy_index + 1]
          next_action = next_rule.get('if', {}).get('properties', {}).get('action', {}).get('const')
          if not isinstance(next_action, str) or next_action == ACTION:
              raise SystemExit('cannot identify stable following request-rule action')
          next_anchor = (
              '    {\n'
              f'      "if": {{"properties": {{"action": {{"const": "{next_action}"}}}}, "required": ["action"]}},'
          )
          request = replace_once(
              request,
              next_anchor,
              indented_json(taxonomy_rule, 4) + ',\n' + next_anchor,
              'taxonomy request rule ordered insertion',
          )
          if json.loads(request) != request_target:
              raise SystemExit('format-preserving request schema is not semantically identical to green target')
          request_path.write_text(request, encoding='utf-8')

          result_path = Path('schemas/agent-action-result-v1.schema.json')
          result_target = json.loads(result_path.read_text(encoding='utf-8'))
          result_base_text = base_text(str(result_path))
          result_base = json.loads(result_base_text)
          result = result_base_text

          result = replace_once(
              result,
              f'  "$comment": {json.dumps(result_base["$comment"])},',
              f'  "$comment": {json.dumps(result_target["$comment"])},',
              'result comment',
          )
          enum_anchor = '"efehr_eshm20_gsim_resource_profile"]}'
          if result.count(enum_anchor) != 2:
              raise SystemExit(f'expected two result action enum anchors, found {result.count(enum_anchor)}')
          result = result.replace(
              enum_anchor,
              '"efehr_eshm20_gsim_resource_profile", "efehr_kosovo_taxonomy_identity"]}',
          )

          taxonomy_evidence = [
              item for item in result_target['properties']['evidence']['oneOf']
              if ACTION in item.get('properties', {})
          ]
          if len(taxonomy_evidence) != 1:
              raise SystemExit('expected one taxonomy evidence variant')
          evidence_suffix = '        }\n      ]\n    },\n    "duplicate_result_comment_id"'
          result = replace_once(
              result,
              evidence_suffix,
              '        },\n' + indented_json(taxonomy_evidence[0], 8) + '\n      ]\n    },\n    "duplicate_result_comment_id"',
              'taxonomy evidence insertion',
          )

          taxonomy_def = result_target['$defs'].get('efehrKosovoTaxonomyIdentity')
          if taxonomy_def is None:
              raise SystemExit('taxonomy result definition missing from green target')
          result = replace_once(
              result,
              '    }\n  },\n  "allOf": [',
              '    },\n' + def_entry('efehrKosovoTaxonomyIdentity', taxonomy_def) + '\n  },\n  "allOf": [',
              'taxonomy definition insertion',
          )

          result = replace_once(
              result,
              '          {"not": {"required": ["efehr_eshm20_gsim_resource_profile"]}}\n',
              '          {"not": {"required": ["efehr_eshm20_gsim_resource_profile"]}},\n',
              'request-validation guard comma',
          )
          result = replace_once(
              result,
              '          {"not": {"required": ["efehr_eshm20_gsim_resource_profile"]}},\n        ]',
              '          {"not": {"required": ["efehr_eshm20_gsim_resource_profile"]}},\n'
              '          {"not": {"required": ["efehr_kosovo_taxonomy_identity"]}}\n        ]',
              'taxonomy request-validation guard',
          )

          taxonomy_rules = [
              rule for rule in result_target['allOf']
              if rule.get('if', {}).get('properties', {}).get('action', {}).get('const') == ACTION
          ]
          if len(taxonomy_rules) != 3:
              raise SystemExit(f'expected three taxonomy result rules, found {len(taxonomy_rules)}')
          result_suffix = '    }\n  ]\n}\n'
          if not result.endswith(result_suffix):
              raise SystemExit('unexpected result schema suffix')
          rendered_rules = ',\n'.join(indented_json(rule, 4) for rule in taxonomy_rules)
          result = result[:-len(result_suffix)] + '    },\n' + rendered_rules + '\n  ]\n}\n'
          if json.loads(result) != result_target:
              raise SystemExit('format-preserving result schema is not semantically identical to green target')
          result_path.write_text(result, encoding='utf-8')
          PY
      - name: Regenerate canonical references and prove the minimized contract
        run: |
          python scripts/schema_reference.py --write
          python scripts/check_all.py
          git diff --check
      - name: Remove minimizer and commit the clean presentation
        run: |
          git rm .github/workflows/temp-minimize-taxonomy-schema-diff.yml
          git diff --check
          git config user.name 'OpenCatastrophe port bot'
          git config user.email '287434260+pokekarten@users.noreply.github.com'
          git add -A
          git commit -m 'Minimize Kosovo taxonomy action schema diff'
          git push origin HEAD:agent/363-taxonomy-action-port
