name: TEMP FFBK freclaimset2motor annual reserving gate

on:
  push:
    branches:
      - tmp/ffbk-freclaimset2motor-annual-reserving-20260906

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install bounded data dependencies
        run: python -m pip install --disable-pip-version-check --no-input pandas pyarrow
      - name: Execute exact public-data gate
        run: |
          python tmp/ffbk_freclaimset2motor_annual_reserving.py > /tmp/ffbk-result.json
          cat /tmp/ffbk-result.json
