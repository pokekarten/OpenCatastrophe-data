name: TEMP FFBK freclaimset2motor annual reserving gate

on:
  push:
    branches:
      - tmp/ffbk-freclaimset2motor-annual-reserving-20260906
  pull_request:
    branches:
      - main
    paths:
      - 'tmp/ffbk_freclaimset2motor_annual_reserving_v2.py'
      - '.github/workflows/tmp-ffbk-freclaimset2motor-annual-reserving.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up pinned R runtime
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2 resolved 2026-09-09
        with:
          r-version: "4.5.1"
          use-public-rspm: false
      - name: Install bounded data dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy pandas pyarrow
      - name: Record environment
        run: |
          python --version
          Rscript --version
          python -m pip freeze | sort
      - name: Compile corrected public-data gate
        run: python -m py_compile tmp/ffbk_freclaimset2motor_annual_reserving_v2.py
      - name: Execute corrected exact public-data gate
        run: |
          set -euo pipefail
          rm -f ffbk_freclaimset2motor_annual_reserving_v2_result.json
          python tmp/ffbk_freclaimset2motor_annual_reserving_v2.py > ffbk_freclaimset2motor_annual_reserving_v2_result.json
          python -m json.tool ffbk_freclaimset2motor_annual_reserving_v2_result.json >/dev/null
          sha256sum ffbk_freclaimset2motor_annual_reserving_v2_result.json
          cat ffbk_freclaimset2motor_annual_reserving_v2_result.json
      - name: Upload corrected result receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffbk-freclaimset2motor-annual-reserving-v2-result
          path: ffbk_freclaimset2motor_annual_reserving_v2_result.json
          if-no-files-found: error
          retention-days: 14
