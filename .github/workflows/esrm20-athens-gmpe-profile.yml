name: ESRM20 Athens GMPE Structure Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    esrm20-athens-gmpe-profile-${{ github.repository }}-${{
      github.event.issue.number == 669 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-athens-gmpe-profile-request-v1 -->') &&
      'trusted-request' || format('noise-{0}', github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main Athens GMPE request
    if: >-
      github.event.issue.number == 669 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-athens-gmpe-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bind request to trusted main
        id: fence
        env:
          OC_ATHENS_GMPE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_athens_gmpe_profile_action \
            --comment-body-env OC_ATHENS_GMPE_PROFILE_REQUEST_BODY \
            --expected-issue 669 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-and-publish:
    name: Execute and publish bounded Athens GMPE profile
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Deduplicate before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_athens_gmpe_profile_action as subject
          found = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if found else 'false'}\n")
          PY
      - name: Run exact Athens GMPE profile
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_ATHENS_GMPE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/athens-gmpe-profile.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_athens_gmpe_profile_action \
            --comment-body-env OC_ATHENS_GMPE_PROFILE_REQUEST_BODY \
            --expected-issue 669 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
      - name: Re-fence and publish terminal evidence
        if: steps.dedup.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/athens-gmpe-profile.json
          RESULT_MARKER: "<!-- oc-eq1-esrm20-athens-gmpe-profile-result-v1 -->"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_athens_gmpe_profile_action as subject
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject._validate_terminal_result(result, execution_sha=os.environ["EXECUTION_SHA"])
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/athens-gmpe-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/669/comments" \
            --input "$RUNNER_TEMP/athens-gmpe-comment.json"
