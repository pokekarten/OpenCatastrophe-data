name: ESRM20 Athens GMPE Logic-Tree Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-athens-gmpe-profile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-profile:
    name: Execute bounded trusted-main Athens GMPE profile
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-athens-gmpe-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind request to trusted main
        id: fence
        env:
          OC_ATHENS_GMPE_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_athens_gmpe_profile_action \
            --comment-body-env OC_ATHENS_GMPE_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Deduplicate trusted terminal before provider I/O
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ steps.fence.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.run_esrm20_athens_gmpe_profile_action import has_terminal_result

          found = has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              f"skip={'true' if found else 'false'}\n", encoding="utf-8"
          )
          PY

      - name: Acquire exact bytes and emit bounded structural evidence
        if: steps.dedup.outputs.skip != 'true'
        id: run
        env:
          OC_ATHENS_GMPE_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ steps.fence.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/athens-gmpe-profile.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_athens_gmpe_profile_action \
            --comment-body-env OC_ATHENS_GMPE_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-profile:
    name: Publish bounded Athens GMPE structural evidence
    needs: [execute-profile]
    if: >-
      needs.execute-profile.result == 'success' &&
      needs.execute-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-profile.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-athens-gmpe-profile-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-athens-gmpe-profile-result-v1" and
            .action == "esrm20_athens_gmpe_logic_tree_structure_profile" and
            .source_issue == 285 and
            .parent_consumer_issue == 287 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and
            .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .gmpe_identity.project_id == 273 and
            .gmpe_identity.commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
            .gmpe_identity.repository_path == "ruptures/ground-motion-models/gmpe_logic_tree_5br_shallow_default.xml" and
            .gmpe_identity.byte_count == 6490 and
            .gmpe_identity.sha256 == "3c6ff83efcac45cf75125e035060e84b910c45a9e531306d822b4566383d5b78" and
            .external_bytes_persisted == false and
            .gmpe_semantics_verified == false and
            .gmpe_applicability_verified == false and
            .numerical_equivalence_verified == false and
            .scenario_selection_authorized == false and
            .independent_validation_established == false and
            .publication_authorized == false and
            .model_use_authorized == false
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/athens-gmpe-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/285/comments" \
            --input "$RUNNER_TEMP/athens-gmpe-comment.json"
