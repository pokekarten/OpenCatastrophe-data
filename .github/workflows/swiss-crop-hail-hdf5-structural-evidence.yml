name: Swiss crop hail original HDF5 structural evidence

on:
  pull_request:
    paths:
      - "research_runners/swiss_crop_hail_hdf5_metadata_profile_v0.py"
      - "tests/test_swiss_crop_hail_hdf5_metadata_profile_v0.py"
      - ".github/workflows/swiss-crop-hail-hdf5-structural-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiss-crop-hail-hdf5-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-metadata:
    name: Original HDF5 2 radar and 48 crop files - metadata only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact research source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install isolated pinned HDF5 inspector
        run: |
          python -m pip install --disable-pip-version-check --no-input "h5py==3.14.0"
          python -m pip check
      - name: Run synthetic source-contract tests without internet
        run: python -m unittest -v tests.test_swiss_crop_hail_hdf5_metadata_profile_v0
      - name: Read original source HDF5 metadata only, no payload samples
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m research_runners.swiss_crop_hail_hdf5_metadata_profile_v0
