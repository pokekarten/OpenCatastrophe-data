name: Swiss crop hail original event and coordinate axis join proof

on:
  pull_request:
    paths:
      - "research_runners/swiss_crop_hail_event_alignment_v0.py"
      - "tests/test_swiss_crop_hail_event_alignment_v0.py"
      - ".github/workflows/swiss-crop-hail-event-alignment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiss-hail-event-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-original-axes:
    name: Check 12 radar dates against 24 crop exposure/damage HDF5 pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR revision, no saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install exact isolated original HDF5 reader
        run: |
          python -m pip install --disable-pip-version-check --no-input "h5py==3.14.0"
          python -m pip check
      - name: Synthetic event subset and archive family invariants
        run: python -m unittest -v tests.test_swiss_crop_hail_event_alignment_v0
      - name: Read original event metadata, no original coordinate or damage row exports
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m research_runners.swiss_crop_hail_event_alignment_v0
