name: One-time superseded branch prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-prune-superseded-once-2026-08-16.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact superseded no-PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          delete_exact() {
            branch="$1"
            expected_sha="$2"
            branch_enc="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            current_sha="$(gh api "/repos/$REPO/branches/$branch_enc" --jq '.commit.sha' 2>/dev/null || true)"
            open_count="$(gh api -X GET "/repos/$REPO/pulls" -f state=open -f "head=$owner:$branch" -f per_page=100 --jq 'length')"
            if [[ "$current_sha" != "$expected_sha" || "$open_count" != "0" ]]; then
              echo "PRESERVE $branch current=$current_sha open_prs=$open_count"
              return 0
            fi
            gh api --silent -X DELETE "/repos/$REPO/git/refs/heads/$branch"
            echo "DELETED $branch $expected_sha"
          }
          delete_exact "agent/422-esrm20-mapping-headers" "e9eb02a8e9cdf7d33d782ab024f320abcee485a8"
          delete_exact "agent/431-eshm20-gsim-openquake314" "48e2db13fb605eae3a77a678ba71df098fc04742"
