name: CLIMK-WINDS ERA5 Provider Source Receipt

on:
  pull_request:
    paths:
      - ".github/workflows/climk-winds-era5-receipt.yml"
      - "scripts/inspect_climk_winds_era5_v0.py"
      - "tests/test_inspect_climk_winds_era5_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climk-era5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    name: Verify CLIMK ERA5 exact source and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install isolated NetCDF4 research reader
        run: |
          python -m pip install --no-input --disable-pip-version-check -r requirements-glofas-acquisition.txt
          python -m pip check
      - name: Synthetic provider-receipt invariants
        run: python -m unittest tests.test_inspect_climk_winds_era5_v0 -v
      - name: Reproduce real publisher ERA5 NetCDF source and scientific header
        run: |
          python scripts/inspect_climk_winds_era5_v0.py --fetch --output "$RUNNER_TEMP/climk-era5-metadata.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"climk-era5-metadata.json"; d=json.loads(p.read_text()); assert d["inventory"]["metadata_only"] is True and d["model_admission"] is False; print(json.dumps(d,sort_keys=True))'
