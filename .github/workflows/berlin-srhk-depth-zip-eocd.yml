name: Berlin SRHK bounded ZIP EOCD tail checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srhk_depth_zip_eocd_tail_v0.py
      - tests/test_berlin_srhk_depth_zip_eocd_tail_v0.py
      - .github/workflows/berlin-srhk-depth-zip-eocd.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srhk-depth-zip-eocd.yml

permissions:
  contents: read

concurrency:
  group: berlin-srhk-depth-eocd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-eocd:
    name: Fixed 65557-byte original ZIP tail - ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        scenario: [extreme, extraordinary]
    steps:
      - name: Checkout immutable reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Synthetic EOCD ZIP and malicious HTTP regression
        run: python -m unittest tests.test_berlin_srhk_depth_zip_eocd_tail_v0 -v
      - name: One fixed original 65557-byte suffix GET only after reviewed merge
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srhk_depth_zip_eocd_tail_v0 --scenario ${{ matrix.scenario }} --live
