name: Berlin detailed SRGK WFS original schema and hits metadata
on:
  pull_request:
    paths:
      - research_runners/berlin_srgk_wfs_schema_hits_v0.py
      - tests/test_berlin_srgk_wfs_schema_hits_v0.py
      - .github/workflows/berlin-srgk-schema-hits.yml
      - docs/research/berlin-srgk-wfs-filter-semantics-preflight-v0.md
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-schema-hits.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-metadata-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact approved branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test fixed three-operation source and reject geometry or false coverage
        run: python -m unittest tests.test_berlin_srgk_wfs_schema_hits_v0 -v
      - name: Original source schema and count-only hits on main only
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_wfs_schema_hits_v0
