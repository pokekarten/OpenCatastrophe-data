name: ESRM20 Greece Exposure Wrapper Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    esrm20-greece-exposure-profile-${{ github.repository }}-${{
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-greece-exposure-profile-request-v1 -->') &&
      'trusted-request' || format('noise-{0}', github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main Greece exposure-profile request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-greece-exposure-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_GREECE_EXPOSURE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_greece_exposure_profile_action \
            --comment-body-env OC_GREECE_EXPOSURE_PROFILE_REQUEST_BODY \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-exposure-profile:
    name: Execute bounded Greece exposure wrapper profile
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout current trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-fence privileged checkout to validated main SHA
        env:
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"

      - name: Select earliest canonical trusted request and deduplicate terminal
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          CURRENT_REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY_OWNER: ${{ github.event.repository.owner.login }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/285/comments?per_page=100" \
            > "$RUNNER_TEMP/greece-exposure-profile-comments.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts import run_esrm20_greece_exposure_profile_action as subject

          execution_sha = os.environ["EXECUTION_SHA"]
          current_comment_id = int(os.environ["CURRENT_REQUEST_COMMENT_ID"])
          owner = os.environ["REPOSITORY_OWNER"]
          pages = json.loads(
              Path(
                  os.environ["RUNNER_TEMP"],
                  "greece-exposure-profile-comments.json",
              ).read_text(encoding="utf-8")
          )
          comments = [item for page in pages for item in page]

          canonical_requests = []
          for comment in comments:
              body = comment.get("body")
              if not isinstance(body, str) or subject.REQUEST_MARKER not in body:
                  continue
              if comment.get("user", {}).get("login") != owner:
                  continue
              if comment.get("author_association") != "OWNER":
                  continue
              try:
                  subject.validate_request(
                      body,
                      expected_issue=285,
                      execution_sha=execution_sha,
                  )
              except subject.GreeceExposureProfileActionError:
                  continue
              comment_id = comment.get("id")
              created_at = comment.get("created_at")
              if type(comment_id) is not int or not isinstance(created_at, str):
                  raise SystemExit(
                      "canonical Greece exposure-profile request identity is incomplete"
                  )
              canonical_requests.append((created_at, comment_id))

          if not canonical_requests:
              raise SystemExit(
                  "canonical Greece exposure-profile request is absent from issue history"
              )
          winner_comment_id = min(canonical_requests)[1]
          if current_comment_id != winner_comment_id:
              raise SystemExit(
                  "duplicate trusted request is not earliest canonical OWNER request"
              )

          found = False
          for comment in comments:
              body = comment.get("body")
              if not isinstance(body, str) or subject.RESULT_MARKER not in body:
                  continue
              if comment.get("user", {}).get("login") != subject.TRUSTED_RESULT_LOGIN:
                  continue
              if subject._parse_trusted_terminal_result(
                  body,
                  execution_sha=execution_sha,
              ):
                  found = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if found else 'false'}\n")
          PY

      - name: Run exact frozen Greece exposure-profile worker
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_GREECE_EXPOSURE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/greece-exposure-profile-result.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_greece_exposure_profile_action \
            --comment-body-env OC_GREECE_EXPOSURE_PROFILE_REQUEST_BODY \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_greece_exposure_profile_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject._validate_terminal_result(
              result,
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/greece-exposure-profile-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 11900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-exposure-profile:
    name: Publish bounded Greece exposure declarations
    needs: [validate-request, execute-exposure-profile]
    if: >-
      needs.execute-exposure-profile.result == 'success' &&
      needs.execute-exposure-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Re-fence exposure result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-exposure-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-greece-exposure-profile-result-v1 -->"
        run: |
          set -euo pipefail
          LATEST_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha'
          )"
          test "$LATEST_SHA" = "$EXECUTION_SHA"

          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            def bounded_text:
              type == "string" and length >= 1 and length <= 4096;
            def bounded_text_list:
              type == "array" and length <= 128 and all(.[]; bounded_text);
            keys == [
              "action",
              "benchmark_agreement_inspected",
              "crs_semantics_verified",
              "dataset_id",
              "execution_sha",
              "exposure_identity",
              "external_bytes_persisted",
              "failure_class",
              "holdout_status_established",
              "independent_validation_established",
              "model_use_authorized",
              "profile",
              "publication_authorized",
              "receipt_issue",
              "referenced_dependency_bytes_receipted",
              "referenced_dependency_content_profiled",
              "replacement_cost_semantics_verified",
              "schema_version",
              "source_issue",
              "status",
              "target_sha",
              "taxonomy_semantics_verified"
            ] and
            .schema_version == "oc-esrm20-greece-exposure-profile-result-v1" and
            .action == "esrm20_greece_exposure_wrapper_profile" and
            .source_issue == 285 and .receipt_issue == 285 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .exposure_identity == {
              "byte_count":697,
              "commit_sha":"05f83bbc9df81d02ee8ddb1801d9d781355ce783",
              "consumer_event":"Greece_07-9-1999",
              "project_id":269,
              "project_path":"efehr/esrm20",
              "receipt_comment_id":5388640521,
              "receipt_execution_sha":"9bf3fee5d80431dfa873ee5ae03e07891e6f154a",
              "receipt_retrieved_at":"2026-08-23T21:47:08Z",
              "release":"v1.0",
              "repository_path":"Exposure/OQ_Exposure_Input_Greece.xml",
              "sha256":"f66dd2623a29a1ec6066e4daf9e1c40df14acca24d1643c545d8fac5c38a2556"
            } and
            .referenced_dependency_bytes_receipted == false and
            .referenced_dependency_content_profiled == false and
            .crs_semantics_verified == false and
            .taxonomy_semantics_verified == false and
            .replacement_cost_semantics_verified == false and
            .benchmark_agreement_inspected == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and
              (.profile | type) == "object" and
              (.profile | keys) == [
                "byte_count","commit_sha","consumer_event","content_profile",
                "dataset_id","external_bytes_persisted","model_use_authorized",
                "project_id","project_path","publication_authorized",
                "receipt_comment_id","receipt_execution_sha","receipt_issue",
                "receipt_retrieved_at","release","repository_path",
                "schema_version","sha256","source_issue"
              ] and
              .profile.schema_version == "oc-esrm20-greece-exposure-content-profile-v0" and
              .profile.source_issue == 285 and .profile.receipt_issue == 285 and
              .profile.dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
              .profile.project_id == 269 and .profile.project_path == "efehr/esrm20" and
              .profile.release == "v1.0" and
              .profile.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
              .profile.consumer_event == "Greece_07-9-1999" and
              .profile.repository_path == "Exposure/OQ_Exposure_Input_Greece.xml" and
              .profile.receipt_comment_id == 5388640521 and
              .profile.receipt_execution_sha == "9bf3fee5d80431dfa873ee5ae03e07891e6f154a" and
              .profile.receipt_retrieved_at == "2026-08-23T21:47:08Z" and
              .profile.byte_count == 697 and
              .profile.sha256 == "f66dd2623a29a1ec6066e4daf9e1c40df14acca24d1643c545d8fac5c38a2556" and
              .profile.external_bytes_persisted == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false and
              (.profile.content_profile | type) == "object" and
              (.profile.content_profile | keys) == [
                "benchmark_agreement_inspected","crs_semantics_verified",
                "external_bytes_persisted","holdout_status_established",
                "independent_validation_established","model_use_authorized",
                "parser","profile","publication_authorized",
                "raw_xml_returned","referenced_dependency_bytes_receipted",
                "referenced_dependency_content_profiled",
                "replacement_cost_semantics_verified","schema_version",
                "source_declarations_profiled","taxonomy_semantics_verified"
              ] and
              .profile.content_profile.schema_version == "oc-esrm20-greece-exposure-content-profile-v0" and
              .profile.content_profile.parser ==
                "profile_esrm20_runtime_exposure_xml.profile_xml_bytes" and
              .profile.content_profile.source_declarations_profiled == true and
              .profile.content_profile.raw_xml_returned == false and
              .profile.content_profile.referenced_dependency_bytes_receipted == false and
              .profile.content_profile.referenced_dependency_content_profiled == false and
              .profile.content_profile.crs_semantics_verified == false and
              .profile.content_profile.taxonomy_semantics_verified == false and
              .profile.content_profile.replacement_cost_semantics_verified == false and
              .profile.content_profile.benchmark_agreement_inspected == false and
              .profile.content_profile.independent_validation_established == false and
              .profile.content_profile.holdout_status_established == false and
              .profile.content_profile.external_bytes_persisted == false and
              .profile.content_profile.publication_authorized == false and
              .profile.content_profile.model_use_authorized == false and
              (.profile.content_profile.profile | type) == "object" and
              (.profile.content_profile.profile | keys) == [
                "area","asset_references","cost_types","exposure_fields",
                "exposure_model","nrml_namespace","occupancy_periods",
                "structural_cost_type_declared","structural_value_inputs",
                "tag_names"
              ] and
              (.profile.content_profile.profile.nrml_namespace | bounded_text) and
              (.profile.content_profile.profile.asset_references | bounded_text_list) and
              (.profile.content_profile.profile.occupancy_periods | bounded_text_list) and
              (.profile.content_profile.profile.tag_names | bounded_text_list) and
              (.profile.content_profile.profile.structural_value_inputs | bounded_text_list) and
              (.profile.content_profile.profile.structural_cost_type_declared | type) == "boolean" and
              (.profile.content_profile.profile.exposure_model | type) == "object" and
              (.profile.content_profile.profile.exposure_model | keys) ==
                ["category","description","id","taxonomy_source"] and
              (.profile.content_profile.profile.exposure_model.id | bounded_text) and
              (.profile.content_profile.profile.exposure_model.description | bounded_text) and
              (
                .profile.content_profile.profile.exposure_model.category == null or
                (.profile.content_profile.profile.exposure_model.category | bounded_text)
              ) and
              (
                .profile.content_profile.profile.exposure_model.taxonomy_source == null or
                (.profile.content_profile.profile.exposure_model.taxonomy_source | bounded_text)
              ) and
              (
                .profile.content_profile.profile.area == null or
                (
                  (.profile.content_profile.profile.area | keys) == ["type","unit"] and
                  (.profile.content_profile.profile.area.type | bounded_text) and
                  (.profile.content_profile.profile.area.unit | bounded_text)
                )
              ) and
              (.profile.content_profile.profile.cost_types | type) == "array" and
              (.profile.content_profile.profile.cost_types | length) <= 128 and
              all(.profile.content_profile.profile.cost_types[];
                (keys == ["name","type","unit"]) and
                (.name | bounded_text) and (.type | bounded_text) and (.unit | bounded_text)
              ) and
              (.profile.content_profile.profile.exposure_fields | type) == "array" and
              (.profile.content_profile.profile.exposure_fields | length) <= 128 and
              all(.profile.content_profile.profile.exposure_fields[];
                (
                  (keys == ["input","oq"]) or
                  (keys == ["input","oq","type"])
                ) and
                (.input | bounded_text) and (.oq | bounded_text) and
                ((has("type") | not) or (.type | bounded_text))
              )
            elif .status == "blocked" then
              (
                .failure_class == "acquisition_failure" or
                .failure_class == "profile_failure"
              ) and .profile == null
            else false end)
          ' >/dev/null

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 12000
          jq -n --arg body "$BODY" '{body:$body}' \
            > "$RUNNER_TEMP/greece-exposure-profile-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/285/comments" \
            --input "$RUNNER_TEMP/greece-exposure-profile-comment.json"
