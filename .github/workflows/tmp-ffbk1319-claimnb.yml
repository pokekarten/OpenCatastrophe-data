name: Temporary FFBK 1319 ClaimNb replication

on:
  push:
    branches:
      - tmp/ffbk-1319-independent-run-20260905

permissions:
  contents: read

jobs:
  replicate-claimnb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific stack
        run: python -m pip install --disable-pip-version-check numpy==2.2.3 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.8.0 pyarrow==19.0.1
      - name: Run independent ClaimNb sensitivity
        working-directory: .tmp_ffbk1319
        run: python independent_fremtpl_claimnb_runner.py
      - name: Upload durable result
        uses: actions/upload-artifact@v4
        with:
          name: ffbk1319-raw-claimnb
          path: .tmp_ffbk1319/ffbk1319-raw-claimnb.json
          if-no-files-found: error
