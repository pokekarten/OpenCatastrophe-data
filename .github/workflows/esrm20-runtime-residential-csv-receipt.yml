name: ESRM20 Runtime Residential CSV Receipt

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-runtime-residential-csv-receipt-${{ github.repository }}-${{ github.event.issue.number == 282 && github.event.comment.user.login == github.event.repository.owner.login && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '<!-- oc-eq1-esrm20-runtime-residential-csv-receipt-request-v1 -->') && 'trusted-request' || format('noise-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  execute-receipt:
    name: Execute bounded runtime residential CSV receipt
    if: >-
      github.event.issue.number == 282 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-runtime-residential-csv-receipt-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and run exact fixed worker
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_RUNTIME_RESIDENTIAL_CSV_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/runtime-residential-csv-result.json
        run: |
          set -euo pipefail
          export EXECUTION_SHA="$(git rev-parse HEAD)"

          python -m scripts.run_esrm20_runtime_residential_csv_receipt_action \
            --comment-body-env OC_RUNTIME_RESIDENTIAL_CSV_REQUEST \
            --expected-issue 282 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only

          DEDUP_STATUS="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_runtime_residential_csv_receipt_action as subject

          try:
              duplicate = subject.has_terminal_result(
                  repository=os.environ["GITHUB_REPOSITORY"],
                  token=os.environ["GH_TOKEN"],
                  execution_sha=os.environ["EXECUTION_SHA"],
              )
          except subject.RuntimeResidentialCsvReceiptActionError as exc:
              if str(exc) != "runtime residential ledger is incomplete":
                  raise
              result = subject.ledger_incomplete_result(
                  execution_sha=os.environ["EXECUTION_SHA"]
              )
              Path(os.environ["RESULT_PATH"]).write_text(
                  json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              print("ledger_incomplete")
          else:
              print("duplicate" if duplicate else "clear")
          PY
          )"

          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$DEDUP_STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test "$DEDUP_STATUS" = "ledger_incomplete"; then
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$DEDUP_STATUS" = "clear"

          python -m scripts.run_esrm20_runtime_residential_csv_receipt_action \
            --comment-body-env OC_RUNTIME_RESIDENTIAL_CSV_REQUEST \
            --expected-issue 282 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_runtime_residential_csv_receipt_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("runtime residential CSV result execution identity drifted")
          PY

          RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
          test -n "$RESULT_JSON"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-receipt:
    name: Publish bounded runtime residential CSV evidence
    needs: [execute-receipt]
    if: >-
      needs.execute-receipt.result == 'success' &&
      needs.execute-receipt.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-receipt.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-receipt.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-runtime-residential-csv-receipt-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            keys == [
              "action",
              "content_interpreted",
              "crs_semantics_verified",
              "dataset_id",
              "execution_sha",
              "external_bytes_persisted",
              "failure_class",
              "model_use_authorized",
              "publication_authorized",
              "receipt",
              "runtime_residential_identity",
              "schema_version",
              "source_issue",
              "status",
              "target_sha",
              "taxonomy_semantics_verified",
              "value_semantics_verified"
            ] and
            .schema_version == "oc-esrm20-runtime-residential-csv-receipt-result-v1" and
            .action == "esrm20_runtime_residential_csv_receipt" and
            .source_issue == 282 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and
            .execution_sha == $sha and
            .runtime_residential_identity == {
              "commit_sha":"05f83bbc9df81d02ee8ddb1801d9d781355ce783",
              "project_id":269,
              "project_path":"efehr/esrm20",
              "repository_path":"Exposure/OQ_Exposure_Input_Kosovo_Res.csv",
              "worker_operation_id":"esrm20-v1-kosovo-runtime-residential-csv-v1"
            } and
            .content_interpreted == false and
            .taxonomy_semantics_verified == false and
            .crs_semantics_verified == false and
            .value_semantics_verified == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and
              (.receipt | type) == "object" and
              (.receipt | keys) == ["byte_count","content_type","etag","retrieved_at","sha256"] and
              (.receipt.byte_count | type) == "number" and
              (.receipt.byte_count | floor) == .receipt.byte_count and
              .receipt.byte_count >= 1 and .receipt.byte_count <= 67108864 and
              (.receipt.sha256 | type) == "string" and
              (.receipt.sha256 | test("^[0-9a-f]{64}$")) and
              (.receipt.retrieved_at | type) == "string" and
              (.receipt.retrieved_at | length) >= 1 and
              (.receipt.content_type == null or (.receipt.content_type | type) == "string") and
              (.receipt.etag == null or (.receipt.etag | type) == "string")
            elif .status == "blocked" then
              (.failure_class == "acquisition_failure" or .failure_class == "ledger_incomplete") and
              .receipt == null
            else false end)
          ' >/dev/null

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 20000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/runtime-residential-csv-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/282/comments" \
            --input "$RUNNER_TEMP/runtime-residential-csv-comment.json"
