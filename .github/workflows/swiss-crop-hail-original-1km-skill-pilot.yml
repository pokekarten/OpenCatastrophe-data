name: Swiss original 1 km MESHS POH binary footprint skill pilot

on:
  pull_request:
    paths:
      - "research_runners/swiss_crop_hail_original_1km_skill_pilot_v0.py"
      - "tests/test_swiss_crop_hail_original_1km_skill_pilot_v0.py"
      - ".github/workflows/swiss-crop-hail-original-1km-skill-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiss-hail-1km-binary-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-original-1km-pilot:
    name: Original 2021 exposure with 2017-21 claims-grid and 1km MESHS/POH
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR revision without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Pinned, isolated original radar/grid comparison dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy==2.3.5" "h5py==3.14.0" "scipy==1.16.2" "pyproj==3.7.2"
          python -m pip check
      - name: Strict no-network event, hazard-unit and 2021 field support tests
        run: python -m unittest -v tests.test_swiss_crop_hail_original_1km_skill_pilot_v0
      - name: Run original-source 1 km MESHS and POH binary model pilot, aggregate only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m research_runners.swiss_crop_hail_original_1km_skill_pilot_v0
