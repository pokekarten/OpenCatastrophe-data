name: CEMS EMSN028 official ZIP HEAD receipt

on:
  push:
    branches: [main]
    paths:
      - "scripts/cems_emns028_zip_head_receipt_v0.py"
      - "tests/test_cems_emns028_zip_head_receipt_v0.py"
      - ".github/workflows/cems-emns028-head-receipt.yml"
  pull_request:
    paths:
      - "scripts/cems_emns028_zip_head_receipt_v0.py"
      - "tests/test_cems_emns028_zip_head_receipt_v0.py"
      - ".github/workflows/cems-emns028-head-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-metadata:
    name: Seven synthetic gates and one safe official HEAD
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate offline refusal and redirect constraints
        run: python -m unittest tests.test_cems_emns028_zip_head_receipt_v0 -v
      - name: Test HTTP HEAD only with 18-second deadline and no raw bytes
        run: python -m scripts.cems_emns028_zip_head_receipt_v0 --live
