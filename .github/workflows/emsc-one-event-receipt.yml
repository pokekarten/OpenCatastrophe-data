name: EMSC bounded one-event connectivity receipt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emsc-one-event-probe
  cancel-in-progress: false

jobs:
  probe:
    name: EMSC fixed anonymous one-event probe
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Exercise offline bounded response and security gates
        run: python -m unittest tests.test_probe_emsc_fdsn_event_v0 -v
      - name: Run the one fixed live request and log metadata receipt only
        run: python scripts/probe_emsc_fdsn_event_v0.py --live
