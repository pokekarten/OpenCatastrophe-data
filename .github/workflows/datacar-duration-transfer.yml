name: dataCar duration transfer research runner

on:
  push:
    branches:
      - research-runner/datacar-duration-transfer-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.1 scikit-learn==1.8.0
      - name: Execute preregistered transfer
        run: python research_runners/datacar_duration_transfer.py
      - name: Upload receipt and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datacar-duration-transfer
          path: datacar_duration_transfer_artifact/
          if-no-files-found: error
          retention-days: 30
