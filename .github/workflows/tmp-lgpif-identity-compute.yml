name: Temporary LGPIF identity compute

on:
  push:
    branches:
      - research/lgpif-identity-compute-20260907
    paths:
      - .github/workflows/tmp-lgpif-identity-compute.yml

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ensure R is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v Rscript >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq r-base-core
          fi
          Rscript --version

      - name: Download only in-sample sources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://users.ssc.wisc.edu/~jfrees/InsurableRisks/DataDownload/PropertyFundData/data.RData' \
            --output /tmp/data.RData
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/OpenActTextDev/LDA_Ed2/8410b067ed2548e0e09077bbb880a476a0a2cdf9/Data/WiscPropFund.csv' \
            --output /tmp/WiscPropFund.csv
          sha256sum /tmp/data.RData /tmp/WiscPropFund.csv
          wc -c /tmp/data.RData /tmp/WiscPropFund.csv

      - name: Diagnose deterministic 2006-2010 mappings only
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RSCRIPT'
          options(width=240, digits=17)
          e <- new.env(parent=baseenv())
          load('/tmp/data.RData', envir=e)
          d <- get('data', envir=e)
          w <- read.csv('/tmp/WiscPropFund.csv', stringsAsFactors=FALSE, check.names=FALSE)
          d$PolicyNum <- as.character(d$PolicyNum); w$PolicyNum <- as.character(w$PolicyNum)
          d$Year <- as.integer(d$Year); w$Year <- as.integer(w$Year)
          if (any(d$Year > 2010L, na.rm=TRUE)) stop('TARGET_BLINDNESS_STOP')
          m <- merge(d,w,by=c('PolicyNum','Year'),all=FALSE,suffixes=c('.rdata','.csv'),sort=FALSE)
          kd <- paste(d$PolicyNum,d$Year,sep='|'); kw <- paste(w$PolicyNum,w$Year,sep='|')
          extra <- d[!(kd %in% kw),,drop=FALSE]
          cat('BLINDNESS=dataout.RData_NOT_ACCESSED\n')
          cat(sprintf('ROWS_RDATA=%d ROWS_CSV=%d COMMON=%d RDATA_ONLY=%d CSV_ONLY=%d\n',nrow(d),nrow(w),nrow(m),nrow(extra),length(setdiff(kw,kd))))

          score <- function(name,a,b,atol=1e-8,rtol=1e-10) {
            a <- as.numeric(a); b <- as.numeric(b)
            ok <- is.finite(a)&is.finite(b)
            delta <- abs(a-b); matched <- ok & delta <= atol+rtol*pmax(abs(a),abs(b))
            cat(sprintf('%s comparable=%d matched=%d mismatched=%d max_abs=%.17g\n',name,sum(ok),sum(matched),sum(ok&!matched),if(any(ok))max(delta[ok]) else NaN))
          }
          cat('COVERAGE_SUMMARY_RDATA\n'); print(summary(as.numeric(m$CoverageBC)))
          cat('COVERAGE_SUMMARY_CSV\n'); print(summary(as.numeric(m$BCcov)))
          score('COV_raw',m$BCcov,m$CoverageBC)
          score('COV_x1e6',m$BCcov,as.numeric(m$CoverageBC)*1e6,1e-5,1e-10)
          score('COV_exp',m$BCcov,exp(as.numeric(m$CoverageBC)),1e-5,1e-10)
          score('COV_exp_x1e6',m$BCcov,exp(as.numeric(m$CoverageBC))*1e6,1e-5,1e-10)

          cat('DEDUCT_SUMMARY_RDATA\n'); print(summary(as.numeric(m$lnDeductBC)))
          cat('DEDUCT_SUMMARY_CSV\n'); print(summary(as.numeric(m$Deduct)))
          score('DEDUCT_raw',m$Deduct,m$lnDeductBC)
          score('DEDUCT_exp',m$Deduct,exp(as.numeric(m$lnDeductBC)),1e-8,1e-10)

          cat('FREQ_DISTRIBUTION_CSV\n'); print(table(m$Freq,useNA='ifany'))
          cat('FREQBC_DISTRIBUTION_RDATA\n'); print(table(m$FreqBC,useNA='ifany'))
          cat('FREQ_CROSSTAB\n'); print(table(CSV=m$Freq,RDATA=m$FreqBC,useNA='ifany'))
          score('FREQ_exact',m$Freq,m$FreqBC,0,0)
          score('NOCLAIM_exact',m$NoClaimCredit,m$NoClaimCreditBC,0,0)
          score('CLAIM_AMOUNT_exact',m$BCClaim,m$ClaimBC,1e-8,1e-10)

          bad <- which(as.numeric(m$Freq) != as.numeric(m$FreqBC) & is.finite(as.numeric(m$Freq)) & is.finite(as.numeric(m$FreqBC)))
          cat(sprintf('FREQ_MISMATCH_ROWS=%d\n',length(bad)))
          if (length(bad)) {
            cols <- intersect(c('PolicyNum','Year','Freq','FreqBC','BCClaim','ClaimBC','yAvgBC','BCcov','CoverageBC'),names(m))
            print(head(m[bad,cols,drop=FALSE],20))
          }

          cat('RDATA_ONLY_DIAGNOSTICS\n')
          cat(sprintf('extra_rows=%d CoverageBC_NA=%d CoverageBC_nonpositive=%d lnDeductBC_NA=%d FreqBC_NA=%d ClaimBC_NA=%d\n',
              nrow(extra),sum(is.na(extra$CoverageBC)),sum(!is.na(extra$CoverageBC)&extra$CoverageBC<=0),sum(is.na(extra$lnDeductBC)),sum(is.na(extra$FreqBC)),sum(is.na(extra$ClaimBC))))
          print(table(extra$Year,useNA='ifany'))

          cat(sprintf('Fire5_PRESENT=%s AlarmCredit_PRESENT=%s Premium_PRESENT=%s\n',
              'Fire5'%in%names(d),'AlarmCredit'%in%names(d),'Premium'%in%names(d)))
          cat('TARGET_ACCESS=dataout.RData_NOT_DOWNLOADED_NOT_LOADED_NOT_SCORED\n')
          RSCRIPT
