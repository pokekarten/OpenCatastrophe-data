name: EIA-860 2025 Delaware original capacity and ownership evidence

on:
  pull_request:
    paths:
      - "research_runners/eia860_2025_generator_capacity_ownership_v0.py"
      - "tests/test_eia860_2025_generator_capacity_ownership_v0.py"
      - "docs/research/eia860-2025-generator-nameplate-ownership-20261104.md"
      - ".github/workflows/eia860-2025-generator-capacity-ownership.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    name: Native 2025 generator nameplate and S/J/W source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch without credentials retained
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Source-private synthetic negative regressions
        run: python -m unittest tests.test_eia860_2025_generator_capacity_ownership_v0 -v
      - name: Check fixed official ZIP and record aggregate generator status, nameplate MW and S/J/W ownership
        run: python research_runners/eia860_2025_generator_capacity_ownership_v0.py --live
