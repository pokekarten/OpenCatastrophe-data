name: Temporary PR 415 review-blocker repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 415 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply bounded review repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dep = "efehr_eshm20_source_model_dependencies"
          child = "efehr_eshm20_source_model_child_receipts"
          dep_fields = ("dependency_inventory_authorized", "dependency_receipt_authorized")

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              p.write_text(text.replace(old, new), newline="\n")

          worker = Path("scripts/acquire_eshm20_source_model_child_receipts.py")
          text = worker.read_text()
          for field in dep_fields:
              old = f'    "{field}",\n'
              if text.count(old) != 1:
                  raise SystemExit(f"worker child field-set occurrence drifted: {field}")
              text = text.replace(old, "", 1)
              old = f'        "{field}": False,\n'
              if text.count(old) != 1:
                  raise SystemExit(f"worker child projection occurrence drifted: {field}")
              text = text.replace(old, "", 1)
          worker.write_text(text, newline="\n")

          validator = Path("scripts/validate_agent_action_result_mapping.py")
          text = validator.read_text()
          for field in dep_fields:
              old = f'            "{field}": False,\n'
              if text.count(old) != 1:
                  raise SystemExit(f"validator per-child occurrence drifted: {field}")
              text = text.replace(old, "", 1)
          validator.write_text(text, newline="\n")

          worker_test = Path("tests/test_acquire_eshm20_source_model_child_receipts.py")
          text = worker_test.read_text()
          for field in dep_fields:
              old = f'            self.assertFalse(item["{field}"])\n'
              if text.count(old) != 1:
                  raise SystemExit(f"worker test assertion drifted: {field}")
              text = text.replace(old, f'            self.assertNotIn("{field}", item)\n', 1)
          worker_test.write_text(text, newline="\n")

          wiring = Path("tests/test_efehr_eshm20_source_model_child_receipts_action_wiring.py")
          text = wiring.read_text()
          for field in dep_fields:
              old = f'            "{field}": False,\n'
              if text.count(old) != 1:
                  raise SystemExit(f"wiring fixture child field drifted: {field}")
              text = text.replace(old, "", 1)
          anchor = '        self.assertNotIn("final_url", child["properties"])\n'
          if text.count(anchor) != 1:
              raise SystemExit("wiring schema assertion anchor drifted")
          text = text.replace(
              anchor,
              anchor
              + '        self.assertNotIn("dependency_inventory_authorized", child["properties"])\n'
              + '        self.assertNotIn("dependency_receipt_authorized", child["properties"])\n',
              1,
          )
          wiring.write_text(text, newline="\n")

          schema_path = Path("schemas/agent-action-result-v1.schema.json")
          schema = schema_path.read_text()
          pattern = re.compile(
              r'"not"\s*:\s*\{\s*"required"\s*:\s*\[\s*"'
              + re.escape(dep)
              + r'"\s*,\s*"'
              + re.escape(child)
              + r'"\s*\]\s*\}'
          )
          replacement = (
              '"allOf": ['
              f'{{"not": {{"required": ["{dep}"]}}}}, '
              f'{{"not": {{"required": ["{child}"]}}}}'
              ']'
          )
          schema, count = pattern.subn(replacement, schema)
          if count != 1:
              raise SystemExit(f"combined request-validation exclusion count={count}")

          combined = f'["{dep}", "{child}"]'
          if schema.count(combined) != 1:
              raise SystemExit(f"dependencies evidence combined required count={schema.count(combined)}")
          schema = schema.replace(combined, f'["{dep}"]', 1)

          start_marker = '"efehrEshm20SourceModelChildReceipt": {'
          end_marker = '"efehrEshm20SourceModelChildReceiptSet": {'
          if schema.count(start_marker) != 1 or schema.count(end_marker) != 1:
              raise SystemExit("child schema definition markers drifted")
          start = schema.index(start_marker)
          end = schema.index(end_marker, start)
          block = schema[start:end]
          for field in dep_fields:
              token = f'"{field}", '
              if block.count(token) != 1:
                  raise SystemExit(f"child schema required token drifted: {field}")
              block = block.replace(token, "", 1)
              prop_pattern = re.compile(r'^\s*"' + re.escape(field) + r'"\s*:\s*\{\s*"const"\s*:\s*false\s*\}\s*,?\s*\n', re.MULTILINE)
              block, prop_count = prop_pattern.subn("", block)
              if prop_count != 1:
                  raise SystemExit(f"child schema property drifted: {field}; count={prop_count}")
          schema = schema[:start] + block + schema[end:]
          schema_path.write_text(schema, newline="\n")

          branch_test = Path("tests/test_agent_action_result_schema_branch_regression.py")
          text = branch_test.read_text()
          marker = '\n\nif __name__ == "__main__":\n'
          if text.count(marker) != 1:
              raise SystemExit("schema regression test insertion marker drifted")
          addition = r'''

    def test_source_model_dependencies_portable_branch_remains_dependencies_only(self) -> None:
        schema = self._load_schema()
        branch = self._find_acquisition_branch(
            schema,
            action="efehr_eshm20_source_model_dependencies",
            status=None,
        )
        evidence = branch["then"]["properties"]["evidence"]
        self.assertEqual(evidence, {"required": ["efehr_eshm20_source_model_dependencies"]})
        self.assertNotIn("efehr_eshm20_source_model_child_receipts", json.dumps(branch, sort_keys=True))

    def test_request_validation_independently_excludes_both_source_model_receipt_fields(self) -> None:
        schema = self._load_schema()
        required_exclusions: list[tuple[str, ...]] = []

        def walk(value: object) -> None:
            if isinstance(value, dict):
                not_node = value.get("not")
                if isinstance(not_node, dict) and isinstance(not_node.get("required"), list):
                    required_exclusions.append(tuple(not_node["required"]))
                for child_value in value.values():
                    walk(child_value)
            elif isinstance(value, list):
                for child_value in value:
                    walk(child_value)

        request_branches = []
        for branch in schema["allOf"]:
            properties = branch.get("if", {}).get("properties", {})
            if properties.get("phase") == {"const": "request_validation"}:
                request_branches.append(branch)
        self.assertEqual(len(request_branches), 1)
        walk(request_branches[0]["then"])
        self.assertIn(("efehr_eshm20_source_model_dependencies",), required_exclusions)
        self.assertIn(("efehr_eshm20_source_model_child_receipts",), required_exclusions)
        self.assertNotIn(
            ("efehr_eshm20_source_model_dependencies", "efehr_eshm20_source_model_child_receipts"),
            required_exclusions,
        )
'''
          branch_test.write_text(text.replace(marker, addition + marker, 1), newline="\n")
          PY
          python scripts/schema_reference.py --write
          python -m unittest \
            tests.test_agent_action_result_schema_branch_regression \
            tests.test_acquire_eshm20_source_model_child_receipts \
            tests.test_efehr_eshm20_source_model_child_receipts_action_wiring
          git rm .github/workflows/agent-415-review-blocker-repair.yml
          git diff --check
      - name: Verify full repository DoD
        run: python scripts/check_all.py
      - name: Commit exact repaired product tree
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix PR 415 Tier-2 contract regressions"
          git push origin "HEAD:$HEAD_REF"
