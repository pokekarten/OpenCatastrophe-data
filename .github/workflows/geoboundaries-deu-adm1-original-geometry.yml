name: Original geoBoundaries DEU ADM1 geometry audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/geoboundaries_deu_adm1_original_geojson_v0.py
      - tests/test_geoboundaries_deu_adm1_original_geojson_v0.py
      - .github/workflows/geoboundaries-deu-adm1-original-geometry.yml
  # Execute one bounded exact-source acquisition on merging this audited
  # workflow revision; ordinary main pushes do not download source bytes.
  push:
    branches: [main]
    paths:
      - .github/workflows/geoboundaries-deu-adm1-original-geometry.yml

permissions:
  contents: read

concurrency:
  group: geoboundaries-deu-adm1-original-geometry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-geojson:
    name: Exact Git-LFS SHA and 16-state topology gate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact code revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install reviewed spatial validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Exercise offline synthetic integrity and boundary regressions
        run: python -m unittest tests.test_geoboundaries_deu_adm1_original_geojson_v0 -v
      - name: Exact original provider geometry SHA and topology
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_file="$RUNNER_TEMP/geoboundaries-DEU-ADM1-9469f09.geojson"
          trap 'rm -f "$source_file"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --retry 0 \
            --max-filesize 7340032 \
            --output "$source_file" \
            'https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/9469f09/releaseData/gbOpen/DEU/ADM1/geoBoundaries-DEU-ADM1.geojson'
          python -m research_runners.geoboundaries_deu_adm1_original_geojson_v0 \
            --original-geojson "$source_file"
          # Provider file is ephemeral, never uploaded as a workflow artifact.
