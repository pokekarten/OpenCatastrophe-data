name: DLR WSF bounded WMS visual preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_dlr_wsf_wms_preview_v0.py"
      - "tests/test_probe_dlr_wsf_wms_preview_v0.py"
      - ".github/workflows/dlr-wsf-bounded-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Offline fail-closed PNG / fixed URL tests
        run: python3 -m unittest tests.test_probe_dlr_wsf_wms_preview_v0 -v
      - name: Exactly three anonymous 32x32 provider previews
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            "dlr.wsf.2019" \
            "dlr.eoc.wsf-tracker.2016-2026" \
            "dlr.wsf.evolution.1985-2015"; do
            python3 scripts/probe_dlr_wsf_wms_preview_v0.py --source "$source"
          done
