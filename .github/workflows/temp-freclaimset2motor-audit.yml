name: Temporary freclaimset2motor exact-byte audit
on:
  push:
    branches: [research/freclaimset2motor-audit-20260908]
jobs:
  audit3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Audit tied-state economic materiality
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/dutangc/CASdatasets/227fb56b8734bdb7c0327a41180e01d2ddaeaf26/data/freclaimset2motor.rda' -o /tmp/x.rda
          test "$(git hash-object /tmp/x.rda)" = 'a232d3a63f0ecc7bd28e45ce8364afb660f2eb4f'
          if ! command -v Rscript >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends r-base-core; fi
          cat >/tmp/audit3.R <<'RS'
          e<-new.env(parent=emptyenv());load('/tmp/x.rda',envir=e);d<-e$freclaimset2motor$claimset
          dr<-d[!duplicated(d),,drop=FALSE]
          k<-paste(dr$ClaimID,dr$ManagYear,sep='|');dup<-duplicated(k)|duplicated(k,fromLast=TRUE);z<-dr[dup,,drop=FALSE]
          sp<-split(seq_len(nrow(z)),paste(z$ClaimID,z$ManagYear,sep='|'))
          cols<-c('PaidAmount','RecourseAmount','ExpectCharge','ExpectRecourse')
          cat('CONFLICT_GROUPS=',length(sp),'\n',sep='')
          cat('CONFLICT_CLAIMS=',length(unique(z$ClaimID)),'\n',sep='')
          cat('CONFLICT_OCCURRENCE_YEAR_GROUPS=',sum(vapply(sp,function(ii) z$ManagYear[ii[1]]==z$OccurYear[ii[1]],logical(1))),'\n',sep='')
          cat('OCCURRENCE_YEAR_ROWS=',sum(d$OccurYear==d$ManagYear),'\n',sep='')
          cat('OCCURRENCE_YEAR_UNIQUE_CLAIMS=',length(unique(d$ClaimID[d$OccurYear==d$ManagYear])),'\n',sep='')
          for(nm in cols){
            r<-vapply(sp,function(ii) diff(range(z[[nm]][ii])),numeric(1))
            cat('CONFLICT_',toupper(nm),'_RANGE_SUM=',sum(r),'\n',sep='')
            cat('CONFLICT_',toupper(nm),'_RANGE_MAX=',max(r),'\n',sep='')
            cat('CONFLICT_',toupper(nm),'_NONZERO_GROUPS=',sum(r>0),'\n',sep='')
          }
          o<-order(d$ClaimID,d$ManagYear,method='radix');s<-d[o,,drop=FALSE]
          ends<-c(s$ClaimID[-nrow(s)]!=s$ClaimID[-1],TRUE);last<-s[ends,,drop=FALSE]
          total_terminal_paid<-sum(last$PaidAmount)
          cat('LAST_OBSERVED_PAID_TOTAL=',total_terminal_paid,'\n',sep='')
          paidranges<-vapply(sp,function(ii)diff(range(z$PaidAmount[ii])),numeric(1))
          cat('CONFLICT_PAID_RANGE_SHARE_OF_LAST_PAID=',sum(paidranges)/total_terminal_paid,'\n',sep='')
          # exact duplicate occurrence-year groups explain part of ClaimNb vs unique-ID mismatch
          rawk<-paste(d$ClaimID,d$ManagYear,sep='|');rawdup<-duplicated(rawk)|duplicated(rawk,fromLast=TRUE);rd<-d[rawdup,,drop=FALSE]
          rsp<-split(seq_len(nrow(rd)),paste(rd$ClaimID,rd$ManagYear,sep='|'))
          cat('ALL_DUPKEY_OCCURRENCE_YEAR_GROUPS=',sum(vapply(rsp,function(ii)rd$ManagYear[ii[1]]==rd$OccurYear[ii[1]],logical(1))),'\n',sep='')
          cat('AUDIT3_STATUS=PASS\n')
          RS
          Rscript /tmp/audit3.R
