name: ESRM20 Runtime Exposure XML Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-runtime-exposure-xml-profile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main runtime exposure XML profile request
    if: >-
      github.event.issue.number == 282 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-runtime-exposure-xml-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bind request to trusted main and receipted bytes
        id: fence
        env:
          OC_RUNTIME_EXPOSURE_XML_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_runtime_exposure_xml_profile_action.py \
            --comment-body-env OC_RUNTIME_EXPOSURE_XML_PROFILE_REQUEST_BODY \
            --expected-issue 282 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-profile:
    name: Execute bounded exact-byte XML profile
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_runtime_exposure_xml_profile_action as subject
          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Profile only the fixed receipted runtime exposure XML
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_RUNTIME_EXPOSURE_XML_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/runtime-exposure-xml-profile-result.json
        run: |
          set -euo pipefail
          python scripts/run_esrm20_runtime_exposure_xml_profile_action.py \
            --comment-body-env OC_RUNTIME_EXPOSURE_XML_PROFILE_REQUEST_BODY \
            --expected-issue 282 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_runtime_exposure_xml_profile_action as subject
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("runtime exposure XML profile execution identity drifted")
          PY
      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/runtime-exposure-xml-profile-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-profile:
    name: Publish bounded runtime exposure XML evidence
    needs: [validate-request, execute-profile]
    if: >-
      needs.execute-profile.result == 'success' &&
      needs.execute-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-runtime-exposure-xml-profile-result-v2 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            keys == [
              "action","dataset_id","exact_kosovo_exposure_selected","execution_sha",
              "external_bytes_persisted","failure_class","failure_code","model_use_authorized","profile",
              "publication_authorized","receipt","runtime_exposure_identity","schema_version",
              "source_issue","status","target_sha","value_structural_wiring_verified","xml_content_interpreted"
            ] and
            .schema_version == "oc-esrm20-runtime-exposure-xml-profile-result-v2" and
            .action == "esrm20_runtime_exposure_xml_profile" and
            .source_issue == 282 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .runtime_exposure_identity == {
              "commit_sha":"05f83bbc9df81d02ee8ddb1801d9d781355ce783",
              "project_id":269,
              "project_path":"efehr/esrm20",
              "receipt_byte_count":664,
              "receipt_sha256":"61be4c534e6bdd1577d15dd289b2c604fde41f00f8f636901634daf2f41bcceb",
              "repository_path":"Exposure/OQ_Exposure_Input_Kosovo.xml"
            } and
            .exact_kosovo_exposure_selected == false and
            .value_structural_wiring_verified == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .failure_code == null and .xml_content_interpreted == true and
              (.receipt | type) == "object" and
              (.receipt | keys) == ["byte_count","content_type","etag","retrieved_at","sha256"] and
              .receipt.byte_count == 664 and
              .receipt.sha256 == "61be4c534e6bdd1577d15dd289b2c604fde41f00f8f636901634daf2f41bcceb" and
              (.receipt.retrieved_at | type) == "string" and (.receipt.retrieved_at | length) > 0 and
              (.profile | type) == "object" and
              (.profile | keys) == ["area","asset_references","cost_types","exposure_fields","exposure_model","nrml_namespace","occupancy_periods","structural_cost_type_declared","structural_value_inputs","tag_names"] and
              .profile.nrml_namespace == "http://openquake.org/xmlns/nrml/0.5" and
              (.profile.asset_references | type) == "array" and (.profile.asset_references | length) > 0
            elif .status == "blocked" then
              (.failure_class == "acquisition_failure" or .failure_class == "byte_identity_mismatch" or .failure_class == "xml_profile_failure" or .failure_class == "profile_failure") and
              (if .failure_class == "xml_profile_failure" then
                (.failure_code as $code | [
                  "empty_or_nonbytes_payload",
                  "payload_exceeds_profile_bound",
                  "dtd_or_entity_forbidden",
                  "malformed_xml",
                  "nrml_root_drifted",
                  "exposure_model_cardinality_drifted",
                  "exposure_model_attributes_drifted",
                  "exposure_model_child_namespace_drifted",
                  "exposure_model_child_set_drifted",
                  "required_exposure_metadata_missing",
                  "description_shape_drifted",
                  "description_empty",
                  "unsafe_asset_reference",
                  "asset_reference_not_csv",
                  "assets_declaration_drifted",
                  "asset_reference_set_drifted",
                  "conversions_envelope_drifted",
                  "conversions_child_namespace_drifted",
                  "conversions_child_set_drifted",
                  "area_declaration_drifted",
                  "cost_types_envelope_drifted",
                  "cost_type_declaration_drifted",
                  "cost_type_attributes_drifted",
                  "duplicate_cost_type_name",
                  "occupancy_periods_declaration_drifted",
                  "tag_names_declaration_drifted",
                  "exposure_fields_envelope_drifted",
                  "exposure_field_declaration_drifted",
                  "exposure_field_attributes_drifted",
                  "unclassified_xml_profile_failure"
                ] | index($code) != null)
              else .failure_code == null end) and
              .receipt == null and .profile == null and .xml_content_interpreted == false
            else false end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 30000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/runtime-exposure-xml-profile-comment.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/282/comments" --input "$RUNNER_TEMP/runtime-exposure-xml-profile-comment.json"
