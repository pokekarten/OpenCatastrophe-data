name: Berlin SRHK two exact 512-byte ZIP prefix canaries

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srhk_depth_zip_prefix_v0.py
      - tests/test_berlin_srhk_depth_zip_prefix_v0.py
      - .github/workflows/berlin-srhk-depth-zip-prefix.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srhk-depth-zip-prefix.yml

permissions:
  contents: read

concurrency:
  group: berlin-srhk-depth-range512-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-prefix:
    name: Bounded original 512-byte ZIP header - ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        scenario: [extraordinary, extreme]
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Test synthetic hostile range responses and bounded ZIP header
        run: python -m unittest tests.test_berlin_srhk_depth_zip_prefix_v0 -v
      - name: One exact source GET Range 0-511, no full file
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srhk_depth_zip_prefix_v0 --scenario ${{ matrix.scenario }} --live
