name: Berlin ALKIS WFS typed building field completeness receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_alkis_building_attribute_schema_v0.py
      - tests/test_berlin_alkis_building_attribute_schema_v0.py
      - .github/workflows/berlin-alkis-attribute-schema-receipt.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-alkis-attribute-schema-receipt.yml

permissions:
  contents: read

concurrency:
  group: berlin-official-building-fields-v0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-schema-audit:
    name: Official XSD and 5-object field presence (no personal values)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install reviewed geometry validation libraries
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Offline schema, no personal values and request-boundary tests
        run: python -m unittest tests.test_berlin_alkis_building_attribute_schema_v0 -v
      - name: Exactly two official WFS source operations and metadata-only receipt
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_alkis_building_attribute_schema_v0 --live
