name: DWD paired original stations exact UTC gust comparison

on:
  pull_request:
    paths:
      - 'scripts/dwd_two_station_paired_gust_v0.py'
      - 'tests/test_dwd_two_station_paired_gust_v0.py'
      - '.github/workflows/dwd-paired-original-gust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-paired-gust-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed on invalid original archives, timestamps, serial assumptions
        run: python -m unittest tests.test_dwd_two_station_paired_gust_v0 -v

  two-original-dwd-archive-statistics:
    needs: synthetic-paired-gust-research
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Acquire two SHA-pinned actual historic wind ZIPs; emit aggregate correlation only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          first="$RUNNER_TEMP/10minutenwerte_extrema_wind_00003_20100101_20110331_hist.zip"
          second="$RUNNER_TEMP/10minutenwerte_extrema_wind_00348_20100101_20110901_hist.zip"
          trap 'rm -f "$first" "$second"' EXIT
          curl --fail --silent --show-error --noproxy '*' \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 120 --retry 0 --max-filesize 8388608 --output "$first" \
            'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/extreme_wind/historical/10minutenwerte_extrema_wind_00003_20100101_20110331_hist.zip'
          curl --fail --silent --show-error --noproxy '*' \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 120 --retry 0 --max-filesize 8388608 --output "$second" \
            'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/extreme_wind/historical/10minutenwerte_extrema_wind_00348_20100101_20110901_hist.zip'
          python -m scripts.dwd_two_station_paired_gust_v0 \
            --first-zip "$first" --second-zip "$second"
          # No original rows, coordinates or source ZIPs are uploaded or stored.
