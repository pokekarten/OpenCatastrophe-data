name: Validate generated Markdown views

on:
  push:
    branches-ignore:
      - main
    paths:
      - "**/*.json"
      - "**/*.md"
      - "scripts/render_public_views.py"
      - "scripts/structured_public_views.py"
      - ".github/workflows/sync-public-views.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-view-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check JSON Markdown projections
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify all human-readable JSON projections are current
        run: python scripts/render_public_views.py --check --scope all
