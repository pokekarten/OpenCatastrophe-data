name: DLR WSF native independent GDAL cross-check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_dlr_wsf_native_cog_tile_v0.py"
      - "scripts/verify_dlr_wsf_native_gdal_v0.py"
      - "tests/test_verify_dlr_wsf_native_gdal_v0.py"
      - ".github/workflows/dlr-wsf-native-gdal.yml"
permissions:
  contents: read
jobs:
  independent-gdal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned independent COG decoder only
        run: python3 -m pip install --disable-pip-version-check --only-binary=:all: rasterio==1.5.0
      - name: Prove GDAL can read one sparse LZW GeoTIFF block, offline synthetic
        run: python3 -m unittest tests.test_verify_dlr_wsf_native_gdal_v0 -v
      - name: Verify two exact original native 32x32 window class hashes with GDAL
        run: python3 -m scripts.verify_dlr_wsf_native_gdal_v0
