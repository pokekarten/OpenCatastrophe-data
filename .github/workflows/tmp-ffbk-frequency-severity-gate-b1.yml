name: Temporary FFBK freMTPL2 Gate B1

on:
  pull_request:
    paths:
      - 'scripts/tmp_ffbk_frequency_severity_gate_b1.py'
      - '.github/workflows/tmp-ffbk-frequency-severity-gate-b1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-b1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn rdata
      - name: Record environment
        run: |
          python --version
          python -m pip freeze | sort
      - name: Compile frozen Gate B1 script
        run: python -m py_compile scripts/tmp_ffbk_frequency_severity_gate_b1.py
      - name: Execute real-data Gate B1
        run: python scripts/tmp_ffbk_frequency_severity_gate_b1.py
      - name: Upload result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffbk-frequency-severity-gate-b1-result
          path: ffbk_frequency_severity_gate_b1_result.json
          if-no-files-found: warn
          retention-days: 14
