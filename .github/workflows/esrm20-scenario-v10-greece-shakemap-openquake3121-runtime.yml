name: ESRM20 Greece ShakeMap OpenQuake 3.12.1 Runtime

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-greece-shakemap-openquake3121-runtime-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main native ShakeMap request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-scenario-v10-greece-shakemap-openquake3121-runtime-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up host validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bind request to trusted main and fixed ShakeMap receipts
        id: fence
        env:
          OC_GREECE_SHAKEMAP_OQ3121_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_scenario_v10_greece_shakemap_openquake3121_runtime_action.py \
            --comment-body-env OC_GREECE_SHAKEMAP_OQ3121_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-native-runtime:
    name: Execute exact OpenQuake 3.12.1 ShakeMap reader gate
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up host Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Prove complete issue-local dedup before external activity
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_scenario_v10_greece_shakemap_openquake3121_runtime_action as subject
          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Fetch exact OpenQuake v3.12.1 source
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_COMMIT: 0bb8441aa202cd6ec075bf2044dd4aaeb26919b9
        run: |
          set -euo pipefail
          OQ_ROOT="$RUNNER_TEMP/oq-engine"
          git init "$OQ_ROOT"
          git -C "$OQ_ROOT" remote add origin https://github.com/gem/oq-engine.git
          git -C "$OQ_ROOT" fetch --depth=1 origin refs/tags/v3.12.1:refs/tags/v3.12.1
          OBSERVED="$(git -C "$OQ_ROOT" rev-parse 'refs/tags/v3.12.1^{commit}')"
          test "$OBSERVED" = "$OQ_COMMIT"
          git -C "$OQ_ROOT" checkout --detach "$OBSERVED"
          test -z "$(git -C "$OQ_ROOT" status --porcelain=v1)"
      - name: Build observed OpenQuake 3.12.1 execution container
        if: steps.dedup.outputs.skip != 'true'
        id: image
        run: |
          set -euo pipefail
          BASE_IMAGE="openquake/engine:3.12.1"
          docker pull "$BASE_IMAGE"
          BASE_REPO_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          printf '%s\n' "$BASE_REPO_DIGEST" | grep -Eq '^openquake/engine@sha256:[0-9a-f]{64}$'
          DOCKERFILE="$RUNNER_TEMP/Dockerfile.oq3121-shakemap-runtime"
          cat > "$DOCKERFILE" <<EOF
          FROM $BASE_REPO_DIGEST
          USER root
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          COPY --chown=root:root oq-engine /oq-engine
          RUN git config --system --add safe.directory /oq-engine
          USER openquake
          EOF
          docker build --pull=false \
            --file "$DOCKERFILE" \
            --tag oc-oq3121-shakemap-runtime:local \
            "$RUNNER_TEMP"
          IMAGE_ID="$(docker image inspect --format='{{.Id}}' oc-oq3121-shakemap-runtime:local)"
          printf '%s\n' "$IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
      - name: Run exact-byte native ShakeMap acceptance gate
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_GREECE_SHAKEMAP_OQ3121_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
          RESULT_PATH: ${{ runner.temp }}/greece-shakemap-oq3121-result/result.json
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/greece-shakemap-oq3121-result"
          mkdir -p "$OUTPUT_DIR"
          : > "$OUTPUT_DIR/result.json"
          chmod 0666 "$OUTPUT_DIR/result.json"
          docker run --rm \
            --entrypoint /opt/openquake/bin/python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e PYTHONPATH=/oq-engine:/workspace \
            -e OC_GREECE_SHAKEMAP_OQ3121_REQUEST \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$OUTPUT_DIR:/output" \
            -w /workspace \
            "$IMAGE_ID" \
            scripts/run_esrm20_scenario_v10_greece_shakemap_openquake3121_runtime_action.py \
            --comment-body-env OC_GREECE_SHAKEMAP_OQ3121_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --image-digest "$IMAGE_ID" \
            --output /output/result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_scenario_v10_greece_shakemap_openquake3121_runtime_action as subject
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("native ShakeMap runtime execution identity drifted")
          PY
      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/greece-shakemap-oq3121-result/result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 8900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-native-runtime:
    name: Publish bounded native ShakeMap evidence
    needs: [validate-request, execute-native-runtime]
    if: >-
      needs.execute-native-runtime.result == 'success' &&
      needs.execute-native-runtime.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence closed result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-native-runtime.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-scenario-v10-greece-shakemap-openquake3121-runtime-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-scenario-v10-greece-shakemap-openquake3121-runtime-result-v1" and
            .action == "esrm20_scenario_v10_greece_shakemap_openquake3121_runtime" and
            .source_issue == 285 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            (.execution_container_image_digest | test("^sha256:[0-9a-f]{64}$")) and
            .openquake_reference == {
              "commit":"0bb8441aa202cd6ec075bf2044dd4aaeb26919b9",
              "parser_path":"openquake.hazardlib.shakemap.parsers.get_array(usgs_xml)",
              "repository":"gem/oq-engine",
              "tag":"v3.12.1"
            } and
            .shakemap_identity.commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
            .shakemap_identity.grid.receipt_sha256 == "3c2fe7a2a7182fac999442ce3d88ddfd99004b7f999462ef2327f2eebc1ccd9f" and
            .shakemap_identity.uncertainty.receipt_sha256 == "eb08df5ff78f265fb45bf31dbd3dddf4f01bf10632382d4156a2bdf016e46417" and
            .output_payload_bytes_read == false and .external_bytes_persisted == false and
            .historical_environment_verified == false and
            .event_location_inference_authorized == false and
            .scenario_selection_authorized == false and
            .scientific_validity_verified == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .publication_authorized == false and .model_use_authorized == false and
            (if .status == "pass" then
               .failure_stage == null and .failure_code == null and
               .runtime_source_commit_verified == true and
               .provider_file_bytes_read == true and
               .byte_identity_verified == true and
               .trusted_profile_precondition_verified == true and
               .native_reader_attempted == true and
               .native_reader_acceptance_verified == true and
               .native_row_count == 96525 and
               .native_top_level_fields == ["lon","lat","vs30","val","std"] and
               .native_value_imts == ["MMI","PGA","SA(0.3)","SA(1.0)","SA(3.0)"] and
               .native_stddev_imts == ["MMI","PGA","SA(0.3)","SA(1.0)","SA(3.0)"] and
               .native_grid_uncertainty_coordinate_match_verified == true
             elif .status == "blocked" then
               (.failure_stage == "runtime_identity" or .failure_stage == "acquisition" or
                .failure_stage == "byte_identity" or .failure_stage == "profile_precondition" or
                .failure_stage == "native_reader") and
               .native_reader_acceptance_verified == false and
               .native_grid_uncertainty_coordinate_match_verified == false and
               .native_row_count == null and .native_top_level_fields == null and
               .native_value_imts == null and .native_stddev_imts == null
             else false end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 9000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/result-comment.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/285/comments" --input "$RUNNER_TEMP/result-comment.json"
