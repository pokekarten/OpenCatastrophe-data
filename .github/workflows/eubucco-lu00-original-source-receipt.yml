name: EUBUCCO LU00 original bounded Parquet source receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/eubucco-lu00-original-source-receipt.yml'
      - 'research_runners/eubucco_lu00_lineage_preflight_v0.py'
      - 'docs/research/eubucco-lu00-original-source-receipt-20261101.md'

permissions:
  contents: read

jobs:
  original-eubucco-lu00-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install exact Parquet research runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input pyarrow==20.0.0
          python -m pip check
      - name: Verify synthetic EUBUCCO lineage safety
        run: python -m unittest tests.test_eubucco_lu00_lineage_preflight_v0 -v
      - name: Bounded public LU00-only source acquisition and aggregate-only audit
        shell: bash
        run: |
          set -euo pipefail
          source_file="$RUNNER_TEMP/eubucco-lu00-v0.2-original.parquet"
          trap 'rm -f "$source_file"' EXIT
          umask 077
          # Fixed URL, single source object, no wildcard, redirects only HTTPS.
          # Hard 256 MiB and 4-minute download budgets.
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 240 --retry 0 \
            --max-filesize 268435456 --output "$source_file" \
            'https://s3.eubucco.com/eubucco/v0.2/buildings/parquet/nuts_id=LU00/LU00.parquet'
          # This digest is an INITIAL source-byte receipt, NOT independent
          # provider authenticity verification or an original published hash.
          original_sha256="$(sha256sum "$source_file" | cut -d' ' -f1)"
          python research_runners/eubucco_lu00_lineage_preflight_v0.py \
            --original "$source_file" \
            --source-id eubucco.buildings.v0.2 \
            --partition-id LU00 \
            --expected-sha256 "$original_sha256"
          # Provider row contents and geometries are never printed or saved.
          # No raw data, crosswalks, source artifact or insurer records persisted.
