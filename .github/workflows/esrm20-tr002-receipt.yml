name: ESRM20 TR002 Release PDF Receipt

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate-request:
    name: Validate trusted-main TR002 receipt request
    if: >-
      github.event.issue.number == 596 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-tr002-receipt-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_TR002_RECEIPT_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_tr002_receipt_action.py \
            --comment-body-env OC_TR002_RECEIPT_REQUEST_BODY \
            --expected-issue 596 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-and-publish-receipt:
    name: Execute and publish bounded TR002 receipt
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    concurrency:
      group: esrm20-tr002-receipt-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_tr002_receipt_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Run exact fixed TR002 receipt
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_TR002_RECEIPT_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-tr002-receipt.json
        run: |
          set -euo pipefail
          python scripts/run_esrm20_tr002_receipt_action.py \
            --comment-body-env OC_TR002_RECEIPT_REQUEST_BODY \
            --expected-issue 596 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

      - name: Re-fence and publish terminal receipt evidence
        if: steps.dedup.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-tr002-receipt.json
          RESULT_MARKER: "<!-- oc-eq1-esrm20-tr002-receipt-result-v1 -->"
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_tr002_receipt_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          execution_sha = os.environ["EXECUTION_SHA"]
          for field, expected in subject._base_result(execution_sha=execution_sha).items():
              observed = result.get(field)
              if type(observed) is not type(expected) or observed != expected:
                  raise SystemExit(f"result drifted at {field}")
          if result.get("status") == "pass":
              receipt = result.get("receipt")
              if not isinstance(receipt, dict) or not receipt.get("sha256") or not receipt.get("byte_count"):
                  raise SystemExit("PASS lacks bounded receipt")
          elif result.get("status") == "blocked":
              if result.get("failure_class") != "acquisition_failure" or result.get("receipt") is not None:
                  raise SystemExit("blocked result is not atomic")
          else:
              raise SystemExit("result has non-terminal status")
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/esrm20-tr002-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/596/comments" \
            --input "$RUNNER_TEMP/esrm20-tr002-comment.json"
