# Temporary FFBK integration support. Public PyPI wheels only; no private FFBK source.
name: tmp-ffbk1319-export-cp313-wheelhouse

on:
  push:
    branches:
      - tmp/ffbk-1319-independent-run-20260905
    paths:
      - .github/workflows/tmp-ffbk1319-export-cp313-wheelhouse.yml

permissions:
  contents: read

jobs:
  export-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned scientific wheels
        run: |
          mkdir -p .tmp_ffbk1319/wheelhouse
          python -m pip download --disable-pip-version-check --only-binary=:all: \
            --dest .tmp_ffbk1319/wheelhouse \
            numpy==2.2.3 pandas==2.2.3 scipy==1.15.2 \
            scikit-learn==1.8.0 pyarrow==19.0.1
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: ffbk1319-cp313-wheelhouse
          path: .tmp_ffbk1319/wheelhouse
          if-no-files-found: error
          compression-level: 0
