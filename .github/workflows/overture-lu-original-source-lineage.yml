name: Luxembourg Overture original building source lineage

on:
  pull_request:
    paths:
      - research_runners/overture_lu_original_source_family_mix_v0.py
      - tests/test_overture_lu_original_source_family_mix_v0.py
      - .github/workflows/overture-lu-original-source-lineage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-original-upstream-lineage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-source-mix:
    name: One pinned rowgroup, aggregate upstream source families, no IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout reviewed research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned anonymous original Parquet reader
        run: |
          python -m pip install --disable-pip-version-check --no-input pyarrow==26.0.0
          python -m pip check
      - name: Source-free lineage regression tests
        run: python -m unittest tests.test_overture_lu_original_source_family_mix_v0 -v
      - name: Read original source dataset labels, never provider record IDs
        run: python -m research_runners.overture_lu_original_source_family_mix_v0 --live
