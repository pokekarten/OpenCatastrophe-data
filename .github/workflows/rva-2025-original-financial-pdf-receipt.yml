name: R+V original 2025 financial PDF byte receipts (research only)

on:
  pull_request:
    paths:
      - ".github/workflows/rva-2025-original-financial-pdf-receipt.yml"
      - "research_runners/rva_solo_original_financial_pdf_receipt_v0.py"
      - "tests/test_rva_solo_original_financial_pdf_receipt_v0.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-original-sfcr-hgb:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact SHA-pinned read-only checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Fail-closed PDF downloader and source semantics unit tests (no HTTP)
        run: |
          python -m unittest tests.test_rva_solo_original_financial_pdf_receipt_v0 -v
          python -m compileall -q research_runners/rva_solo_original_financial_pdf_receipt_v0.py
      - name: Install exact pure-Python PDF reader, no Poppler required
        run: |
          python -m pip install --disable-pip-version-check --no-input pypdf==5.9.0
          python -m pip check
      - name: Fetch ephemeral official issuer PDFs and emit only hashes/positive receipts
        run: python research_runners/rva_solo_original_financial_pdf_receipt_v0.py
