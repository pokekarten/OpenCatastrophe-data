name: Temporary taxonomy action-set regression update

on:
  push:
    branches:
      - agent/363-taxonomy-action-port

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Extend only the two exhaustive action-set regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in (
              'tests/test_agent_action_protocol.py',
              'tests/test_dwd_metadata_result_review_regressions.py',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              marker = '                "efehr_eshm20_gsim_resource_profile",\n'
              addition = marker + '                "efehr_kosovo_taxonomy_identity",\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one GMM action-set marker in {filename}')
              if '                "efehr_kosovo_taxonomy_identity",\n' in text:
                  raise SystemExit(f'taxonomy action already present in {filename}')
              path.write_text(text.replace(marker, addition), encoding='utf-8')
          PY
      - name: Remove updater and commit bounded expectation change
        run: |
          git rm .github/workflows/temp-update-taxonomy-test-expectations.yml
          git diff --check
          git config user.name 'OpenCatastrophe port bot'
          git config user.email '287434260+pokekarten@users.noreply.github.com'
          git add -A
          git commit -m 'Align taxonomy action-set regressions'
          git push origin HEAD:agent/363-taxonomy-action-port
