name: HANZE v3.0.2 Native 2024 Regions Original Source Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/hanze-native-region-source-evidence.yml"
      - "research_runners/hanze_native_regions2024_source_audit_v0.py"
      - "research_runners/hanze_native_regions2024_original_receipt_v0.py"
      - "tests/test_hanze_native_regions2024_source_audit_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanze-s2-regions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-region-source:
    name: Verify HANZE original 2024 S2 region glossary and candidate mappings
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Synthetic rights, source-SHA and multi-code guards
        run: python -m unittest tests.test_hanze_native_regions2024_source_audit_v0 -v
      - name: Reproduce real publisher-source regional glossary coverage (no raw files saved)
        run: |
          python research_runners/hanze_native_regions2024_original_receipt_v0.py --out "$RUNNER_TEMP/hanze-s2-regional-audit.json"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-s2-regional-audit.json").read_text()); s=r["original_glossary"]; assert r["candidate_pair_count"] == 9 and sum(r["status_counts"].values()) == 9 and s["publisher_md5_confirmed"] and s["distinct_region_codes"] >= 1000 and not r["source_event_identity_proven"] and not r["model_input_admitted"] and not r["gis_geometry_loaded"]; print("HANZE v3.0.2 original S2 glossary/region list source metadata, NOT flood footprint:", json.dumps({k:r[k] for k in ("original_glossary","status_counts","region_tokens_from_accepted_lists")},sort_keys=True))'
