name: Berlin SRHK bounded TIFF header in ZIP canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srhk_zip_first_tiff_header_v0.py
      - tests/test_berlin_srhk_zip_first_tiff_header_v0.py
      - research_runners/berlin_srhk_tiff_grid_affine_v0.py
      - tests/test_berlin_srhk_tiff_grid_affine_v0.py
      - research_runners/berlin_srhk_tiff_band_semantics_v0.py
      - tests/test_berlin_srhk_tiff_band_semantics_v0.py
      - .github/workflows/berlin-srhk-tiff-header.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srhk-tiff-header.yml

permissions:
  contents: read

concurrency:
  group: berlin-srhk-first-tiff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-tiff-header:
    name: Original ZIP TIFF header, source ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        scenario: [extreme, extraordinary]
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Synthetic ZIP, TIFF GeoKey, malicious range and decompression-cap tests
        run: python -m unittest tests.test_berlin_srhk_zip_first_tiff_header_v0 -v
      - name: Synthetic projected TIFF grid and fixed Berlin pilot coverage gates
        run: python -m unittest tests.test_berlin_srhk_tiff_grid_affine_v0 -v
      - name: Synthetic TIFF NoData, band-unit and source-bound ZIP metadata contract
        run: python -m unittest tests.test_berlin_srhk_tiff_band_semantics_v0 -v
      - name: Exactly 65536 original ZIP bytes and bounded in-memory TIFF metadata
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srhk_zip_first_tiff_header_v0 --scenario ${{ matrix.scenario }} --live
