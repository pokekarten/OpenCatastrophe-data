name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    needs: [eu-flood-spatial]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reviewed validation dependency set
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-validation.txt
      - name: Verify validation dependency consistency
        run: python -m pip check
      - name: Repository definition of done
        run: python scripts/check_all.py

  glofas-acquisition:
    name: GloFAS NetCDF4 acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed acquisition dependency set
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-glofas-acquisition.txt
      - name: Verify acquisition dependency consistency
        run: python -m pip check
      - name: Exercise real NetCDF4 reader with synthetic bytes
        run: python -m unittest tests.test_glofas_v4_uparea_reader -v

  eu-flood-spatial:
    name: EU flood spatial A1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed EU flood spatial dependency set
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Verify EU flood spatial dependency consistency
        run: python -m pip check
      - name: Exercise synthetic EU flood spatial transform
        run: python -m unittest tests.test_eu_flood_spatial_transform -v

  cems-geotiff-profile:
    name: CEMS GeoTIFF metadata profile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed CEMS GeoTIFF dependency set
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-cems-geotiff-profile.txt
      - name: Verify CEMS GeoTIFF dependency consistency
        run: python -m pip check
      - name: Exercise receipt-bound GeoTIFF metadata profile with synthetic bytes
        run: python -m unittest tests.test_cems_rp10_geotiff_profile -v

  reuse:
    name: REUSE 6.2.0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed development dependency set
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify REUSE compliance
        run: reuse lint

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reject newly introduced high-severity vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  required:
    name: Required
    if: always()
    needs: [check, glofas-acquisition, cems-geotiff-profile, reuse, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          GLOFAS_ACQUISITION_RESULT: ${{ needs.glofas-acquisition.result }}
          CEMS_GEOTIFF_PROFILE_RESULT: ${{ needs.cems-geotiff-profile.result }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$CHECK_RESULT" = "success"
          test "$GLOFAS_ACQUISITION_RESULT" = "success"
          test "$CEMS_GEOTIFF_PROFILE_RESULT" = "success"
          test "$REUSE_RESULT" = "success"
          test "$DEPENDENCY_REVIEW_RESULT" = "success" || test "$DEPENDENCY_REVIEW_RESULT" = "skipped"
