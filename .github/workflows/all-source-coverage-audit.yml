name: All source coverage and reviewed public API probes

on:
  pull_request:
    paths:
      - 'scripts/audit_all_sources_v0.py'
      - 'tests/test_audit_all_sources_v0.py'
      - '.github/workflows/all-source-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-source-offline-audit:
    name: Every source registry record and reviewed access contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate all-source coverage and fail-closed access inventory
        run: python -m unittest tests.test_audit_all_sources_v0 tests.test_source_access_inventory_failclosed -v
      - name: Generate one status and next action per source, without network
        run: |
          python -m scripts.audit_all_sources_v0 \
            --json "$RUNNER_TEMP/all-source-audit.json" \
            --markdown "$RUNNER_TEMP/all-source-audit.md"
          cat "$RUNNER_TEMP/all-source-audit.md" >> "$GITHUB_STEP_SUMMARY"
  reviewed-live-api-probes:
    name: Fixed HTTPS probe / ${{ matrix.source }}
    needs: [all-source-offline-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        source:
          - geoboundaries.gbopen
          - gfz.geomagnetic-kp
          - noaa.swpc.real-time-solar-wind
          - wsv.pegelonline.rest-v2.dresden
          - emsc.seismicportal.fdsn-event
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source allowlist and static contract before network
        run: python -m unittest tests.test_probe_fixed_public_sources_v0 -v
      - name: One reviewed, bounded, anonymous request per source
        env:
          SOURCE: ${{ matrix.source }}
        run: python -m scripts.probe_fixed_public_sources_v0 --source "$SOURCE"

  other-reviewed-live-probes:
    name: Additional fixed public source / ${{ matrix.source }}
    needs: [all-source-offline-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source:
          - dwd.cdc.extreme-wind.http-file
          - esa.worldcover.2021.v200
          - globaldamwatch.gdw.v1.0
          - noaa.coops.water-levels
          - storm.ibtracs.present-climate.v4.datacite
          - usgs.3dep.s1m.tnmaccess
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fixed reviewed original-provider probe (one request only)
        env:
          SOURCE: ${{ matrix.source }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE" in
            dwd.cdc.extreme-wind.http-file)
              python -m unittest tests.test_probe_dwd_historical_directory_v0 -v
              python -m scripts.probe_dwd_historical_directory_v0
              ;;
            esa.worldcover.2021.v200)
              python -m unittest tests.test_probe_esa_worldcover_tiff_header_v0 -v
              python -m scripts.probe_esa_worldcover_tiff_header_v0 --live
              ;;
            globaldamwatch.gdw.v1.0)
              python -m unittest tests.test_probe_globaldamwatch_gdw_v1_metadata_v0 -v
              python -m scripts.probe_globaldamwatch_gdw_v1_metadata_v0 --live
              ;;
            noaa.coops.water-levels)
              python -m unittest tests.test_probe_noaa_coops_water_levels_v0 -v
              python -m scripts.probe_noaa_coops_water_levels_v0 --live
              ;;
            storm.ibtracs.present-climate.v4.datacite)
              python -m unittest tests.test_storm_v4_datacite_probe_v0 -v
              python -m research_runners.storm_v4_datacite_probe_v0 --probe-once
              ;;
            usgs.3dep.s1m.tnmaccess)
              python -m unittest tests.test_probe_usgs_s1m_florida_tnm_v0 -v
              python -m scripts.probe_usgs_s1m_florida_tnm_v0 --live
              ;;
            *)
              echo "BLOCKED: no reviewed one-shot probe for source" >&2
              exit 2
              ;;
          esac
