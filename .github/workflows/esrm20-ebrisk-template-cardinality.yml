name: ESRM20 Ebrisk Template Cardinality

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-ebrisk-template-cardinality-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-diagnostic:
    name: Execute exact trusted-main ebrisk template diagnostic
    if: >-
      github.event.issue.number == 281 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-ebrisk-template-cardinality-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and diagnose fixed template cardinality
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_EBRISK_TEMPLATE_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-ebrisk-template-cardinality.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_ebrisk_template_cardinality_action.py \
            --comment-body-env OC_EBRISK_TEMPLATE_REQUEST \
            --expected-issue 281 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-diagnostic:
    name: Publish bounded ebrisk template diagnostic
    needs: [execute-diagnostic]
    if: >-
      needs.execute-diagnostic.result == 'success' &&
      needs.execute-diagnostic.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-diagnostic.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-diagnostic.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-ebrisk-template-cardinality-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            (keys == [
              "execution_sha",
              "external_bytes_persisted",
              "historical_group_assignment_authorized",
              "model_use_authorized",
              "provider_file_bytes_read",
              "publication_authorized",
              "schema_version",
              "source_issue",
              "status",
              "target_sha",
              "template_resolution"
            ]) and
            .schema_version == "oc-esrm20-ebrisk-template-cardinality-result-v1" and
            .source_issue == 281 and
            .target_sha == $sha and .execution_sha == $sha and
            .status == "pass" and
            .provider_file_bytes_read == false and
            .external_bytes_persisted == false and
            .historical_group_assignment_authorized == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (.template_resolution | length) == 3 and
            (.template_resolution | all(.[]; (keys == ["basename","state"]))) and
            ([.template_resolution[].basename] ==
              ["config_ebrisk_group1.ini","config_ebrisk_group2.ini","conif_ebrisk_group3.ini"]) and
            ([.template_resolution[].state] | all(
              . == "missing" or
              . == "single_blob" or
              . == "single_non_blob" or
              . == "multiple"
            ))
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/ebrisk-template-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/ebrisk-template-comment.json"
