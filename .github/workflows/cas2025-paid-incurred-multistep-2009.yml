name: CAS paid-incurred multistep 2009 bridge

on:
  push:
    branches:
      - research-run/cas2025-paid-incurred-multistep-2009-sol56
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numeric dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Compile frozen bridge
        run: python -m py_compile scripts/research/cas2025_paid_incurred_multistep_2009_bridge.py
      - name: Download exact current CAS Schedule-P targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www.casact.org/sites/default/files/2026-03/ppauto_pos98-07%20%281%29.csv' -o target/ppauto.csv
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www.casact.org/sites/default/files/2026-03/wkcomp_pos_98-07.csv' -o target/wkcomp.csv
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www.casact.org/sites/default/files/2026-03/comauto_pos_98-07.csv' -o target/comauto.csv
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www.casact.org/sites/default/files/2026-03/medmal_pos_98-07.csv' -o target/medmal.csv
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www.casact.org/sites/default/files/2026-03/prodliab_pos_98-07.csv' -o target/prodliab.csv
          curl --fail --location --retry 5 --retry-all-errors \
            'https://www.casact.org/sites/default/files/2026-03/othliab_pos_98-07.csv' -o target/othliab.csv
          sha256sum target/*.csv
          wc -c target/*.csv
      - name: Execute preregistered 2009 discriminator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research/cas2025_paid_incurred_multistep_2009_bridge.py \
            --dataset 'ppauto=target/ppauto.csv' \
            --dataset 'wkcomp=target/wkcomp.csv' \
            --dataset 'comauto=target/comauto.csv' \
            --dataset 'medmal=target/medmal.csv' \
            --dataset 'prodliab=target/prodliab.csv' \
            --dataset 'othliab=target/othliab.csv' \
            --source-url 'ppauto=https://www.casact.org/sites/default/files/2026-03/ppauto_pos98-07%20%281%29.csv' \
            --source-url 'wkcomp=https://www.casact.org/sites/default/files/2026-03/wkcomp_pos_98-07.csv' \
            --source-url 'comauto=https://www.casact.org/sites/default/files/2026-03/comauto_pos_98-07.csv' \
            --source-url 'medmal=https://www.casact.org/sites/default/files/2026-03/medmal_pos_98-07.csv' \
            --source-url 'prodliab=https://www.casact.org/sites/default/files/2026-03/prodliab_pos_98-07.csv' \
            --source-url 'othliab=https://www.casact.org/sites/default/files/2026-03/othliab_pos_98-07.csv' \
            --output result.json
      - name: Bind execution metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          import numpy as np
          p = Path('result.json')
          d = json.loads(p.read_text())
          d['execution'] = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'trigger_head_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'python': platform.python_version(),
              'numpy': np.__version__,
          }
          p.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit receipt only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-results
          cp result.json research-results/cas2025-paid-incurred-multistep-2009-result-v0.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-results/cas2025-paid-incurred-multistep-2009-result-v0.json
          git commit -m 'Research: record CAS multistep incurred 2009 receipt'
          git push
