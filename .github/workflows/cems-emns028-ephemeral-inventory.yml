name: CEMS EMSN028 ephemeral original ZIP inventory

on:
  push:
    branches: [main]
    paths:
      - "scripts/cems_emns028_ephemeral_zip_inventory_v0.py"
      - "tests/test_cems_emns028_ephemeral_zip_inventory_v0.py"
      - ".github/workflows/cems-emns028-ephemeral-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-research-only:
    name: Ephemeral <=180MB ZIP SHA and member-type inventory (not model data)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Offline synthetic ZIP safety tests
        run: python -m unittest tests.test_cems_emns028_ephemeral_zip_inventory_v0 -v
      - name: Bounded temporary original ZIP inspection with automatic delete
        run: python -m scripts.cems_emns028_ephemeral_zip_inventory_v0 --live
