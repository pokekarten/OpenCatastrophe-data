name: ESRM20 Athens Local Receipts

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    esrm20-athens-local-receipts-${{
      github.repository
    }}-${{
      github.event.issue.number == 658 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(
        github.event.comment.body,
        '<!-- oc-eq1-esrm20-athens-local-receipts-request-v1 -->'
      ) &&
      'trusted-request' ||
      format('noise-{0}', github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  execute-athens-local-receipts:
    name: Receipt exact trusted-main Athens-local inputs
    if: >-
      github.event.issue.number == 658 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(
        github.event.comment.body,
        '<!-- oc-eq1-esrm20-athens-local-receipts-request-v1 -->'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and receipt fixed Athens-local inputs
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_ATHENS_LOCAL_RECEIPT_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-athens-local-receipts.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_efehr_esrm20_athens_local_receipts_action.py \
            --comment-body-env OC_ATHENS_LOCAL_RECEIPT_REQUEST \
            --expected-issue 658 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            test "$(jq -r '
              ((keys | sort) ==
                (["duplicate_result_comment_id","status"] | sort)) and
              .status == "duplicate" and
              (.duplicate_result_comment_id | type) == "number" and
              .duplicate_result_comment_id >= 1
            ' "$RESULT_PATH")" = "true"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 24000
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-athens-local-receipts:
    name: Publish bounded Athens-local byte receipts
    needs: [execute-athens-local-receipts]
    if: >-
      needs.execute-athens-local-receipts.result == 'success' &&
      needs.execute-athens-local-receipts.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXECUTION_SHA: ${{ needs.execute-athens-local-receipts.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-athens-local-receipts.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-athens-local-receipts-result-v1 -->"
        run: |
          set -euo pipefail
          LATEST_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha'
          )"
          test "$LATEST_SHA" = "$EXECUTION_SHA"

          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            def receipt($role; $path; $blob; $bytes):
              ((keys | sort) == ([
                "byte_count","content_type","etag","external_bytes_persisted",
                "git_blob_sha1","provider_file_bytes_read",
                "publication_authorized","repository_path","retrieved_at",
                "role","sha256"
              ] | sort)) and
              .role == $role and
              .repository_path == $path and
              .git_blob_sha1 == $blob and
              .byte_count == $bytes and
              (.retrieved_at | type == "string" and length >= 1) and
              (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
              (.content_type == null or (.content_type | type == "string")) and
              (.etag == null or (.etag | type == "string")) and
              .provider_file_bytes_read == true and
              .external_bytes_persisted == false and
              .publication_authorized == false;

            ((keys | sort) == ([
              "benchmark_agreement_inspected","commit_sha",
              "content_semantics_verified","dataset_id","event_id",
              "event_location_inference_authorized","execution_sha",
              "external_bytes_persisted","failure_class",
              "holdout_status_established","independent_validation_established",
              "model_use_authorized","output_payload_bytes_read","project_id",
              "project_path","provider_file_bytes_read",
              "provider_file_content_profiled","provider_host",
              "publication_authorized","receipts","release_tag",
              "scenario_selection_authorized","schema_version","source_issue",
              "status","target_sha"
            ] | sort)) and
            .schema_version == "oc-esrm20-athens-local-receipts-result-v1" and
            .source_issue == 658 and
            .target_sha == $sha and .execution_sha == $sha and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .provider_host == "gitlab.seismo.ethz.ch" and
            .project_id == 273 and
            .project_path == "efehr/esrm20_scenario_tests" and
            .release_tag == "v1.0" and
            .commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
            .event_id == "Greece_07-9-1999" and
            .provider_file_content_profiled == false and
            .output_payload_bytes_read == false and
            .content_semantics_verified == false and
            .benchmark_agreement_inspected == false and
            .event_location_inference_authorized == false and
            .scenario_selection_authorized == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and
              .provider_file_bytes_read == true and
              (.receipts | type == "array" and length == 4) and
              (.receipts[0] | receipt(
                "rupture_definition";
                "ruptures/source_models/rupture_Greece_07-9-1999.xml";
                "fa3bfd7aedfb63869c5808785b0ca712b6e45859";
                666
              )) and
              (.receipts[1] | receipt(
                "ground_motion_model_logic_tree";
                "ruptures/ground-motion-models/gmpe_logic_tree_5br_shallow_default.xml";
                "7f6ac690bf0f0538dabc4ef957db5b48e9fd35d3";
                6490
              )) and
              (.receipts[2] | receipt(
                "vulnerability_total_replacement_cost";
                "ruptures/vulnerability/vulnerability_total-repl-cost_ESRM20_VariousIM.xml";
                "9e3ddc6196665db8e6256341dc735b84b8aff39c";
                908623
              )) and
              (.receipts[3] | receipt(
                "vulnerability_loss_of_life_day";
                "ruptures/vulnerability/vulnerability_loss-of-life_ESRM20_VariousIM_day.xml";
                "c5f140abe59c847869545fb9414d54452d6ad960";
                702053
              ))
            elif .status == "blocked" then
              (
                .failure_class == "athens_local_receipt_failure" or
                .failure_class == "ledger_incomplete"
              ) and
              .receipts == null and .provider_file_bytes_read == null
            else false end)
          ' >/dev/null

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 24000
          jq -n --arg body "$BODY" '{body:$body}' \
            > "$RUNNER_TEMP/athens-local-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/658/comments" \
            --input "$RUNNER_TEMP/athens-local-comment.json"
