name: CAS2025 UW-reserve dependence research run
on:
  push:
    branches:
      - research-run/uw-reserve-cas2025-20260910-sol
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3'
      - name: Execute primary fail-closed probe
        run: python research_execution/uw_reserve_cas2025_dependence_probe.py
      - name: Execute training-only rank-copula sensitivity
        run: python research_execution/uw_reserve_cas2025_rank_copula_probe.py
      - name: Upload result receipts
        uses: actions/upload-artifact@v4
        with:
          name: uw-reserve-cas2025-dependence-result
          path: |
            research_execution/result.json
            research_execution/result_rank.json
          if-no-files-found: error
