name: Berlin two official pluvial flood WFS metadata sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_starkregen_wfs_capabilities_v0.py
      - tests/test_berlin_starkregen_wfs_capabilities_v0.py
      - .github/workflows/berlin-starkregen-wfs-metadata.yml
  # One-shot bounded actual source request only after review/merge of the
  # specific workflow change or explicit manual dispatch on main.
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-starkregen-wfs-metadata.yml

permissions:
  contents: read

concurrency:
  group: berlin-pluvial-wfs-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-provider-capabilities:
    name: Metadata only - ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [hinweiskarte, gefahrenkarte]
    steps:
      - name: Checkout fixed reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate synthetic malicious XML and exact endpoint boundaries
        run: python -m unittest tests.test_berlin_starkregen_wfs_capabilities_v0 -v
      - name: One official GetCapabilities only per named source
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_starkregen_wfs_capabilities_v0 --source ${{ matrix.source }} --live
