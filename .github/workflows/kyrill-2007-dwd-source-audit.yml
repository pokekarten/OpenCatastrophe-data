name: Kyrill 2007 original DWD station-window audit

# Historical PR-specific source replay. The original head branch no longer
# exists; keep explicit, reviewed manual execution on trusted main rather
# than creating a skipped run on every unrelated pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-dwd-window:
    name: Original Kyrill DWD station observations and history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Test DWD source gates offline
        run: |
          python -m unittest tests.test_kyrill_2007_dwd_station_hourly_source_v0 -v
          python research_runners/kyrill_2007_dwd_station_hourly_source_v0.py --dry-run
      - name: Re-read original DWD station and archive sources for Kyrill 2007
        run: python research_runners/kyrill_2007_dwd_station_hourly_source_v0.py --live-original-dwd
