name: ESRM20 EBRISK Risk Config Dependency Profiles

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-ebrisk-risk-config-dependency-profiles-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-dependency-profiles:
    name: Execute exact receipt-bound profiles
    if: >-
      github.event.issue.number == 281 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-ebrisk-risk-config-dependency-profiles-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile exact receipted candidates
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_EBRISK_DEP_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-ebrisk-risk-config-dependency-profiles.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_ebrisk_risk_config_dependency_profiles_action.py \
            --comment-body-env OC_EBRISK_DEP_REQUEST \
            --expected-issue 281 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-dependency-profiles:
    name: Publish bounded dependency metadata
    needs: [execute-dependency-profiles]
    if: >-
      needs.execute-dependency-profiles.result == 'success' &&
      needs.execute-dependency-profiles.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-dependency-profiles.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-dependency-profiles.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-ebrisk-risk-config-dependency-profiles-result-v1 -->"
        run: |
          set -euo pipefail
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 96000
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            def bounded_text:
              type == "string" and
              utf8bytelength >= 1 and utf8bytelength <= 2048 and
              . == (gsub("^\\s+|\\s+$"; "")) and
              (explode | all(. >= 32 and . != 127));
            def safe_resolved_path:
              bounded_text and
              (startswith("/") | not) and
              (contains("\\") | not) and
              ([split("/")[] | select(. == "" or . == "." or . == "..")] | length) == 0;
            keys == ["action","dataset_id","dependency_inventory_authorized","execution_sha","external_bytes_persisted","failure_class","historical_group_assignment_verified","model_use_authorized","profiles","publication_authorized","raw_config_returned","runtime_compatibility_verified","schema_version","source_issue","status","target_sha"] and
            .schema_version == "oc-esrm20-ebrisk-risk-config-dependency-profiles-result-v1" and
            .action == "esrm20_ebrisk_risk_config_dependency_profiles" and
            .source_issue == 281 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .raw_config_returned == false and
            .historical_group_assignment_verified == false and
            .dependency_inventory_authorized == false and
            .runtime_compatibility_verified == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and
              (.profiles | type) == "array" and (.profiles | length) == 3 and
              all(.profiles[];
                keys == ["byte_count","candidate_key","commit_sha","dataset_id","dependencies","dependency_inventory_authorized","external_bytes_persisted","historical_group_assignment_verified","model_use_authorized","operation_id","parser","profiled_at","project_id","project_path","publication_authorized","raw_config_returned","receipt_comment_id","repository_path","runtime_compatibility_verified","schema_version","sha256","source_issue"] and
                .schema_version == "oc-esrm20-ebrisk-risk-config-dependency-profile-v1" and
                .source_issue == 281 and
                .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
                .project_id == 269 and .project_path == "efehr/esrm20" and
                .commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
                .receipt_comment_id == 5328119673 and
                .parser == "scripts.openquake_config_dependencies.extract_openquake_config_references" and
                (.profiled_at | type) == "string" and
                (.profiled_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
                (.dependencies | type) == "array" and (.dependencies | length) <= 128 and
                all(.dependencies[];
                  keys == ["option","raw_path","resolved_path","section"] and
                  (.section | bounded_text) and
                  (.option | bounded_text) and
                  (.raw_path | bounded_text) and
                  (.resolved_path | safe_resolved_path)) and
                (.dependencies == (.dependencies | sort_by([.resolved_path,.section,.option,.raw_path]))) and
                (([.dependencies[] | [.section,.option,.resolved_path]] | unique | length) == (.dependencies | length)) and
                .raw_config_returned == false and
                .historical_group_assignment_verified == false and
                .dependency_inventory_authorized == false and
                .runtime_compatibility_verified == false and
                .external_bytes_persisted == false and
                .publication_authorized == false and
                .model_use_authorized == false) and
              .profiles[0].candidate_key == "group1" and
              .profiles[0].operation_id == "esrm20-ebrisk-group1-config-candidate-v1" and
              .profiles[0].repository_path == "Configuration_files/config_ebrisk_Group1.ini" and
              .profiles[0].byte_count == 3052 and
              .profiles[0].sha256 == "be5f787954ca7e4060e4362d12efcf7cba5e50740930f3de7d7a521ebc580146" and
              .profiles[1].candidate_key == "group2" and
              .profiles[1].operation_id == "esrm20-ebrisk-group2-config-candidate-v1" and
              .profiles[1].repository_path == "Configuration_files/config_ebrisk_Group2.ini" and
              .profiles[1].byte_count == 2832 and
              .profiles[1].sha256 == "80cf566003cdb5e12dde820d5cba3db8ea5a6ba2db31e7089f3453f921852625" and
              .profiles[2].candidate_key == "iceland" and
              .profiles[2].operation_id == "esrm20-ebrisk-iceland-config-candidate-v1" and
              .profiles[2].repository_path == "Configuration_files/config_ebrisk_Iceland.ini" and
              .profiles[2].byte_count == 1345 and
              .profiles[2].sha256 == "7d1f23170462a4f1b6b514518d4d35564a0ec2255072f6df38e5a5c6518b849c"
            else
              .failure_class == "profile_failure" and .profiles == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/ebrisk-dependency-profiles-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/ebrisk-dependency-profiles-comment.json"
