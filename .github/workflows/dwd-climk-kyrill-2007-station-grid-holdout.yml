name: CLIMK Kyrill 2007 original ERA5 at real DWD station coordinates (research)

on:
  pull_request:
    paths:
      - '.github/workflows/dwd-climk-kyrill-2007-station-grid-holdout.yml'
      - 'scripts/dwd_climk_kyrill_station_grid_holdout_v0.py'
      - 'tests/test_dwd_climk_kyrill_station_grid_holdout_v0.py'
      - 'docs/research/dwd_climk_kyrill_2007_real_station_native_grid_20261106.md'
      - 'docs/research/evidence/dwd-kyrill-2007-three-station-history-source-receipt-20261106.md'
      - 'docs/research/evidence/dwd-kyrill-2007-berlin-tempelhof-original-fx10-20261106.md'
      - 'docs/research/evidence/dwd-kyrill-2007-munich-two-stations-original-fx10-20261106.md'
      - 'scripts/climk_era5_synthetic_native_sample_v0.py'
      - 'scripts/inspect_climk_winds_era5_v0.py'
      - 'requirements-glofas-acquisition.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwd-climk-station-grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-station-to-model-grid:
    name: 3 original station positions / 2 fictional markers / one source Kyrill storm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install existing original NetCDF reader
        run: |
          python -m pip install --no-input --disable-pip-version-check -r requirements-glofas-acquisition.txt
          python -m pip check
      - name: Prove strict source/measurement semantics with synthetic only tests
        run: |
          python -m unittest tests.test_dwd_climk_kyrill_station_grid_holdout_v0 -v
      - name: Re-sample ORIGINAL pinned CLIMK storm at REAL original DWD station locations
        run: |
          python -m scripts.dwd_climk_kyrill_station_grid_holdout_v0 --out "$RUNNER_TEMP/kyrill-dwd-original-3-stations-climk-grid.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'kyrill-dwd-original-3-stations-climk-grid.json'
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['contract']=='OC_CLIMK_KYRILL_2007_DWD_STATION_NATIVE_GRID_HOLDOUT_V0'
          assert data['era5_sample_original_bytes_verified_in_this_pure_function'] is True
          assert data['original_dwd_measurement_and_metadata_receipts_git_blob_authenticated'] is True
          assert data['source_era5_sha256']=='92856dea4578ac556ff5598176ff33411b56baa7c2af0170150e288bd5581102'
          assert data['real_dwd_stations']==3 and data['fictional_comparison_markers']==2
          assert [r['dwd_station_id'] for r in data['station_to_grid_results']]==['00433','01262','03379']
          assert [r['source_observation_quality_level'] for r in data['station_to_grid_results']]==['1','1','3']
          assert [r['original_sensor_height_m'] for r in data['station_to_grid_results']]==['10','10','29.28']
          assert [r['observed_DWD_2007_01_18_max_3s_10min_gust_mps'] for r in data['station_to_grid_results']]==['33.5','33.0','29.0']
          assert all(r['science_admitted_for_wind_model_calibration'] is False and
                     r['same_wind_measurement_operator_validated'] is False and
                     r['height_or_roughness_normalized'] is False for r in data['station_to_grid_results'])
          assert data['wind_model_bias_calibrated'] is False
          assert data['annual_AAL'] is None and data['annual_AEP'] is None and data['annual_OEP'] is None
          print('REAL original CLIMK native-grid sampling AT original DWD station coordinates (research-only):')
          print(json.dumps(data,sort_keys=True,indent=2,allow_nan=False))
          PY
          # Neither original NetCDF/grid nor full DWD weather rows leave the ephemeral runner.
