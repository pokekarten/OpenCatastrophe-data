# Fixed 2048-byte original DWD CDC Range experiment: publicly reviewable.
# The branch-only push trigger is temporary for one proof run and will be
# removed after the outcome has been documented.
name: DWD corrected 2021 original 2KiB Range proof
on:
  workflow_dispatch:
  push:
    branches:
      - research/dwd-radklim-2021-corrected-native-header-proof-20261113
    paths:
      - ".github/workflows/dwd-radklim-2021-corrected-original-range.yml"
      - "research_runners/dwd_radklim_2021_corrected_bounded_live_v0.py"
      - "research_runners/dwd_radklim_2021_corrected_prefix_header_v0.py"
      - "tests/test_dwd_radklim_2021_corrected_bounded_live_v0.py"
  pull_request:
    paths:
      - ".github/workflows/dwd-radklim-2021-corrected-original-range.yml"
      - "research_runners/dwd_radklim_2021_corrected_bounded_live_v0.py"
      - "research_runners/dwd_radklim_2021_corrected_prefix_header_v0.py"
      - "tests/test_dwd_radklim_2021_corrected_bounded_live_v0.py"
permissions:
  contents: read
jobs:
  one-original-range:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline synthetic original-response and strict HTTP gate checks
        run: |
          python3 -m unittest tests.test_dwd_radklim_2021_corrected_prefix_header_v0 tests.test_dwd_radklim_2021_corrected_bounded_live_v0 -v
      - name: Direct original DWD HTTPS request once, fixed 2KiB, no retry or data persistence
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/dwd-radklim-2021-corrected-native-header-proof-20261113'
        run: |
          python3 -m research_runners.dwd_radklim_2021_corrected_bounded_live_v0 --live
