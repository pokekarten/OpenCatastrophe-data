name: XWS Kyrill fictional one-event policy QS XL Monte Carlo research

on:
  pull_request:
    paths:
      - ".github/workflows/xws-kyrill-2007-fictional-policy-qs-xl-event-mc.yml"
      - "research_runners/xws_kyrill_nrw10k_fictional_policy_ri_event_mc_v0.py"
      - "tests/test_xws_kyrill_nrw10k_fictional_policy_ri_event_mc_v0.py"
      - "research/observations/xws_kyrill_2007_fictional_one_event_mc_receipt_v0.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  historic-event-stochastic-claims-fictional-financial-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Source branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Offline arithmetic and policy financial ordering regression
        run: |
          python -m unittest discover -s tests -p 'test_xws_kyrill_nrw10k_fictional_policy_ri_event_mc_v0.py' -v
          python -m compileall -q research_runners/xws_kyrill_nrw10k_fictional_policy_ri_event_mc_v0.py
      - name: Download the two immutable original-derived noninsurer research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" \
            "repos/pokekarten/OpenCatastrophe-data/actions/artifacts/13452772144/zip" \
            > "${{ runner.temp }}/original-Kyrill-real-hazard-on-fictional-NRW10k.zip"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/pokekarten/OpenCatastrophe-data/actions/artifacts/13447603258/zip" \
            > "${{ runner.temp }}/original-NRW-physical-sites-fictional-OED.zip"
          test -s "${{ runner.temp }}/original-Kyrill-real-hazard-on-fictional-NRW10k.zip"
          test -s "${{ runner.temp }}/original-NRW-physical-sites-fictional-OED.zip"
      - name: Execute conditional one-event fictional policy QS XL experiment with fixed trial seed
        run: |
          python research_runners/xws_kyrill_nrw10k_fictional_policy_ri_event_mc_v0.py \
            "${{ runner.temp }}/original-Kyrill-real-hazard-on-fictional-NRW10k.zip" \
            "${{ runner.temp }}/original-NRW-physical-sites-fictional-OED.zip" \
            "${{ runner.temp }}/fictional-Kyrill-2007-one-event-financial-mc-summary.json" \
            --seed 20261105 --trials 2048
      - name: Check exact one-event model boundary and 2x financial experiments
        run: |
          python - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"fictional-Kyrill-2007-one-event-financial-mc-summary.json"
          d=json.loads(p.read_text())
          assert d["historical_event_count"]==1
          assert d["fictional_sample_site_count"]==10000
          assert d["fictional_sample_total_tiv_eur"]==4826029500
          assert d["conditional_marginal_expected_reference"]["original_Schwierz_one_event_reference_conditional_GUL_EUR"]=="53686.91"
          assert d["fixed_rng_seed_specific_to_this_toy_not_FFBK_RIM"]==20261105
          assert d["n_trials_per_dependence_scenario"]==2048
          assert len(d["scenario_results"])==2
          assert d["gross_net_OEP_AEP_computed"] is False
          assert d["annual_event_rate_or_occurrence_distribution_verified"] is False
          assert d["native_Oasis_or_NextGen_Kyrill_financial_loss_run"] is False
          assert d["actual_RV_policy_terms_or_reinsurance_observed"] is False
          assert all(x["n_conditionally_simulated_replicates_of_one_Kyrill_event"]==2048
                     for x in d["scenario_results"].values())
          print("PASS one-event FICTIONAL GUL->IL->QS->occ XL->NET numerical trial sensitivity")
          print("HISTORICAL_SINGLE_STORM_MC_SUMMARY_SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Delete all original and derived temporary files; retain aggregate stdout receipts
        run: |
          rm -- "${{ runner.temp }}/original-Kyrill-real-hazard-on-fictional-NRW10k.zip" \
            "${{ runner.temp }}/original-NRW-physical-sites-fictional-OED.zip" \
            "${{ runner.temp }}/fictional-Kyrill-2007-one-event-financial-mc-summary.json"
