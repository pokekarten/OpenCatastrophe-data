name: FFBK Loss-ALAE censoring research run

on:
  push:
    branches:
      - research/ffbk-lossalae-censoring-run-20260906-a1

permissions:
  contents: read

jobs:
  run-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact runner branch
        uses: actions/checkout@3d3c42e5aac5ba80582523462ff38dddc9e9e5c11c56
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Verify byte identity with merged FFBK probe
        run: |
          test "$(git hash-object research-runners/ffbk/lossalae_censoring_replication.py)" = "1f97e4b172727a8f69ec8a449aff6d7a6a6a7217"
          python - <<'PY'
          import numpy, scipy, sys
          print('python', sys.version)
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          PY
      - name: Execute frozen empirical benchmark
        run: |
          python research-runners/ffbk/lossalae_censoring_replication.py --output lossalae-censoring-result.json
          sha256sum lossalae-censoring-result.json
          cat lossalae-censoring-result.json
