name: Luxembourg ACT and Overture original building city overlay

on:
  pull_request:
    paths:
      - research_runners/luxembourg_act_overture_original_city_pair_v0.py
      - tests/test_luxembourg_act_overture_original_city_pair_v0.py
      - .github/workflows/luxembourg-act-overture-original-city-overlay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-original-city-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-sources-aggregate-only:
    name: ACT2026 exact original ZIP x Overture2026 one rowgroup / aggregate only
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source code without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install reviewed geometry and source-reading dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            pyarrow==26.0.0 shapely==2.1.2 pyproj==3.7.2
          python -m pip check
      - name: Synthetic original GPKG and reciprocal pairing regressions
        run: python -m unittest tests.test_luxembourg_act_overture_original_city_pair_v0 -v
      - name: Download exact public ACT original to temporary runner storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 0 \
            --max-filesize 83886080 --output "$RUNNER_TEMP/act20261001.zip" \
            'https://download.data.public.lu/resources/bd-l-geobase/20261001-010523/buildings-20261001.zip'
      - name: Full ACT original SHA proof and ephemeral original Overture geometry overlay
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/act20261001.zip"' EXIT
          python -m research_runners.luxembourg_act_overture_original_city_pair_v0 \
            --live --source-zip "$RUNNER_TEMP/act20261001.zip"
