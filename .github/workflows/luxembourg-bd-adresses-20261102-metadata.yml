name: Luxembourg ACT BD-Adresses 2026-11-02 original metadata

on:
  pull_request:
    paths:
      - "scripts/probe_lu_bd_adresses_metadata_v0.py"
      - "tests/test_probe_lu_bd_adresses_metadata_v0.py"
      - "docs/research/lu-bd-adresses-20261102-live-metadata-receipt.md"
      - ".github/workflows/luxembourg-bd-adresses-20261102-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-bd-adresses-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-publisher-metadata-only:
    name: Three ACT source version/MD5 metadata receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run synthetic metadata drift/security regressions
        run: python -m unittest tests.test_probe_lu_bd_adresses_metadata_v0 -v
      - name: Read only exact three official ACT metadata resources
        run: python scripts/probe_lu_bd_adresses_metadata_v0.py --live
