name: Berlin detailed SRGK water-depth Atom root metadata only

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srgk_detailed_atom_root_v0.py
      - tests/test_berlin_srgk_detailed_atom_root_v0.py
      - .github/workflows/berlin-srgk-detailed-atom-root.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-detailed-atom-root.yml

permissions:
  contents: read

jobs:
  public-atom-root-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Synthetic Atom safety and no-follow tests
        run: python -m unittest tests.test_berlin_srgk_detailed_atom_root_v0 -v
      - name: One fixed official detailed Berlin Atom GET after approved merge
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_detailed_atom_root_v0 --live
