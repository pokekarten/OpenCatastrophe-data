name: Luxembourg AGE HQ100 2021 original ZIP format receipt

on:
  pull_request:
    paths:
      - 'research_runners/luxembourg_age_hq100_2021_original_preflight_v0.py'
      - 'research_runners/luxembourg_age_hq100_2021_shp_structure_v0.py'
      - 'research_runners/luxembourg_age_hq100_2021_prj_crs_screen_v0.py'
      - 'research_runners/luxembourg_age_hq100_2021_ring_coordinate_quality_v0.py'
      - 'research_runners/luxembourg_age_hq100_2021_ring_topology_v0.py'
      - 'research_runners/luxembourg_age_hq100_2021_invalid_ring_repair_challenge_v0.py'
      - 'research_runners/luxembourg_age_hq2021_sibling_source_receipts_v0.py'
      - 'tests/test_luxembourg_age_hq2021_sibling_source_receipts_v0.py'
      - 'tests/test_luxembourg_age_hq100_2021_invalid_ring_repair_challenge_v0.py'
      - 'tests/test_luxembourg_age_hq100_2021_ring_topology_v0.py'
      - 'tests/test_luxembourg_age_hq100_2021_ring_coordinate_quality_v0.py'
      - 'tests/test_luxembourg_age_hq100_2021_prj_crs_screen_v0.py'
      - 'tests/test_luxembourg_age_hq100_2021_original_preflight_v0.py'
      - '.github/workflows/luxembourg-age-hq100-2021-original.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-hq100-format-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Synthetic source ring topology GEOS regression and privacy cases
        run: |
          python -m pip install --disable-pip-version-check --no-input shapely==2.1.2
          python -m unittest tests.test_luxembourg_age_hq100_2021_ring_topology_v0 -v
      - name: Synthetic invalid source ring repair-method challenge
        run: python -m unittest tests.test_luxembourg_age_hq100_2021_invalid_ring_repair_challenge_v0 -v
      - name: Synthetic official HQ10 and HQext independent source-label checks
        run: python -m unittest tests.test_luxembourg_age_hq2021_sibling_source_receipts_v0 -v
      - name: Install pinned source coordinate metadata parser
        run: |
          python -m pip install --disable-pip-version-check --no-input pyproj==3.7.2 shapely==2.1.2
          python -m pip check
      - name: Synthetic original-PRJ WKT and geometry admission negative tests
        run: python -m unittest tests.test_luxembourg_age_hq100_2021_prj_crs_screen_v0 -v
      - name: Exercise synthetic original ZIP, DBF, SHP and unsafe-archive cases
        run: python -m unittest tests.test_luxembourg_age_hq100_2021_original_preflight_v0 -v
      - name: Regression-check source-wide SHP polygon ring/coordinate diagnostics
        run: python -m unittest tests.test_luxembourg_age_hq100_2021_ring_coordinate_quality_v0 -v
      - name: Download immutable publisher source and inspect format headers only
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/lu-age-hq100-2021-source.zip"
          umask 077
          trap 'rm -f "$original"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --retry 0 \
            --max-filesize 16777216 --output "$original" \
            'https://download.data.public.lu/resources/flood-hazard-maps-100-year-flood/20220613-154804/hwgk2021-hq100.zip'
          python -m research_runners.luxembourg_age_hq100_2021_original_preflight_v0 \
            --source-zip "$original"
          python -m research_runners.luxembourg_age_hq100_2021_prj_crs_screen_v0 \
            --source-zip "$original"
          python -m research_runners.luxembourg_age_hq100_2021_ring_coordinate_quality_v0 \
            --source-zip "$original"
          python -m research_runners.luxembourg_age_hq100_2021_ring_topology_v0 \
            --source-zip "$original"
          hq10="$RUNNER_TEMP/lu-age-hq10-2021.zip"
          hqext="$RUNNER_TEMP/lu-age-hqext-2021.zip"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --retry 0 \
            --max-filesize 16777216 --output "$hq10" \
            'https://download.data.public.lu/resources/flood-hazard-maps-10-year-flood/20220613-155024/hwgk2021-hq10.zip'
          python -m research_runners.luxembourg_age_hq2021_sibling_source_receipts_v0 \
            --scenario hq10 --source-zip "$hq10"
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --retry 0 \
            --max-filesize 16777216 --output "$hqext" \
            'https://download.data.public.lu/resources/flood-hazard-maps-extreme/20220613-154504/hwgk2021-hqext.zip'
          python -m research_runners.luxembourg_age_hq2021_sibling_source_receipts_v0 \
            --scenario hqext --source-zip "$hqext"
          rm -f "$hq10" "$hqext"
          # Original XY is read only transiently to compute anonymous aggregate QA.
          # No feature, ring coordinates or numeric depth observations are exported.
          # Original provider bytes never enter Git, logs, artifacts or Neon.
