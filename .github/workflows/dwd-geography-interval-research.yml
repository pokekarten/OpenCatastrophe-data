name: DWD original station 00003 geography interval coverage

on:
  pull_request:
    paths:
      - 'scripts/dwd_station_geography_interval_research_v0.py'
      - 'tests/test_dwd_station_geography_interval_research_v0.py'
      - '.github/workflows/dwd-geography-interval-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-fail-closed-interval-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic strict station geography and ambiguous-period checks
        run: python -m unittest tests.test_dwd_station_geography_interval_research_v0 -v

  exact-original-read-only-interval-audit:
    needs: offline-fail-closed-interval-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only frozen DWD station 00003 metadata and report overlap counts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          asset="$RUNNER_TEMP/Meta_Daten_zehn_min_fx_00003.zip"
          trap 'rm -f "$asset"' EXIT
          curl --fail --silent --show-error --noproxy '*' \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 120 --retry 0 --max-filesize 5242880 \
            --output "$asset" \
            'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/extreme_wind/meta_data/Meta_Daten_zehn_min_fx_00003.zip'
          python -m scripts.dwd_station_geography_interval_research_v0 --source-zip "$asset"
          # Original coordinates, station labels and ZIP members remain ephemeral.
