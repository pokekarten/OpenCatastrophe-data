name: Luxembourg LiDAR2024 classified COPC official three-group archive HEAD receipts

on:
  pull_request:
    paths:
      - 'research_runners/luxembourg_lidar2024_copc_group_resource_head_v0.py'
      - 'tests/test_luxembourg_lidar2024_copc_group_resource_head_v0.py'
      - '.github/workflows/luxembourg-lidar2024-copc-groups-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-copc-group-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout reviewed exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No-network synthetic metadata and HTTPS HEAD guards
        run: python -m unittest tests.test_luxembourg_lidar2024_copc_group_resource_head_v0 -v
      - name: Verify only official portal resource JSON and exact ZIP HEAD headers
        run: python -m research_runners.luxembourg_lidar2024_copc_group_resource_head_v0
      # Exactly 3 small publisher JSON GETs + 3 bounded official ZIP HEADs.
      # Zero original COPC/LAZ archives, classified points, roof values or source IDs written.
