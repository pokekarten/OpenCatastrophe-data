name: ESRM20 Scenario v1.0 Summary Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-scenario-v10-summaries-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-scenario-summaries:
    name: Execute exact trusted-main scenario summary profile
    if: >-
      github.event.issue.number == 488 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-scenario-v10-summaries-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile fixed v1.0 summaries
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_SCENARIO_SUMMARY_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-scenario-v10-summaries.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_scenario_v10_summaries_action.py \
            --comment-body-env OC_SCENARIO_SUMMARY_REQUEST \
            --expected-issue 488 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-scenario-summaries:
    name: Publish bounded scenario summary evidence
    needs: [execute-scenario-summaries]
    if: >-
      needs.execute-scenario-summaries.result == 'success' &&
      needs.execute-scenario-summaries.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-scenario-summaries.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-scenario-summaries.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-scenario-v10-summaries-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-scenario-v10-summaries-result-v1" and
            .source_issue == 488 and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .external_bytes_persisted == false and
            .scenario_payload_bytes_read == false and
            .scenario_selection_authorized == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .profile != null and
              .profile.source_issue == 488 and
              .profile.parent_science_issue == 285 and
              .profile.project_id == 273 and
              .profile.project_path == "efehr/esrm20_scenario_tests" and
              .profile.release_tag == "v1.0" and
              .profile.commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
              .profile.summary_paths == [
                "scenario_ruptures_output_summary.csv",
                "scenario_shakemaps_output_summary.csv"
              ] and
              (.profile.summaries | length) == 2 and
              .profile.summaries[0].repository_path == "scenario_ruptures_output_summary.csv" and
              .profile.summaries[1].repository_path == "scenario_shakemaps_output_summary.csv" and
              .profile.provider_file_bytes_read == true and
              .profile.external_bytes_persisted == false and
              .profile.scenario_payload_bytes_read == false and
              .profile.scenario_selection_authorized == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false
            else
              .failure_class == "summary_acquisition_or_profile_failure" and .profile == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/scenario-summary-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/488/comments" \
            --input "$RUNNER_TEMP/scenario-summary-comment.json"
