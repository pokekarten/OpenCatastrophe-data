name: Luxembourg original ACT-EUBUCCO bounded research geometry overlap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_runners/luxembourg_act_eubucco_bounded_overlap_v0.py'
      - 'tests/test_luxembourg_act_eubucco_bounded_overlap_v0.py'
      - '.github/workflows/luxembourg-act-eubucco-bounded-original-overlap.yml'

permissions:
  contents: read

jobs:
  actual-bounded-original-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned spatial and Parquet research dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt pyarrow==20.0.0
          python -m pip check
      - name: Run synthetic source boundary / match regressions
        run: python -m unittest tests.test_luxembourg_act_eubucco_bounded_overlap_v0 -v
      - name: Bounded original-provider-only research overlap
        shell: bash
        run: |
          set -euo pipefail
          export ACT_ZIP="$RUNNER_TEMP/act2023v2-pinned.zip"
          export ACT_GPKG="$RUNNER_TEMP/act2023v2-pinned.gpkg"
          export EUBUCCO="$RUNNER_TEMP/eubucco-lu00-v0.2-pinned.parquet"
          trap 'rm -f "$ACT_ZIP" "$ACT_GPKG" "$EUBUCCO"' EXIT
          umask 077
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 0 \
            --max-filesize 115343360 --output "$ACT_ZIP" \
            'https://download.data.public.lu/resources/base-de-donnees-nationale-des-batiments-3d-2023/20260317-160936/act2023v2-buildings3d-footprints.gpkg.zip'
          python scripts/luxembourg_gpkg_zip_preflight_v0.py \
            --source-zip "$ACT_ZIP" \
            --sha256 a271b1cbcc22ded018f9bab0c150e9f33efa6cb7ebca8cf4dc4bdb1f5d84859a > /dev/null
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          import shutil
          with ZipFile(os.environ["ACT_ZIP"]) as archive:
              members=[m for m in archive.infolist() if m.filename.lower().endswith(".gpkg")]
              if len(members)!=1 or members[0].file_size > 1500*1024*1024:
                  raise SystemExit("BLOCKED: source archive failed bounded extracted GPKG gate")
              with archive.open(members[0]) as original:
                  with Path(os.environ["ACT_GPKG"]).open("xb") as out:
                      shutil.copyfileobj(original,out,length=1024*1024)
          PY
          python research_runners/luxembourg_gpkg_schema_window_v0.py \
            --gpkg "$ACT_GPKG" \
            --expected-gpkg-sha256 9765b04eaeb9332aa606b8dca44031116588e285553aab061d61037938a002bf > /dev/null
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 240 --retry 0 \
            --max-filesize 268435456 --output "$EUBUCCO" \
            'https://s3.eubucco.com/eubucco/v0.2/buildings/parquet/nuts_id=LU00/LU00.parquet'
          python research_runners/eubucco_lu00_lineage_preflight_v0.py \
            --original "$EUBUCCO" \
            --expected-sha256 d1e554de9db0b1f747575426ebb950ef96bb8b2956657554b5ff2998a91abe8c > /dev/null
          python -m research_runners.luxembourg_act_eubucco_bounded_overlap_v0 \
            --act-gpkg "$ACT_GPKG" --eubucco-lu00 "$EUBUCCO" \
            --center-lon 6.1319 --center-lat 49.6116 \
            --half-width-m 125 --cap 500
          # All source geometry and IDs remain in ephemeral local runner files.
          # Outputs contain aggregate candidate overlap counts only.
          # Do not upload provider artifacts or alter insurance-risk-core.
