name: Luxembourg GeoBase 2026-04 original Addresses GPKG schema

on:
  pull_request:
    paths:
      - "research_runners/lu_geobase_addresses_20260401_original_v0.py"
      - "tests/test_lu_geobase_addresses_20260401_original_v0.py"
      - "docs/research/lu-geobase-addresses-20260401-original-source.md"
      - ".github/workflows/luxembourg-geobase-addresses-20260401-original.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-geobase-addresses-20260401-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-addresses-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Synthetic ZIP and GeoPackage structural/identity safety tests
        run: python -m unittest tests.test_lu_geobase_addresses_20260401_original_v0 -v
      - name: Only official original 12.8 MB ACT Addresses GPKG ZIP
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_file="$RUNNER_TEMP/geobase-addresses-20260401.zip"
          trap 'rm -f "$source_file"' EXIT
          curl --fail --location --silent --show-error --retry 0 \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --max-filesize 25165824 \
            -o "$source_file" \
            'https://download.data.public.lu/resources/bd-l-geobase/20260401-011010/addresses-20260401.zip'
          python -m research_runners.lu_geobase_addresses_20260401_original_v0 \
            --source-zip "$source_file"
          # No original addresses or feature IDs are emitted or uploaded.
