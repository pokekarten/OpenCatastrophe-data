name: ESRM20 Country Viewer provenance

on:
  pull_request:
    paths:
      - 'research_runners/esrm20_country_viewer_provenance.py'
      - 'tests/test_esrm20_country_viewer_provenance.py'
      - '.github/workflows/esrm20-country-viewer-provenance.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Run focused offline tests
        run: python -m unittest tests.test_esrm20_country_viewer_provenance -v
      - name: Run metadata-only provider provenance diagnostic
        run: python research_runners/esrm20_country_viewer_provenance.py
