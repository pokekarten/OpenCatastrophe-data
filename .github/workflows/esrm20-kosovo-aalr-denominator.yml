name: ESRM20 Kosovo Residential AALR denominator

on:
  pull_request:
    paths:
      - 'scripts/profile_efehr_kosovo_exposure_value_spatial.py'
      - 'research_runners/esrm20_kosovo_aalr_denominator.py'
      - 'tests/test_profile_efehr_kosovo_exposure_value_spatial.py'
      - 'tests/test_esrm20_kosovo_aalr_denominator.py'
      - '.github/workflows/esrm20-kosovo-aalr-denominator.yml'

permissions:
  contents: read

jobs:
  denominator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run focused offline tests
        run: >-
          python -m unittest
          tests.test_profile_efehr_kosovo_exposure_value_spatial
          tests.test_esrm20_kosovo_aalr_denominator
          -v
      - name: Run exact provider-bound denominator diagnostic
        run: python -m research_runners.esrm20_kosovo_aalr_denominator
