name: ESRM20 GSIM OpenQuake 3.14 Reference Runtime

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-gsim-reference-runtime-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main ESRM20 runtime request
    if: >-
      github.event.issue.number == 493 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-gsim-reference-runtime-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bind request to trusted main
        id: fence
        env:
          OC_ESRM20_RUNTIME_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_gsim_reference_runtime \
            --comment-body-env OC_ESRM20_RUNTIME_REQUEST_BODY \
            --expected-issue 493 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-runtime:
    name: Execute ESRM20 GSIM gate in reconstructed OpenQuake 3.14
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove complete issue-local dedup before external/provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_gsim_reference_runtime as subject
          skip = subject.has_terminal_runtime_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Resolve public OpenQuake v3.14.0 tag and require frozen commit
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_TAG_API: https://api.github.com/repos/gem/oq-engine/git/ref/tags/v3.14.0
          OQ_COMMIT_API: https://api.github.com/repos/gem/oq-engine/commits/9f044c93d72846421a8faa90ebf0a6afacdf3c20
          EXPECTED_COMMIT: 9f044c93d72846421a8faa90ebf0a6afacdf3c20
        run: |
          set -euo pipefail
          TAG_JSON="$(curl --fail --silent --show-error --location --max-time 30 --proto '=https' --tlsv1.2 "$OQ_TAG_API")"
          COMMIT_JSON="$(curl --fail --silent --show-error --location --max-time 30 --proto '=https' --tlsv1.2 "$OQ_COMMIT_API")"
          export TAG_JSON COMMIT_JSON EXPECTED_COMMIT
          python - <<'PY'
          import json, os, re
          expected = os.environ["EXPECTED_COMMIT"]
          tag = json.loads(os.environ["TAG_JSON"])
          commit = json.loads(os.environ["COMMIT_JSON"])
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("invalid frozen commit")
          obj = tag.get("object")
          if not isinstance(obj, dict) or obj.get("type") != "commit" or obj.get("sha") != expected:
              raise SystemExit("OpenQuake v3.14.0 tag no longer resolves to frozen commit")
          if commit.get("sha") != expected:
              raise SystemExit("OpenQuake frozen commit metadata mismatch")
          PY
      - name: Fetch frozen OpenQuake source archive
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_ARCHIVE_URL: https://api.github.com/repos/gem/oq-engine/tarball/9f044c93d72846421a8faa90ebf0a6afacdf3c20
          OQ_ARCHIVE: ${{ runner.temp }}/oq-engine-9f044c93.tar.gz
          OQ_SOURCE: ${{ runner.temp }}/oq-engine-source
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 --proto '=https' --tlsv1.2 "$OQ_ARCHIVE_URL" -o "$OQ_ARCHIVE"
          test -s "$OQ_ARCHIVE"
          mkdir -p "$OQ_SOURCE"
          tar -xzf "$OQ_ARCHIVE" -C "$OQ_SOURCE" --strip-components=1
          test -f "$OQ_SOURCE/setup.py"
          test -f "$OQ_SOURCE/requirements-py38-linux64.txt"
          test -f "$OQ_SOURCE/docker/Dockerfile.engine"
      - name: Reconstruct frozen OpenQuake Git identity
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_SOURCE: ${{ runner.temp }}/oq-engine-source
          EXPECTED_COMMIT: 9f044c93d72846421a8faa90ebf0a6afacdf3c20
        run: |
          set -euo pipefail
          cd "$OQ_SOURCE"
          git init --quiet
          git config user.name OpenCatastrophe-EQ1
          git config user.email public-ci@users.noreply.github.com
          git add -A
          TREE="$(git write-tree)"
          COMMIT="$(printf 'OpenQuake v3.14.0 reconstructed source\n' | git commit-tree "$TREE")"
          git update-ref refs/heads/receipt "$COMMIT"
          git reset --hard --quiet receipt
          git update-ref refs/heads/receipt "$EXPECTED_COMMIT" "$COMMIT"
          printf '%s\n' "$EXPECTED_COMMIT" > .git/refs/heads/receipt
          printf 'ref: refs/heads/receipt\n' > .git/HEAD
      - name: Build reconstructed OpenQuake 3.14 runtime image
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_SOURCE: ${{ runner.temp }}/oq-engine-source
        run: |
          set -euo pipefail
          cp scripts/eshm20_openquake314_runtime.Dockerfile "$OQ_SOURCE/OpenCatastrophe.Dockerfile"
          docker build \
            --file "$OQ_SOURCE/OpenCatastrophe.Dockerfile" \
            --tag opencatastrophe-oq314-esrm20:trusted \
            "$OQ_SOURCE"
      - name: Execute exact ESRM20 GSIM runtime gate
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          OC_ESRM20_RUNTIME_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-gsim-runtime-result.json
        run: |
          set -euo pipefail
          IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' opencatastrophe-oq314-esrm20:trusted 2>/dev/null || true)"
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = '<no value>' ]; then
            IMAGE_ID="$(docker image inspect --format '{{.Id}}' opencatastrophe-oq314-esrm20:trusted)"
            IMAGE_DIGEST="${IMAGE_ID#sha256:}"
            IMAGE_DIGEST="sha256:$IMAGE_DIGEST"
          fi
          docker run --rm \
            -e OC_ESRM20_RUNTIME_REQUEST_BODY="$OC_ESRM20_RUNTIME_REQUEST_BODY" \
            -e EXECUTION_SHA="$EXECUTION_SHA" \
            -e RUNTIME_IMAGE_DIGEST="$IMAGE_DIGEST" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP:/out" \
            opencatastrophe-oq314-esrm20:trusted \
            python -m scripts.run_esrm20_gsim_reference_runtime \
              --comment-body-env OC_ESRM20_RUNTIME_REQUEST_BODY \
              --expected-issue 493 \
              --execution-sha "$EXECUTION_SHA" \
              --runtime-image-digest-env RUNTIME_IMAGE_DIGEST \
              --output /out/esrm20-gsim-runtime-result.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if result.get("schema_version") != "oc-esrm20-gsim-reference-runtime-result-v1":
              raise SystemExit("runtime result schema drifted")
          if result.get("source_issue") != 493 or result.get("execution_sha") != os.environ["EXECUTION_SHA"]:
              raise SystemExit("runtime result identity drifted")
          if result.get("source_profile_result_comment_id") != 5310194089 or result.get("source_receipt_result_comment_id") != 5310057117:
              raise SystemExit("runtime provenance binding drifted")
          if result.get("gmm_identity") != {
              "project_id":269,
              "project_path":"efehr/esrm20",
              "commit_sha":"05f83bbc9df81d02ee8ddb1801d9d781355ce783",
              "repository_path":"Hazard/gmpe_logic_tree_5br_slope_geology.xml",
              "byte_count":34018,
              "sha256":"f3efd16d56189c7804824d94b20ed75d6ceefc879144d8bd697c1f9b47cf17b4",
          }:
              raise SystemExit("runtime result left exact ESRM20 GSIM identity")
          if result.get("branch_count") != 80:
              raise SystemExit("runtime branch count drifted")
          if result.get("requested_gsim_tokens") != [
              "BCHydroESHM20SInter","BCHydroESHM20SSlab","ESHM20Craton",
              "KothaEtAl2020ESHM20SlopeGeology","LanzanoLuzi2019shallow"
          ]:
              raise SystemExit("runtime requested token set drifted")
          args = result.get("gsim_argument_evidence")
          if not isinstance(args, dict) or args.get("source_argument_keys") != [
              "a","b","c3_epsilon","epsilon","faba_taper_model","sigma_mu_epsilon","site_epsilon","theta_6_adjustment"
          ]:
              raise SystemExit("source-derived GSIM argument evidence drifted")
          if args.get("external_resource_argument_keys") != [] or args.get("argument_values_returned") is not False:
              raise SystemExit("GSIM argument evidence widened external/value authority")
          runtime_keys = args.get("runtime_argument_keys_after_alias")
          if not isinstance(runtime_keys, list) or not runtime_keys:
              raise SystemExit("post-alias GSIM argument evidence is empty")
          if result.get("executing_environment_matches_reconstructed_reference_recipe_fields") is not True or result.get("gsim_request_reference_recipe_runtime_compatibility_verified") is not True:
              raise SystemExit("reviewed runtime gate did not pass")
          if result.get("site_parameter_requirements_derived") is not True:
              raise SystemExit("site parameter requirements not derived")
          site = result.get("site_parameter_requirements")
          if not isinstance(site, dict) or not isinstance(site.get("required_site_parameters"), list) or not site["required_site_parameters"]:
              raise SystemExit("site parameter evidence is invalid")
          for field in (
              "historical_environment_verified","reference_base_image_byte_identity_verified",
              "wheel_byte_identity_verified","numerical_hazard_agreement_verified",
              "full_hazard_compatibility_verified","site_model_compatibility_verified",
              "imt_component_unit_compatibility_verified","vulnerability_compatibility_verified",
              "reference_run_verified","scientific_validity_verified","external_bytes_persisted",
              "publication_authorized","model_use_authorized"
          ):
              if result.get(field) is not False:
                  raise SystemExit(f"runtime result widened {field}")
          PY
          RESULT_JSON="$(python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-runtime:
    name: Publish bounded ESRM20 runtime evidence
    needs: [validate-request, execute-runtime]
    if: >-
      needs.execute-runtime.result == 'success' &&
      needs.execute-runtime.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-runtime.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-gsim-reference-runtime-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-gsim-reference-runtime-result-v1" and
            .source_issue == 493 and .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .execution_sha == $sha and
            .openquake_reference.commit == "9f044c93d72846421a8faa90ebf0a6afacdf3c20" and
            .gmm_identity.project_id == 269 and
            .gmm_identity.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
            .gmm_identity.repository_path == "Hazard/gmpe_logic_tree_5br_slope_geology.xml" and
            .gmm_identity.byte_count == 34018 and
            .gmm_identity.sha256 == "f3efd16d56189c7804824d94b20ed75d6ceefc879144d8bd697c1f9b47cf17b4" and
            .branch_count == 80 and
            .requested_gsim_tokens == [
              "BCHydroESHM20SInter","BCHydroESHM20SSlab","ESHM20Craton",
              "KothaEtAl2020ESHM20SlopeGeology","LanzanoLuzi2019shallow"
            ] and
            .source_profile_result_comment_id == 5310194089 and
            .source_receipt_result_comment_id == 5310057117 and
            .gsim_argument_evidence.source_profile_result_comment_id == 5310194089 and
            .gsim_argument_evidence.source_argument_keys == [
              "a","b","c3_epsilon","epsilon","faba_taper_model","sigma_mu_epsilon","site_epsilon","theta_6_adjustment"
            ] and
            (.gsim_argument_evidence.runtime_argument_keys_after_alias | type) == "array" and
            (.gsim_argument_evidence.runtime_argument_keys_after_alias | length) > 0 and
            .gsim_argument_evidence.external_resource_argument_keys == [] and
            .gsim_argument_evidence.argument_values_returned == false and
            .executing_environment_matches_reconstructed_reference_recipe_fields == true and
            .gsim_request_reference_recipe_runtime_compatibility_verified == true and
            .site_parameter_requirements_derived == true and
            (.site_parameter_requirements.required_site_parameters | type) == "array" and
            (.site_parameter_requirements.per_resolved_gsim_class | type) == "array" and
            .historical_environment_verified == false and
            .reference_base_image_byte_identity_verified == false and
            .wheel_byte_identity_verified == false and
            .site_model_compatibility_verified == false and
            .imt_component_unit_compatibility_verified == false and
            .numerical_hazard_agreement_verified == false and
            .full_hazard_compatibility_verified == false and
            .vulnerability_compatibility_verified == false and
            .reference_run_verified == false and
            .scientific_validity_verified == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and .model_use_authorized == false
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/esrm20-runtime-comment.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/493/comments" --input "$RUNNER_TEMP/esrm20-runtime-comment.json"
