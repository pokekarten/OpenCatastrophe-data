name: Berlin BLD4 synthetic flood-support area proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-support:
    name: Original BLD4 schema and synthetic flood-cell support
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install reviewed spatial dependency pins
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Verify dependencies so spatial tests never silently skip
        run: |
          python -m pip check
          python -c 'from shapely.geometry import box; from pyproj import Transformer'
      - name: Test synthetic metre-depth cell area conservation and source isolation
        run: python -m unittest tests.test_berlin_bld4_synthetic_flood_cell_join_v0 -v
