name: Luxembourg CC0 footprint original GeoPackage receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/luxembourg_gpkg_zip_preflight_v0.py'
      - 'tests/test_luxembourg_gpkg_zip_preflight_v0.py'
      - 'research_runners/luxembourg_axis_extent_audit_v0.py'
      - 'tests/test_luxembourg_axis_extent_audit_v0.py'
      - '.github/workflows/luxembourg-gpkg-original-preflight.yml'

permissions:
  contents: read

jobs:
  original-cc0-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout original-receipt code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic-only source ZIP / GPKG checks
        run: python -m unittest tests.test_luxembourg_gpkg_zip_preflight_v0 -v
      - name: Bounded single official CC0 GeoPackage download and temporary read
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/act2023v2-buildings3d-footprints.gpkg.zip"
          gpkg="$RUNNER_TEMP/act2023v2-original-footprints.gpkg"
          trap 'rm -f "$file" "$gpkg"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 0 \
            --max-filesize 115343360 --output "$file" \
            'https://download.data.public.lu/resources/base-de-donnees-nationale-des-batiments-3d-2023/20260317-160936/act2023v2-buildings3d-footprints.gpkg.zip'
          # Logs contain only byte hashes, schema metadata and aggregate counts.
          # No original dataset artifact or database is ever uploaded or committed.
          python scripts/luxembourg_gpkg_zip_preflight_v0.py --source-zip "$file" \
            --sha256 a271b1cbcc22ded018f9bab0c150e9f33efa6cb7ebca8cf4dc4bdb1f5d84859a
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
          python research_runners/luxembourg_axis_extent_audit_v0.py --source-zip "$file"
          # The ZIP preflight above establishes one safe GPKG member and its
          # exact full archive receipt; extract to ephemeral disk only after it.
          python - "$file" "$gpkg" <<'PY'
          import shutil
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as source:
              gpkg_members = [
                  entry for entry in source.infolist()
                  if not entry.is_dir() and entry.filename.lower().endswith(".gpkg")
              ]
              if len(gpkg_members) != 1:
                  raise SystemExit("BLOCKED: exactly one original GPKG required")
              with source.open(gpkg_members[0]) as original:
                  with open(sys.argv[2], "xb") as target:
                      shutil.copyfileobj(original, target, 1024 * 1024)
          PY
          # The extracted GeoPackage is pinned to an independently recorded
          # earlier receipt; inspect only schema/CRS/field names/counts.
          python research_runners/luxembourg_gpkg_schema_window_v0.py \
            --gpkg "$gpkg" \
            --expected-gpkg-sha256 9765b04eaeb9332aa606b8dca44031116588e285553aab061d61037938a002bf
