name: Berlin insurance TED official original XML provenance preflight

on:
  pull_request:
    paths:
      - ".github/workflows/berlin-insurance-ted-original-xml-preflight.yml"
      - "research_runners/ted_berlin_insurance_original_xml_preflight_v0.py"
      - "research_runners/ted_berlin_insurance_daily_xml_preflight_v0.py"
      - "research_runners/ted_berlin_insurance_search_api_preflight_v0.py"
      - "research_runners/ted_wbm_eforms_winner_role_v0.py"
      - "research_runners/ted_wbm_contract_search_index_candidates_v0.py"
      - "research_runners/ted_wbm_original_award_graph_receipt_v0.py"
      - "research_runners/ted_wbm_original_contract_identifier_labels_v0.py"
      - "research_runners/ted_wbm_2026_competition_original_preflight_v0.py"
      - "research_runners/ted_wbm_2026_procedure_lineage_v0.py"
      - "research/observations/ted_wbm_2026_original_contract_share_labels_v0.toml"
      - "research/observations/ted_wbm_2026_original_eforms_award_graph_receipt_v0.toml"
      - "tests/test_ted_berlin_insurance_original_xml_preflight_v0.py"
      - "tests/test_ted_berlin_insurance_original_http202_retry_v0.py"
      - "tests/test_ted_berlin_insurance_daily_xml_preflight_v0.py"
      - "tests/test_ted_berlin_insurance_search_api_preflight_v0.py"
      - "tests/test_ted_wbm_eforms_winner_role_v0.py"
      - "tests/test_ted_wbm_contract_search_index_candidates_v0.py"
      - "tests/test_ted_wbm_original_award_graph_receipt_v0.py"
      - "tests/test_ted_wbm_original_contract_identifier_labels_v0.py"
      - "tests/test_ted_wbm_2026_competition_original_preflight_v0.py"
      - "tests/test_ted_wbm_2026_procedure_lineage_v0.py"
      - "tests/test_ted_wbm_original_contract_quota_label_register_v0.py"
      - "docs/research/berlin-insurer-ted-original-xml-preflight-20261105.md"
      - "docs/research/berlin-wbm-2026-ted-eforms-winner-role-v0.md"
      - "docs/research/berlin-wbm-2026-ted-search-index-contract-candidates.md"
      - "docs/research/berlin-wbm-2026-contract-bt150-share-labels-and-tender-minimum.md"
      - "docs/research/berlin-wbm-2026-ted-bt04-procedure-lineage.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berlin-insurance-ted-xml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ted-original-xml-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Offline synthetic malformed source/refusal regression
        run: python -m unittest discover -s tests -p "test_ted_berlin_insurance_original_xml_preflight_v0.py" -v
      - name: Offline HTTP 202 bounded retry and authenticity gates
        run: python -m unittest discover -s tests -p "test_ted_berlin_insurance_original_http202_retry_v0.py" -v
      - name: Offline exact original-publication ZIP member and source refusal tests
        run: python -m unittest discover -s tests -p "test_ted_berlin_insurance_daily_xml_preflight_v0.py" -v
      - name: Offline WBM award winner-role graph tests
        run: python -m unittest discover -s tests -p "test_ted_wbm_eforms_winner_role_v0.py" -v
      - name: Independently fetch official TED publication XML (no raw-XML retention)
        # External source availability is not under our CI control. PR remains
        # regression-checkable when TED is down; a manually dispatched run
        # MUST succeed before anyone marks primary source evidence verified.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_berlin_insurance_original_xml_preflight_v0
      - name: Offline official Search API exact-notice metadata tests
        run: python -m unittest discover -s tests -p "test_ted_berlin_insurance_search_api_preflight_v0.py" -v
      - name: Query TED primary publication metadata as separate fallback
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_berlin_insurance_search_api_preflight_v0
      - name: Offline WBM official TED index contract candidate safeguard tests
        run: python -m unittest discover -s tests -p "test_ted_wbm_contract_search_index_candidates_v0.py" -v
      - name: Query official WBM award index candidate and contract fields separately
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_wbm_contract_search_index_candidates_v0
      - name: Offline WBM original awarded-contract graph receipt tamper tests
        run: python -m unittest discover -s tests -p "test_ted_wbm_original_award_graph_receipt_v0.py" -v
      - name: Re-verify three saved official WBM contract-to-company edges
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_wbm_original_award_graph_receipt_v0
      - name: Offline original WBM BT-150 contract percent-label regression
        run: python -m unittest discover -s tests -p "test_ted_wbm_original_contract_identifier_labels_v0.py" -v
      - name: Check exact original WBM contract identifiers without policy share admission
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_wbm_original_contract_identifier_labels_v0
      - name: Offline official WBM 2026 original competition provenance checks
        run: python -m unittest discover -s tests -p "test_ted_wbm_2026_competition_original_preflight_v0.py" -v
      - name: Retrieve official WBM 2026 original competition and quote minima separately
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_wbm_2026_competition_original_preflight_v0
      - name: Offline immutable original source quota-label register and no CAT admission tests
        run: python -m unittest discover -s tests -p "test_ted_wbm_original_contract_quota_label_register_v0.py" -v
      - name: Offline WBM official BT-04 procedure linkage and BT-701 notice UUID guards
        run: python -m unittest discover -s tests -p "test_ted_wbm_2026_procedure_lineage_v0.py" -v
      - name: Cross-check exact original WBM competition and award BT-04 procedure IDs
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_wbm_2026_procedure_lineage_v0
      - name: Try official TED daily OJ S archive fallback for 202 Accepted
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_berlin_insurance_daily_xml_preflight_v0
      - name: Re-fetch exact-pinned WBM award and resolve only role-linked winners
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_wbm_eforms_winner_role_v0
