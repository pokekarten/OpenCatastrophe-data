name: Berlin insurance TED official original XML provenance preflight

on:
  pull_request:
    paths:
      - ".github/workflows/berlin-insurance-ted-original-xml-preflight.yml"
      - "research_runners/ted_berlin_insurance_original_xml_preflight_v0.py"
      - "research_runners/ted_berlin_insurance_daily_xml_preflight_v0.py"
      - "tests/test_ted_berlin_insurance_original_xml_preflight_v0.py"
      - "tests/test_ted_berlin_insurance_daily_xml_preflight_v0.py"
      - "docs/research/berlin-insurer-ted-original-xml-preflight-20261105.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berlin-insurance-ted-xml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ted-original-xml-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Offline synthetic malformed source/refusal regression
        run: python -m unittest discover -s tests -p "test_ted_berlin_insurance_original_xml_preflight_v0.py" -v
      - name: Offline exact original-publication ZIP member and source refusal tests
        run: python -m unittest discover -s tests -p "test_ted_berlin_insurance_daily_xml_preflight_v0.py" -v
      - name: Independently fetch official TED publication XML (no raw-XML retention)
        # External source availability is not under our CI control. PR remains
        # regression-checkable when TED is down; a manually dispatched run
        # MUST succeed before anyone marks primary source evidence verified.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_berlin_insurance_original_xml_preflight_v0
      - name: Try official TED daily OJ S archive fallback for 202 Accepted
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m research_runners.ted_berlin_insurance_daily_xml_preflight_v0
