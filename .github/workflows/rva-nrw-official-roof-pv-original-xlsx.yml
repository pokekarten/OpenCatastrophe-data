name: R+V NRW original rooftop PV municipality XLSX canary

on:
  pull_request:
    paths:
      - ".github/workflows/rva-nrw-official-roof-pv-original-xlsx.yml"
      - "research_runners/rva_nrw_original_rooftop_pv_xlsx_v0.py"
      - "tests/test_rva_nrw_original_rooftop_pv_xlsx_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rva-nrw-pv-original-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-publisher-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic negative tests (no network, no original records)
        run: python -m unittest discover -s tests -p "test_rva_nrw_original_rooftop_pv_xlsx_v0.py" -v
      - name: Official public municipal rooftop PV potential original (1.4 MB)
        run: python research_runners/rva_nrw_original_rooftop_pv_xlsx_v0.py
