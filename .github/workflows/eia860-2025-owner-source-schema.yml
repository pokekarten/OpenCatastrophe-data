name: EIA-860 2025 original generator Owner metadata proof

on:
  pull_request:
    paths:
      - "research_runners/eia860_2025_original_owner_schema_v0.py"
      - "tests/test_eia860_2025_original_owner_schema_v0.py"
      - "research_runners/eia860_2025_owner_shares_cohort_v0.py"
      - "tests/test_eia860_2025_owner_shares_cohort_v0.py"
      - "docs/research/eia860-2025-original-owner-schema-20261104.md"
      - ".github/workflows/eia860-2025-owner-source-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-original:
    name: Original EIA 2025 generator Owner XLSX schema-only proof
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout original branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run synthetic Owner XLSX privacy and header tests
        run: python -m unittest tests.test_eia860_2025_original_owner_schema_v0 -v
      - name: Fetch fixed official EIA 2025 original ZIP with pinned hash; print schema only
        run: python research_runners/eia860_2025_original_owner_schema_v0.py --live
      - name: Exercise synthetic generator-keyed Owner share conservation
        run: python -m unittest tests.test_eia860_2025_owner_shares_cohort_v0 -v
      - name: Audit the exact original EIA Owner generator shares for the Delaware source cohort
        run: python research_runners/eia860_2025_owner_shares_cohort_v0.py --live
