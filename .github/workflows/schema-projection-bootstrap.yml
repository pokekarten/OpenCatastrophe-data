name: Schema projection bootstrap

on:
  push:
    branches:
      - agent/196-schema-reference

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate deterministic schema projections
        run: python scripts/schema_reference.py --write
      - name: Verify renderer unit tests and exact projections
        run: |
          python -m unittest tests.test_schema_reference -v
          python scripts/schema_reference.py --check
      - name: Commit generated projections
        shell: bash
        run: |
          git add schemas/*.schema.md
          if git diff --cached --quiet; then
            echo 'Schema projections already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate schema Markdown projections'
          git push
