name: Berlin detailed SRGK Atom child and three scenario ZIP HEAD metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srgk_detailed_atom_child_zip_heads_v0.py
      - tests/test_berlin_srgk_detailed_atom_child_zip_heads_v0.py
      - .github/workflows/berlin-srgk-detailed-atom-child-head.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-detailed-atom-child-head.yml

permissions:
  contents: read

jobs:
  exact-child-and-three-heads:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test scenario identity / mixed rights / never GET ZIP
        run: python -m unittest tests.test_berlin_srgk_detailed_atom_child_zip_heads_v0 -v
      - name: Read exact original child Atom and ZIP HEAD metadata, never ZIP bodies
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_detailed_atom_child_zip_heads_v0 --live
