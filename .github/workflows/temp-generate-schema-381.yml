name: Temporary schema generation 381

on:
  push:
    branches:
      - agent/376-gsim-resource-profile-action

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Generate deterministic schema projection
        run: python scripts/schema_reference.py --write
      - name: Verify generated projection is current
        run: python scripts/schema_reference.py --check
      - name: Upload generated projection only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr381-agent-action-result-schema-md
          path: schemas/agent-action-result-v1.schema.md
          if-no-files-found: error
          retention-days: 1
