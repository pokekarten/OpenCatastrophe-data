name: ESRM20 Scenario v1.0 Greece Rupture Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-scenario-v10-greece-rupture-profile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main Greece rupture profile request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-scenario-v10-greece-rupture-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main and receipted rupture identity
        id: fence
        env:
          OC_GREECE_RUPTURE_PROFILE_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_scenario_v10_greece_rupture_profile_action.py \
            --comment-body-env OC_GREECE_RUPTURE_PROFILE_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-profile:
    name: Fetch and profile only the fixed receipted rupture
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up execution Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_scenario_v10_greece_rupture_profile_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Profile fixed Greece rupture bytes in memory
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_GREECE_RUPTURE_PROFILE_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/greece-rupture-profile-result.json
        run: |
          set -euo pipefail
          python scripts/run_esrm20_scenario_v10_greece_rupture_profile_action.py \
            --comment-body-env OC_GREECE_RUPTURE_PROFILE_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_scenario_v10_greece_rupture_profile_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("Greece rupture profile execution identity drifted")
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/greece-rupture-profile-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 11900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-profile:
    name: Publish bounded Greece rupture structural evidence
    needs: [validate-request, execute-profile]
    if: >-
      needs.execute-profile.result == 'success' &&
      needs.execute-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-scenario-v10-greece-rupture-profile-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            keys == [
              "action",
              "dataset_id",
              "event_location_inference_authorized",
              "execution_sha",
              "external_bytes_persisted",
              "failure_class",
              "failure_code",
              "holdout_status_established",
              "independent_validation_established",
              "model_use_authorized",
              "output_payload_bytes_read",
              "profile",
              "provider_file_bytes_read",
              "provider_file_content_profiled",
              "publication_authorized",
              "receipt",
              "rupture_identity",
              "scenario_selection_authorized",
              "schema_version",
              "source_issue",
              "status",
              "target_sha"
            ] and
            .schema_version == "oc-esrm20-scenario-v10-greece-rupture-profile-result-v1" and
            .action == "esrm20_scenario_v10_greece_rupture_profile" and
            .source_issue == 285 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .rupture_identity == {
              "commit_sha":"041f90d950d6ff84180b2faa11319a42c66c74cc",
              "event_id":"Greece_07-9-1999",
              "git_blob_sha1":"fa3bfd7aedfb63869c5808785b0ca712b6e45859",
              "project_id":273,
              "project_path":"efehr/esrm20_scenario_tests",
              "receipt_byte_count":666,
              "receipt_sha256":"bb2715a8ca2233dd27a77dbccf789ab023b742048805ce53df6dd2532a1b073b",
              "release_tag":"v1.0",
              "repository_path":"ruptures/source_models/rupture_Greece_07-9-1999.xml",
              "role":"rupture_definition"
            } and
            .output_payload_bytes_read == false and
            .external_bytes_persisted == false and
            .event_location_inference_authorized == false and
            .scenario_selection_authorized == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .failure_code == null and
              .provider_file_bytes_read == true and
              .provider_file_content_profiled == true and
              (.receipt | type) == "object" and
              (.receipt | keys) == [
                "byte_count","content_type","etag","git_blob_sha1","retrieved_at","sha256"
              ] and
              .receipt.byte_count == 666 and
              .receipt.sha256 == "bb2715a8ca2233dd27a77dbccf789ab023b742048805ce53df6dd2532a1b073b" and
              .receipt.git_blob_sha1 == "fa3bfd7aedfb63869c5808785b0ca712b6e45859" and
              (.receipt.retrieved_at | type) == "string" and
              (.receipt.retrieved_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) and
              (.profile | type) == "object" and
              (.profile | keys) == [
                "byte_count",
                "element_count",
                "event_location_inference_authorized",
                "holdout_status_established",
                "hypocenter_element_count",
                "independent_validation_established",
                "magnitude_element_count",
                "max_depth",
                "model_use_authorized",
                "nrml_namespace",
                "provider_file_content_profiled",
                "publication_authorized",
                "rake_element_count",
                "rupture_element_local_name",
                "scenario_selection_authorized",
                "schema_version",
                "sha256"
              ] and
              .profile.schema_version == "oc-esrm20-scenario-v10-greece-rupture-profile-v1" and
              .profile.byte_count == 666 and
              .profile.sha256 == "bb2715a8ca2233dd27a77dbccf789ab023b742048805ce53df6dd2532a1b073b" and
              .profile.nrml_namespace == "http://openquake.org/xmlns/nrml/0.5" and
              (.profile.rupture_element_local_name as $kind |
                ["simpleFaultRupture","complexFaultRupture","singlePlaneRupture","multiPlanesRupture","griddedRupture"]
                | index($kind) != null) and
              (.profile.element_count | type) == "number" and
              (.profile.element_count | floor) == .profile.element_count and
              .profile.element_count >= 2 and .profile.element_count <= 64 and
              (.profile.max_depth | type) == "number" and
              (.profile.max_depth | floor) == .profile.max_depth and
              .profile.max_depth >= 2 and .profile.max_depth <= 12 and
              (.profile.element_count as $element_count |
                all([
                  .profile.magnitude_element_count,
                  .profile.rake_element_count,
                  .profile.hypocenter_element_count
                ][]; type == "number" and floor == . and . >= 0 and . <= $element_count)) and
              .profile.provider_file_content_profiled == true and
              .profile.event_location_inference_authorized == false and
              .profile.scenario_selection_authorized == false and
              .profile.independent_validation_established == false and
              .profile.holdout_status_established == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false
            elif .status == "blocked" then
              (.failure_class == "acquisition_failure" or
               .failure_class == "byte_identity_mismatch" or
               .failure_class == "profile_failure") and
              .receipt == null and .profile == null and
              .provider_file_content_profiled == false and
              (if .failure_class == "acquisition_failure"
               then .provider_file_bytes_read == false
               else .provider_file_bytes_read == true end) and
              (if .failure_class == "profile_failure"
               then .failure_code == "rupture_profile_rejected"
               else .failure_code == null end)
            else false end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 12000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/greece-rupture-profile-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/285/comments" \
            --input "$RUNNER_TEMP/greece-rupture-profile-comment.json"
