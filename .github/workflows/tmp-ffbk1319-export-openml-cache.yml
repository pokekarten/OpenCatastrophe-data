# Temporary FFBK integration support. Public freMTPL2 data only; no private FFBK source.
name: tmp-ffbk1319-export-openml-cache

on:
  push:
    branches:
      - tmp/ffbk-1319-independent-run-20260905
    paths:
      - .tmp_ffbk1319/export_openml_cache.py
      - .github/workflows/tmp-ffbk1319-export-openml-cache.yml

permissions:
  contents: read

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact scientific stack
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.3 pandas==2.2.3 scipy==1.15.2 \
            scikit-learn==1.8.0 pyarrow==19.0.1
      - name: Materialise OpenML cache
        run: python .tmp_ffbk1319/export_openml_cache.py
      - name: Upload public cache
        uses: actions/upload-artifact@v4
        with:
          name: ffbk1319-openml-cache
          path: |
            .tmp_ffbk1319/cache_export/openml-meta.json
            .tmp_ffbk1319/cache_export/scikit_learn_data.tar.gz
          if-no-files-found: error
          compression-level: 0
