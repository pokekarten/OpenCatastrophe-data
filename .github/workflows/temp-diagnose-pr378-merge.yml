name: Temporary PR378 merge diagnosis

on:
  push:
    branches:
      - agent/363-kosovo-taxonomy-identity-action

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Simulate merge with current main
        shell: bash
        run: |
          git config user.name 'PR378 merge diagnosis'
          git config user.email 'noreply@example.invalid'
          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "MERGE_RC=$rc"
          echo '=== UNMERGED PATHS ==='
          git diff --name-only --diff-filter=U | sort
          echo '=== STATUS ==='
          git status --short
          echo '=== CONFLICT MARKERS ==='
          while IFS= read -r path; do
            test -n "$path" || continue
            echo "--- $path ---"
            grep -n -C 8 -E '^(<<<<<<<|=======|>>>>>>>)' "$path" || true
          done < <(git diff --name-only --diff-filter=U | sort)
          git merge --abort || true
          exit 0
