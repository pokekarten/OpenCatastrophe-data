name: Synthetic CEDE-to-OED Oasis ODTF smoke

on:
  pull_request:
    paths:
      - ".github/workflows/cede-oed-ods-tools-smoke.yml"
      - "scripts/cede_oed_*"
      - "tests/test_cede_oed_*"
      - "docs/research/verisk-air-cede13-oed-compatibility-20261102.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cede-oed-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-odtf:
    name: Oasis ODS Tools 5.0.10 synthetic direct-field conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned Oasis ODTF runtime (no vendor data)
        run: python -m pip install --disable-pip-version-check --no-input 'ods-tools[transform]==5.0.10'
      - name: Verify dependency consistency and Oasis version
        run: |
          python -m pip check
          python -c "import importlib.metadata as m; assert m.version('ods-tools') == '5.0.10'"
      - name: Run original synthetic CEDE-10-to-OED-3 direct-field transformation
        run: python scripts/cede_oed_ods_tools_live_smoke_v0.py
