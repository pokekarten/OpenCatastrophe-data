name: ESRM20 Site-Tool Candidate Tree Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-sitemodel-candidate-trees-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-sitemodel-candidate-trees:
    name: Execute exact trusted-main site-tool candidate-tree profile
    if: >-
      github.event.issue.number == 291 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-sitemodel-candidate-tree-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile fixed project-278 candidate trees
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_SITEMODEL_CANDIDATE_TREE_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-sitemodel-candidate-trees.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_sitemodel_candidate_tree_action.py \
            --comment-body-env OC_SITEMODEL_CANDIDATE_TREE_REQUEST \
            --expected-issue 291 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            test "$(printf '%s\n%s' '<!-- oc-eq1-esrm20-sitemodel-candidate-tree-result-v1 -->' "$RESULT_JSON" | wc -c)" -le 60000
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-sitemodel-candidate-trees:
    name: Publish bounded site-tool candidate-tree metadata
    needs: [execute-sitemodel-candidate-trees]
    if: >-
      needs.execute-sitemodel-candidate-trees.result == 'success' &&
      needs.execute-sitemodel-candidate-trees.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-sitemodel-candidate-trees.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-sitemodel-candidate-trees.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-sitemodel-candidate-tree-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-sitemodel-candidate-tree-result-v1" and
            .source_issue == 291 and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .provider_file_bytes_read == false and
            .external_bytes_persisted == false and
            .exact_kosovo_generator_commit_verified == false and
            .crs_coordinate_semantics_verified == false and
            .missingness_semantics_verified == false and
            .site_model_compatibility_verified == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .profile != null and
              .profile.schema_version == "oc-esrm20-sitemodel-candidate-tree-profile-v1" and
              .profile.source_issue == 291 and
              .profile.project_id == 278 and
              .profile.project_path == "efehr/esrm20_sitemodel" and
              .profile.history_identity_sha256 == "368858a0bce6ddb7fbc42adf1c520d23c7bf0102c533f6d9501a2b933170235d" and
              (.profile.candidate_tree_profiles | type == "array") and
              (.profile.candidate_tree_profiles | length) == 3 and
              .profile.candidate_tree_profiles[0].commit_sha == "038c91d2bf5a07f6b54ff51639aad874d6837ea9" and
              .profile.candidate_tree_profiles[1].commit_sha == "cf7a026746bd411d4b80414611b97401a3aed41e" and
              .profile.candidate_tree_profiles[2].commit_sha == "e8eddb6d9357419c74775ef5887a4b50f442778e" and
              all(.profile.candidate_tree_profiles[];
                (keys | sort) == ["blob_count","commit_sha","entry_count","pages_read","tree_identity_sha256"] and
                (.commit_sha | test("^[0-9a-f]{40}$")) and
                (.pages_read | type == "number") and .pages_read >= 1 and .pages_read <= 50 and
                (.entry_count | type == "number") and .entry_count >= 1 and .entry_count <= 5000 and
                (.blob_count | type == "number") and .blob_count >= 0 and .blob_count <= .entry_count and
                (.tree_identity_sha256 | test("^[0-9a-f]{64}$"))
              ) and
              (.profile.changed_blob_count | type == "number") and
              .profile.changed_blob_count >= 0 and .profile.changed_blob_count <= 256 and
              (.profile.changed_blob_identity_sha256 | test("^[0-9a-f]{64}$")) and
              (.profile.changed_blobs | type == "array") and
              (.profile.changed_blobs | length) == .profile.changed_blob_count and
              all(.profile.changed_blobs[];
                (keys | sort) == ["path","states"] and
                (.path | type == "string") and
                (.path | utf8bytelength) >= 1 and (.path | utf8bytelength) <= 2048 and
                (.path == (.path | gsub("^\\s+|\\s+$"; ""))) and
                (.path | startswith("/") | not) and
                (.path | contains("\\") | not) and
                (.path | explode | all(. >= 32 and . != 127)) and
                (.path | split("/") | all(. != "" and . != "." and . != "..")) and
                (.states | type == "array") and (.states | length) == 3 and
                .states[0].commit_sha == "038c91d2bf5a07f6b54ff51639aad874d6837ea9" and
                .states[1].commit_sha == "cf7a026746bd411d4b80414611b97401a3aed41e" and
                .states[2].commit_sha == "e8eddb6d9357419c74775ef5887a4b50f442778e" and
                all(.states[];
                  (keys | sort) == ["commit_sha","mode","object_sha1","present"] and
                  (.commit_sha | test("^[0-9a-f]{40}$")) and
                  (.present | type == "boolean") and
                  (if .present then
                    (.mode == "100644" or .mode == "100755" or .mode == "120000") and
                    (.object_sha1 | type == "string") and (.object_sha1 | test("^[0-9a-f]{40}$"))
                  else
                    .mode == null and .object_sha1 == null
                  end)
                )
              ) and
              .profile.provider_file_bytes_read == false and
              .profile.external_bytes_persisted == false and
              .profile.exact_kosovo_generator_commit_verified == false and
              .profile.crs_coordinate_semantics_verified == false and
              .profile.missingness_semantics_verified == false and
              .profile.site_model_compatibility_verified == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false
            else
              (.failure_class == "metadata_acquisition_failure" or .failure_class == "result_publication_limit") and
              .profile == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 60000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/sitemodel-candidate-tree-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/291/comments" \
            --input "$RUNNER_TEMP/sitemodel-candidate-tree-comment.json"
