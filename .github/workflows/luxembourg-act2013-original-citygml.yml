name: ACT2013 Luxembourg national CityGML original receipt

on:
  pull_request:
    paths:
      - 'research_runners/luxembourg_act2013_original_zip_receipt_v0.py'
      - 'tests/test_luxembourg_act2013_original_zip_receipt_v0.py'
      - '.github/workflows/luxembourg-act2013-original-citygml.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  act2013-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout reviewed exact workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run all synthetic archive security tests
        run: python -m unittest tests.test_luxembourg_act2013_original_zip_receipt_v0 -v
      - name: Read only official source, independently publisher-SHA1 pinned
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/lod1-par-pays-2013.zip"
          trap 'rm -f "$original"' EXIT
          umask 077
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 200 --retry 0 \
            --max-filesize 47185920 --output "$original" \
            'https://download.data.public.lu/resources/batiments-3d-lod-1-level-of-detail-1-1/20190528-082153/lod1-par-pays.zip'
          python -m research_runners.luxembourg_act2013_original_zip_receipt_v0 --source-zip "$original"
          # No raw CityGML data, original archive or detailed features in artifacts, Git, or Neon.
