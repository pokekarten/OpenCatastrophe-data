name: Swiss crop hail original nonzero field support mask

on:
  pull_request:
    paths:
      - "research_runners/swiss_crop_hail_nonzero_exposure_support_v0.py"
      - "tests/test_swiss_crop_hail_nonzero_exposure_support_v0.py"
      - ".github/workflows/swiss-crop-hail-n-fields-support.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiss-hail-n-fields-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-n-fields:
    name: Reconcile original 2021 n_fields with 24 crop impact grids
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned metadata and numeric readers in isolated runner
        run: |
          python -m pip install --disable-pip-version-check --no-input "numpy==2.3.5" "h5py==3.14.0"
          python -m pip check
      - name: Synthetic tests distinguish zero crop fields and absent geometry
        run: python -m unittest -v tests.test_swiss_crop_hail_nonzero_exposure_support_v0
      - name: Compute publisher-pinned original nonzero crop field support coverage
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m research_runners.swiss_crop_hail_nonzero_exposure_support_v0
