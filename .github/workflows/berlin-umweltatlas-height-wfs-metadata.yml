name: Official Berlin Umweltatlas building heights WFS metadata receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_umweltatlas_height_wfs_metadata_v0.py
      - tests/test_berlin_umweltatlas_height_wfs_metadata_v0.py
      - .github/workflows/berlin-umweltatlas-height-wfs-metadata.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-umweltatlas-height-wfs-metadata.yml

permissions:
  contents: read

concurrency:
  group: berlin-official-building-heights-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-height-metadata:
    name: Official LoD2 building heights separate WFS metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure reviewed Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Synthetic source, XML, redirect and rights-scope regressions
        run: python -m unittest tests.test_berlin_umweltatlas_height_wfs_metadata_v0 -v
      - name: One bounded first-party original Berlin Umweltatlas height source request
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_umweltatlas_height_wfs_metadata_v0 --live
