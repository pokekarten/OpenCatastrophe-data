name: Berlin Umweltatlas historical building-height WFS metadata receipt

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_umweltatlas_gebaeudehoehen_wfs_metadata_v0.py
      - tests/test_berlin_umweltatlas_gebaeudehoehen_wfs_metadata_v0.py
      - .github/workflows/berlin-umweltatlas-height-wfs-metadata.yml
  # Only a reviewed workflow revision or explicit manual action may call source.
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-umweltatlas-height-wfs-metadata.yml

permissions:
  contents: read

concurrency:
  group: berlin-umweltatlas-height-wfs-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-metadata:
    name: Official 2022 building-height WFS GetCapabilities only
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Synthetic original-service security and provenance tests
        run: python -m unittest tests.test_berlin_umweltatlas_gebaeudehoehen_wfs_metadata_v0 -v
      - name: Exactly one fixed official GetCapabilities with no building features
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_umweltatlas_gebaeudehoehen_wfs_metadata_v0 --live
