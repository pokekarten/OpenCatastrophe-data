name: GRWL 2018-2026 pinned original DBF and XY aggregate semantics

on:
  pull_request:
    paths:
      - research_runners/grwl_original_aggregate_semantic_diff_v0.py
      - tests/test_grwl_original_aggregate_semantic_diff_v0.py
      - docs/research/grwl-original-aggregate-semantics-20261104.md
      - .github/workflows/grwl-original-aggregate-semantics.yml
  workflow_dispatch:
  # First trusted-main run on reviewed workflow merge; never on PR head.
  push:
    branches: [main]
    paths:
      - .github/workflows/grwl-original-aggregate-semantics.yml

permissions:
  contents: read

concurrency:
  group: grwl-original-aggregate-semantics
  cancel-in-progress: false

jobs:
  grwl-aggregates:
    name: Pinned GRWL source feature aggregates (no raw data artifacts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Synthetic-only DBF and SHP semantic comparison tests
        run: |
          python -m unittest tests.test_grwl_original_aggregate_semantic_diff_v0 -v
          python -m unittest tests.test_grwl_trusted_original_byte_proof_v0 -v
      - name: Pin executable source identity
        run: |
          git rev-parse HEAD
          sha256sum research_runners/grwl_original_aggregate_semantic_diff_v0.py
      - name: Original ZIP SHA-pinned DBF value and SHP XY aggregate comparison
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m research_runners.grwl_original_aggregate_semantic_diff_v0 --live
