name: ESHM20 Region-Main OpenQuake 3.14 Typed Site Ingestion

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: eshm20-site-oq314-typed-${{ github.repository }}-${{ github.event.issue.number == 281 && github.event.comment.user.login == github.event.repository.owner.login && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '<!-- oc-eq1-eshm20-site-oq314-typed-ingestion-request-v1 -->') && 'trusted-request' || format('noise-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main OQ3.14 typed-site request
    if: >-
      github.event.issue.number == 281 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-eshm20-site-oq314-typed-ingestion-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_ESHM20_OQ314_TYPED_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_eshm20_site_model_oq314_typed_ingestion_action.py \
            --comment-body-env OC_ESHM20_OQ314_TYPED_REQUEST_BODY \
            --expected-issue 281 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-typed-ingestion:
    name: Execute exact OQ3.14 typed site ingestion
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove complete issue-local dedup before any external access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_eshm20_site_model_oq314_typed_ingestion_action as subject

          skip = subject.has_terminal_typed_ingestion_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Fetch exact OpenQuake v3.14.0 source
        if: steps.dedup.outputs.skip != 'true'
        env:
          OQ_COMMIT: 9f044c93d72846421a8faa90ebf0a6afacdf3c20
        run: |
          set -euo pipefail
          OQ_ROOT="$RUNNER_TEMP/oq-engine"
          git init "$OQ_ROOT"
          git -C "$OQ_ROOT" remote add origin https://github.com/gem/oq-engine.git
          git -C "$OQ_ROOT" fetch --depth=1 origin \
            refs/tags/v3.14.0:refs/tags/v3.14.0
          OBSERVED="$(git -C "$OQ_ROOT" rev-parse 'refs/tags/v3.14.0^{commit}')"
          test "$OBSERVED" = "$OQ_COMMIT"
          git -C "$OQ_ROOT" checkout --detach "$OBSERVED"
          test -z "$(git -C "$OQ_ROOT" status --porcelain=v1)"

      - name: Build observed OpenQuake 3.14 runtime image
        if: steps.dedup.outputs.skip != 'true'
        id: image
        run: |
          set -euo pipefail
          BASE_IMAGE="openquake/engine:3.14.0"
          docker pull "$BASE_IMAGE"
          BASE_REPO_DIGEST="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          printf '%s\n' "$BASE_REPO_DIGEST" |
            grep -Eq '^openquake/engine@sha256:[0-9a-f]{64}$'

          DOCKERFILE="$RUNNER_TEMP/Dockerfile.oq314-site-typed"
          cat > "$DOCKERFILE" <<EOF
          FROM $BASE_REPO_DIGEST
          USER root
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          COPY --chown=root:root oq-engine /oq-engine
          RUN git config --system --add safe.directory /oq-engine
          USER openquake
          EOF

          docker build --pull=false \
            --file "$DOCKERFILE" \
            --tag oc-oq314-eshm20-site-typed:local \
            "$RUNNER_TEMP"
          IMAGE_ID="$(docker image inspect \
            --format='{{.Id}}' oc-oq314-eshm20-site-typed:local)"
          printf '%s\n' "$IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "runtime_image_digest=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "bootstrap_repo_digest=$BASE_REPO_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Run exact receipt-bound site CSV through OQ3.14 parser
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          OC_ESHM20_OQ314_TYPED_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RUNTIME_IMAGE_DIGEST: ${{ steps.image.outputs.runtime_image_digest }}
          BOOTSTRAP_REPO_DIGEST: ${{ steps.image.outputs.bootstrap_repo_digest }}
          RESULT_PATH: ${{ runner.temp }}/eshm20-site-typed-output/result.json
        run: |
          set -euo pipefail
          OUTPUT_DIR="$RUNNER_TEMP/eshm20-site-typed-output"
          mkdir -p "$OUTPUT_DIR"
          : > "$OUTPUT_DIR/result.json"
          chmod 0666 "$OUTPUT_DIR/result.json"

          docker run --rm \
            --entrypoint /opt/openquake/bin/python \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e PYTHONPATH=/oq-engine:/workspace \
            -e OC_ESHM20_OQ314_TYPED_REQUEST_BODY \
            -e RUNTIME_IMAGE_DIGEST \
            -e BOOTSTRAP_REPO_DIGEST \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$OUTPUT_DIR:/output" \
            -w /workspace \
            "$RUNTIME_IMAGE_DIGEST" \
            scripts/run_eshm20_site_model_oq314_typed_ingestion_action.py \
              --comment-body-env OC_ESHM20_OQ314_TYPED_REQUEST_BODY \
              --expected-issue 281 \
              --execution-sha "$EXECUTION_SHA" \
              --runtime-image-digest-env RUNTIME_IMAGE_DIGEST \
              --bootstrap-repo-digest-env BOOTSTRAP_REPO_DIGEST \
              --output /output/result.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_eshm20_site_model_oq314_typed_ingestion_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject._validate_terminal_result(
              result, execution_sha=os.environ["EXECUTION_SHA"]
          )
          PY

          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-typed-ingestion:
    name: Publish bounded OQ3.14 typed-site evidence
    needs: [validate-request, execute-typed-ingestion]
    if: >-
      needs.execute-typed-ingestion.result == 'success' &&
      needs.execute-typed-ingestion.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-typed-ingestion.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-eshm20-site-oq314-typed-ingestion-result-v1 -->"
          PUBLICATION_NOTICE_MARKER: "<!-- oc-eq1-eshm20-site-oq314-typed-ingestion-publication-notice-v1 -->"
          ESHM20_ATTRIBUTION: "European Seismic Hazard Model 2020 (ESHM20), EFEHR"
          ESHM20_LICENSE_ID: "CC-BY-4.0"
          ESHM20_LICENSE_URL: "https://creativecommons.org/licenses/by/4.0/"
          ESHM20_CITATION: "Danciu et al. (2021), EFEHR Technical Report 001 v1.0.0"
          ESHM20_CITATION_URL: "https://doi.org/10.12686/a15"
          DERIVED_PUBLICATION_SCOPE: "bounded-derived-oq314-typed-site-evidence-only"
          DERIVED_CHANGE_NOTICE: "Bounded action evidence for attempted OpenQuake 3.14 typed ingestion of the fixed receipt-bound ESHM20 site CSV; provider bytes, rows and raw values are not reproduced."
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-eshm20-site-oq314-typed-ingestion-result-v1" and
            .action == "eshm20_site_model_oq314_typed_ingestion" and
            .source_issue == 281 and .dataset_id == "efehr.eshm20" and
            .target_sha == $sha and .execution_sha == $sha and
            .source_profile_result_comment_id == 5376038471 and
            .source_semantics_handoff_comment_id == 5376088705 and
            .source_identity.project_id == 197 and
            .source_identity.commit_sha == "fbd334de68f85d72669f73fc5a314a113db67317" and
            .source_identity.repository_path == "oq_computational/oq_configuration_eshm20_v12e_region_main/eshm20_site_model_v06d.csv" and
            .source_identity.byte_count == 3873324 and
            .source_identity.sha256 == "d4d95f3e482a0361a90d1b0796545eaf075d0e212d66d025f975973497b29529" and
            .openquake_reference.commit == "9f044c93d72846421a8faa90ebf0a6afacdf3c20" and
            (.openquake_reference.runtime_image_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.openquake_reference.bootstrap_repo_digest | test("^openquake/engine@sha256:[0-9a-f]{64}$")) and
            ((.status == "pass" and .failure_class == null and
              .exact_site_bytes_verified == true and
              .openquake_typed_ingestion_verified == true and
              .bounded_dtype_value_and_observed_support_verified == true and
              .typed_ingestion.raw_values_returned == false) or
             (.status == "blocked" and
              .failure_class == "site_byte_identity_or_acquisition_rejected" and
              .typed_ingestion == null and
              .exact_site_bytes_verified == false and
              .openquake_typed_ingestion_verified == false and
              .bounded_dtype_value_and_observed_support_verified == false) or
             (.status == "blocked" and
              .failure_class == "typed_site_ingestion_rejected" and
              .typed_ingestion == null and
              .exact_site_bytes_verified == true and
              .openquake_typed_ingestion_verified == false and
              .bounded_dtype_value_and_observed_support_verified == false)) and
            .historical_environment_verified == false and
            .reference_base_image_byte_identity_verified == false and
            .wheel_byte_identity_verified == false and
            .crs_authorized == false and
            .coordinate_semantics_authorized == false and
            .site_response_authorized == false and
            .site_semantics_authorized == false and
            .numerical_hazard_agreement_verified == false and
            .full_hazard_compatibility_verified == false and
            .site_model_compatibility_verified == false and
            .reference_run_verified == false and
            .scientific_validity_verified == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false
          ' >/dev/null

          test "$ESHM20_ATTRIBUTION" = "European Seismic Hazard Model 2020 (ESHM20), EFEHR"
          test "$ESHM20_LICENSE_ID" = "CC-BY-4.0"
          test "$ESHM20_LICENSE_URL" = "https://creativecommons.org/licenses/by/4.0/"
          test "$ESHM20_CITATION" = "Danciu et al. (2021), EFEHR Technical Report 001 v1.0.0"
          test "$ESHM20_CITATION_URL" = "https://doi.org/10.12686/a15"
          test "$DERIVED_PUBLICATION_SCOPE" = "bounded-derived-oq314-typed-site-evidence-only"

          NOTICE="$PUBLICATION_NOTICE_MARKER
          Attribution: $ESHM20_ATTRIBUTION
          License: $ESHM20_LICENSE_ID — $ESHM20_LICENSE_URL
          Citation: $ESHM20_CITATION — $ESHM20_CITATION_URL
          Bounded derived action evidence publication authorized: true
          Derived action-evidence publication scope: $DERIVED_PUBLICATION_SCOPE
          Change notice: $DERIVED_CHANGE_NOTICE
          Execution SHA: $EXECUTION_SHA
          Provider/raw publication authority: false; model-use authority: false."
          jq -n --arg body "$NOTICE" '{body:$body}' > "$RUNNER_TEMP/eshm20-site-oq314-typed-publication-notice.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/eshm20-site-oq314-typed-publication-notice.json"

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/eshm20-site-oq314-typed-result-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/eshm20-site-oq314-typed-result-comment.json"
