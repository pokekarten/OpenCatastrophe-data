name: tmp FFBK 1319 public data cache

on:
  push:
    branches:
      - tmp/ffbk-1319-exact-wrapper-sol56-20260905

permissions:
  contents: read

jobs:
  materialize-openml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.2.3 \
            pandas==2.2.3 \
            scipy==1.15.2 \
            scikit-learn==1.8.0 \
            pyarrow==19.0.1

      - name: Fetch public OpenML inputs into sklearn cache
        env:
          SCIKIT_LEARN_DATA: ${{ github.workspace }}/sklearn-data
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from sklearn.datasets import fetch_openml

          out = {}
          for data_id in (41214, 41215):
              bunch = fetch_openml(data_id=data_id, as_frame=True)
              details = bunch.details
              out[str(data_id)] = {
                  'data_id': int(details['id']),
                  'name': details.get('name'),
                  'version': int(details['version']),
                  'md5_checksum': details.get('md5_checksum'),
                  'status': details.get('status'),
                  'rows': int(len(bunch.data)),
                  'columns': list(map(str, bunch.data.columns)),
              }
          Path('openml-receipt.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(json.dumps(out, sort_keys=True))
          print('CACHE_ROOT', os.environ['SCIKIT_LEARN_DATA'])
          PY
          tar -czf openml-cache.tgz sklearn-data
          sha256sum openml-cache.tgz openml-receipt.json

      - name: Upload public OpenML cache
        uses: actions/upload-artifact@v4
        with:
          name: ffbk-1319-openml-cache
          path: |
            openml-cache.tgz
            openml-receipt.json
          if-no-files-found: error
