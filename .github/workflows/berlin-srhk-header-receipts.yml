name: Berlin SRHK original TIFF header research receipts

on:
  pull_request:
    paths:
      - docs/research/berlin-srhk-original-tiff-header-receipts-20261101.jsonl
      - docs/research/berlin-srhk-original-tiff-header-receipts-20261101.md
      - tests/test_berlin_srhk_original_tiff_header_receipts_v0.py
      - .github/workflows/berlin-srhk-header-receipts.yml
  push:
    branches: [main]
    paths:
      - docs/research/berlin-srhk-original-tiff-header-receipts-20261101.jsonl
      - docs/research/berlin-srhk-original-tiff-header-receipts-20261101.md
      - tests/test_berlin_srhk_original_tiff_header_receipts_v0.py
      - .github/workflows/berlin-srhk-header-receipts.yml

permissions:
  contents: read

jobs:
  offline-source-receipts:
    name: Validate original TIFF metadata receipts (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Authenticate stored provenance constraints only, no live sources
        run: python -m unittest tests.test_berlin_srhk_original_tiff_header_receipts_v0 -v
