name: Temporary PR 415 chunked hardening finalizer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr415-chunked-hardening-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 415 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Reassemble and apply verified hardening patch
        shell: bash
        run: |
          cat .github/tmp/pr415-hardening.part* > /tmp/pr415-hardening.patch.gz.b64
          base64 -d /tmp/pr415-hardening.patch.gz.b64 | gzip -d > /tmp/pr415-hardening.patch
          echo "71645f2fbcd48bbeacdcfee5d819d0634d7fee08dcd6edef5d02222fa1377aee  /tmp/pr415-hardening.patch" | sha256sum -c -
          git apply --check /tmp/pr415-hardening.patch
          git apply /tmp/pr415-hardening.patch
          git rm -r .github/tmp
          git rm .github/workflows/agent-415-exact-checkout-export.yml
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-validation.txt
      - name: Verify validation dependency consistency
        run: python -m pip check
      - name: Repository definition of done on final tree
        run: python scripts/check_all.py
      - name: Commit final hardened candidate
        shell: bash
        run: |
          test ! -e .github/workflows/agent-415-exact-checkout-export.yml
          test ! -e .github/tmp
          git add -A
          git diff --cached --check
          git config user.name "pokekarten"
          git config user.email "287434260+pokekarten@users.noreply.github.com"
          git commit -m "Harden exact ESHM20 child receipt action"
          git push origin HEAD:agent/414-eshm20-source-model-child-receipts
