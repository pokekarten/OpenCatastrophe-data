name: Temporary PR 415 verified finalizer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 415 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact finalizer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply locally verified exact patch
        env:
          FINAL_PATCH_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/pr415-final.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['FINAL_PATCH_GZ_B64'])))
          PY
          git apply --check /tmp/pr415-final.patch
          git apply /tmp/pr415-final.patch
          rm .github/workflows/agent-415-exact-checkout-export.yml
      - name: Verify full repository DoD
        run: python scripts/check_all.py
      - name: Commit exact verified final state
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete ESHM20 child receipt action wiring"
          git push origin "HEAD:$HEAD_REF"
