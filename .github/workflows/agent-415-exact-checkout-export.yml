name: Temporary PR 415 exact-checkout export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 415
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Pack exact checkout
        run: tar --exclude=.git -czf /tmp/opencat-pr415-exact-checkout.tgz .
      - name: Upload exact checkout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencat-pr415-exact-checkout
          path: /tmp/opencat-pr415-exact-checkout.tgz
          if-no-files-found: error
          retention-days: 1
