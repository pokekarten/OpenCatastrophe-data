name: ESRM20 Athens Job Config Binding Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-athens-job-config-profile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-profile:
    name: Execute bounded trusted-main Athens job-config profile
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-athens-job-config-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind request to trusted main
        id: fence
        env:
          OC_ATHENS_JOB_CONFIG_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.acquire_efehr_esrm20_athens_job_config_profile \
            --comment-body-env OC_ATHENS_JOB_CONFIG_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

      - name: Deduplicate trusted terminal before provider I/O
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ steps.fence.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.acquire_efehr_esrm20_athens_job_config_profile import (
              has_terminal_result,
          )

          found = has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              f"skip={'true' if found else 'false'}\n", encoding="utf-8"
          )
          PY

      - name: Acquire exact bytes and emit bounded binding evidence
        if: steps.dedup.outputs.skip != 'true'
        id: run
        env:
          OC_ATHENS_JOB_CONFIG_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ steps.fence.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/athens-job-config-profile.json
        run: |
          set -euo pipefail
          python -m scripts.acquire_efehr_esrm20_athens_job_config_profile \
            --comment-body-env OC_ATHENS_JOB_CONFIG_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-profile:
    name: Publish bounded Athens job-config binding evidence
    needs: [execute-profile]
    if: >-
      needs.execute-profile.result == 'success' &&
      needs.execute-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Re-fence result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXECUTION_SHA: ${{ needs.execute-profile.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-athens-job-config-profile-result-v1 -->"
        run: |
          set -euo pipefail
          LATEST_SHA="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha'
          )"
          test "$LATEST_SHA" = "$EXECUTION_SHA"

          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-athens-job-config-profile-result-v1" and
            .action == "esrm20_athens_job_config_vulnerability_binding_profile" and
            .source_issue == 285 and
            .parent_consumer_issue == 287 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and
            .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .job_config_identity.provider_host == "gitlab.seismo.ethz.ch" and
            .job_config_identity.project_id == 273 and
            .job_config_identity.project_path == "efehr/esrm20_scenario_tests" and
            .job_config_identity.release_tag == "v1.0" and
            .job_config_identity.commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
            .job_config_identity.event_id == "Greece_07-9-1999" and
            .job_config_identity.repository_path == "ruptures/OQ-engine_jobs/job_run_rupture_Greece_07-9-1999.ini" and
            .job_config_identity.git_blob_sha1 == "dcef31c93ff73e055e32881cbb9d5c3f4967a191" and
            .job_config_identity.byte_count == 1185 and
            .external_bytes_persisted == false and
            .vulnerability_model_content_verified == false and
            .benchmark_agreement_inspected == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (
              (
                .status == "blocked" and
                .evidence == null and
                .provider_file_content_profiled == false and
                (
                  (
                    .failure_class == "acquisition_failure" and
                    .provider_file_bytes_read == null
                  ) or
                  (
                    .failure_class == "profile_failure" and
                    .provider_file_bytes_read == true
                  )
                )
              ) or
              (
                .status == "pass" and
                .failure_class == null and
                .provider_file_bytes_read == true and
                .provider_file_content_profiled == true and
                .evidence.profile.schema_version == "oc-esrm20-athens-job-config-binding-profile-v1" and
                .evidence.profile.binding_count == 2 and
                .evidence.profile.raw_config_returned == false and
                .evidence.profile.vulnerability_binding_verified == true and
                .evidence.profile.vulnerability_model_content_verified == false and
                .evidence.profile.benchmark_agreement_inspected == false and
                .evidence.profile.independent_validation_established == false and
                .evidence.profile.holdout_status_established == false and
                .evidence.profile.publication_authorized == false and
                .evidence.profile.model_use_authorized == false
              )
            )
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/athens-job-config-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/285/comments" \
            --input "$RUNNER_TEMP/athens-job-config-comment.json"
