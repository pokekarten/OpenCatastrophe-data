name: DLR WSF native 0-255 GeoTIFF source probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_dlr_wsf_native_cog_tile_v0.py"
      - "tests/test_probe_dlr_wsf_native_cog_tile_v0.py"
      - "scripts/verify_dlr_wsf_native_rasterio_v0.py"
      - "tests/test_verify_dlr_wsf_native_rasterio_v0.py"
      - ".github/workflows/dlr-wsf-native-cog.yml"
  pull_request:
    paths:
      - "scripts/probe_dlr_wsf_native_cog_tile_v0.py"
      - "tests/test_probe_dlr_wsf_native_cog_tile_v0.py"
      - "scripts/verify_dlr_wsf_native_rasterio_v0.py"
      - "tests/test_verify_dlr_wsf_native_rasterio_v0.py"
      - ".github/workflows/dlr-wsf-native-cog.yml"
permissions:
  contents: read
jobs:
  native-cog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Synthetic bounded TIFF LZW, CRS and fail-closed source tests
        run: python3 -m unittest tests.test_probe_dlr_wsf_native_cog_tile_v0 -v
      - name: Verify one real native WSF 2019 COG tile and two 32px pixel windows
        if: github.event_name != 'pull_request'
        run: python3 scripts/probe_dlr_wsf_native_cog_tile_v0.py

  independent-gdal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up exact Python 3.12 (match repository CI)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned binary Rasterio and NumPy wheels
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "numpy==2.3.5" "rasterio==1.5.2"
      - name: Require independently pinned GDAL environment
        run: python -c 'import rasterio, numpy; print(rasterio.__version__, rasterio.__gdal_version__, numpy.__version__)'
      - name: Synthetic independent GDAL LZW and original SHA-gate tests
        run: python -m unittest tests.test_verify_dlr_wsf_native_rasterio_v0 -v
      - name: Read original compressed TIFF block through GDAL and compare Neon SHA receipts
        if: github.event_name != 'pull_request'
        run: python -m scripts.verify_dlr_wsf_native_rasterio_v0
