name: DLR WSF native 0-255 GeoTIFF source probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/probe_dlr_wsf_native_cog_tile_v0.py"
      - "tests/test_probe_dlr_wsf_native_cog_tile_v0.py"
      - "scripts/verify_dlr_wsf_native_rasterio_v0.py"
      - "tests/test_verify_dlr_wsf_native_rasterio_v0.py"
      - ".github/workflows/dlr-wsf-native-cog.yml"
permissions:
  contents: read
jobs:
  native-cog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Synthetic bounded TIFF LZW, CRS and fail-closed source tests
        run: python3 -m unittest tests.test_probe_dlr_wsf_native_cog_tile_v0 -v
      - name: Verify one real native WSF 2019 COG tile and two 32px pixel windows
        run: python3 scripts/probe_dlr_wsf_native_cog_tile_v0.py

  independent-gdal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned binary Rasterio and NumPy wheels
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "numpy==2.3.5" "rasterio==1.5.2"
      - name: Synthetic independent GDAL LZW and original SHA-gate tests
        run: python3 -m unittest tests.test_verify_dlr_wsf_native_rasterio_v0 -v
      - name: Read original compressed TIFF block through GDAL and compare Neon SHA receipts
        run: python3 -m scripts.verify_dlr_wsf_native_rasterio_v0
