name: Luxembourg ACT BD-Adresses 2026-11-02 original CSV quality

on:
  pull_request:
    paths:
      - "research_runners/luxembourg_bd_adresses_20261102_csv_original_v0.py"
      - "tests/test_luxembourg_bd_adresses_20261102_csv_original_v0.py"
      - "docs/research/lu-bd-adresses-20261102-original-csv-quality.md"
      - ".github/workflows/luxembourg-bd-adresses-20261102-original-csv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lu-bd-adresses-csv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-csv-aggregate-only:
    name: Exact 28MB original ACT address CSV digest and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Exercise fabricated original-CSV safety and geometry-boundary tests
        run: python -m unittest tests.test_luxembourg_bd_adresses_20261102_csv_original_v0 -v
      - name: Acquire only one exact ACT original CSV in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/act-addresses-20261102.csv"
          umask 077
          trap 'rm -f "$file"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 0 \
            --max-filesize 33554432 --output "$file" \
            'https://download.data.public.lu/resources/adresses-georeferencees-bd-adresses/20261102-033122/addresses.csv'
          python -m research_runners.luxembourg_bd_adresses_20261102_csv_original_v0 \
            --source-csv "$file"
          # Only digest + aggregate metadata printed; original address rows not published.
