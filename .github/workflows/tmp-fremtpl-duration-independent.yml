name: Temporary freMTPL2 duration independent replication

on:
  push:
    branches:
      - tmp/fremtpl-duration-independent-20260906-sol56

permissions:
  contents: read

jobs:
  independent-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install frozen scientific stack
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 pyarrow==19.0.1
      - name: Execute independent same-lineage tournament
        run: |
          python tmp_research/independent_fremtpl_duration_meanclass.py
          sha256sum tmp_research/independent_fremtpl_duration_meanclass.py independent_fremtpl_duration_result.json
