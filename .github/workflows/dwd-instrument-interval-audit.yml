name: DWD original station 00003 equipment and parameter validity audit

on:
  pull_request:
    paths:
      - 'scripts/dwd_original_instrument_intervals_v0.py'
      - 'tests/test_dwd_original_instrument_intervals_v0.py'
      - '.github/workflows/dwd-instrument-interval-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline equipment intervals, units and negative controls
        run: python -m unittest tests.test_dwd_original_instrument_intervals_v0 -v

  original-source-interval-analysis:
    needs: synthetic-fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact original DWD instrument metadata - aggregate coverage only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          asset="$RUNNER_TEMP/Meta_Daten_zehn_min_fx_00003.zip"
          trap 'rm -f "$asset"' EXIT
          curl --fail --silent --show-error --noproxy '*' \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 120 --retry 0 --max-filesize 5242880 --output "$asset" \
            'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/extreme_wind/meta_data/Meta_Daten_zehn_min_fx_00003.zip'
          python -m scripts.dwd_original_instrument_intervals_v0 --source-zip "$asset"
          # ZIP/raw rows/actual device names and heights are not stored in artifacts or logs.
