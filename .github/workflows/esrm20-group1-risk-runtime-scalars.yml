name: ESRM20 Group1 Risk Runtime Scalars

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-group1-risk-runtime-scalars-${{ github.repository }}-${{ github.event.issue.number == 287 && github.event.comment.user.login == github.event.repository.owner.login && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '<!-- oc-eq1-esrm20-group1-risk-runtime-scalars-request-v1 -->') && 'trusted-request' || format('noise-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  execute-projection:
    name: Execute bounded Group1 runtime scalar projection
    if: >-
      github.event.issue.number == 287 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-group1-risk-runtime-scalars-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, reacquire exact Group1 bytes, and project
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_GROUP1_RUNTIME_SCALARS_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/group1-runtime-scalars-result.json
        run: |
          set -euo pipefail
          export EXECUTION_SHA="$(git rev-parse HEAD)"

          python scripts/run_esrm20_group1_risk_runtime_scalars_action.py \
            --comment-body-env OC_GROUP1_RUNTIME_SCALARS_REQUEST \
            --expected-issue 287 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only

          SKIP="$(python - <<'PY'
          import os
          from scripts import run_esrm20_group1_risk_runtime_scalars_action as subject

          print("true" if subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          ) else "false")
          PY
          )"

          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$SKIP" = "true"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/run_esrm20_group1_risk_runtime_scalars_action.py \
            --comment-body-env OC_GROUP1_RUNTIME_SCALARS_REQUEST \
            --expected-issue 287 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_group1_risk_runtime_scalars_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject.validate_terminal_result(result, execution_sha=os.environ["EXECUTION_SHA"])
          if result.get("status") != "pass":
              raise SystemExit("Group1 runtime scalar projection did not PASS")
          PY

          RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
          test -n "$RESULT_JSON"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-projection:
    name: Publish bounded Group1 runtime scalar evidence
    needs: [execute-projection]
    if: >-
      needs.execute-projection.result == 'success' &&
      needs.execute-projection.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-projection.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-projection.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-group1-risk-runtime-scalars-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-group1-risk-runtime-scalars-result-v1" and
            .action == "esrm20_group1_risk_runtime_scalars" and
            .source_issue == 287 and
            .target_sha == $sha and
            .execution_sha == $sha and
            .status == "pass" and
            .failure_class == null and
            .raw_config_returned == false and
            .historical_group_assignment_verified == false and
            .runtime_compatibility_verified == false and
            .numerical_loss_reproduction_verified == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            .evidence.raw_config_returned == false and
            .evidence.historical_group_assignment_verified == false and
            .evidence.runtime_compatibility_verified == false and
            .evidence.numerical_loss_reproduction_verified == false and
            .evidence.external_bytes_persisted == false and
            .evidence.publication_authorized == false and
            .evidence.model_use_authorized == false and
            .evidence.runtime_scalars.defaults_inferred == false and
            .evidence.runtime_scalars.vulnerability_sampling_seed_semantics_verified == false
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/group1-runtime-scalars-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/287/comments" \
            --input "$RUNNER_TEMP/group1-runtime-scalars-comment.json"
