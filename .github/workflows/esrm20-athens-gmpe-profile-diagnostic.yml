name: ESRM20 Athens GMPE Profile Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-athens-gmpe-profile-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main Athens GMPE diagnostic request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-athens-gmpe-profile-diagnostic-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bind request to trusted main and fixed GMPE receipt
        id: fence
        env:
          OC_ATHENS_GMPE_DIAGNOSTIC_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_athens_gmpe_profile_diagnostic_action \
            --comment-body-env OC_ATHENS_GMPE_DIAGNOSTIC_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-diagnostic:
    name: Classify only the fixed Athens GMPE profiler boundary
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up execution Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_athens_gmpe_profile_diagnostic_action as subject
          skip = subject.has_terminal_result(repository=os.environ["GITHUB_REPOSITORY"], token=os.environ["GH_TOKEN"], execution_sha=os.environ["EXECUTION_SHA"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Re-acquire exact bytes and classify the closed profiler failure
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_ATHENS_GMPE_DIAGNOSTIC_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/athens-gmpe-profile-diagnostic.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_athens_gmpe_profile_diagnostic_action \
            --comment-body-env OC_ATHENS_GMPE_DIAGNOSTIC_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_athens_gmpe_profile_diagnostic_action as subject
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("Athens GMPE diagnostic execution identity drifted")
          PY
      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/athens-gmpe-profile-diagnostic.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 5900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-diagnostic:
    name: Publish bounded Athens GMPE profiler diagnostic
    needs: [validate-request, execute-diagnostic]
    if: >-
      needs.execute-diagnostic.result == 'success' &&
      needs.execute-diagnostic.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence closed result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-diagnostic.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-athens-gmpe-profile-diagnostic-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-athens-gmpe-profile-diagnostic-result-v1" and
            .action == "esrm20_athens_gmpe_logic_tree_profile_diagnostic" and
            .source_issue == 285 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .gmpe_identity.project_id == 273 and
            .gmpe_identity.commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
            .gmpe_identity.repository_path == "ruptures/ground-motion-models/gmpe_logic_tree_5br_shallow_default.xml" and
            .gmpe_identity.byte_count == 6490 and
            .gmpe_identity.sha256 == "3c6ff83efcac45cf75125e035060e84b910c45a9e531306d822b4566383d5b78" and
            (.status == "pass" or .status == "blocked") and
            .output_payload_bytes_read == false and .external_bytes_persisted == false and
            .gmpe_semantics_verified == false and .gmpe_applicability_verified == false and
            .numerical_equivalence_verified == false and .scenario_selection_authorized == false and
            .independent_validation_established == false and .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
               .failure_stage == null and .failure_code == null and .provider_file_bytes_read == true and .provider_file_content_profiled == true and .byte_identity_verified == true
             elif .failure_stage == "acquisition" then
               .failure_code == "acquisition_failed" and .provider_file_bytes_read == null and .provider_file_content_profiled == false and .byte_identity_verified == false
             elif .failure_stage == "byte_identity" then
               (.failure_code == "profiler_byte_count_mismatch" or .failure_code == "profiler_sha256_mismatch") and .provider_file_bytes_read == true and .provider_file_content_profiled == false and .byte_identity_verified == false
             elif .failure_stage == "profile" then
               (.failure_code as $code | ["attribute_value_too_large","branch_direct_child_cardinality_mismatch","branch_model_cardinality_mismatch","branch_weight_cardinality_mismatch","dtd_or_entity_forbidden","element_text_too_large","foreign_xml_namespace","invalid_utf8_xml","invalid_xml","malformed_expanded_xml_name","missing_direct_child","missing_required_element","namespaced_attribute_forbidden","non_text_xml_tag","non_utf8_xml_encoding","non_whitespace_container_text_forbidden","non_whitespace_tail_text_forbidden","nul_character_forbidden","unclassified_profile_rejection","unexpected_direct_child","unexpected_leaf_child","unexpected_logic_tree_root","unexpected_nrml_root","unsafe_xml_local_name","xml_depth_limit_exceeded","xml_element_limit_exceeded"] | index($code) != null) and .provider_file_bytes_read == true and .provider_file_content_profiled == false and .byte_identity_verified == true
             else false end)
          ' >/dev/null
          BODY="$(printf '%s\n%s' "$RESULT_MARKER" "$RESULT_JSON")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/285/comments" -f body="$BODY" >/dev/null
