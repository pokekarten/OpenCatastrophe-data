name: Berlin SRGK original model-area XSD geometry property proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srgk_model_area_feature_schema_v0.py
      - tests/test_berlin_srgk_model_area_feature_schema_v0.py
      - .github/workflows/berlin-srgk-model-area-schema.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-model-area-schema.yml

permissions:
  contents: read

jobs:
  one-original-xsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Synthetic source XSD abuse and metadata tests only
        run: python -m unittest tests.test_berlin_srgk_model_area_feature_schema_v0 -v
      - name: One fixed official WFS DescribeFeatureType metadata request
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_model_area_feature_schema_v0 --live
