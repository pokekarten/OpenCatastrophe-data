name: Luxembourg 100m ACT2023 GeoBase2026 EUBUCCO three original pairs

on:
  pull_request:
    paths:
      - 'research_runners/luxembourg_three_pair_same_window_v0.py'
      - 'tests/test_luxembourg_three_source_same_window_v0.py'
      - '.github/workflows/luxembourg-three-source-same-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-window-original-source-challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned spatial and parquet test runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            -r requirements-eu-flood-spatial.txt pyarrow==20.0.0
          python -m pip check
      - name: Test strict synthetic aggregate reconciliation
        run: python -m unittest tests.test_luxembourg_three_source_same_window_v0 -v
      - name: Download verified original files and run all three same-window comparisons
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ACT_ZIP="$RUNNER_TEMP/act2023-original.zip"
          export ACT_GPKG="$RUNNER_TEMP/act2023-original.gpkg"
          export GEO_ZIP="$RUNNER_TEMP/geobase2026-original.zip"
          export GEO_GPKG="$RUNNER_TEMP/geobase2026-original.gpkg"
          export EBU="$RUNNER_TEMP/eubucco-lu00-original.parquet"
          AE="$RUNNER_TEMP/act-eubucco-aggregate.json"
          AG="$RUNNER_TEMP/act-geobase-aggregate.json"
          GE="$RUNNER_TEMP/geobase-eubucco-aggregate.json"
          trap 'rm -f "$ACT_ZIP" "$ACT_GPKG" "$GEO_ZIP" "$GEO_GPKG" "$EBU" "$AE" "$AG" "$GE"' EXIT

          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 180 --retry 0 --max-filesize 115343360 \
            --output "$ACT_ZIP" \
            'https://download.data.public.lu/resources/base-de-donnees-nationale-des-batiments-3d-2023/20260317-160936/act2023v2-buildings3d-footprints.gpkg.zip'
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 180 --retry 0 --max-filesize 83886080 \
            --output "$GEO_ZIP" \
            'https://download.data.public.lu/resources/bd-l-geobase/20261001-010523/buildings-20261001.zip'
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 180 --retry 0 --max-filesize 115343360 \
            --output "$EBU" \
            'https://s3.eubucco.com/eubucco/v0.2/buildings/parquet/nuts_id=LU00/LU00.parquet'

          python scripts/luxembourg_gpkg_zip_preflight_v0.py \
            --source-zip "$ACT_ZIP" \
            --sha256 a271b1cbcc22ded018f9bab0c150e9f33efa6cb7ebca8cf4dc4bdb1f5d84859a > /dev/null
          python -m research_runners.luxembourg_geobase_buildings_20261001_v0 \
            --source-zip "$GEO_ZIP" > /dev/null
          python -m research_runners.eubucco_lu00_lineage_preflight_v0 \
            --original "$EBU" \
            --expected-sha256 d1e554de9db0b1f747575426ebb950ef96bb8b2956657554b5ff2998a91abe8c > /dev/null

          python - <<'PY'
          import hashlib,os,shutil
          from pathlib import Path
          from zipfile import ZipFile
          specs=[
              ("ACT_ZIP","ACT_GPKG","9765b04eaeb9332aa606b8dca44031116588e285553aab061d61037938a002bf"),
              ("GEO_ZIP","GEO_GPKG","ec70bd1175b6f67b6dceaf8ab39e0433bc871e1099ff308c3eb8323127aa5676"),
          ]
          for zip_key,gpkg_key,sha in specs:
              with ZipFile(os.environ[zip_key]) as zipped:
                  members=[x for x in zipped.infolist() if x.filename.lower().endswith(".gpkg") and not x.is_dir()]
                  if len(members)!=1 or not 0<members[0].file_size<=1500*1024*1024:
                      raise SystemExit("BLOCKED: original GeoPackage member count/size drift")
                  with zipped.open(members[0]) as inp, Path(os.environ[gpkg_key]).open("xb") as out:
                      shutil.copyfileobj(inp,out,length=1024*1024)
              with Path(os.environ[gpkg_key]).open("rb") as inp:
                  actual=hashlib.file_digest(inp,"sha256").hexdigest()
              if actual!=sha:
                  raise SystemExit("BLOCKED: original extracted GeoPackage SHA drift")
          PY

          # The ACT2023-EUBUCCO run is deliberately narrowed from the OLD
          # 250m study area to the already validated 100m x 100m comparison.
          python -m research_runners.luxembourg_act_eubucco_bounded_overlap_v0 \
            --act-gpkg "$ACT_GPKG" --eubucco-lu00 "$EBU" \
            --half-width-m 50 > "$AE"
          python -m research_runners.luxembourg_act2023_geobase2026_geometry_v0 \
            --act-gpkg "$ACT_GPKG" --geobase-gpkg "$GEO_GPKG" > "$AG"
          python -m research_runners.luxembourg_geobase2026_eubucco_bounded_pair_v0 \
            --geobase-gpkg "$GEO_GPKG" --eubucco-lu00 "$EBU" > "$GE"
          python -m research_runners.luxembourg_three_pair_same_window_v0 \
            --act-eubucco "$AE" --act-geobase "$AG" --geobase-eubucco "$GE"

          # Original provider files, intermediate GeoJSON, original IDs and all
          # pairwise source reports remain ephemeral. Only final aggregate
          # diagnostics are logged, no upload, no provider bytes in Git/Neon.
