name: Luxembourg LiDAR 2019 original 3 ZIP central directory ranged receipts

on:
  pull_request:
    paths:
      - 'research_runners/lu_act2019_three_zip_directory_range_v0.py'
      - 'tests/test_lu_act2019_three_zip_directory_range_v0.py'
      - 'docs/research/lu-act2019-three-zip-central-directory-range-20261104.md'
      - '.github/workflows/luxembourg-act2019-three-zip-central-directory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-three-zip-directories:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate fictional ZIP format and network boundary tests offline
        run: python -m unittest discover -s tests -p 'test_lu_act2019_three_zip_directory_range_v0.py' -v
      - name: Install pinned GIS reprojection dependencies
        run: python -m pip install --disable-pip-version-check 'pyproj==3.7.2' 'shapely==2.1.2'
      - name: Check original source index and exactly three remote ZIP directories without archive download
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          original="$RUNNER_TEMP/lu-act2019-index-verified.geojson"
          trap 'rm -f "$original"' EXIT
          curl --fail --location --silent --show-error --retry 0 \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 90 --max-filesize 600000 \
            -o "$original" \
            'https://download.data.public.lu/resources/lidar-2019-releve-3d-du-territoire-luxembourgeois/20200225-183349/lidar-urls.geojson'
          python -m research_runners.lu_act2019_three_zip_directory_range_v0 \
            --original-index "$original"
          # Zip central directories and original file names remain ephemeral.
          # No full source ZIP, compressed file payload, point, coordinate,
          # point-cloud classification or individual building identity is emitted.
