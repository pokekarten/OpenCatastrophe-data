name: ESRM20 Greece Site Structure Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-greece-site-profile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main Greece site-profile request
    if: >-
      github.event.issue.number == 661 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-greece-site-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_GREECE_SITE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_greece_site_profile_action \
            --comment-body-env OC_GREECE_SITE_PROFILE_REQUEST_BODY \
            --expected-issue 661 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-site-profile:
    name: Execute bounded Greece site structure profile
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_greece_site_profile_action as subject

          skip = subject.has_terminal_greece_site_profile_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Run exact frozen Greece site-profile worker
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_GREECE_SITE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/greece-site-profile-result.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_greece_site_profile_action \
            --comment-body-env OC_GREECE_SITE_PROFILE_REQUEST_BODY \
            --expected-issue 661 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_greece_site_profile_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject._validate_terminal_result(result, execution_sha=os.environ["EXECUTION_SHA"])
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/greece-site-profile-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-site-profile:
    name: Publish bounded Greece site structure evidence
    needs: [validate-request, execute-site-profile]
    if: >-
      needs.execute-site-profile.result == 'success' &&
      needs.execute-site-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence Greece result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-site-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-greece-site-profile-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-greece-site-profile-result-v1" and
            .action == "esrm20_greece_site_model_structure_profile" and
            .source_issue == 661 and
            .content_issue == 285 and
            .source_science_issue == 284 and
            .receipt_issue == 285 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and
            .execution_sha == $sha and
            .site_identity.project_id == 269 and
            .site_identity.project_path == "efehr/esrm20" and
            .site_identity.release == "v1.0" and
            .site_identity.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
            .site_identity.consumer_event == "Greece_07-9-1999" and
            .site_identity.repository_path == "Vs30/Site_model_Greece.xml" and
            .site_identity.receipt_comment_id == 5388640521 and
            .site_identity.receipt_execution_sha == "9bf3fee5d80431dfa873ee5ae03e07891e6f154a" and
            .site_identity.receipt_retrieved_at == "2026-08-23T21:47:08Z" and
            .site_identity.byte_count == 235015 and
            .site_identity.sha256 == "613938c3f9e63fb94490ba4514ef7faf4bf3141b86c33fdd5eb7f21f8c175f85" and
            (
              (
                .status == "pass" and
                .failure_class == null and
                .profile.schema_version == "oc-esrm20-greece-site-content-profile-v0" and
                .profile.source_issue == 285 and
                .profile.receipt_issue == 285 and
                .profile.consumer_event == "Greece_07-9-1999" and
                .profile.repository_path == "Vs30/Site_model_Greece.xml" and
                .profile.byte_count == 235015 and
                .profile.sha256 == "613938c3f9e63fb94490ba4514ef7faf4bf3141b86c33fdd5eb7f21f8c175f85" and
                .profile.profile.raw_xml_returned == false and
                .profile.profile.raw_attribute_values_returned == false and
                .profile.profile.crs_coordinate_semantics_verified == false and
                .profile.profile.site_parameter_units_verified == false and
                .profile.profile.missingness_semantics_verified == false and
                .profile.profile.gsim_site_parameter_sufficiency_verified == false and
                .profile.profile.site_adjusted_reference_authorized == false and
                .profile.external_bytes_persisted == false and
                .profile.publication_authorized == false and
                .profile.model_use_authorized == false
              ) or
              (
                .status == "blocked" and
                (.failure_class == "acquisition_failure" or .failure_class == "profile_failure") and
                .profile == null
              )
            ) and
            .crs_coordinate_semantics_verified == false and
            .site_parameter_units_verified == false and
            .missingness_semantics_verified == false and
            .gsim_site_parameter_sufficiency_verified == false and
            .site_adjusted_reference_authorized == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false
          ' >/dev/null

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/greece-site-profile-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/661/comments" \
            --input "$RUNNER_TEMP/greece-site-profile-comment.json"
