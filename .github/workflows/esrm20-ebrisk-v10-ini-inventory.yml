name: ESRM20 Ebrisk v1.0 INI Inventory

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-ebrisk-v10-ini-inventory-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-ini-inventory:
    name: Execute exact trusted-main ebrisk INI inventory
    if: >-
      github.event.issue.number == 281 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-ebrisk-v10-ini-inventory-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile fixed v1.0 configuration metadata
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_EBRISK_INI_INVENTORY_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-ebrisk-v10-ini-inventory.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_ebrisk_v10_ini_inventory_action.py \
            --comment-body-env OC_EBRISK_INI_INVENTORY_REQUEST \
            --expected-issue 281 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-ini-inventory:
    name: Publish bounded ebrisk INI inventory metadata
    needs: [execute-ini-inventory]
    if: >-
      needs.execute-ini-inventory.result == 'success' &&
      needs.execute-ini-inventory.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-ini-inventory.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-ini-inventory.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-ebrisk-v10-ini-inventory-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-ebrisk-v10-ini-inventory-result-v1" and
            .source_issue == 281 and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .provider_file_bytes_read == false and
            .external_bytes_persisted == false and
            .historical_group_assignment_authorized == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .profile != null and
              .profile.schema_version == "oc-esrm20-ebrisk-v10-ini-inventory-profile-v1" and
              .profile.source_issue == 281 and
              .profile.project_id == 269 and
              .profile.project_path == "efehr/esrm20" and
              .profile.release_tag == "v1.0" and
              .profile.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
              .profile.configuration_root == "Configuration_files" and
              (.profile.tree_entry_count | type == "number") and
              (.profile.tree_entry_count >= 1 and .profile.tree_entry_count <= 10000) and
              (.profile.source_tree_identity_sha256 | test("^[0-9a-f]{64}$")) and
              (.profile.ini_blob_count | type == "number") and
              (.profile.ini_blob_count >= 0 and .profile.ini_blob_count <= 512) and
              (.profile.ini_inventory_sha256 | test("^[0-9a-f]{64}$")) and
              (.profile.ini_blobs | type == "array") and
              (.profile.ini_blobs | length) == .profile.ini_blob_count and
              ([.profile.ini_blobs[].path] == ([.profile.ini_blobs[].path] | sort)) and
              ([.profile.ini_blobs[] |
                (.basename | type == "string") and
                (.basename | endswith(".ini")) and
                (.path | type == "string") and
                (.path | startswith("Configuration_files/")) and
                (.mode == "100644" or .mode == "100755") and
                (.object_sha1 | test("^[0-9a-f]{40}$"))] | all) and
              .profile.provider_file_bytes_read == false and
              .profile.external_bytes_persisted == false and
              .profile.historical_group_assignment_authorized == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false
            else
              .failure_class == "inventory_profile_failure" and .profile == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/ebrisk-ini-inventory-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/ebrisk-ini-inventory-comment.json"
