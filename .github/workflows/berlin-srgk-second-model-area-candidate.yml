name: Berlin second detailed model-area anchored pilot candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srgk_second_model_area_candidate_v0.py
      - tests/test_berlin_srgk_second_model_area_candidate_v0.py
      - .github/workflows/berlin-srgk-second-model-area-candidate.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-second-model-area-candidate.yml

permissions:
  contents: read

jobs:
  source-derived-independent-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install reviewed polygon runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
          python -m pip check
      - name: Synthetic only spatial/privacy/admission tests
        run: python -m unittest tests.test_berlin_srgk_second_model_area_candidate_v0 -v
      - name: One exact official model-area source GET after merge to main
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_second_model_area_candidate_v0 --live
