name: GHSL independent GDAL/libtiff original E2020 replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ghsl_original_gdal_independent_replay_v0.py"
      - "tests/test_ghsl_original_gdal_independent_replay_v0.py"
      - ".github/workflows/ghsl-original-gdal-replay.yml"
  pull_request:
    paths:
      - "scripts/ghsl_original_gdal_independent_replay_v0.py"
      - "tests/test_ghsl_original_gdal_independent_replay_v0.py"
      - ".github/workflows/ghsl-original-gdal-replay.yml"
permissions:
  contents: read
concurrency:
  group: ghsl-gdal-original-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  independent-decoder:
    name: Independent GDAL libtiff original research canary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pinned reviewed sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install deterministic independent raster dependency versions
        run: python -m pip install --no-input --disable-pip-version-check --only-binary=:all: "numpy==2.3.5" "rasterio==1.5.0"
      - name: Offline synthetic uint32, Deflate and source-identity negative tests
        run: python -m unittest tests.test_ghsl_original_gdal_independent_replay_v0 -v
      - name: Independently decode original JRC BUILT-S block and match previous source SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m scripts.ghsl_original_gdal_independent_replay_v0 --product surface --live
      - name: Independently decode original JRC BUILT-V block and match previous source SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m scripts.ghsl_original_gdal_independent_replay_v0 --product volume --live
