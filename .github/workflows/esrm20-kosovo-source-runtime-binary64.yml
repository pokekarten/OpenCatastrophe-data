name: ESRM20 Kosovo Source Runtime Binary64 Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-kosovo-source-runtime-binary64-${{ github.event.issue.number == 282 && github.event.comment.user.login == github.event.repository.owner.login && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '<!-- oc-eq1-esrm20-kosovo-source-runtime-binary64-request-v1 -->') && 'authorized-v1' || github.event.comment.id }}
  cancel-in-progress: false
  queue: max

jobs:
  validate-request:
    name: Validate trusted-main Kosovo binary64 request
    if: >-
      github.event.issue.number == 282 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-kosovo-source-runtime-binary64-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout event-associated trusted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Bind request to trusted main and canonical receipt pair
        id: fence
        env:
          OC_KOSOVO_SOURCE_RUNTIME_BINARY64_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_kosovo_source_runtime_binary64_action \
            --comment-body-env OC_KOSOVO_SOURCE_RUNTIME_BINARY64_REQUEST_BODY \
            --expected-issue 282 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-profile:
    name: Execute fixed source/runtime binary64 diagnostic
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_kosovo_source_runtime_binary64_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY
      - name: Test binary64 hypothesis against only the fixed receipt pair
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_KOSOVO_SOURCE_RUNTIME_BINARY64_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/kosovo-source-runtime-binary64-result.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_kosovo_source_runtime_binary64_action \
            --comment-body-env OC_KOSOVO_SOURCE_RUNTIME_BINARY64_REQUEST_BODY \
            --expected-issue 282 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_kosovo_source_runtime_binary64_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("Kosovo binary64 execution identity drifted")
          PY
      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/kosovo-source-runtime-binary64-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-profile:
    name: Publish bounded Kosovo binary64 evidence
    needs: [validate-request, execute-profile]
    if: >-
      needs.execute-profile.result == 'success' &&
      needs.execute-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence aggregate result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-kosovo-source-runtime-binary64-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            (. | keys) == ([
              "action","canonical_receipt_pair_verified","execution_sha",
              "external_bytes_persisted","failure_class","model_use_authorized",
              "profile","profile_executed","provider_generator_identity_verified",
              "publication_authorized","raw_rows_returned",
              "runtime_receipt_identity","runtime_values_substitutable_with_source_values",
              "schema_version","source_issue","source_receipt_identity",
              "source_runtime_semantic_equivalence_verified",
              "source_to_runtime_transform_lineage_verified","status","target_sha"
            ] | sort) and
            .schema_version == "oc-esrm20-kosovo-source-runtime-binary64-result-v1" and
            .action == "esrm20_kosovo_source_runtime_binary64_profile" and
            .source_issue == 282 and
            .target_sha == $sha and .execution_sha == $sha and
            .source_receipt_identity == {
              "commit_sha":"900433ada80fbb424c0976c34d72eeef97bab1af",
              "project_id":186,
              "project_path":"efehr/esrm20_exposure",
              "receipt_byte_count":316789,
              "receipt_comment_id":5300981864,
              "receipt_execution_sha":"46d054930025553ad19d8b05fff9018dc2a49b5f",
              "receipt_sha256":"4d562ad4925c527d518834b8dcd39a083cfd3b87b622031a84958ae7b4d8c5ea",
              "repository_path":"_exposure_models/Exposure_Model_Kosovo_Res.csv"
            } and
            .runtime_receipt_identity == {
              "commit_sha":"05f83bbc9df81d02ee8ddb1801d9d781355ce783",
              "project_id":269,
              "project_path":"efehr/esrm20",
              "receipt_byte_count":160627,
              "receipt_comment_id":5369154884,
              "receipt_execution_sha":"032464963f72a38e01f47b1e5eba6200a9e6d658",
              "receipt_sha256":"12a20d393c8d677d304263aed96eb05f81098104fd7e3fb0d119aafc336aa00f",
              "repository_path":"Exposure/OQ_Exposure_Input_Kosovo_Res.csv"
            } and
            .source_to_runtime_transform_lineage_verified == false and
            .provider_generator_identity_verified == false and
            .runtime_values_substitutable_with_source_values == false and
            .source_runtime_semantic_equivalence_verified == false and
            .external_bytes_persisted == false and
            .raw_rows_returned == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and
              .profile_executed == true and
              .canonical_receipt_pair_verified == true and
              (.profile | type) == "object" and
              (.profile | keys) == ([
                "all_fields_numerically_consistent_with_hypothesis",
                "canonical_receipt_pair_verified","comparison_key_set_sha256",
                "external_bytes_persisted","hypothesis","model_use_authorized",
                "numeric_fields","provider_generator_identity_verified",
                "publication_authorized","raw_rows_returned","record_count",
                "runtime_values_substitutable_with_source_values","schema_version",
                "source_runtime_semantic_equivalence_verified",
                "source_to_runtime_transform_lineage_verified"
              ] | sort) and
              .profile.schema_version == "oc-esrm20-kosovo-source-runtime-binary64-profile-v1" and
              .profile.record_count == 1093 and
              .profile.canonical_receipt_pair_verified == true and
              (.profile.comparison_key_set_sha256 | test("^[0-9a-f]{64}$")) and
              .profile.hypothesis == {
                "comparison":"exact-decimal-equality-to-runtime-token",
                "id":"python-binary64-shortest-roundtrip-decimal-v1",
                "provider_transform_claimed":false,
                "render":"python-repr-shortest-roundtrip-decimal",
                "source_parse":"python-float-from-decimal-text-ieee754-binary64"
              } and
              (.profile.numeric_fields | type) == "array" and
              (.profile.numeric_fields | length) == 5 and
              (.profile.numeric_fields | map([.source_field,.runtime_field])) == [
                ["BUILDINGS","number"],
                ["TOTAL_REPL_COST_EUR","structural"],
                ["OCCUPANTS_PER_ASSET_DAY","day"],
                ["OCCUPANTS_PER_ASSET_NIGHT","night"],
                ["OCCUPANTS_PER_ASSET_TRANSIT","transit"]
              ] and
              all(.profile.numeric_fields[];
                (. | keys) == ([
                  "all_runtime_values_match_binary64_projection",
                  "binary64_projection_match_count",
                  "binary64_projection_mismatch_count","projection_relation_sha256",
                  "record_count","runtime_field","source_field",
                  "source_runtime_exact_equal_count"
                ] | sort) and
                .record_count == 1093 and
                (.source_runtime_exact_equal_count | type) == "number" and
                (.source_runtime_exact_equal_count | floor) == .source_runtime_exact_equal_count and
                .source_runtime_exact_equal_count >= 0 and
                .source_runtime_exact_equal_count <= 1093 and
                (.binary64_projection_match_count | type) == "number" and
                (.binary64_projection_match_count | floor) == .binary64_projection_match_count and
                .binary64_projection_match_count >= 0 and
                (.binary64_projection_mismatch_count | type) == "number" and
                (.binary64_projection_mismatch_count | floor) == .binary64_projection_mismatch_count and
                .binary64_projection_mismatch_count >= 0 and
                (.binary64_projection_match_count + .binary64_projection_mismatch_count) == 1093 and
                (.all_runtime_values_match_binary64_projection | type) == "boolean" and
                (.all_runtime_values_match_binary64_projection == (.binary64_projection_mismatch_count == 0)) and
                (.projection_relation_sha256 | test("^[0-9a-f]{64}$"))
              ) and
              (.profile.all_fields_numerically_consistent_with_hypothesis | type) == "boolean" and
              .profile.source_to_runtime_transform_lineage_verified == false and
              .profile.provider_generator_identity_verified == false and
              .profile.runtime_values_substitutable_with_source_values == false and
              .profile.source_runtime_semantic_equivalence_verified == false and
              .profile.external_bytes_persisted == false and
              .profile.raw_rows_returned == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false
            elif .status == "blocked" then
              .failure_class == "binary64_profile_failure" and
              .profile == null and
              .profile_executed == false and
              .canonical_receipt_pair_verified == false
            else false end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          test "$(printf '%s' "$BODY" | wc -c)" -le 30000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/kosovo-source-runtime-binary64-comment.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/282/comments" \
            --input "$RUNNER_TEMP/kosovo-source-runtime-binary64-comment.json"
