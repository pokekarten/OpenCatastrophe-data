name: FFBK yield-curve tournament

on:
  pull_request:
    paths:
      - ".github/workflows/ffbk-yield-curve-tournament.yml"
      - "scripts/ffbk_yield_curve_tournament.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    name: Execute preregistered H.15 holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.3.5
      - name: Execute frozen FFBK yield-curve tournament
        run: python scripts/ffbk_yield_curve_tournament.py
