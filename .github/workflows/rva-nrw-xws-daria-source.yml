name: NRW XWS Daria 1990 original open wind source preflight

on:
  pull_request:
    paths:
      - ".github/workflows/rva-nrw-xws-daria-source.yml"
      - "research_runners/xws_daria_1990_original_csv_preflight_v0.py"
      - "research_runners/rva_nrw_xws_daria_10k_original_gust_overlay_v0.py"
      - "research_runners/rva_nrw_xws_daria_invented_damage_v0.py"
      - "research_runners/rva_nrw_xws_daria_excess_cube_index_v0.py"
      - "tests/test_rva_nrw_xws_daria_excess_cube_index_v0.py"
      - "docs/research/rva-nrw-xws-daria-asset-sampled-excess-cubed-severity-20261106.md"
      - "tests/test_rva_nrw_xws_daria_invented_damage_v0.py"
      - "docs/research/rva-nrw-xws-daria-invented-event-direct-value-20261106.md"
      - "tests/test_rva_nrw_xws_daria_10k_original_gust_overlay_v0.py"
      - "tests/test_xws_daria_1990_original_csv_preflight_v0.py"
      - "docs/research/rva-nrw-xws-daria-original-wind-source-20261105.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-xws-daria-public-wind:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Source commit read-only checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stable Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Original XWS CSV source, geographic identity and no-model negative tests
        run: python -m unittest discover -s tests -p 'test_xws_daria_1990_original_csv_preflight_v0.py' -v
      - name: Entirely invented conditional impact arithmetic and negative tests
        run: python -m unittest discover -s tests -p 'test_rva_nrw_xws_daria_invented_damage_v0.py' -v
      - name: Independent fixed-threshold wind severity index and fail-closed tests
        run: python -m unittest discover -s tests -p 'test_rva_nrw_xws_daria_excess_cube_index_v0.py' -v
      - name: Source-original FULL CSV byte hashes and licence receipt (no raw upload)
        run: |
          python research_runners/xws_daria_1990_original_csv_preflight_v0.py --live \
            --out-receipt "${{ runner.temp }}/xws-daria-1990-original-metadata-receipt.json" \
            --out-ephemeral-original-dir "${{ runner.temp }}/xws-daria-original-csv"
      - name: Offline 1990 XWS 3-second original site overlay negative checks
        run: python -m unittest discover -s tests -p 'test_rva_nrw_xws_daria_10k_original_gust_overlay_v0.py' -v
      - name: Read exact earlier full-source NRW 10k OED research artifact via GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42097472463 --repo "${{ github.repository }}" \
            --name "rva-nrw-hu2022-10k-official-physical-candidates-fictional-insurance-NOT-CAT-model" \
            --dir "${{ runner.temp }}/nrw-source-geocoded-10k"
          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile
          root=Path(os.environ["RUNNER_TEMP"])
          source=root/"nrw-source-geocoded-10k"
          expected={"location.csv","account.csv","physical_candidate_evidence.csv","manifest.json"}
          assert {p.name for p in source.iterdir()}==expected
          with zipfile.ZipFile(root/"nrw-original-10k-verified-repacked.zip","x",
                               compression=zipfile.ZIP_DEFLATED) as out:
              for name in sorted(expected):
                  out.write(source/name,arcname=name)
          PY
      - name: Historical original Daria 1990 XWS gust over 10k public NRW buildings
        run: |
          python research_runners/rva_nrw_xws_daria_10k_original_gust_overlay_v0.py \
            --original-xws-csv-dir "${{ runner.temp }}/xws-daria-original-csv" \
            --original-geocoded-nrw-oed-zip "${{ runner.temp }}/nrw-original-10k-verified-repacked.zip" \
            --out-derived-gust-zip "${{ runner.temp }}/rva-nrw-10k-original-XWS-Daria1990-gust-NOT-INSURED-LOSS.zip"
      - name: Invented direct-value wind impact for ONE physical Daria storm (not insurer CAT loss)
        run: |
          python research_runners/rva_nrw_xws_daria_invented_damage_v0.py \
            --source-hazard-zip "${{ runner.temp }}/rva-nrw-10k-original-XWS-Daria1990-gust-NOT-INSURED-LOSS.zip" \
            --out-fictional-direct-impact-zip "${{ runner.temp }}/rva-nrw-Daria1990-INVENTED-direct-impact-NOT-CAT-LOSS.zip"
      - name: Source-bound asset-sampled XWS excess-cubed wind severity (NOT damage)
        run: |
          python research_runners/rva_nrw_xws_daria_excess_cube_index_v0.py \
            --original-xws-csv-dir "${{ runner.temp }}/xws-daria-original-csv" \
            --original-geocoded-nrw-oed-zip "${{ runner.temp }}/nrw-original-10k-verified-repacked.zip" \
            --out-severity-index-zip "${{ runner.temp }}/rva-nrw-Daria1990-XWS-asset-sampled-cubic-index-NOT-LOSS.zip"
      - name: Remove original public CSV bytes before any source-derived research artifact
        run: |
          rm -rf -- "${{ runner.temp }}/xws-daria-original-csv"
          rm -rf -- "${{ runner.temp }}/nrw-source-geocoded-10k"
          rm -f -- "${{ runner.temp }}/nrw-original-10k-verified-repacked.zip"
      - name: Publish only historical original XWS hazard assigned to fictional NRW buildings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rva-nrw-10k-physical-public-XWS-Daria-1990-historical-wind-gust-NOT-CAT-LOSS
          path: ${{ runner.temp }}/rva-nrw-10k-original-XWS-Daria1990-gust-NOT-INSURED-LOSS.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Publish invented single-event direct-value sensitivity separately from original hazard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rva-nrw-Daria1990-INVENTED-conditional-direct-value-NOT-CAT-LOSS
          path: ${{ runner.temp }}/rva-nrw-Daria1990-INVENTED-direct-impact-NOT-CAT-LOSS.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Publish separate source-bound intensity severity INDEX (never money loss)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rva-nrw-Daria1990-source-asset-sampled-cubic-SEVERITY-INDEX-NOT-LOSS
          path: ${{ runner.temp }}/rva-nrw-Daria1990-XWS-asset-sampled-cubic-index-NOT-LOSS.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Publish only original file SHAs/source statistics/rights/no-CAT-admission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rva-nrw-xws-Daria-1990-original-wind-CSV-source-only-receipt
          path: ${{ runner.temp }}/xws-daria-1990-original-metadata-receipt.json
          if-no-files-found: error
          retention-days: 14
