name: DWD Kyrill 2007 Original Munich Two-Station Gust Holdout

on:
  pull_request:
    paths:
      - '.github/workflows/dwd-kyrill-2007-original-munich-holdout.yml'
      - 'scripts/dwd_kyrill_2007_munich_original_v0.py'
      - 'scripts/dwd_kyrill_2007_berlin_original_v0.py'
      - 'tests/test_dwd_kyrill_2007_munich_original_v0.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwd-kyrill-munich-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-munich-two-station-gusts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Synthetic-only source audit and negative checks
        run: python -B -m unittest tests.test_dwd_kyrill_2007_munich_original_v0 -v
      - name: Download and inspect two ORIGINAL DWD Munich 2000-2009 FX_10 ZIPs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          airport="$RUNNER_TEMP/10minutenwerte_extrema_wind_01262_20000101_20091231_hist.zip"
          city="$RUNNER_TEMP/10minutenwerte_extrema_wind_03379_20000101_20091231_hist.zip"
          receipt="$RUNNER_TEMP/dwd-munich-jan-2007-original-preflight.json"
          trap 'rm -f "$airport" "$city" "$receipt"' EXIT
          base='https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/extreme_wind/historical'
          for pair in "01262:$airport" "03379:$city"; do
            station="${pair%%:*}"
            dest="${pair#*:}"
            curl --fail --silent --show-error --noproxy '*' \
              --proto '=https' --proto-redir '=https' --connect-timeout 20 \
              --max-time 150 --retry 0 --max-filesize 4000000 \
              --output "$dest" \
              "$base/10minutenwerte_extrema_wind_${station}_20000101_20091231_hist.zip"
          done
          python -B -m scripts.dwd_kyrill_2007_munich_original_v0 \
            --airport "$airport" --city "$city" --output "$receipt"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'dwd-munich-jan-2007-original-preflight.json'
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['contract']=='OC_DWD_KYRILL_2007_TWO_MUNICH_STATION_GUST_HOLDOUT_V0'
          assert [s['dwd_station_id'] for s in r['stations']]==['01262','03379']
          assert all(len(s['four_day_window_utc'])==4 for s in r['stations'])
          assert all(s['full_product_rows']>0 and len(s['original_archive_sha256'])==64 for s in r['stations'])
          assert all(sum(d['observed_10minute_records'] for d in s['four_day_window_utc'])>0 for s in r['stations'])
          assert not r['all_original_sources_independently_prior_pinned']
          assert not r['same_measurement_height_verified']
          assert not r['same_historical_storm_attribution_proven']
          assert r['annual_AAL'] is None and r['annual_AEP'] is None and r['annual_OEP'] is None
          print('ORIGINAL DWD MUNICH STATION RESEARCH AGGREGATES ONLY (NOT CALIBRATED):')
          print(json.dumps(r,indent=2,sort_keys=True,allow_nan=False))
          PY
