name: FFBK 970 CLRD2025 public runner harness

on:
  pull_request:
    paths:
      - ".github/workflows/ffbk970-clrd2025-public-harness.yml"
      - "ffbk970_runner/**"

permissions:
  contents: read

jobs:
  exact-source-full-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify copied FFBK #970 code bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ffbk970_runner/scripts/clrd2025_ca_pa_full_panel_probe.py)" = "a141c387db3fa047f071ffe8da695ffdc608a7dd"
          test "$(git hash-object ffbk970_runner/tests/test_clrd2025_ca_pa_full_panel_probe.py)" = "f6df118790351aeb08deeeba694db41a4d256f6f"

      - name: Focused unit tests
        working-directory: ffbk970_runner
        run: python -m unittest tests.test_clrd2025_ca_pa_full_panel_probe -v

      - name: Materialize exact pinned CLRD2025 Git object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/casact/chainladder-python/git/blobs/8d0400f1ace87c3e1e1202d359ef3bb6111b3dd0" \
            --output .tmp/clrd2025-blob.json
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          expected = '8d0400f1ace87c3e1e1202d359ef3bb6111b3dd0'
          payload = json.loads(Path('.tmp/clrd2025-blob.json').read_text(encoding='utf-8'))
          assert payload['sha'] == expected, payload['sha']
          assert payload['encoding'] == 'base64', payload['encoding']
          data = base64.b64decode(payload['content'])
          raw_git_sha = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
          assert raw_git_sha == expected, raw_git_sha
          Path('.tmp/clrd2025.csv').write_bytes(data)
          print(f"API_BLOB_SIZE={payload.get('size')}")
          print(f"DECODED_BYTES={len(data)}")
          print(f"PYTHON_RAW_GIT_BLOB={raw_git_sha}")
          print(f"SOURCE_SHA256={hashlib.sha256(data).hexdigest()}")
          PY
          filtered="$(git hash-object .tmp/clrd2025.csv)"
          unfiltered="$(git hash-object --no-filters .tmp/clrd2025.csv)"
          echo "GIT_HASH_OBJECT_FILTERED=$filtered"
          echo "GIT_HASH_OBJECT_NO_FILTERS=$unfiltered"
          echo "SOURCE_BYTES=$(wc -c < .tmp/clrd2025.csv)"
          head -n 1 .tmp/clrd2025.csv
          test "$unfiltered" = "8d0400f1ace87c3e1e1202d359ef3bb6111b3dd0"

      - name: Independent no-import headline reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python ffbk970_runner/scripts/independent_clrd2025_full_panel_check.py \
            --csv .tmp/clrd2025.csv

      - name: Execute exact FFBK #970 full-panel probe
        shell: bash
        run: |
          set -euo pipefail
          python ffbk970_runner/scripts/clrd2025_ca_pa_full_panel_probe.py \
            --csv .tmp/clrd2025.csv \
            --output .tmp/clrd2025-ca-pa-full-panel-result.json
          echo "RESULT_SHA256=$(sha256sum .tmp/clrd2025-ca-pa-full-panel-result.json | awk '{print $1}')"
          echo "RESULT_JSON_BASE64_BEGIN"
          base64 -w0 .tmp/clrd2025-ca-pa-full-panel-result.json
          echo
          echo "RESULT_JSON_BASE64_END"

      - name: Upload exact result receipt
        uses: actions/upload-artifact@v4
        with:
          name: ffbk970-clrd2025-full-panel-result
          path: .tmp/clrd2025-ca-pa-full-panel-result.json
          if-no-files-found: error
