name: Berlin ALKIS and LoD2 full 200m in-box geometry overlap audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_alkis_lod2_complete_bbox_v0.py
      - tests/test_berlin_alkis_lod2_complete_bbox_v0.py
      - .github/workflows/berlin-alkis-lod2-complete-bbox.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-alkis-lod2-complete-bbox.yml

permissions:
  contents: read

concurrency:
  group: berlin-loD2-alkis-complete-200m-original-footprints-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-in-bbox:
    name: Exact 50-cap complete official Berlin polygon population IoU
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout source review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install reviewed topology dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Offline source schema, feature count and 1:1 topology tests
        run: python -m unittest tests.test_berlin_alkis_lod2_complete_bbox_v0 -v
      - name: Two official bounded WFS source populations with original Gebäudeteil role QA
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_alkis_lod2_complete_bbox_v0 --live
