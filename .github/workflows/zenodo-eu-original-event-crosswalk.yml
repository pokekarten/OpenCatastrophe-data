name: Zenodo EU compound-event original-ID crosswalk

on:
  pull_request:
    paths:
      - ".github/workflows/zenodo-eu-original-event-crosswalk.yml"
      - "scripts/zenodo_eu_original_event_crosswalk_v0.py"
      - "tests/test_zenodo_eu_original_event_crosswalk_v0.py"
      - "docs/research/zenodo-eu-original-event-crosswalk-20261103.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-catalogue-crosswalk:
    name: Crosswalk three exact original Zenodo CSVs, receipt only
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run offline synthetic safety boundary tests
        run: python -m unittest tests.test_zenodo_eu_original_event_crosswalk_v0 -v
      - name: Fetch exact 3 public original CSVs under fixed caps, report aggregate only
        run: python -m scripts.zenodo_eu_original_event_crosswalk_v0 --fetch
