name: ESRM20 Kosovo Site Static-Domain Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-kosovo-site-domain-${{ github.repository }}-${{ github.event.issue.number == 291 && github.event.comment.user.login == github.event.repository.owner.login && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '<!-- oc-eq1-esrm20-kosovo-site-domain-profile-request-v1 -->') && 'trusted-request' || format('noise-{0}', github.event.comment.id) }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main site-domain request
    if: >-
      github.event.issue.number == 291 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-kosovo-site-domain-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_SITE_DOMAIN_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python -m scripts.run_esrm20_kosovo_site_domain_profile_action \
            --comment-body-env OC_SITE_DOMAIN_REQUEST_BODY \
            --expected-issue 291 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-site-domain:
    name: Execute bounded Kosovo site static-domain profile
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_kosovo_site_domain_profile_action as subject

          skip = subject.has_terminal_site_domain_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Acquire exact bytes and run bounded domain classifier
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_SITE_DOMAIN_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/site-domain-result.json
        run: |
          set -euo pipefail
          python -m scripts.run_esrm20_kosovo_site_domain_profile_action \
            --comment-body-env OC_SITE_DOMAIN_REQUEST_BODY \
            --expected-issue 291 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_kosovo_site_domain_profile_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject._validate_terminal_result(result, execution_sha=os.environ["EXECUTION_SHA"])
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/site-domain-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-site-domain:
    name: Publish bounded Kosovo site static-domain evidence
    needs: [validate-request, execute-site-domain]
    if: >-
      needs.execute-site-domain.result == 'success' &&
      needs.execute-site-domain.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-site-domain.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-kosovo-site-domain-profile-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-kosovo-site-domain-profile-result-v1" and
            .action == "esrm20_kosovo_site_parameter_static_domain_profile" and
            .source_issue == 291 and .site_profile_issue == 459 and
            .source_science_issue == 284 and .receipt_issue == 342 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or (.status == "blocked" and
              (.failure_class == "acquisition_failure" or .failure_class == "domain_profile_failure") and
              .profile == null)) and
            .external_bytes_persisted == false and
            .openquake_runtime_value_acceptance_verified == false and
            .crs_coordinate_semantics_verified == false and
            .missingness_semantics_verified == false and
            .gsim_site_parameter_sufficiency_verified == false and
            .site_adjusted_reference_authorized == false and
            .publication_authorized == false and .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .profile != null and
              .profile.schema_version == "oc-esrm20-kosovo-site-parameter-domain-profile-v0" and
              .profile.source_issue == 291 and .profile.site_profile_issue == 459 and
              .profile.site_structure_result_comment_id == 5310018006 and
              .profile.required_parameter_handoff_comment_id == 5310209812 and
              .profile.xvf_semantics_comment_id == 5310202888 and
              .profile.site_identity.project_id == 269 and
              .profile.site_identity.project_path == "efehr/esrm20" and
              .profile.site_identity.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
              .profile.site_identity.repository_path == "Vs30/Site_model_Kosovo.xml" and
              .profile.site_identity.byte_count == 5891 and
              .profile.site_identity.sha256 == "746cf75d91507da8b55a9476c61bb5d884eed42c6268a36b1179f432e8850edd" and
              .profile.domain_profile.required_site_parameter_names == ["geology","region","slope","vs30","xvf"] and
              .profile.domain_profile.site_count == 37 and
              .profile.domain_profile.static_domain_classification_complete == true and
              .profile.domain_profile.raw_xml_returned == false and
              .profile.domain_profile.raw_attribute_values_returned == false and
              .profile.domain_profile.raw_site_rows_returned == false and
              .profile.domain_profile.openquake_runtime_value_acceptance_verified == false and
              .profile.domain_profile.crs_coordinate_semantics_verified == false and
              .profile.domain_profile.missingness_semantics_verified == false and
              .profile.domain_profile.gsim_site_parameter_sufficiency_verified == false and
              .profile.domain_profile.site_adjusted_reference_authorized == false and
              .profile.domain_profile.publication_authorized == false and
              .profile.domain_profile.model_use_authorized == false and
              .profile.external_bytes_persisted == false and
              .profile.publication_authorized == false and .profile.model_use_authorized == false
            else true end)
          ' >/dev/null

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/site-domain-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/291/comments" \
            --input "$RUNNER_TEMP/site-domain-comment.json"
