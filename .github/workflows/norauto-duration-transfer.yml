name: norauto duration transfer research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pandas==2.3.2 scipy==1.16.1 scikit-learn==1.8.0 pyreadr==0.5.3
      - name: Execute prospectively registered Norway transfer
        run: python research_runners/norauto_duration_transfer.py
      - name: Upload scientific receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norauto-duration-transfer
          path: norauto_duration_transfer_artifact/
          if-no-files-found: error
          retention-days: 30
