name: XWS Kyrill 2007 Schwierz conditional sensitivity (research only)

on:
  pull_request:
    paths:
      - ".github/workflows/xws-kyrill-schwierz-conditional-v0.yml"
      - "research_runners/xws_kyrill_nrw10k_schwierz_conditional_loss_v0.py"
      - "tests/test_xws_kyrill_nrw10k_schwierz_conditional_loss_v0.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-original-artifact-conditional-groundup-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact read-only repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python 3.11, stdlib-only calculation
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: PAA MDD interpolation and fail-closed county conservation tests
        run: |
          python -m unittest discover -s tests -p 'test_xws_kyrill_nrw10k_schwierz_conditional_loss_v0.py' -v
          python -m compileall -q research_runners/xws_kyrill_nrw10k_schwierz_conditional_loss_v0.py
      - name: Re-acquire exact immutable previously source-verified research ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" \
            "repos/pokekarten/OpenCatastrophe-data/actions/artifacts/13452772144/zip" \
            > "${{ runner.temp }}/kyrill-2007-10k-source-hazard-only.zip"
          gh api -H "Accept: application/vnd.github+json" \
            "repos/pokekarten/OpenCatastrophe-data/actions/artifacts/13447603258/zip" \
            > "${{ runner.temp }}/nrw-2022-hu-10k-fictitious-original-oed.zip"
          test -s "${{ runner.temp }}/kyrill-2007-10k-source-hazard-only.zip"
          test -s "${{ runner.temp }}/nrw-2022-hu-10k-fictitious-original-oed.zip"
      - name: Exactly source-bound 12 conditional loss sensitivity totals, no annual CAT
        run: |
          python research_runners/xws_kyrill_nrw10k_schwierz_conditional_loss_v0.py \
            "${{ runner.temp }}/kyrill-2007-10k-source-hazard-only.zip" \
            "${{ runner.temp }}/nrw-2022-hu-10k-fictitious-original-oed.zip" \
            "${{ runner.temp }}/xws-kyrill-10k-schwierz-summary.json" \
            "${{ runner.temp }}/xws-kyrill-53kreis-conditional-scenarios.csv"
      - name: Enforce no source promotion and check 12 scenario x 53 county totals
        run: |
          python - <<'PY'
          import csv,json,os,pathlib,hashlib,tomllib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          p=root/"xws-kyrill-10k-schwierz-summary.json"
          c=root/"xws-kyrill-53kreis-conditional-scenarios.csv"
          data=json.loads(p.read_text())
          rows=list(csv.DictReader(c.open(newline="")))
          assert len(rows)==53*4*3
          assert len(data["results"])==4*3
          assert data["site_count"]==10000 and data["county_count"]==53
          assert data["fictional_tiv_eur"]==4826029500
          assert data["annual_event_frequency_justified"] is False
          assert data["gross_net_OEP_AEP_calibrated"] is False
          assert data["native_Oasis_or_NextGen_GUL_IL_RI_executed"] is False
          assert data["insurer_RV_actual_risks_or_tiv_observed"] is False
          assert hashlib.sha256(c.read_bytes()).hexdigest()==data["per_county_csv_sha256"]
          source=tomllib.loads(pathlib.Path(
            "research/observations/xws_kyrill_2007_nrw10k_schwierz_one_event_sensitivity_v0.toml"
          ).read_text(encoding="utf-8"))
          assert source["results_per_county_csv_sha256"]==data["per_county_csv_sha256"]
          assert source["results_machine_summary_json_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert source["source_annual_event_frequency_established"] is False
          assert source["annual_gross_net_OEP_AEP_authorized"] is False
          actual={r["historical_wind_source_variant"]:{} for r in data["results"]}
          for r in data["results"]:
            actual[r["historical_wind_source_variant"]][
              r["hypothetical_damage_sensitivity"]
            ]=r["conditional_expected_groundup_eur"]
          for r in source["wind_scenario"]:
            got=actual[r["name"]]
            assert got["low_half_reference"]==r["loss_reference_0_5_eur"]
            assert got["reference_unmodified"]==r["loss_reference_1_0_eur"]
            assert got["high_double_reference"]==r["loss_reference_2_0_eur"]
          print("SOURCE_XWS_SCHWIERZ_10K_CONDITIONAL_ONLY_QC_PASS")
          print("COUNTY_CSV_SHA256", data["per_county_csv_sha256"])
          print("SCENARIO_SUMMARY_SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Do not persist original third-party or fictional site-level artifacts
        run: |
          rm -- "${{ runner.temp }}/kyrill-2007-10k-source-hazard-only.zip" \
            "${{ runner.temp }}/nrw-2022-hu-10k-fictitious-original-oed.zip" \
            "${{ runner.temp }}/xws-kyrill-10k-schwierz-summary.json" \
            "${{ runner.temp }}/xws-kyrill-53kreis-conditional-scenarios.csv"
