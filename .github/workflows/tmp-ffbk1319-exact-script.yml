name: TEMP FFBK 1319 exact script bytes v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-script:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.3 pandas==2.2.3 scipy==1.15.2 scikit-learn==1.8.0 pyarrow==19.0.1
      - name: Verify exact FFBK scientific blobs
        run: |
          python - <<'PY'
          import hashlib, pathlib
          expected = {
              'tmp_ffbk1319_exact/scripts/underwriting_fremtpl_raw_tournament.py': '33e1f7afc77bf24dc3c47389feec0a908211a82f',
              'tmp_ffbk1319_exact/scripts/underwriting_fremtpl_raw_sensitivity.py': 'f4a56d58ddc261b6da3482847c5dac9000abedb0',
          }
          for name, wanted in expected.items():
              data = pathlib.Path(name).read_bytes()
              got = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              print(name, 'bytes=', len(data), 'git_blob=', got, 'sha256=', hashlib.sha256(data).hexdigest())
              if got != wanted:
                  raise SystemExit(f'blob mismatch: {name} {got} != {wanted}')
          PY
      - name: Execute exact tournament CLI
        run: |
          mkdir -p tmp_ffbk1319_exact/results
          python tmp_ffbk1319_exact/scripts/underwriting_fremtpl_raw_tournament.py \
            --seeds 0,17,42 \
            --output tmp_ffbk1319_exact/results/tournament.json \
            > tmp_ffbk1319_exact/results/tournament.log
          tail -n 2 tmp_ffbk1319_exact/results/tournament.log
      - name: Execute exact sensitivity wrapper
        run: |
          python tmp_ffbk1319_exact/scripts/underwriting_fremtpl_raw_sensitivity.py \
            --seeds 0,17,42 \
            --output tmp_ffbk1319_exact/results/sensitivity.json \
            > tmp_ffbk1319_exact/results/sensitivity.log
          tail -n 2 tmp_ffbk1319_exact/results/sensitivity.log
      - name: Build exact execution receipt
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, platform, sys
          import numpy, pandas, scipy, sklearn, pyarrow
          root = pathlib.Path('tmp_ffbk1319_exact/results')
          def digest(p):
              return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          t = json.loads((root/'tournament.json').read_text())
          s = json.loads((root/'sensitivity.json').read_text())
          receipt = {
              'ffbk_pr_head_scientific_bytes': '705c50a67567f785d983a7dad9dbf7d9f3724748',
              'script_blobs': {
                  'tournament': '33e1f7afc77bf24dc3c47389feec0a908211a82f',
                  'sensitivity': 'f4a56d58ddc261b6da3482847c5dac9000abedb0',
              },
              'python': sys.version,
              'platform': platform.platform(),
              'versions': {
                  'numpy': numpy.__version__, 'pandas': pandas.__version__, 'scipy': scipy.__version__,
                  'scikit_learn': sklearn.__version__, 'pyarrow': pyarrow.__version__,
              },
              'tournament_semantic_receipt_sha256': t['semantic_receipt_sha256'],
              'sensitivity_semantic_receipt_sha256': s['semantic_receipt_sha256'],
              'tournament_file_sha256': digest(root/'tournament.json'),
              'sensitivity_file_sha256': digest(root/'sensitivity.json'),
              'openml': s['data']['openml'],
              'direct_tweedie_claimnb_invariance': s['direct_tweedie_claimnb_invariance'],
          }
          (root/'execution-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          for variant in ('reference_cleaned','uncapped_joined_claim_amount','raw_claimnb_reference_amount_cap'):
              print('VARIANT', variant)
              group = s['variants'][variant]['summary']['direct_vs_joint_product_same_power']
              for model, rows in sorted(group.items()):
                  for row in rows:
                      power = str(row['selection_power'])
                      print('DELTA', model, row['seed'], power, row['deviance_difference_direct_minus_joint_product'][power], row['ordered_gini_difference_direct_minus_joint_product'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffbk1319-exact-script-results-v2
          path: tmp_ffbk1319_exact/results/
          if-no-files-found: error
