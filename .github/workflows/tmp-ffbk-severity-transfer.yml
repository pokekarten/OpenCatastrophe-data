name: tmp-ffbk-severity-transfer

on:
  push:
    branches:
      - tmp/ffbk-severity-transfer-20260906
    paths:
      - scripts/tmp_ffbk_fremtpl2_severity_transfer.py
      - .github/workflows/tmp-ffbk-severity-transfer.yml

permissions:
  contents: read

jobs:
  run-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn
      - name: Run frozen target study
        run: python scripts/tmp_ffbk_fremtpl2_severity_transfer.py
      - name: Upload result receipt
        uses: actions/upload-artifact@v4
        with:
          name: ffbk-severity-transfer-result
          path: tmp_ffbk_severity_transfer_result.json
          if-no-files-found: error
