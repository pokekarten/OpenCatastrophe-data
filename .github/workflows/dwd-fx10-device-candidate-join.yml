name: DWD original FX10 Maxwind equipment candidate joint audit

on:
  pull_request:
    paths:
      - 'scripts/dwd_fx10_maxwind_candidate_join_v0.py'
      - 'tests/test_dwd_fx10_maxwind_candidate_join_v0.py'
      - '.github/workflows/dwd-fx10-device-candidate-join.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fx10-negative-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test ambiguous device/parameter joins, units, rights and original hashes
        run: python -m unittest tests.test_dwd_fx10_maxwind_candidate_join_v0 -v

  exact-original-candidate-audit:
    needs: synthetic-fx10-negative-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-read only SHA-pinned original DWD metadata ZIP and publish aggregate research receipt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          asset="$RUNNER_TEMP/Meta_Daten_zehn_min_fx_00003.zip"
          trap 'rm -f "$asset"' EXIT
          curl --fail --silent --show-error --noproxy '*' \
            --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 120 --retry 0 --max-filesize 5242880 --output "$asset" \
            'https://opendata.dwd.de/climate_environment/CDC/observations_germany/climate/10_minutes/extreme_wind/meta_data/Meta_Daten_zehn_min_fx_00003.zip'
          python -m scripts.dwd_fx10_maxwind_candidate_join_v0 --source-zip "$asset"
          # Raw DWD ZIP/data rows, instrument names and coordinates are never persisted.
