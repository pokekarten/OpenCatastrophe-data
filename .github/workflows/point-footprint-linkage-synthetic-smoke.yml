name: Point-footprint linkage synthetic smoke

on:
  pull_request:
    paths:
      - "scripts/point_footprint_linkage_diagnostic_v0.py"
      - "tests/test_point_footprint_linkage_diagnostic_v0.py"
      - "docs/research/point-footprint-linkage-diagnostic-v0.md"
      - ".github/workflows/point-footprint-linkage-synthetic-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-linkage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-linkage:
    name: Shapely synthetic point-footprint diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install reviewed optional spatial dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Exercise synthetic-only geometric matching and negative tests
        run: python -m unittest tests.test_point_footprint_linkage_diagnostic_v0 -v
