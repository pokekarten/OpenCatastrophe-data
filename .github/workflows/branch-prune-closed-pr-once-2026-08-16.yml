name: One-time closed PR branch prune

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-prune-closed-pr-once-2026-08-16.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact closed-PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/410-mapping-bridge-transport-hardening"
          expected_sha="a8e58e1996424558e2f0d60ae37c4e001177d0c0"
          branch_enc="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("agent/410-mapping-bridge-transport-hardening", safe=""))')"
          current_sha="$(gh api "/repos/$REPO/branches/$branch_enc" --jq '.commit.sha')"
          open_count="$(gh api -X GET "/repos/$REPO/pulls" -f state=open -f "head=pokekarten:$branch" -f per_page=100 --jq 'length')"
          [[ "$current_sha" == "$expected_sha" ]]
          [[ "$open_count" == "0" ]]
          gh api --silent -X DELETE "/repos/$REPO/git/refs/heads/$branch"
          echo "DELETED $branch $expected_sha"
