name: tmp-ffbk-fair-score-audit

on:
  push:
    branches:
      - research/fremtpl2-fair-score-audit-20260908
    paths:
      - scripts/tmp_ffbk_fremtpl2_fair_score_audit.py
      - .github/workflows/tmp-ffbk-fair-score-audit.yml

permissions:
  contents: read

jobs:
  run-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen research dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.5.3 pandas==3.0.5 scipy==1.18.1
          scikit-learn==1.9.0 rdata==1.1.0
      - name: Run frozen freMTPL2 fair-score audit
        run: python scripts/tmp_ffbk_fremtpl2_fair_score_audit.py
      - name: Upload result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffbk-fair-score-audit-result
          path: tmp_ffbk_fair_score_audit_result.json
          if-no-files-found: error
