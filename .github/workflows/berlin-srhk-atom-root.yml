name: Berlin SRHK 2025 Atom root metadata preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srhk_atom_root_preflight_v0.py
      - tests/test_berlin_srhk_atom_root_preflight_v0.py
      - .github/workflows/berlin-srhk-atom-root.yml
  # One reviewed metadata GET only on the workflow's main revision.
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srhk-atom-root.yml

permissions:
  contents: read

concurrency:
  group: berlin-srhk-atom-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-atom:
    name: Source Atom root XML metadata only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Synthetic XML security and no-follow test
        run: python -m unittest tests.test_berlin_srhk_atom_root_preflight_v0 -v
      - name: Exactly one official Atom root GET (no child reads)
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srhk_atom_root_preflight_v0 --live
