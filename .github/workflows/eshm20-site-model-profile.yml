name: ESHM20 Region-Main Site Structure Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: eshm20-site-model-profile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main ESHM20 site-profile request
    if: >-
      github.event.issue.number == 281 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-eshm20-site-model-profile-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_ESHM20_SITE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_eshm20_site_model_profile_action.py \
            --comment-body-env OC_ESHM20_SITE_PROFILE_REQUEST_BODY \
            --expected-issue 281 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-site-profile:
    name: Execute bounded ESHM20 site structure profile
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import validate_eshm20_site_profile_public_result as public_result

          skip = public_result.has_terminal_site_profile_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Run exact frozen ESHM20 site-profile worker
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_ESHM20_SITE_PROFILE_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/eshm20-site-profile-result.json
        run: |
          set -euo pipefail
          python scripts/run_eshm20_site_model_profile_action.py \
            --comment-body-env OC_ESHM20_SITE_PROFILE_REQUEST_BODY \
            --expected-issue 281 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_eshm20_site_model_profile_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          subject._validate_terminal_result(result, execution_sha=os.environ["EXECUTION_SHA"])
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/eshm20-site-profile-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-site-profile:
    name: Publish bounded ESHM20 site structure evidence
    needs: [validate-request, execute-site-profile]
    if: >-
      needs.execute-site-profile.result == 'success' &&
      needs.execute-site-profile.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-site-profile.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-eshm20-site-model-profile-result-v1 -->"
          PUBLICATION_NOTICE_MARKER: "<!-- oc-eq1-eshm20-site-model-profile-publication-notice-v1 -->"
          ESHM20_ATTRIBUTION: "European Seismic Hazard Model 2020 (ESHM20), EFEHR"
          ESHM20_LICENSE_ID: "CC-BY-4.0"
          ESHM20_LICENSE_URL: "https://creativecommons.org/licenses/by/4.0/"
          ESHM20_CITATION: "Danciu et al. (2021), EFEHR Technical Report 001 v1.0.0"
          ESHM20_CITATION_URL: "https://doi.org/10.12686/a15"
          DERIVED_PUBLICATION_SCOPE: "bounded-derived-site-profile-action-evidence-only"
          DERIVED_CHANGE_NOTICE: "Bounded action evidence for an attempted structural profile of the fixed receipt-bound ESHM20 site CSV; provider bytes and rows are not reproduced."
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-eshm20-site-model-profile-result-v1" and
            .action == "eshm20_site_model_structural_profile" and
            .source_issue == 281 and
            .dataset_id == "efehr.eshm20" and
            .target_sha == $sha and
            .execution_sha == $sha and
            (.status == "pass" or (.status == "blocked" and .failure_class == "site_profile_failure" and .profile == null)) and
            .schema_interpretation_authorized == false and
            .crs_authorized == false and
            .coordinate_semantics_authorized == false and
            .site_response_authorized == false and
            .site_semantics_authorized == false and
            .external_bytes_persisted == false and
            .publication_authorized == false and
            .model_use_authorized == false
          ' >/dev/null

          # The active result above has already passed the exact Python contract.
          # Remove deterministic per-column value-set fingerprints only at the
          # public boundary: low-entropy domains can otherwise be inverted by
          # offline dictionary enumeration even though raw rows are absent.
          PUBLIC_RESULT_JSON="$(printf '%s' "$RESULT_JSON" | jq -c '
            if .status == "pass" then
              .profile.profile.columns |= map(del(.exact_value_set_sha256))
            else
              .
            end
          ')"
          test -n "$PUBLIC_RESULT_JSON"
          printf '%s' "$PUBLIC_RESULT_JSON" | jq -e '
            if .status == "pass" then
              (.profile.profile.columns | length) > 0 and
              all(.profile.profile.columns[]; has("exact_value_set_sha256") | not)
            else
              .profile == null
            end
          ' >/dev/null

          test "$ESHM20_ATTRIBUTION" = "European Seismic Hazard Model 2020 (ESHM20), EFEHR"
          test "$ESHM20_LICENSE_ID" = "CC-BY-4.0"
          test "$ESHM20_LICENSE_URL" = "https://creativecommons.org/licenses/by/4.0/"
          test "$ESHM20_CITATION" = "Danciu et al. (2021), EFEHR Technical Report 001 v1.0.0"
          test "$ESHM20_CITATION_URL" = "https://doi.org/10.12686/a15"
          test "$DERIVED_PUBLICATION_SCOPE" = "bounded-derived-site-profile-action-evidence-only"
          test "$DERIVED_CHANGE_NOTICE" = "Bounded action evidence for an attempted structural profile of the fixed receipt-bound ESHM20 site CSV; provider bytes and rows are not reproduced."

          NOTICE="$PUBLICATION_NOTICE_MARKER
          Attribution: $ESHM20_ATTRIBUTION
          License: $ESHM20_LICENSE_ID — $ESHM20_LICENSE_URL
          Citation: $ESHM20_CITATION — $ESHM20_CITATION_URL
          Bounded derived action evidence publication authorized: true
          Derived action-evidence publication scope: $DERIVED_PUBLICATION_SCOPE
          Change notice: $DERIVED_CHANGE_NOTICE
          Execution SHA: $EXECUTION_SHA
          Provider/raw publication authority: false; model-use authority: false."
          jq -n --arg body "$NOTICE" '{body:$body}' > "$RUNNER_TEMP/eshm20-site-profile-publication-notice.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/eshm20-site-profile-publication-notice.json"

          BODY="$RESULT_MARKER
          $PUBLIC_RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/eshm20-site-profile-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/281/comments" \
            --input "$RUNNER_TEMP/eshm20-site-profile-comment.json"
