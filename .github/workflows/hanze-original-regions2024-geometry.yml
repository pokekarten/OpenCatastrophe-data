name: HANZE v3 Region Geometry Original Archive Byte Profile

on:
  pull_request:
    paths:
      - ".github/workflows/hanze-original-regions2024-geometry.yml"
      - "research_runners/hanze_regions2024_geometry_zip_audit_v0.py"
      - "research_runners/hanze_regions2024_zip_original_receipt_v0.py"
      - "tests/test_hanze_regions2024_geometry_zip_audit_v0.py"
      - "research_runners/hanze_regions2024_geometry_code_coverage_v0.py"
      - "tests/test_hanze_regions2024_geometry_code_coverage_v0.py"
      - "research_runners/hanze_regions2024_geometry_source_receipt_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanze2024-geometry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-original-archive:
    name: Inspect exact original HANZE 2024 region geometry archive
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Test fail-closed archive byte/header contract on synthetic fixtures
        run: python -m unittest tests.test_hanze_regions2024_geometry_zip_audit_v0 tests.test_hanze_regions2024_geometry_code_coverage_v0 -v
      - name: Download and inspect original provider archive (nothing persisted to Git)
        run: |
          python research_runners/hanze_regions2024_zip_original_receipt_v0.py --out "$RUNNER_TEMP/hanze-regions2024-zip-metadata.json"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); assert r["publisher_md5_matched"] and r["original_sha256_independently_pinned"] and r["original_bytes"]==2430309 and r["shapefile_component_groups"] and not r["model_input_admitted"] and not r["geometry_topology_or_projection_validated"]; print("HANZE native regions archive header/field metadata ONLY:", json.dumps({k:r[k] for k in ("observed_sha256","archive_member_count","total_decompressed_member_bytes","member_extensions_counts","shapefile_component_groups")},sort_keys=True))'
      - name: Original HANZE geometry DBF Code against native S2 region IDs and 9 candidate lists
        run: |
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); g=r["native_glossary_geometry_id_comparison"]; c=r["candidate_region_geometry_id_coverage"]; assert c["candidate_pair_count"]==9 and g["glossary_region_count"]==1442 and c["region_token_occurrences"]==150 and not c["source_polygon_geometry_intersections_computed"] and not c["model_input_admitted"]; print("HANZE region geometry DBF exact source Code coverage, no flood polygons:", json.dumps({"glossary_matches":g["glossary_codes_also_in_geometry"],"geometry_only":g["geometry_codes_not_in_glossary"],"glossary_only":g["glossary_codes_not_in_geometry"],"distinct_dbf_codes":g["original_geometry"]["dbf_distinct_canonical_code_count"],"repeated_dbf_features":g["original_geometry"]["dbf_repeated_code_surplus_features"],"candidate_coverage":c},sort_keys=True))'
      - name: Compare exact verified original ZIP source profile with frozen research receipt
        run: |
          python -c 'import json,os,pathlib; from research_runners.hanze_regions2024_geometry_source_receipt_v0 import HANZE_NATIVE_REGION_GEOMETRY_RECEIPT_V0 as e; a=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); s=a["native_glossary_geometry_id_comparison"]; d=a["candidate_region_geometry_id_coverage"]; g=s["original_geometry"]; assert a["observed_sha256"]==e["source_archive_observed_sha256"] and a["archive_member_count"]==e["zip_member_count"] and g["dbf_distinct_canonical_code_count"]==e["dbf_distinct_valid_code_count"] and g["dbf_repeated_code_surplus_features"]==e["dbf_repeated_code_surplus"] and s["glossary_codes_also_in_geometry"]==e["in_both_original_s2_and_dbf_code_counts"] and s["geometry_codes_not_in_glossary"]==e["in_dbf_not_s2_code_count"] and s["glossary_codes_not_in_geometry"]==e["in_s2_not_dbf_code_count"] and d["fully_dbf_code_covered_original_candidate_lists"]==e["candidate_original_hanze_region_lists_fully_present_in_dbf"] and d["region_token_occurrences"]==e["original_hanze_region_token_occurrences_all_in_dbf"] and not e["model_source_admitted"]; print("PASS: original HANZE polygons ID coverage 1449 / source S2 1442 / 1382 common / 67 + 60 source-only / 150 source event tokens all in shapes")'
