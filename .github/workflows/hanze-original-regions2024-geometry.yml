name: HANZE v3 Region Geometry Original Archive Byte Profile

on:
  pull_request:
    paths:
      - ".github/workflows/hanze-original-regions2024-geometry.yml"
      - "research_runners/hanze_regions2024_geometry_zip_audit_v0.py"
      - "research_runners/hanze_regions2024_zip_original_receipt_v0.py"
      - "tests/test_hanze_regions2024_geometry_zip_audit_v0.py"
      - "research_runners/hanze_regions2024_geometry_code_coverage_v0.py"
      - "tests/test_hanze_regions2024_geometry_code_coverage_v0.py"
      - "research_runners/hanze_2024_original_polygon_integrity_v0.py"
      - "tests/test_hanze_2024_original_polygon_integrity_v0.py"
      - "research_runners/hanze_2024_polygon_integrity_source_receipt_v0.py"
      - "research_runners/hanze_2024_independent_crs_geos_audit_v0.py"
      - "tests/test_hanze_2024_independent_crs_geos_audit_v0.py"
      - "research_runners/hanze_2024_independent_geometry_source_receipt_v0.py"
      - "research_runners/hanze_regions2024_geometry_source_receipt_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanze2024-geometry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-original-archive:
    name: Inspect exact original HANZE 2024 region geometry archive
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python 3.12 (binary geospatial audit dependencies)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install isolated pinned geospatial validation wheels
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pyproj==3.7.2" "shapely==2.1.2" "pyshp==2.3.1"
      - name: Test fail-closed archive byte/header contract on synthetic fixtures
        run: python -m unittest tests.test_hanze_regions2024_geometry_zip_audit_v0 tests.test_hanze_regions2024_geometry_code_coverage_v0 tests.test_hanze_2024_original_polygon_integrity_v0 tests.test_hanze_2024_independent_crs_geos_audit_v0 -v
      - name: Download and inspect original provider archive (nothing persisted to Git)
        run: |
          python research_runners/hanze_regions2024_zip_original_receipt_v0.py --out "$RUNNER_TEMP/hanze-regions2024-zip-metadata.json"
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); assert r["publisher_md5_matched"] and r["original_sha256_independently_pinned"] and r["original_bytes"]==2430309 and r["shapefile_component_groups"] and not r["model_input_admitted"] and not r["geometry_topology_or_projection_validated"]; print("HANZE native regions archive header/field metadata ONLY:", json.dumps({k:r[k] for k in ("observed_sha256","archive_member_count","total_decompressed_member_bytes","member_extensions_counts","shapefile_component_groups")},sort_keys=True))'
      - name: Original HANZE geometry DBF Code against native S2 region IDs and 9 candidate lists
        run: |
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); g=r["native_glossary_geometry_id_comparison"]; c=r["candidate_region_geometry_id_coverage"]; assert c["candidate_pair_count"]==9 and g["glossary_region_count"]==1442 and c["region_token_occurrences"]==150 and not c["source_polygon_geometry_intersections_computed"] and not c["model_input_admitted"]; print("HANZE region geometry DBF exact source Code coverage, no flood polygons:", json.dumps({"glossary_matches":g["glossary_codes_also_in_geometry"],"geometry_only":g["geometry_codes_not_in_glossary"],"glossary_only":g["glossary_codes_not_in_geometry"],"distinct_dbf_codes":g["original_geometry"]["dbf_distinct_canonical_code_count"],"repeated_dbf_features":g["original_geometry"]["dbf_repeated_code_surplus_features"],"candidate_coverage":c},sort_keys=True))'
      - name: Compare exact verified original ZIP source profile with frozen research receipt
        run: |
          python -c 'import json,os,pathlib; from research_runners.hanze_regions2024_geometry_source_receipt_v0 import HANZE_NATIVE_REGION_GEOMETRY_RECEIPT_V0 as e; a=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); s=a["native_glossary_geometry_id_comparison"]; d=a["candidate_region_geometry_id_coverage"]; g=s["original_geometry"]; assert a["observed_sha256"]==e["source_archive_observed_sha256"] and a["archive_member_count"]==e["zip_member_count"] and g["dbf_distinct_canonical_code_count"]==e["dbf_distinct_valid_code_count"] and g["dbf_repeated_code_surplus_features"]==e["dbf_repeated_code_surplus"] and s["glossary_codes_also_in_geometry"]==e["in_both_original_s2_and_dbf_code_counts"] and s["geometry_codes_not_in_glossary"]==e["in_dbf_not_s2_code_count"] and s["glossary_codes_not_in_geometry"]==e["in_s2_not_dbf_code_count"] and d["fully_dbf_code_covered_original_candidate_lists"]==e["candidate_original_hanze_region_lists_fully_present_in_dbf"] and d["region_token_occurrences"]==e["original_hanze_region_token_occurrences_all_in_dbf"] and not e["model_source_admitted"]; print("PASS: original HANZE polygons ID coverage 1449 / source S2 1442 / 1382 common / 67 + 60 source-only / 150 source event tokens all in shapes")'
      - name: Show original polygon record structure and reported projection metadata only
        run: |
          python -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); p=r["original_polygon_record_integrity"]; assert p["original_zip_sha256_verified"] and p["polygon_records"]+p["null_shape_records"]==1449 and p["shp_shx_record_count_exactly_reconciled"] and p["all_declared_bounds_contain_finite_vertices"] and not p["historical_hazard_footprint_observed"] and not p["model_source_admitted"]; print("HANZE 2024 original Polygon/PRJ evidence (not actual inundation):",json.dumps(p,sort_keys=True))'
      - name: Compare all original Polygon and PRJ metadata to frozen source evidence
        run: |
          python -c 'import json,os,pathlib; from research_runners.hanze_2024_polygon_integrity_source_receipt_v0 import HANZE_2024_POLYGON_INTEGRITY_RECEIPT_V0 as e; a=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); p=a["original_polygon_record_integrity"]; w=p["projection_declaration"]; assert a["observed_sha256"] == e["original_zip_sha256"] and p["polygon_records"] == e["polygon_records"] and p["null_shape_records"] == e["null_shape_records"] and p["polygon_rings"] == e["polygon_rings"] and p["polygon_vertices"] == e["polygon_vertices"] and p["exactly_closed_ring_count"] == e["exactly_closed_rings"] and p["open_ring_count"] == e["open_rings"] and w["declared_crs_name_unverified"] == e["projection_declared_name"] and w["declared_projection_method_unverified"] == e["projection_declared_method"] and w["declared_unit_names_unverified"] == e["projection_declared_unit_names"] and w["wkt_authority_epsg_codes_reported"] == e["projection_source_explicit_epsg_authorities"] and not e["model_source_admitted"]; print("PASS: exact original 1449 polygons, 15712 closed rings, 397659 points; publisher declares ETRS_1989_LAEA without EPSG ID")'
      - name: Verify independent original CRS matching and GEOS validity counts, metadata only
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text()); g=d["independent_crs_and_geos_validity"]; assert g["original_source_sha256_verified"] and g["source_feature_count"]==1449 and sum(g["validity"][k] for k in ("geos_valid_geometries","geos_invalid_geometries","null_shapes"))==1449 and not g["original_coordinates_or_region_id_exported"] and not g["model_input_admitted"]; print("Independent source CRS and GEOS geometry validity aggregate (not inundation):",json.dumps(g,sort_keys=True))'
      - name: Reproduce original CRS/GEOS source finding and enforce no CAT admission
        run: |
          python -c 'import json,os,pathlib; from research_runners.hanze_2024_independent_geometry_source_receipt_v0 import HANZE_2024_INDEPENDENT_GEOMETRY_RECEIPT_V0 as e; g=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"hanze-regions2024-zip-metadata.json").read_text())["independent_crs_and_geos_validity"]; v=g["validity"]; assert g["epsg_code_identified_by_pyproj"]==e["identified_epsg_by_proj"]==3035 and g["epsg3035_projection_parameters_ellipsoid_axes_match"] and g["equals_official_epsg3035_ignoring_axis_order"] is False and v["geos_valid_geometries"]==e["geos_valid_geometries"] and v["geos_invalid_geometries"]==e["geos_invalid_geometries"] and v["polygons"]==e["interpreted_feature_types"]["polygon"] and v["multipolygons"]==e["interpreted_feature_types"]["multipolygon"] and g["invalid_reason_family_counts"]==e["invalid_reason_families"] and g["versions"]==e["libraries"] and not e["all_geometry_features_eligible_for_model_input"] and not e["model_input_admitted"]; print("PASS: independent source EPSG3035 projection match, 555 GEOS-valid vs 894 GEOS-flagged source geometries, rights/model admission blocked")'
