name: Synthetic Oasis OED 5.0 compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/synthetic-oed-compat.yml"
      - "research_runners/export_synthetic_oed_v0.py"
      - "research_runners/validate_synthetic_oed_ods_tools_v0.py"
      - "research_runners/sql/synthetic_oed_snapshot_v0.sql"
      - "tests/test_export_synthetic_oed_v0.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-oed:
    name: Official ODS Tools 5.0.8 synthetic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned official ODS Tools
        run: |
          python -m pip install --disable-pip-version-check --no-input ods-tools==5.0.8
          python -m pip check
      - name: Run standard-library synthetic fixture tests
        run: python -m unittest discover -s tests -p test_export_synthetic_oed_v0.py -v
      - name: Validate synthetic exposure with official ODS Tools
        run: python research_runners/validate_synthetic_oed_ods_tools_v0.py
