name: Luxembourg ACT LiDAR 2019 original tile index and fixed research windows

on:
  pull_request:
    paths:
      - 'research_runners/lu_act2019_original_lidar_tile_index_v0.py'
      - 'tests/test_lu_act2019_original_lidar_tile_index_v0.py'
      - '.github/workflows/luxembourg-act2019-original-lidar-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-2019-lidar-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run synthetic integrity and source safety tests
        run: python -m unittest discover -s tests -p 'test_lu_act2019_original_lidar_tile_index_v0.py' -v
      - name: Install pinned CRS and geometry libraries
        run: python -m pip install --disable-pip-version-check 'pyproj==3.7.2' 'shapely==2.1.2'
      - name: Download and validate exact publisher 2019 tile index only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          original="$RUNNER_TEMP/lu-act2019-tile-urls.geojson"
          trap 'rm -f "$original"' EXIT
          curl --fail --location --silent --show-error --retry 0 \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 90 --max-filesize 600000 \
            -o "$original" \
            'https://download.data.public.lu/resources/lidar-2019-releve-3d-du-territoire-luxembourgeois/20200225-183349/lidar-urls.geojson'
          python -m research_runners.lu_act2019_original_lidar_tile_index_v0 \
            --original-index "$original"
          # No per-tile URLs, footprints, original GeoJSON, raw point clouds or
          # source building records are uploaded or persisted.
