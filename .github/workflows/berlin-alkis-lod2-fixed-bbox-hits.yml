name: Berlin ALKIS vs LoD2 two original WFS hits-only completeness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_alkis_lod2_bbox_hits_v0.py
      - tests/test_berlin_alkis_lod2_bbox_hits_v0.py
      - .github/workflows/berlin-alkis-lod2-fixed-bbox-hits.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-alkis-lod2-fixed-bbox-hits.yml

permissions:
  contents: read

concurrency:
  group: berlin-two-wfs-official-hits-v0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-counts:
    name: Two bounded original 200m bbox count-only GetFeature hits
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Offline fixed-query and no-geometry-count regressions
        run: python -m unittest tests.test_berlin_alkis_lod2_bbox_hits_v0 -v
      - name: Two exactly reviewed original WFS count-only source calls
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_alkis_lod2_bbox_hits_v0 --live
