name: OQ3.13 Offline Linux Runtime Bundle

on:
  pull_request:
    paths:
      - .github/workflows/oq313-offline-linux-bundle.yml
      - docs/OQ313_OFFLINE_LINUX_BUNDLE.md
      - scripts/run_oq313_offline_linux_runtime.sh
      - tests/test_oq313_offline_linux_bundle_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oq313-offline-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-bundle:
    name: Build pinned OQ3.13 Linux rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OQ_COMMIT: 16dd69ecea0c6dcaf49c22ca12edc9da3f024889
      BASE_IMAGE: openquake/engine@sha256:dcfb88b3f9feb96eddee648690253492ba252619703ff48477affdbbb3c1151c
      EXPECTED_BOOTSTRAP_DIGEST: sha256:dcfb88b3f9feb96eddee648690253492ba252619703ff48477affdbbb3c1151c
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify candidate source fence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Fetch exact OpenQuake 3.13 source
        run: |
          set -euo pipefail
          OQ_ROOT="$RUNNER_TEMP/oq-engine"
          git init "$OQ_ROOT"
          git -C "$OQ_ROOT" remote add origin https://github.com/gem/oq-engine.git
          git -C "$OQ_ROOT" fetch --depth=1 origin "$OQ_COMMIT"
          OBSERVED="$(git -C "$OQ_ROOT" rev-parse 'FETCH_HEAD^{commit}')"
          test "$OBSERVED" = "$OQ_COMMIT"
          git -C "$OQ_ROOT" checkout --detach "$OQ_COMMIT"
          test -z "$(git -C "$OQ_ROOT" status --porcelain=v1)"

      - name: Build exact-source runtime image
        id: runtime
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          BASE_REPO_DIGEST="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          BOOTSTRAP_DIGEST="${BASE_REPO_DIGEST##*@}"
          printf '%s\n' "$BOOTSTRAP_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$BOOTSTRAP_DIGEST" = "$EXPECTED_BOOTSTRAP_DIGEST"

          BUILD_ROOT="$RUNNER_TEMP/oq313-offline-build"
          mkdir -p "$BUILD_ROOT"
          cp -a "$RUNNER_TEMP/oq-engine" "$BUILD_ROOT/oq-engine"
          mkdir -p "$BUILD_ROOT/opencatastrophe-data"
          rsync -a --delete --exclude='.git/' ./ "$BUILD_ROOT/opencatastrophe-data/"

          cat > "$BUILD_ROOT/Dockerfile" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          USER root
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          COPY oq-engine /oq-engine
          COPY opencatastrophe-data /opencatastrophe-data
          RUN git -C /oq-engine config core.abbrev 10 \
              && test "$(git -C /oq-engine rev-parse --short HEAD)" = "16dd69ecea" \
              && python -m pip install --disable-pip-version-check --no-warn-script-location \
                   -r /oq-engine/requirements-py38-linux64.txt \
              && python -m pip install --no-deps -e /oq-engine \
              && rm -rf /root/.cache/pip \
              && chown -R openquake:openquake /oq-engine /opencatastrophe-data
          USER openquake
          WORKDIR /opencatastrophe-data
          EOF

          EXEC_IMAGE="oc-eq1-oq313-offline:${SOURCE_SHA}"
          docker build --pull=false --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t "$EXEC_IMAGE" "$BUILD_ROOT"
          EXEC_IMAGE_ID="$(docker image inspect --format='{{.Id}}' "$EXEC_IMAGE")"
          printf '%s\n' "$EXEC_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'

          echo "bootstrap_digest=$BOOTSTRAP_DIGEST" >> "$GITHUB_OUTPUT"
          echo "execution_image=$EXEC_IMAGE" >> "$GITHUB_OUTPUT"
          echo "execution_image_id=$EXEC_IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Probe exact runtime identity inside image
        env:
          EXEC_IMAGE: ${{ steps.runtime.outputs.execution_image }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            -e OQ_DISTRIBUTE=no \
            -e OPENBLAS_NUM_THREADS=1 \
            -e PYTHONPATH=/oq-engine \
            "$EXEC_IMAGE" - <<'PY'
          import json
          import sys
          import h5py
          import numpy
          import pandas
          import psutil
          import scipy
          import shapely
          import zmq
          import openquake.baselib as baselib

          expected = {
              "h5py": "3.1.0",
              "numpy": "1.20.0",
              "pandas": "1.1.5",
              "psutil": "5.6.7",
              "pyzmq": "19.0.0",
              "scipy": "1.4.1",
              "shapely": "1.7.1",
          }
          observed = {
              "h5py": h5py.__version__,
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "psutil": psutil.__version__,
              "pyzmq": zmq.__version__,
              "scipy": scipy.__version__,
              "shapely": shapely.__version__,
          }
          if sys.version_info[:2] != (3, 8):
              raise SystemExit(f"Python drifted: {sys.version_info[:2]}")
          if baselib.__version__ != "3.13.0-git16dd69ecea":
              raise SystemExit(f"OpenQuake drifted: {baselib.__version__}")
          if observed != expected:
              raise SystemExit(f"dependency drifted: {observed!r}")
          print(json.dumps({
              "python_major_minor": "3.8",
              "openquake_version": baselib.__version__,
              "dependency_versions": observed,
          }, sort_keys=True))
          PY

      - name: Materialize and probe non-distributed portable runtime
        id: bundle
        env:
          EXEC_IMAGE: ${{ steps.runtime.outputs.execution_image }}
          EXEC_IMAGE_ID: ${{ steps.runtime.outputs.execution_image_id }}
          BOOTSTRAP_DIGEST: ${{ steps.runtime.outputs.bootstrap_digest }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/oq313-offline-bundle"
          mkdir -p "$OUT"

          CID="$(docker create --entrypoint /bin/true "$EXEC_IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker export "$CID" | zstd -T0 -7 -o "$OUT/rootfs.tar.zst"
          docker rm "$CID" >/dev/null
          trap - EXIT

          cp scripts/run_oq313_offline_linux_runtime.sh "$OUT/offline-python.sh"
          chmod +x "$OUT/offline-python.sh"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "oq313-offline-bundle"
          manifest = {
              "schema_version": "oc-oq313-offline-linux-runtime-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_sha": os.environ["SOURCE_SHA"],
              "workflow_event_sha": os.environ["GITHUB_SHA"],
              "platform": "linux/amd64",
              "base_image": os.environ["BASE_IMAGE"],
              "bootstrap_image_digest": os.environ["BOOTSTRAP_DIGEST"],
              "execution_image_id": os.environ["EXEC_IMAGE_ID"],
              "oq_engine_commit": os.environ["OQ_COMMIT"],
              "openquake_version": "3.13.0-git16dd69ecea",
              "python_major_minor": "3.8",
              "portable_host_proc": True,
              "provider_bytes_included": False,
              "model_execution_performed": False,
              "rootfs_distributed": False,
              "rootfs_redistribution_authorized": False,
              "historical_reproduction_verified": False,
              "scientific_validity_verified": False,
              "publication_authorized": False,
              "model_use_authorized": False,
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$OUT/offline-probe.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          BUNDLE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          "$BUNDLE_DIR/offline-python.sh" - <<'PY'
          import json
          import sys
          from pathlib import Path

          import openquake.baselib as baselib
          import h5py
          import numpy
          import pandas
          import psutil
          import scipy
          import shapely
          import zmq

          expected = {
              "h5py": "3.1.0",
              "numpy": "1.20.0",
              "pandas": "1.1.5",
              "psutil": "5.6.7",
              "pyzmq": "19.0.0",
              "scipy": "1.4.1",
              "shapely": "1.7.1",
          }
          observed = {
              "h5py": h5py.__version__,
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "psutil": psutil.__version__,
              "pyzmq": zmq.__version__,
              "scipy": scipy.__version__,
              "shapely": shapely.__version__,
          }
          if sys.version_info[:2] != (3, 8):
              raise SystemExit(f"Python drifted: {sys.version_info[:2]}")
          if baselib.__version__ != "3.13.0-git16dd69ecea":
              raise SystemExit(f"OpenQuake drifted: {baselib.__version__}")
          if observed != expected:
              raise SystemExit(f"dependency drifted: {observed!r}")
          print(json.dumps({
              "python": sys.version.split()[0],
              "openquake": baselib.__version__,
              "baselib_file": str(Path(baselib.__file__).resolve()),
              "dependency_versions": observed,
              "cpu_count": psutil.cpu_count(),
          }, sort_keys=True))
          PY
          EOF
          chmod +x "$OUT/offline-probe.sh"

          cat > "$OUT/README.txt" <<'EOF'
          OpenCatastrophe OQ3.13 ephemeral portable Linux runtime bundle.

          This workflow-local bundle contains a Linux/amd64 OpenQuake 3.13
          runtime plus the exact OpenCatastrophe-data source revision recorded
          in manifest.json. It intentionally contains NO EFEHR/ESRM20 provider
          bytes and is NOT uploaded or otherwise distributed by this workflow.

          An authorized local operator retaining an equivalent bundle can run:
            sha256sum -c SHA256SUMS
            ./offline-probe.sh
            ./offline-python.sh -m <module> <arguments>

          Do not treat this runtime materialization as scientific validation,
          redistribution authorization, publication authority, or model-use
          authority.
          EOF

          (cd "$OUT" && sha256sum \
            rootfs.tar.zst manifest.json offline-python.sh offline-probe.sh README.txt \
            > SHA256SUMS)
          ROOTFS_SHA256="$(sha256sum "$OUT/rootfs.tar.zst" | awk '{print $1}')"
          MANIFEST_SHA256="$(sha256sum "$OUT/manifest.json" | awk '{print $1}')"
          printf '%s\n' "$ROOTFS_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$MANIFEST_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          echo "rootfs_sha256=$ROOTFS_SHA256" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MANIFEST_SHA256" >> "$GITHUB_OUTPUT"
          du -h "$OUT/rootfs.tar.zst"

          # Exercise the exported portable path before the ephemeral rootfs is discarded.
          "$OUT/offline-probe.sh"

      - name: Publish metadata-only runtime receipt to workflow summary
        env:
          ROOTFS_SHA256: ${{ steps.bundle.outputs.rootfs_sha256 }}
          MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ROOTFS_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$MANIFEST_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          {
            echo '## OQ3.13 non-distributed runtime receipt'
            echo
            printf -- '- source_sha: `%s`\n' "$SOURCE_SHA"
            printf -- '- bootstrap_image: `%s`\n' "$BASE_IMAGE"
            printf -- '- rootfs_sha256: `%s`\n' "$ROOTFS_SHA256"
            printf -- '- manifest_sha256: `%s`\n' "$MANIFEST_SHA256"
            echo '- rootfs_distributed: `false`'
            echo '- rootfs_redistribution_authorized: `false`'
            echo
            echo 'The rootfs was materialized and probed inside this job, then left in runner-temporary storage. Only this metadata receipt is published.'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/oq313-offline-bundle/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
