name: OQ3.13 Offline Linux Runtime Bundle

on:
  pull_request:
    paths:
      - .github/workflows/oq313-offline-linux-bundle.yml
      - docs/OQ313_OFFLINE_LINUX_BUNDLE.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oq313-offline-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-bundle:
    name: Build pinned OQ3.13 Linux rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OQ_COMMIT: 16dd69ecea0c6dcaf49c22ca12edc9da3f024889
      BASE_IMAGE: openquake/engine:3.13.0
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch exact OpenQuake 3.13 source
        run: |
          set -euo pipefail
          OQ_ROOT="$RUNNER_TEMP/oq-engine"
          git init "$OQ_ROOT"
          git -C "$OQ_ROOT" remote add origin https://github.com/gem/oq-engine.git
          git -C "$OQ_ROOT" fetch --depth=1 origin "$OQ_COMMIT"
          OBSERVED="$(git -C "$OQ_ROOT" rev-parse 'FETCH_HEAD^{commit}')"
          test "$OBSERVED" = "$OQ_COMMIT"
          git -C "$OQ_ROOT" checkout --detach "$OQ_COMMIT"
          test -z "$(git -C "$OQ_ROOT" status --porcelain=v1)"

      - name: Build exact-source runtime image
        id: runtime
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          BASE_REPO_DIGEST="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          BOOTSTRAP_DIGEST="${BASE_REPO_DIGEST##*@}"
          printf '%s\n' "$BOOTSTRAP_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

          BUILD_ROOT="$RUNNER_TEMP/oq313-offline-build"
          mkdir -p "$BUILD_ROOT"
          cp -a "$RUNNER_TEMP/oq-engine" "$BUILD_ROOT/oq-engine"
          mkdir -p "$BUILD_ROOT/opencatastrophe-data"
          rsync -a --delete --exclude='.git/' ./ "$BUILD_ROOT/opencatastrophe-data/"

          cat > "$BUILD_ROOT/Dockerfile" <<'EOF'
          FROM openquake/engine:3.13.0
          USER root
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          COPY oq-engine /oq-engine
          COPY opencatastrophe-data /opencatastrophe-data
          RUN git -C /oq-engine config core.abbrev 10 \
              && test "$(git -C /oq-engine rev-parse --short HEAD)" = "16dd69ecea" \
              && python -m pip install --disable-pip-version-check --no-warn-script-location \
                   -r /oq-engine/requirements-py38-linux64.txt \
              && python -m pip install --no-deps -e /oq-engine \
              && rm -rf /root/.cache/pip /home/openquake/.cache/pip \
              && chown -R openquake:openquake /oq-engine /opencatastrophe-data
          USER openquake
          WORKDIR /opencatastrophe-data
          EOF

          EXEC_IMAGE="oc-eq1-oq313-offline:${GITHUB_SHA}"
          docker build --pull=false -t "$EXEC_IMAGE" "$BUILD_ROOT"
          EXEC_IMAGE_ID="$(docker image inspect --format='{{.Id}}' "$EXEC_IMAGE")"
          printf '%s\n' "$EXEC_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$'

          echo "bootstrap_digest=$BOOTSTRAP_DIGEST" >> "$GITHUB_OUTPUT"
          echo "execution_image=$EXEC_IMAGE" >> "$GITHUB_OUTPUT"
          echo "execution_image_id=$EXEC_IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Probe exact runtime identity
        env:
          EXEC_IMAGE: ${{ steps.runtime.outputs.execution_image }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python \
            -e OQ_DISTRIBUTE=no \
            -e OPENBLAS_NUM_THREADS=1 \
            -e PYTHONPATH=/oq-engine \
            "$EXEC_IMAGE" - <<'PY'
          import json
          import sys
          import h5py
          import numpy
          import pandas
          import psutil
          import scipy
          import shapely
          import zmq
          import openquake.baselib as baselib

          expected = {
              "h5py": "3.1.0",
              "numpy": "1.20.0",
              "pandas": "1.1.5",
              "psutil": "5.6.7",
              "pyzmq": "19.0.0",
              "scipy": "1.4.1",
              "shapely": "1.7.1",
          }
          observed = {
              "h5py": h5py.__version__,
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "psutil": psutil.__version__,
              "pyzmq": zmq.__version__,
              "scipy": scipy.__version__,
              "shapely": shapely.__version__,
          }
          if sys.version_info[:2] != (3, 8):
              raise SystemExit(f"Python drifted: {sys.version_info[:2]}")
          if baselib.__version__ != "3.13.0-git16dd69ecea":
              raise SystemExit(f"OpenQuake drifted: {baselib.__version__}")
          if observed != expected:
              raise SystemExit(f"dependency drifted: {observed!r}")
          print(json.dumps({
              "python_major_minor": "3.8",
              "openquake_version": baselib.__version__,
              "dependency_versions": observed,
          }, sort_keys=True))
          PY

      - name: Export compressed Linux rootfs and receipts
        id: bundle
        env:
          EXEC_IMAGE: ${{ steps.runtime.outputs.execution_image }}
          EXEC_IMAGE_ID: ${{ steps.runtime.outputs.execution_image_id }}
          BOOTSTRAP_DIGEST: ${{ steps.runtime.outputs.bootstrap_digest }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/oq313-offline-bundle"
          mkdir -p "$OUT"

          CID="$(docker create --entrypoint /bin/true "$EXEC_IMAGE")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker export "$CID" | zstd -T0 -7 -o "$OUT/rootfs.tar.zst"
          docker rm "$CID" >/dev/null
          trap - EXIT

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "oq313-offline-bundle"
          manifest = {
              "schema_version": "oc-oq313-offline-linux-runtime-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_sha": os.environ["GITHUB_SHA"],
              "platform": "linux/amd64",
              "base_image": os.environ["BASE_IMAGE"],
              "bootstrap_image_digest": os.environ["BOOTSTRAP_DIGEST"],
              "execution_image_id": os.environ["EXEC_IMAGE_ID"],
              "oq_engine_commit": os.environ["OQ_COMMIT"],
              "openquake_version": "3.13.0-git16dd69ecea",
              "python_major_minor": "3.8",
              "provider_bytes_included": False,
              "model_execution_performed": False,
              "historical_reproduction_verified": False,
              "scientific_validity_verified": False,
              "publication_authorized": False,
              "model_use_authorized": False,
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$OUT/offline-probe.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          BUNDLE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          ROOTFS="${1:-$BUNDLE_DIR/rootfs}"
          if [[ ! -d "$ROOTFS" ]]; then
            mkdir -p "$ROOTFS"
            zstd -dc "$BUNDLE_DIR/rootfs.tar.zst" | tar -x -C "$ROOTFS"
          fi
          chroot "$ROOTFS" /usr/bin/env \
            OQ_DISTRIBUTE=no \
            OPENBLAS_NUM_THREADS=1 \
            PYTHONPATH=/oq-engine \
            python -c 'import sys, openquake.baselib as b; print(sys.version); print(b.__version__)'
          EOF
          chmod +x "$OUT/offline-probe.sh"

          cat > "$OUT/README.txt" <<'EOF'
          OpenCatastrophe OQ3.13 offline Linux runtime bundle.

          This bundle contains a Linux/amd64 OpenQuake 3.13 runtime plus the
          OpenCatastrophe-data source revision recorded in manifest.json.
          It intentionally contains NO EFEHR/ESRM20 provider bytes.

          On a Linux host with root/chroot and zstd:
            ./offline-probe.sh

          For model execution, mount or copy separately receipted provider input
          bytes into the extracted rootfs and use the repository's bounded runner.
          Do not treat this runtime bundle as scientific validation or model-use
          authority. Verify SHA256SUMS before use.
          EOF

          (cd "$OUT" && sha256sum rootfs.tar.zst manifest.json offline-probe.sh README.txt > SHA256SUMS)
          du -h "$OUT/rootfs.tar.zst"

      - name: Upload offline runtime bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oq313-offline-linux-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/oq313-offline-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Report artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          printf 'artifact_id=%s\nartifact_digest=%s\nartifact_url=%s\n' \
            "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "$ARTIFACT_URL"
