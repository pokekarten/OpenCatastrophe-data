name: ESRM20 Scenario v1.0 Greece Rupture Profile Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-scenario-v10-greece-rupture-profile-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main rupture diagnostic request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-scenario-v10-greece-rupture-profile-diagnostic-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main and fixed rupture identity
        id: fence
        env:
          OC_GREECE_RUPTURE_DIAGNOSTIC_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_scenario_v10_greece_rupture_profile_diagnostic_action.py \
            --comment-body-env OC_GREECE_RUPTURE_DIAGNOSTIC_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-diagnostic:
    name: Classify only the fixed rupture profiler boundary
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up execution Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_scenario_v10_greece_rupture_profile_diagnostic_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Run fixed diagnostic in memory
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_GREECE_RUPTURE_DIAGNOSTIC_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/greece-rupture-profile-diagnostic-result.json
        run: |
          set -euo pipefail
          python scripts/run_esrm20_scenario_v10_greece_rupture_profile_diagnostic_action.py \
            --comment-body-env OC_GREECE_RUPTURE_DIAGNOSTIC_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_scenario_v10_greece_rupture_profile_diagnostic_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("Greece rupture diagnostic execution identity drifted")
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/greece-rupture-profile-diagnostic-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 5900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-diagnostic:
    name: Publish bounded rupture profiler diagnostic
    needs: [validate-request, execute-diagnostic]
    if: >-
      needs.execute-diagnostic.result == 'success' &&
      needs.execute-diagnostic.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence closed result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-diagnostic.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-scenario-v10-greece-rupture-profile-diagnostic-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            keys == [
              "action",
              "byte_identity_verified",
              "dataset_id",
              "event_location_inference_authorized",
              "execution_sha",
              "external_bytes_persisted",
              "failure_code",
              "failure_stage",
              "holdout_status_established",
              "independent_validation_established",
              "model_use_authorized",
              "output_payload_bytes_read",
              "provider_file_bytes_read",
              "provider_file_content_profiled",
              "publication_authorized",
              "rupture_identity",
              "scenario_selection_authorized",
              "schema_version",
              "source_issue",
              "status",
              "target_sha"
            ] and
            .schema_version == "oc-esrm20-scenario-v10-greece-rupture-profile-diagnostic-result-v1" and
            .action == "esrm20_scenario_v10_greece_rupture_profile_diagnostic" and
            .source_issue == 285 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .rupture_identity == {
              "commit_sha":"041f90d950d6ff84180b2faa11319a42c66c74cc",
              "event_id":"Greece_07-9-1999",
              "git_blob_sha1":"fa3bfd7aedfb63869c5808785b0ca712b6e45859",
              "project_id":273,
              "project_path":"efehr/esrm20_scenario_tests",
              "receipt_byte_count":666,
              "receipt_sha256":"bb2715a8ca2233dd27a77dbccf789ab023b742048805ce53df6dd2532a1b073b",
              "release_tag":"v1.0",
              "repository_path":"ruptures/source_models/rupture_Greece_07-9-1999.xml",
              "role":"rupture_definition"
            } and
            .output_payload_bytes_read == false and
            .external_bytes_persisted == false and
            .event_location_inference_authorized == false and
            .scenario_selection_authorized == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (
              if .status == "pass" then
                .failure_stage == null and
                .failure_code == null and
                .provider_file_bytes_read == true and
                .provider_file_content_profiled == true and
                .byte_identity_verified == true
              elif .status == "blocked" then
                .provider_file_content_profiled == false and
                (
                  (.failure_stage == "acquisition" and
                   .failure_code == "acquisition_failed" and
                   .provider_file_bytes_read == false and
                   .byte_identity_verified == false)
                  or
                  (.failure_stage == "byte_identity" and
                   .failure_code == "byte_identity_mismatch" and
                   .provider_file_bytes_read == true and
                   .byte_identity_verified == false)
                  or
                  (.failure_stage == "profile" and
                   .provider_file_bytes_read == true and
                   .byte_identity_verified == true and
                   (.failure_code as $code | [
                     "authority_byte_count_drift",
                     "authority_max_depth_drift",
                     "authority_max_elements_drift",
                     "authority_nrml_namespace_drift",
                     "authority_rupture_elements_drift",
                     "authority_sha256_drift",
                     "dtd_or_entity_forbidden",
                     "foreign_rupture_namespace",
                     "foreign_xml_namespace",
                     "invalid_utf8_xml",
                     "invalid_xml",
                     "malformed_expanded_xml_name",
                     "non_text_xml_tag",
                     "non_utf8_xml_encoding",
                     "profiler_byte_count_mismatch",
                     "profiler_sha256_mismatch",
                     "rupture_top_level_cardinality",
                     "unclassified_profile_rejection",
                     "unexpected_nrml_root",
                     "unsafe_xml_local_name",
                     "unsupported_rupture_element",
                     "xml_depth_limit_exceeded",
                     "xml_element_limit_exceeded",
                     "xml_encoding_declaration_mismatch"
                   ] | index($code) != null))
                )
              else
                false
              end
            )
          ' >/dev/null

          BODY="$(printf '%s\n%s' "$RESULT_MARKER" "$RESULT_JSON")"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/285/comments" \
            -f body="$BODY" \
            >/dev/null
