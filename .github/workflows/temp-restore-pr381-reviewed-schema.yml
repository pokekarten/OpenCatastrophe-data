name: Temporary PR381 reviewed schema restore

on:
  push:
    branches:
      - agent/376-gsim-resource-profile-action

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Restore exact reviewed canonical schema and EOF newline
        run: |
          git fetch --no-tags --depth=1 origin 72e88c30c310b9dd463758a064ee0b52d47ea5d7
          git show 72e88c30c310b9dd463758a064ee0b52d47ea5d7:schemas/agent-action-result-v1.schema.json > /tmp/reviewed-result-schema.json
          test "$(git hash-object /tmp/reviewed-result-schema.json)" = "787da8cf3479b27db282299ee20bde97e5964819"
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/reviewed-result-schema.json').read_bytes()
          desired = source if source.endswith(b'\n') else source + b'\n'
          path = Path('schemas/agent-action-result-v1.schema.json')
          path.write_bytes(desired)
          if path.read_bytes() != desired:
              raise SystemExit('reviewed schema restoration was not byte exact')
          PY
      - name: Regenerate projection from restored canonical schema
        run: python scripts/schema_reference.py --write
      - name: Run repository definition of done
        run: python scripts/check_all.py
      - name: Remove temporary workflow and verify bounded write scope
        run: |
          git rm .github/workflows/temp-restore-pr381-reviewed-schema.yml
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/temp-restore-pr381-reviewed-schema.yml',
              'schemas/agent-action-result-v1.schema.json',
              'schemas/agent-action-result-v1.schema.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if '.github/workflows/temp-restore-pr381-reviewed-schema.yml' not in changed:
              raise SystemExit('temporary workflow deletion missing from diff')
          if not changed <= allowed:
              raise SystemExit(f'unexpected changed paths: {sorted(changed - allowed)}')
          PY
          git diff --check
      - name: Commit bounded restoration
        run: |
          git config user.name 'OpenCatastrophe repair bot'
          git config user.email '287434260+pokekarten@users.noreply.github.com'
          git add schemas/agent-action-result-v1.schema.json schemas/agent-action-result-v1.schema.md .github/workflows/temp-restore-pr381-reviewed-schema.yml
          git commit -m 'Restore reviewed PR381 result schema contract'
          git push origin HEAD:agent/376-gsim-resource-profile-action
