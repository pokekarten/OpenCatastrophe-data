name: ESRM20 Hazard Logic-Tree Receipts

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-hazard-logic-tree-receipts-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main hazard receipt request
    if: >-
      github.event.issue.number == 476 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-hazard-logic-tree-receipts-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main
        id: fence
        env:
          OC_HAZARD_RECEIPT_REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_hazard_logic_tree_receipts_action.py \
            --comment-body-env OC_HAZARD_RECEIPT_REQUEST_BODY \
            --expected-issue 476 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-receipts:
    name: Execute two bounded hazard receipts
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.result.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove complete issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_hazard_logic_tree_receipts_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Run exact fixed hazard receipt workers
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_HAZARD_RECEIPT_REQUEST_BODY: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/hazard-logic-tree-receipts.json
        run: |
          set -euo pipefail
          python scripts/run_esrm20_hazard_logic_tree_receipts_action.py \
            --comment-body-env OC_HAZARD_RECEIPT_REQUEST_BODY \
            --expected-issue 476 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_hazard_logic_tree_receipts_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          sha = os.environ["EXECUTION_SHA"]
          base = subject._base_result(execution_sha=sha)
          for field, expected in base.items():
              observed = result.get(field)
              if type(observed) is not type(expected) or observed != expected:
                  raise SystemExit(f"result drifted at {field}")
          if result.get("status") == "pass":
              rows = result.get("receipts")
              if not isinstance(rows, list) or len(rows) != 2:
                  raise SystemExit("PASS lacks exactly two receipt rows")
          elif result.get("status") == "blocked":
              if result.get("failure_class") != "acquisition_failure" or result.get("receipts") is not None:
                  raise SystemExit("blocked result is not atomic")
          else:
              raise SystemExit("result has non-terminal status")
          PY

      - name: Export bounded result to publisher
        if: steps.dedup.outputs.skip != 'true'
        id: result
        env:
          RESULT_PATH: ${{ runner.temp }}/hazard-logic-tree-receipts.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-receipts:
    name: Publish bounded hazard receipt evidence
    needs: [validate-request, execute-receipts]
    if: >-
      needs.execute-receipts.result == 'success' &&
      needs.execute-receipts.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence result and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-receipts.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-hazard-logic-tree-receipts-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-hazard-logic-tree-receipts-result-v1" and
            .action == "esrm20_hazard_logic_tree_receipts" and
            .source_issue == 476 and
            .source_science_issue == 281 and
            .dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
            .target_sha == $sha and
            .execution_sha == $sha and
            .provider_identity.project_id == 269 and
            .provider_identity.project_path == "efehr/esrm20" and
            .provider_identity.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
            (.status == "pass" or (.status == "blocked" and .failure_class == "acquisition_failure" and .receipts == null)) and
            .dependency_content_interpreted == false and
            .transitive_dependency_closure_verified == false and
            .runtime_compatibility_verified == false and
            .model_use_authorized == false and
            .external_bytes_persisted == false and
            .publication_authorized == false
          ' >/dev/null

          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/hazard-receipts-comment.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/476/comments" \
            --input "$RUNNER_TEMP/hazard-receipts-comment.json"
