name: EuroCrops DE4 original bounded one-shot QC

# Source-only opt-in execution. The research branch's earlier original
# runs are durable GitHub run evidence; future downloads must be manual.
# GitHub exposes workflow_dispatch only after this workflow is on default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jrc-de4-original-qc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-qc:
    name: Actual JRC DE4 2023 original metadata, area and crop-code QC
    if: github.repository == 'pokekarten/OpenCatastrophe-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout audited research code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install bounded original Parquet inspection wheels
        run: >-
          python -m pip install --disable-pip-version-check --no-input
          --only-binary=:all: pyarrow==21.0.0 shapely==2.2.0
      - name: Offline fail-closed original source regression tests first
        run: >-
          python -m unittest
          tests.test_eurocrops_jrc_acquire_v0
          tests.test_eurocrops_jrc_original_run_v0
          tests.test_eurocrops_original_zero_area_geometry_v0
          tests.test_eurocrops_original_full_geometry_code_qc_v0
          tests.test_eurocrops_v202_preflight_v0
          tests.test_eurocrops_codebook_qc_v0
          -v
      - name: Download EXACT original corrected JRC file, outside checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oc-eurocrops-de4-2023-original"
          python research_runners/eurocrops_jrc_acquire_v0.py \
            --live --destination-dir "${RUNNER_TEMP}/oc-eurocrops-de4-2023-original" \
            > "${RUNNER_TEMP}/oc-de4-first-seen-receipt.json"
      - name: Verify original footer; scan full area attribute and sampled geometry
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "oc-de4-first-seen-receipt.json").read_text())["original_sha256"])')
          # Compare to an INDEPENDENT full-file first-seen download from
          # completed prior run 42114631274. Still NOT publisher-signed.
          if [[ "$EXPECTED_SHA" != "4fc38f688a117db6cd0821c7aafc71fbbd2e7a493044c51266ae289929d7b2b6" ]]; then
            echo "BLOCKED: original JRC full-file bytes changed since prior first-seen receipt" >&2
            exit 2
          fi
          python -m research_runners.eurocrops_jrc_original_run_v0 \
            --live \
            --original "${RUNNER_TEMP}/oc-eurocrops-de4-2023-original/de4_2023.parquet" \
            --original-sha256 "$EXPECTED_SHA" \
            --output "${RUNNER_TEMP}/oc-de4-aggregate-qc.json" \
            --sample-rows 1024
      - name: Classify 65 exact original zero-area records via transient WKB
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "oc-de4-first-seen-receipt.json").read_text())["original_sha256"])')
          python -m research_runners.eurocrops_original_zero_area_geometry_v0 \
            --live \
            --original "${RUNNER_TEMP}/oc-eurocrops-de4-2023-original/de4_2023.parquet" \
            --expected-sha256 "$EXPECTED_SHA" \
            --output "${RUNNER_TEMP}/oc-de4-zero-area-geometry-qc.json"
      - name: Audit ALL original WKB geometries, source IDs and regional HCAT4 codes
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "oc-de4-first-seen-receipt.json").read_text())["original_sha256"])')
          python -m research_runners.eurocrops_original_full_geometry_code_qc_v0 \
            --live \
            --original "${RUNNER_TEMP}/oc-eurocrops-de4-2023-original/de4_2023.parquet" \
            --expected-sha256 "$EXPECTED_SHA" \
            --output "${RUNNER_TEMP}/oc-de4-full-wkb-code-qc.json"
      - name: Print aggregate-only original-source summary
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "oc-de4-aggregate-qc.json").read_text())
          scan = report["complete_area_ha_attribute_quality"]
          sample = report["sample_taxonomy_crosswalk_statistics"]
          zero_shapes = json.loads((Path(os.environ["RUNNER_TEMP"]) / "oc-de4-zero-area-geometry-qc.json").read_text())
          full = json.loads((Path(os.environ["RUNNER_TEMP"]) / "oc-de4-full-wkb-code-qc.json").read_text())
          full_stats = full["full_original_geometry_and_code_quality"]
          lines = [
              "## JRC DE4 2023 — research-only original-source QC",
              f"Original footer row count: {report['parquet_total_rows']}",
              f"Full original area column rows: {scan['original_area_rows_scanned']}",
              f"Original zero-area values: {scan['original_area_ha_zero_count']}",
              f"Zero-area source records with VALID positive-size polygons: {zero_shapes['zero_ha_polygon_computed_area_positive_m2']}",
              f"Zero-area source records with ZERO geometric polygon area: {zero_shapes['zero_ha_polygon_computed_area_zero_m2']}",
              f"Zero-area source records with invalid/empty/nonpolygon/missing WKB: {zero_shapes['zero_ha_geometry_invalid_topology'] + zero_shapes['zero_ha_geometry_empty'] + zero_shapes['zero_ha_geometry_nonpolygon'] + zero_shapes['zero_ha_wkb_invalid_or_missing']}",
              f"Original negative-area values: {scan['original_area_ha_negative_count']}",
              f"Valid positive WKB polygon rows in FULL file: {full_stats['geometry_valid_positive_polygon_rows']}",
              f"Invalid original polygon topologies (full scan): {full_stats['geometry_invalid_topology_rows']}",
              f"Unparseable or absent WKB (full scan): {full_stats['wkb_missing_or_unreadable_rows']}",
              f"Duplicate subsequent cropfield IDs (full scan): {full_stats['source_cropfield_duplicate_subsequent_rows']}",
              f"Complete source code-to-HCAT4 resolved rows: {full_stats['source_code_mapping_resolved_to_hcat4_rows']}",
              f"Complete source code-to-HCAT4 hierarchy-gap rows: {full_stats['source_code_mapping_to_absent_hcat4_rows']}",
              f"Geometry/source area disagreement >5%: {full_stats['valid_positive_polygon_area_delta_gt_5pct_rows']}",
              f"Original null/nonfinite areas: {scan['original_area_ha_null_count']}/{scan['original_area_ha_nonfinite_count']}",
              f"WKB sample rows: {report['sampled_wkb_rows']}",
              f"Crop taxonomy resolved in sample: {sample['resolved_to_hcat4_rows']}",
              f"First-seen full-file SHA256 (NOT publisher signed): {report['identity']['first_seen_full_original_sha256']}",
              "NO original source bytes uploaded; NOT_ADMITTED for CAT modelling.",
          ]
          summary = "\n\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          print(summary)
          PY
      - name: Delete the original file from ephemeral runner
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/oc-eurocrops-de4-2023-original"
