name: norauto pre-post provenance comparison

on:
  pull_request:
    paths:
      - 'research_runners/norauto_prepost_provenance_compare.py'
      - '.github/workflows/norauto-prepost-provenance.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.3 pandas==2.3.2 pyreadr==0.5.3
      - run: python research_runners/norauto_prepost_provenance_compare.py
