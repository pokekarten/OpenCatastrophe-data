name: Luxembourg 2025 solar WMS roof-facet metadata probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/luxembourg-solar-2025-wms-capabilities.yml'
      - 'research_runners/lu_solar_wms_capabilities_v0.py'
      - 'tests/test_lu_solar_wms_capabilities_v0.py'

permissions:
  contents: read

jobs:
  original-roof-wms-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run synthetic WMS capabilities and metadata safety tests
        run: python -m unittest -v tests.test_lu_solar_wms_capabilities_v0
      - name: Inspect published 2025 WMS endpoint without feature requests or credentials
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/lu-wms-caps"
          mkdir "$work"
          trap 'rm -rf "$work"' EXIT
          umask 077
          # Exact WMS endpoint documented in tetraeder.solar September 2025 PDF.
          # Fetch ONLY global service capabilities, never GetMap or GetFeatureInfo.
          # No login, no cookies, no address or individual roof query.
          set +e
          code="$(curl --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 12 --max-time 50 --retry 0 \
            --max-filesize 2000000 --output "$work/capabilities.xml" \
            --write-out '%{http_code}' \
            'https://mapproxy.tetraeder.solar/st_luxemburg_25/service?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0')"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "BLOCKED: public metadata acquisition failed (curl exit $rc, HTTP $code)."
            echo "No credentials requested and no feature records accessed."
            exit 0
          fi
          if [ "$code" != '200' ]; then
            echo "BLOCKED: official 2025 WMS public GetCapabilities returned HTTP $code."
            echo "WMS access might require a provider-authorised account."
            exit 0
          fi
          python -m research_runners.lu_solar_wms_capabilities_v0 \
            --capabilities "$work/capabilities.xml"
          # Any valid report is still metadata only; no downstream model approval.
