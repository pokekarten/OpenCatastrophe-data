name: P-COLD v3 source lock

on:
  push:
    branches:
      - research-run/pcold-v3-source-lock-20260908-sol56
    paths:
      - .github/workflows/pcold-v3-source-lock.yml

permissions:
  contents: write

jobs:
  source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source-lock dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 python-dateutil==2.9.0.post0
      - name: Resolve exact Figshare v3 and lock English workbook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          import openpyxl
          from dateutil import parser as dateparser

          ARTICLE_ID = 23940069
          VERSION = 3
          EXPECTED_NAME = 'P-COLD-English ver.xlsx'
          API = f'https://api.figshare.com/v2/articles/{ARTICLE_ID}/versions/{VERSION}'
          DOI = '10.6084/m9.figshare.23940069.v3'

          req = urllib.request.Request(API, headers={'User-Agent': 'OpenCatastrophe-data research source lock'})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw_meta = r.read()
          meta = json.loads(raw_meta)

          version = meta.get('version')
          if version != VERSION:
              raise SystemExit(f'FAIL_CLOSED version mismatch: {version!r}')
          doi = meta.get('doi')
          if doi and doi.lower() != DOI.lower():
              raise SystemExit(f'FAIL_CLOSED DOI mismatch: {doi!r}')

          files = meta.get('files') or []
          matches = [f for f in files if f.get('name') == EXPECTED_NAME]
          if len(matches) != 1:
              names = [f.get('name') for f in files]
              raise SystemExit(f'FAIL_CLOSED exact English workbook match count={len(matches)} names={names!r}')
          f = matches[0]
          url = f.get('download_url')
          if not url:
              raise SystemExit('FAIL_CLOSED missing download_url')

          outdir = Path('tmp/pcold-v3-source-lock')
          outdir.mkdir(parents=True, exist_ok=True)
          workbook_path = outdir / EXPECTED_NAME
          req = urllib.request.Request(url, headers={'User-Agent': 'OpenCatastrophe-data research source lock'})
          with urllib.request.urlopen(req, timeout=120) as r:
              data = r.read()
          workbook_path.write_bytes(data)
          sha256 = hashlib.sha256(data).hexdigest()
          if f.get('size') is not None and int(f['size']) != len(data):
              raise SystemExit(f"FAIL_CLOSED byte size mismatch metadata={f['size']} actual={len(data)}")

          wb = openpyxl.load_workbook(workbook_path, read_only=True, data_only=True)
          sheet_receipts = []

          def parse_date(v):
              if v is None or v == '':
                  return None
              if isinstance(v, dt.datetime):
                  return v.date()
              if isinstance(v, dt.date):
                  return v
              if isinstance(v, str):
                  s = v.strip()
                  if not s:
                      return None
                  try:
                      return dateparser.parse(s, dayfirst=False, yearfirst=False, fuzzy=False).date()
                  except Exception:
                      return None
              return None

          for ws in wb.worksheets:
              rows = ws.iter_rows(values_only=True)
              try:
                  first = next(rows)
              except StopIteration:
                  sheet_receipts.append({'sheet': ws.title, 'headers': [], 'data_rows': 0, 'date_candidates': []})
                  continue
              headers = ['' if x is None else str(x).strip() for x in first]
              candidate_idx = []
              for i, h in enumerate(headers):
                  hl = h.lower()
                  if any(k in hl for k in ('date', 'time', 'occurr', 'start')):
                      candidate_idx.append(i)
              mins = {i: None for i in candidate_idx}
              maxs = {i: None for i in candidate_idx}
              parsed = {i: 0 for i in candidate_idx}
              nonblank = {i: 0 for i in candidate_idx}
              nrows = 0
              for row in rows:
                  nrows += 1
                  for i in candidate_idx:
                      v = row[i] if i < len(row) else None
                      if v not in (None, ''):
                          nonblank[i] += 1
                      d = parse_date(v)
                      if d is not None:
                          parsed[i] += 1
                          mins[i] = d if mins[i] is None or d < mins[i] else mins[i]
                          maxs[i] = d if maxs[i] is None or d > maxs[i] else maxs[i]
              date_candidates = []
              for i in candidate_idx:
                  date_candidates.append({
                      'column_index_1based': i + 1,
                      'header': headers[i],
                      'nonblank': nonblank[i],
                      'parsed': parsed[i],
                      'min_date': None if mins[i] is None else mins[i].isoformat(),
                      'max_date': None if maxs[i] is None else maxs[i].isoformat(),
                  })
              sheet_receipts.append({
                  'sheet': ws.title,
                  'headers': headers,
                  'data_rows': nrows,
                  'date_candidates': date_candidates,
              })

          receipt = {
              'schema': 'pcold-figshare-v3-source-lock-v0',
              'status': 'SOURCE_LOCKED_NO_TARGET_COUNTS_SCORED',
              'ffbk_preregistration_pr': 1462,
              'figshare': {
                  'article_id': ARTICLE_ID,
                  'version': VERSION,
                  'version_api_url': API,
                  'doi_expected': DOI,
                  'doi_metadata': doi,
                  'figshare_url': meta.get('figshare_url'),
                  'title': meta.get('title'),
                  'published_date': meta.get('published_date'),
                  'modified_date': meta.get('modified_date'),
              },
              'english_workbook': {
                  'file_id': f.get('id'),
                  'filename': f.get('name'),
                  'metadata_size_bytes': f.get('size'),
                  'downloaded_size_bytes': len(data),
                  'sha256': sha256,
              },
              'workbook': {
                  'sheets': sheet_receipts,
                  'date_parsing_convention': 'openpyxl native date/datetime; otherwise python-dateutil parser with dayfirst=False, yearfirst=False, fuzzy=False',
              },
              'firewall': {
                  'monthly_counts_computed': False,
                  'annual_counts_computed': False,
                  'validation_or_final_scores_computed': False,
                  'dispersion_statistics_computed': False,
              },
              'execution': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'workflow': os.environ.get('GITHUB_WORKFLOW'),
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'head_sha': os.environ.get('GITHUB_SHA'),
              },
          }
          target = Path('research-results/pcold-v3-source-lock-v0.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Commit durable source-lock receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-results/pcold-v3-source-lock-v0.json
          git commit -m 'Research: record exact P-COLD Figshare v3 source lock'
          git push origin HEAD:${GITHUB_REF_NAME}
