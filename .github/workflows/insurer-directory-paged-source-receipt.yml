name: Insurer directory original page receipt

on:
  pull_request:
    paths:
      - '.github/workflows/insurer-directory-paged-source-receipt.yml'
      - 'scripts/insurer_directory_paged_source_receipt_v0.py'
      - 'scripts/insurer_directory_source_receipt_v0.py'
      - 'tests/test_insurer_directory_paged_source_receipt_v0.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-pages:
    name: 46-page metadata-only original source receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source audit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Synthetic offline fail-closed page contract tests
        run: python -m unittest tests.test_insurer_directory_paged_source_receipt_v0 -v
      - name: Explicit live original provider receipt (diagnostic, not model admission)
        if: github.event_name == 'workflow_dispatch'
        id: provider
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # 46 exact public HTTPS page reads; never save source rows as artifacts.
          # Only metadata and source page SHA-256 are written to a temporary
          # JSON receipt. The provider can change or become unavailable, so
          # transient network failures are not a deterministic CI gate.
          receipt="$RUNNER_TEMP/insurer-directory-page-receipt.json"
          trap 'rm -f "$receipt"' EXIT
          python -m scripts.insurer_directory_paged_source_receipt_v0 --live > "$receipt"
          python - "$receipt" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt=json.loads(Path(sys.argv[1]).read_text())
          if receipt["total_source_rows"] != 18180 or receipt["page_count"] != 46:
              raise SystemExit("BLOCKED: original source pages not complete")
          if receipt["unique_source_slugs"] != 18180 or receipt["model_input_approved"]:
              raise SystemExit("BLOCKED: original source identities or admissions differ")
          import re
          original_digest = receipt["canonical_field_digest_sha256"]
          if not re.fullmatch(r"[0-9a-f]{64}", original_digest):
              raise SystemExit("BLOCKED: invalid original field digest")
          print("CANONICAL_SOURCE_FIELD_SHA256=" + original_digest)
          for p in receipt["pages"]:
              print(f"PAGE {p['page']:02d} rows={p['row_count']} bytes={p['raw_page_bytes']} sha256={p['raw_page_sha256']}")
          summary = (
              "PASS: original pages 46/46; original source rows 18180; "
              "unique source slugs 18180; provider page SHA-256 listed in job log. "
              "Original aggregate SHA unavailable. No DB writes; not model-approved. "
              "Original canonical five-field digest: " + original_digest + "."
          )
          print(summary)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")
          PY
