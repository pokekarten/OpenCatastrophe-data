name: Luxembourg GeoBase official original building digitization-source lineage

on:
  pull_request:
    paths:
      - 'research_runners/lu_geobase_source_origin_two_site_v0.py'
      - 'tests/test_lu_geobase_source_origin_two_site_v0.py'
      - '.github/workflows/luxembourg-geobase-source-origin-two-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-two-site-source-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Offline original-code classifier tests without optional GIS libraries
        run: python -m unittest discover -s tests -p 'test_lu_geobase_source_origin_two_site_v0.py' -v
      - name: Install pinned GIS packages for original source validation
        run: python -m pip install --disable-pip-version-check 'pyproj==3.7.2' 'shapely==2.1.2'
      - name: Check entire original GeoBase source then print only source-category aggregates
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_zip="$RUNNER_TEMP/lu-geobase-buildings-20261001.zip"
          trap 'rm -f "$source_zip"' EXIT
          curl --fail --location --silent --show-error --retry 0 \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --max-filesize 83886080 \
            -o "$source_zip" \
            'https://download.data.public.lu/resources/bd-l-geobase/20261001-010523/buildings-20261001.zip'
          python -m research_runners.lu_geobase_source_origin_two_site_v0 \
            --geobase-zip "$source_zip"
          # No original building/source row, geometry, ID, address or match is published.
