name: ESRM20 Scenario v1.0 Greece ShakeMap Profile Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-scenario-v10-greece-shakemap-profile-diagnostic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate trusted-main ShakeMap diagnostic request
    if: >-
      github.event.issue.number == 285 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-scenario-v10-greece-shakemap-profile-diagnostic-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      execution_sha: ${{ steps.fence.outputs.execution_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Bind request to trusted main and fixed ShakeMap receipts
        id: fence
        env:
          OC_GREECE_SHAKEMAP_DIAGNOSTIC_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_scenario_v10_greece_shakemap_profile_diagnostic_action.py \
            --comment-body-env OC_GREECE_SHAKEMAP_DIAGNOSTIC_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --validate-request-only
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"

  execute-diagnostic:
    name: Classify only the fixed ShakeMap profiler boundary
    needs: [validate-request]
    if: needs.validate-request.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.dedup.outputs.skip }}
      result_json: ${{ steps.export.outputs.result_json }}
    steps:
      - name: Checkout exact trusted execution commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up execution Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Prove issue-local dedup before provider access
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts import run_esrm20_scenario_v10_greece_shakemap_profile_diagnostic_action as subject

          skip = subject.has_terminal_result(
              repository=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GH_TOKEN"],
              execution_sha=os.environ["EXECUTION_SHA"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"skip={'true' if skip else 'false'}\n")
          PY

      - name: Run fixed diagnostic in memory
        if: steps.dedup.outputs.skip != 'true'
        env:
          OC_GREECE_SHAKEMAP_DIAGNOSTIC_REQUEST: ${{ github.event.comment.body }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_PATH: ${{ runner.temp }}/greece-shakemap-profile-diagnostic-result.json
        run: |
          set -euo pipefail
          python scripts/run_esrm20_scenario_v10_greece_shakemap_profile_diagnostic_action.py \
            --comment-body-env OC_GREECE_SHAKEMAP_DIAGNOSTIC_REQUEST \
            --expected-issue 285 \
            --execution-sha "$EXECUTION_SHA" \
            --output "$RESULT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import run_esrm20_scenario_v10_greece_shakemap_profile_diagnostic_action as subject

          result = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          if subject._validate_terminal_result(result) != os.environ["EXECUTION_SHA"]:
              raise SystemExit("ShakeMap diagnostic execution identity drifted")
          PY

      - name: Export bounded diagnostic result
        if: steps.dedup.outputs.skip != 'true'
        id: export
        env:
          RESULT_PATH: ${{ runner.temp }}/greece-shakemap-profile-diagnostic-result.json
        run: |
          set -euo pipefail
          RESULT_JSON="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path(os.environ["RESULT_PATH"]).read_text(encoding="utf-8"))
          print(json.dumps(value, sort_keys=True, separators=(",", ":")))
          PY
          )"
          test -n "$RESULT_JSON"
          test "$(printf '%s' "$RESULT_JSON" | wc -c)" -le 6900
          echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"

  publish-diagnostic:
    name: Publish bounded ShakeMap profiler diagnostic
    needs: [validate-request, execute-diagnostic]
    if: >-
      needs.execute-diagnostic.result == 'success' &&
      needs.execute-diagnostic.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence closed result and publish without checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.validate-request.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-diagnostic.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-scenario-v10-greece-shakemap-profile-diagnostic-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            keys == [
              "action",
              "byte_identity_verified",
              "dataset_id",
              "event_location_inference_authorized",
              "execution_sha",
              "external_bytes_persisted",
              "failure_code",
              "failure_stage",
              "holdout_status_established",
              "independent_validation_established",
              "model_use_authorized",
              "output_payload_bytes_read",
              "provider_file_bytes_read",
              "provider_file_content_profiled",
              "publication_authorized",
              "scenario_selection_authorized",
              "schema_version",
              "shakemap_identity",
              "source_issue",
              "status",
              "target_sha"
            ] and
            .schema_version == "oc-esrm20-scenario-v10-greece-shakemap-profile-diagnostic-result-v1" and
            .action == "esrm20_scenario_v10_greece_shakemap_profile_diagnostic" and
            .source_issue == 285 and
            .dataset_id == "efehr.esrm20.scenario-tests.v1.0" and
            .target_sha == $sha and .execution_sha == $sha and
            .shakemap_identity.project_id == 273 and
            .shakemap_identity.project_path == "efehr/esrm20_scenario_tests" and
            .shakemap_identity.release_tag == "v1.0" and
            .shakemap_identity.commit_sha == "041f90d950d6ff84180b2faa11319a42c66c74cc" and
            .shakemap_identity.event_id == "Greece_07-9-1999" and
            .shakemap_identity.grid.repository_path == "shakemaps/shakemaps_USGS/Greece_07-9-1999/grid.xml" and
            .shakemap_identity.grid.git_blob_sha1 == "21e323dec41b8efb012b2595145fded5fb35fd3a" and
            .shakemap_identity.grid.receipt_byte_count == 5290966 and
            .shakemap_identity.grid.receipt_sha256 == "3c2fe7a2a7182fac999442ce3d88ddfd99004b7f999462ef2327f2eebc1ccd9f" and
            .shakemap_identity.uncertainty.repository_path == "shakemaps/shakemaps_USGS/Greece_07-9-1999/uncertainty.xml" and
            .shakemap_identity.uncertainty.git_blob_sha1 == "30d5635260a83cd0ac91ee559d0109ff126a7b57" and
            .shakemap_identity.uncertainty.receipt_byte_count == 5340320 and
            .shakemap_identity.uncertainty.receipt_sha256 == "eb08df5ff78f265fb45bf31dbd3dddf4f01bf10632382d4156a2bdf016e46417" and
            .output_payload_bytes_read == false and
            .external_bytes_persisted == false and
            .event_location_inference_authorized == false and
            .scenario_selection_authorized == false and
            .independent_validation_established == false and
            .holdout_status_established == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
               .failure_stage == null and .failure_code == null and
               .provider_file_bytes_read == true and
               .provider_file_content_profiled == true and
               .byte_identity_verified == true
             elif .status == "blocked" then
               .provider_file_content_profiled == false and
               (if .failure_stage == "acquisition" then
                  .failure_code == "acquisition_failed" and
                  (.provider_file_bytes_read | type) == "boolean" and
                  .byte_identity_verified == false
                elif .failure_stage == "byte_identity" then
                  .failure_code == "byte_identity_mismatch" and
                  .provider_file_bytes_read == true and
                  .byte_identity_verified == false
                elif .failure_stage == "profile" then
                  .provider_file_bytes_read == true and
                  .byte_identity_verified == true and
                  (.failure_code as $code | [
                    "authority_event_id_drift",
                    "authority_grid_byte_count_drift",
                    "authority_grid_sha256_drift",
                    "authority_max_columns_drift",
                    "authority_max_fields_drift",
                    "authority_max_rows_drift",
                    "authority_max_xml_bytes_drift",
                    "authority_uncertainty_byte_count_drift",
                    "authority_uncertainty_sha256_drift",
                    "coordinate_fields_not_first",
                    "coordinate_grid_mismatch",
                    "dtd_or_entity_forbidden",
                    "duplicate_grid_field_index",
                    "duplicate_grid_field_name",
                    "foreign_xml_namespace",
                    "gapped_grid_field_indexes",
                    "grid_cardinality_limit_exceeded",
                    "grid_column_limit_exceeded",
                    "grid_data_cardinality",
                    "grid_data_must_be_text_only",
                    "grid_field_limit_exceeded",
                    "grid_row_count_exceeded",
                    "grid_row_count_mismatch",
                    "grid_row_count_pair_mismatch",
                    "grid_row_width_mismatch",
                    "grid_specification_cardinality",
                    "grid_specification_mismatch",
                    "insufficient_grid_fields",
                    "invalid_ascii_utf8_xml",
                    "invalid_grid_bounds",
                    "invalid_grid_field_index",
                    "invalid_grid_numeric_token",
                    "invalid_grid_spacing",
                    "invalid_lat_max",
                    "invalid_lat_min",
                    "invalid_lon_max",
                    "invalid_lon_min",
                    "invalid_nlat",
                    "invalid_nlon",
                    "invalid_nominal_lat_spacing",
                    "invalid_nominal_lon_spacing",
                    "invalid_xml",
                    "malformed_expanded_xml_name",
                    "missing_lat_max",
                    "missing_lat_min",
                    "missing_lon_max",
                    "missing_lon_min",
                    "missing_nominal_lat_spacing",
                    "missing_nominal_lon_spacing",
                    "non_ascii_utf8_xml_encoding",
                    "non_finite_grid_numeric_token",
                    "non_finite_lat_max",
                    "non_finite_lat_min",
                    "non_finite_lon_max",
                    "non_finite_lon_min",
                    "non_finite_nominal_lat_spacing",
                    "non_finite_nominal_lon_spacing",
                    "non_text_xml_tag",
                    "profiler_byte_count_mismatch",
                    "profiler_sha256_mismatch",
                    "shakemap_event_id_pair_mismatch",
                    "shakemap_namespace_mismatch",
                    "unclassified_profile_rejection",
                    "unexpected_shakemap_root",
                    "unsafe_code_version",
                    "unsafe_event_id",
                    "unsafe_map_status",
                    "unsafe_shakemap_event_type",
                    "unsafe_shakemap_id",
                    "unsafe_shakemap_originator",
                    "unsafe_shakemap_version",
                    "unsafe_xml_local_name",
                    "unsupported_grid_field_name",
                    "unsupported_grid_field_units",
                    "xml_encoding_declaration_mismatch"
                  ] | index($code) != null)
                else false end)
             else false end)
          ' >/dev/null

          BODY="$(printf '%s\n%s' "$RESULT_MARKER" "$RESULT_JSON")"
          test "$(printf '%s' "$BODY" | wc -c)" -le 7000
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/result-comment.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/285/comments" \
            --input "$RUNNER_TEMP/result-comment.json" >/dev/null
