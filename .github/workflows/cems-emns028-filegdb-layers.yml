name: CEMS EMSN028 original FileGDB layer metadata

on:
  push:
    branches: [main]
    paths:
      - "research_runners/cems_emns028_filegdb_layer_inventory_v0.py"
      - "tests/test_cems_emns028_filegdb_layer_inventory_v0.py"
      - ".github/workflows/cems-emns028-filegdb-layers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-original-archive:
    name: Exact SHA original archive, read-only FileGDB metadata, discard
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install exact FileGDB reader
        run: |
          python -m pip install --disable-pip-version-check --no-input fiona==1.10.1
          python -m pip check
          python -c "import fiona; assert fiona.__version__ == '1.10.1'; assert 'OpenFileGDB' in fiona.supported_drivers"
      - name: Test synthetic GDB extraction and no-model-admission classifier
        run: python -m unittest tests.test_cems_emns028_filegdb_layer_inventory_v0 -v
      - name: Acquire pinned source and inspect FileGDB metadata only
        run: python -m research_runners.cems_emns028_filegdb_layer_inventory_v0 --live
