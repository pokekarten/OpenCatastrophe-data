name: Bavaria original full SHP streamed GHSL source ROI evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research_runners/bvv_oberbayern_full_shp_roi_stream_v0.py"
      - "tests/test_bvv_oberbayern_full_shp_roi_stream_v0.py"
      - ".github/workflows/bvv-original-full-shp-ghsl-roi.yml"
  push:
    branches: [main]
    paths:
      - "research_runners/bvv_oberbayern_full_shp_roi_stream_v0.py"
      - "tests/test_bvv_oberbayern_full_shp_roi_stream_v0.py"
      - ".github/workflows/bvv-original-full-shp-ghsl-roi.yml"
permissions:
  contents: read
concurrency:
  group: bvv-full-shp-ghsl-roi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-roi-structural-proof:
    name: Full original BVV SHP stream and frozen original GHSL 2020 window
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source revision without reusable credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned GEOS and PROJ binary packages
        run: |
          python -m pip install --no-input --disable-pip-version-check --only-binary=:all: "shapely==2.1.2" "pyproj==3.7.2"
      - name: Run offline synthetic full-member stream, shape and ROI negative tests
        run: |
          python -m unittest tests.test_bvv_oberbayern_full_shp_roi_stream_v0 -v
      - name: Read only one complete 166MB original public compressed SHP ZIP member on trusted main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python -m research_runners.bvv_oberbayern_full_shp_roi_stream_v0 --live
