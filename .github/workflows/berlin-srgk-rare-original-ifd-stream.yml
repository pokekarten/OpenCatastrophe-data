name: Berlin rare SRGK ephemeral source TIFF end-IFD verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/berlin_srgk_rare_original_ifd_stream_v0.py
      - tests/test_berlin_srgk_rare_original_ifd_stream_v0.py
      - .github/workflows/berlin-srgk-rare-original-ifd-stream.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-rare-original-ifd-stream.yml

permissions:
  contents: read

jobs:
  original-rare-ifd-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Offline adversarial original ZIP streaming and IFD tests
        run: python -m unittest tests.test_berlin_srgk_rare_original_ifd_stream_v0 -v
      - name: One source locked original rare ZIP to temporary CI storage only
        if: github.event_name != 'pull_request'
        run: |
          python -m research_runners.berlin_srgk_rare_original_ifd_stream_v0 --live
