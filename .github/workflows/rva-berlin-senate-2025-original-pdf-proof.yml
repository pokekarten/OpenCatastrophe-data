name: R+V named Berlin Senate 2025 original PDF provenance proof

on:
  pull_request:
    paths:
      - ".github/workflows/rva-berlin-senate-2025-original-pdf-proof.yml"
      - "research_runners/rva_berlin_senate_original_pdf_source_v0.py"
      - "tests/test_rva_berlin_senate_original_pdf_source_v0.py"
      - "docs/research/rva-berlin-senate-original-2025-pdf-provenance-20261105.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rva-berlin-senate-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-publisher-original-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Offline fake PDF source and provider refusal tests
        run: python -m unittest discover -s tests -p "test_rva_berlin_senate_original_pdf_source_v0.py" -v
      - name: Install original PDF extractor
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils
          pdftotext -v
      - name: Public Senate original PDF bytes and semantic marker checks only
        run: python -m research_runners.rva_berlin_senate_original_pdf_source_v0
