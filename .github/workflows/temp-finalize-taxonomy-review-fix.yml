name: Temporary finalize taxonomy review fix

on:
  push:
    branches:
      - agent/363-taxonomy-action-port

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrate exact current trusted main
        run: |
          git config user.name 'OpenCatastrophe integrator bot'
          git config user.email '287434260+pokekarten@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "bd5792be4d6e1a0a284b912e61ea94786cec025e"
          git merge --no-edit origin/main
      - name: Restore minimal reviewed schema presentation and retain 774-byte fix
        run: |
          git show 67492a755b3d42f603229fdaaeac8c9a24c0c693:schemas/agent-action-request-v1.schema.json > schemas/agent-action-request-v1.schema.json
          git show 67492a755b3d42f603229fdaaeac8c9a24c0c693:schemas/agent-action-result-v1.schema.json > schemas/agent-action-result-v1.schema.json
          python - <<'PY'
          from pathlib import Path
          path = Path('schemas/agent-action-result-v1.schema.json')
          text = path.read_text(encoding='utf-8')
          anchor = '''        "taxonomy_artifact_byte_count": {\n          "type": "integer",\n          "minimum": 1,\n          "maximum": 316789\n        },\n'''
          replacement = anchor.replace('"minimum": 1', '"minimum": 774')
          if text.count(anchor) != 1:
              raise SystemExit('taxonomy byte-count schema anchor not singular in reviewed minimal schema')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python scripts/schema_reference.py --write
      - name: Remove temporary workflow before validation
        run: git rm .github/workflows/temp-finalize-taxonomy-review-fix.yml
      - name: Run focused blocker regression and full final-tree definition of done
        run: |
          python -m unittest tests.test_efehr_kosovo_taxonomy_identity_action_wiring -v
          python scripts/check_all.py
          python scripts/schema_reference.py --check
          git diff --check
          test "$(git status --short | grep -c 'temp-finalize-taxonomy-review-fix' || true)" = "1"
      - name: Commit and publish one bounded review repair
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'Close taxonomy artifact byte-bound review blocker'
          git push origin HEAD:agent/363-taxonomy-action-port
