name: Zensus 2022 official regional workbook receipt

on:
  pull_request:
    paths:
      - ".github/workflows/zensus2022-original-workbook-receipt.yml"
      - "research_runners/zensus_regional_original_receipt_v0.py"
      - "tests/test_zensus_regional_original_receipt_v0.py"
      - "research_runners/zensus_regional_worksheet_schema_v0.py"
      - "tests/test_zensus_regional_worksheet_schema_v0.py"
      - "docs/research/zensus-gdv-2022-2025-insurer-district-bridge-20261103.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zensus-original-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-metadata:
    name: Exact Destatis XLSX original SHA-256 and OOXML worksheet list
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact workflow head without credentials persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run hermetic original-package negative tests
        run: python -m unittest tests.test_zensus_regional_original_receipt_v0 tests.test_zensus_regional_worksheet_schema_v0 -v
      - name: Acquire and audit one exact publisher original in memory
        run: python research_runners/zensus_regional_original_receipt_v0.py --official-live --schema-preview
