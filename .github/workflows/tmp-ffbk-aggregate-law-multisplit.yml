name: tmp-ffbk-aggregate-law-multisplit

on:
  push:
    branches:
      - research/fremtpl2-aggregate-law-20260907
    paths:
      - scripts/tmp_ffbk_fremtpl2_aggregate_law.py
      - scripts/tmp_ffbk_fremtpl2_aggregate_law_multisplit.py
      - .github/workflows/tmp-ffbk-aggregate-law-multisplit.yml

permissions:
  contents: read

jobs:
  run-study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn rdata
      - name: Run freMTPL2 aggregate-law multi-split replication
        run: python scripts/tmp_ffbk_fremtpl2_aggregate_law_multisplit.py
      - name: Upload result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffbk-aggregate-law-multisplit-result
          path: tmp_ffbk_aggregate_law_multisplit_result.json
          if-no-files-found: error
