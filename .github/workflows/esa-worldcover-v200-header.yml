name: ESA WorldCover fixed original TIFF header 4096-byte audit

on:
  pull_request:
    paths:
      - 'access/esa.worldcover.2021.v200.json'
      - 'access/esa.worldcover.2021.v200.md'
      - 'scripts/probe_esa_worldcover_tiff_header_v0.py'
      - 'scripts/inspect_worldcover_tile_table_preflight_v0.py'
      - 'tests/test_worldcover_tile_table_preflight_v0.py'
      - 'scripts/parse_worldcover_geotiff_grid_v0.py'
      - 'tests/test_probe_esa_worldcover_tiff_header_v0.py'
      - '.github/workflows/esa-worldcover-v200-header.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldcover-one-original-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewed-tiff-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed source contract and derived Markdown projection
        run: python scripts/render_public_views.py --check --scope access
      - name: Exercise only synthetic source-header and network security tests
        run: python -m unittest tests.test_probe_esa_worldcover_tiff_header_v0 -v
      - name: Offline synthetic negative tests for reviewed TIFF tile-array pointers
        run: python -m unittest tests.test_worldcover_tile_table_preflight_v0 -v
      - name: Obtain only the reviewed 4096-byte header and preflight source TIFF tile-array metadata
        run: python -m scripts.probe_esa_worldcover_tiff_header_v0 --live --tile-table-preflight
