name: P-COLD INGARCH prequential selftest

on:
  push:
    branches:
      - research-run/pcold-ingarch-prequential-20260908-sol56
    paths:
      - .github/workflows/pcold-ingarch-prequential-selftest.yml
      - research-scripts/pcold_ingarch_prequential.py
      - tests/test_pcold_ingarch_prequential.py

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact scientific runtime
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0 openpyxl==3.1.5
      - name: Compile frozen runner and focused controls
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research-scripts/pcold_ingarch_prequential.py tests/test_pcold_ingarch_prequential.py
          python -m unittest tests.test_pcold_ingarch_prequential -v
