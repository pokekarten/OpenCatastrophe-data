name: Cross-peril Physical Event Evidence Research

on:
  pull_request:
    paths:
      - ".github/workflows/cross-peril-physical-event-evidence.yml"
      - "scripts/reconcile_cat_physical_event_evidence_v0.py"
      - "tests/test_reconcile_cat_physical_event_evidence_v0.py"
      - "scripts/effis_synthetic_point_overlay_v0.py"
      - "scripts/climk_era5_synthetic_native_sample_v0.py"
      - "scripts/inspect_effis_burnt_area_v0.py"
      - "scripts/inspect_climk_winds_era5_v0.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physical-event-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-original-source-bound-handoff:
    name: Reconcile original EFFIS/CLIMK bytes on two synthetic sites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install isolated pinned NetCDF acquisition reader
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-glofas-acquisition.txt
          python -m pip check
      - name: Test independent-event, provenance, and no-financial-claim invariants
        run: python -m unittest tests.test_reconcile_cat_physical_event_evidence_v0 -v
      - name: Generate exact synthetic-only site roster
        run: |
          python -c 'import os,json,pathlib; s={"schema_version":"oc-effis-synthetic-sites-v0","crs":"OGC:CRS84","synthetic_only":True,"sites":[{"site_id":"SYNTH_FIRE_A","longitude":5.958677287830914,"latitude":52.41546239242131},{"site_id":"SYNTH_FIRE_B","longitude":6.02,"latitude":52.47}]}; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"sites.json"; p.write_text(json.dumps(s),encoding="utf-8")'
      - name: Fetch and independently validate both real physical CAT sources
        run: |
          python scripts/reconcile_cat_physical_event_evidence_v0.py --fetch --effis-event-id 646790 --climk-storm-index 0 --sites "$RUNNER_TEMP/sites.json" --output "$RUNNER_TEMP/two-independent-events.json"
          python -c 'import os,json,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"two-independent-events.json"; r=json.loads(p.read_text()); assert r["site_count"]==2 and len(r["events"])==2; assert r["events"][0]["peril"]=="WILDFIRE" and r["events"][1]["peril"]=="WINDSTORM"; assert r["model_admitted"] is False and r["insured_loss_computed"] is False and r["cross_peril_dependency_inferred"] is False; assert r["events"][1]["event_time"]["utc"] is None; print(json.dumps(r,sort_keys=True))'
