name: EUBUCCO LU00 original attribute and geometry lineage correlation

on:
  pull_request:
    paths:
      - 'research_runners/eubucco_lu00_source_coherence_v0.py'
      - 'tests/test_eubucco_lu00_source_coherence_v0.py'
      - '.github/workflows/eubucco-lu00-source-coherence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-original-source-coherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned research-only original Parquet decoder
        run: python -m pip install --disable-pip-version-check --no-input pyarrow==20.0.0
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run all synthetic-only statistical and safety tests
        run: python -m unittest tests.test_eubucco_lu00_source_coherence_v0 -v
      - name: Download only previously seen source file and cross-check labels
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/eubucco-lu00-original.parquet"
          trap 'rm -f "$original"' EXIT
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 0 \
            --max-filesize 115343360 --output "$original" \
            'https://s3.eubucco.com/eubucco/v0.2/buildings/parquet/nuts_id=LU00/LU00.parquet'
          python research_runners/eubucco_lu00_source_coherence_v0.py \
            --original "$original" \
            --sha256 d1e554de9db0b1f747575426ebb950ef96bb8b2956657554b5ff2998a91abe8c
          # Output is aggregate-only. Do not upload/save source file, IDs or geometry.
