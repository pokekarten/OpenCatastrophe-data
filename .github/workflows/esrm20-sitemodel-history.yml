name: ESRM20 Site-Tool History Profile

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: esrm20-sitemodel-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-sitemodel-history:
    name: Execute exact trusted-main site-tool history profile
    if: >-
      github.event.issue.number == 291 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-esrm20-sitemodel-history-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile fixed project-278 history metadata
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_SITEMODEL_HISTORY_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/esrm20-sitemodel-history.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_esrm20_sitemodel_history_action.py \
            --comment-body-env OC_SITEMODEL_HISTORY_REQUEST \
            --expected-issue 291 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-sitemodel-history:
    name: Publish bounded site-tool history metadata
    needs: [execute-sitemodel-history]
    if: >-
      needs.execute-sitemodel-history.result == 'success' &&
      needs.execute-sitemodel-history.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-sitemodel-history.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-sitemodel-history.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-esrm20-sitemodel-history-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            .schema_version == "oc-esrm20-sitemodel-history-result-v1" and
            .source_issue == 291 and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .provider_file_bytes_read == false and
            .external_bytes_persisted == false and
            .exact_kosovo_generator_commit_verified == false and
            .crs_coordinate_semantics_verified == false and
            .missingness_semantics_verified == false and
            .site_model_compatibility_verified == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and .profile != null and
              .profile.schema_version == "oc-esrm20-sitemodel-history-profile-v1" and
              .profile.source_issue == 291 and
              .profile.project_id == 278 and
              .profile.project_path == "efehr/esrm20_sitemodel" and
              .profile.ref_name == "main" and
              .profile.since_utc == "2021-12-06T00:00:00Z" and
              .profile.until_utc == "2021-12-16T23:59:59Z" and
              (.profile.pages_read | type == "number") and
              .profile.pages_read >= 1 and .profile.pages_read <= 10 and
              (.profile.candidate_commit_count | type == "number") and
              .profile.candidate_commit_count >= 1 and .profile.candidate_commit_count <= 1000 and
              (.profile.history_identity_sha256 | test("^[0-9a-f]{64}$")) and
              (.profile.candidate_commits | type == "array") and
              (.profile.candidate_commits | length) == .profile.candidate_commit_count and
              all(.profile.candidate_commits[];
                (keys | sort) == ["commit_sha","committed_at_utc","parent_shas"] and
                (.commit_sha | test("^[0-9a-f]{40}$")) and
                (.committed_at_utc | test("^2021-12-(0[6-9]|1[0-6])T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?Z$")) and
                (.parent_shas | type == "array") and
                (.parent_shas | length) <= 32 and
                all(.parent_shas[]; test("^[0-9a-f]{40}$"))
              ) and
              .profile.provider_file_bytes_read == false and
              .profile.external_bytes_persisted == false and
              .profile.exact_kosovo_generator_commit_verified == false and
              .profile.crs_coordinate_semantics_verified == false and
              .profile.missingness_semantics_verified == false and
              .profile.site_model_compatibility_verified == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false
            else
              .failure_class == "metadata_acquisition_failure" and .profile == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/sitemodel-history-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/291/comments" \
            --input "$RUNNER_TEMP/sitemodel-history-comment.json"
