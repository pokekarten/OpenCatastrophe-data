name: EQ1 Kosovo Spatial Interoperability

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: eq1-kosovo-spatial-interop-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute-spatial-interop:
    name: Execute exact trusted-main Kosovo spatial profile
    if: >-
      github.event.issue.number == 287 &&
      github.event.comment.user.login == github.event.repository.owner.login &&
      github.event.comment.author_association == 'OWNER' &&
      contains(github.event.comment.body, '<!-- oc-eq1-kosovo-spatial-interop-request-v1 -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      execution_sha: ${{ steps.run.outputs.execution_sha }}
      skip: ${{ steps.run.outputs.skip }}
      result_json: ${{ steps.run.outputs.result_json }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate, deduplicate, and profile fixed Kosovo spatial inputs
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          OC_KOSOVO_SPATIAL_REQUEST: ${{ github.event.comment.body }}
          RESULT_PATH: ${{ runner.temp }}/eq1-kosovo-spatial-interop.json
        run: |
          set -euo pipefail
          EXECUTION_SHA="$(git rev-parse HEAD)"
          python scripts/run_eq1_kosovo_spatial_interop_action.py \
            --comment-body-env OC_KOSOVO_SPATIAL_REQUEST \
            --expected-issue 287 \
            --execution-sha "$EXECUTION_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output "$RESULT_PATH"
          STATUS="$(jq -r '.status' "$RESULT_PATH")"
          test "$STATUS" = "pass" -o "$STATUS" = "blocked" -o "$STATUS" = "duplicate"
          echo "execution_sha=$EXECUTION_SHA" >> "$GITHUB_OUTPUT"
          if test "$STATUS" = "duplicate"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result_json=" >> "$GITHUB_OUTPUT"
          else
            RESULT_JSON="$(jq -cS . "$RESULT_PATH")"
            test -n "$RESULT_JSON"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result_json=$RESULT_JSON" >> "$GITHUB_OUTPUT"
          fi

  publish-spatial-interop:
    name: Publish bounded Kosovo spatial evidence
    needs: [execute-spatial-interop]
    if: >-
      needs.execute-spatial-interop.result == 'success' &&
      needs.execute-spatial-interop.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Re-fence and publish without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ needs.execute-spatial-interop.outputs.execution_sha }}
          RESULT_JSON: ${{ needs.execute-spatial-interop.outputs.result_json }}
          RESULT_MARKER: "<!-- oc-eq1-kosovo-spatial-interop-result-v1 -->"
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e --arg sha "$EXECUTION_SHA" '
            . as $root |
            keys == [
              "execution_sha",
              "external_bytes_persisted",
              "failure_class",
              "geographic_cross_source_equivalence_authorized",
              "model_use_authorized",
              "profile",
              "publication_authorized",
              "reprojection_authorized",
              "schema_version",
              "source_crs_datum_epsg_verified",
              "source_issue",
              "status",
              "target_sha"
            ] and
            .schema_version == "oc-eq1-kosovo-spatial-interop-result-v1" and
            .source_issue == 287 and
            .target_sha == $sha and .execution_sha == $sha and
            (.status == "pass" or .status == "blocked") and
            .external_bytes_persisted == false and
            .source_crs_datum_epsg_verified == false and
            .reprojection_authorized == false and
            .geographic_cross_source_equivalence_authorized == false and
            .publication_authorized == false and
            .model_use_authorized == false and
            (if .status == "pass" then
              .failure_class == null and
              (.profile | type) == "object" and
              (.profile | keys) == [
                "exposure_identity",
                "external_bytes_persisted",
                "geographic_cross_source_equivalence_authorized",
                "model_use_authorized",
                "profile",
                "publication_authorized",
                "raw_provider_coordinates_returned",
                "reference_runtime",
                "reference_runtime_coordinate_role_verified",
                "reprojection_authorized",
                "reprojection_performed",
                "schema_version",
                "site_identity",
                "source_crs_datum_epsg_verified",
                "source_issue"
              ] and
              .profile.schema_version == "oc-eq1-kosovo-spatial-interop-v0" and
              .profile.source_issue == 287 and
              .profile.reference_runtime.repository == "gem/oq-engine" and
              .profile.reference_runtime.tag == "v3.14.0" and
              .profile.reference_runtime.commit_sha == "9f044c93d72846421a8faa90ebf0a6afacdf3c20" and
              .profile.exposure_identity.dataset_id == "efehr.esrm20.european-exposure-model.v1.0" and
              .profile.exposure_identity.project_id == 186 and
              .profile.exposure_identity.project_path == "efehr/esrm20_exposure" and
              .profile.exposure_identity.commit_sha == "900433ada80fbb424c0976c34d72eeef97bab1af" and
              .profile.exposure_identity.repository_path == "_exposure_models/Exposure_Model_Kosovo_Res.csv" and
              .profile.exposure_identity.byte_count == 316789 and
              .profile.exposure_identity.sha256 == "4d562ad4925c527d518834b8dcd39a083cfd3b87b622031a84958ae7b4d8c5ea" and
              .profile.site_identity.dataset_id == "efehr.esrm20.risk-inputs.v1.0" and
              .profile.site_identity.project_id == 269 and
              .profile.site_identity.project_path == "efehr/esrm20" and
              .profile.site_identity.commit_sha == "05f83bbc9df81d02ee8ddb1801d9d781355ce783" and
              .profile.site_identity.repository_path == "Vs30/Site_model_Kosovo.xml" and
              .profile.site_identity.byte_count == 5891 and
              .profile.site_identity.sha256 == "746cf75d91507da8b55a9476c61bb5d884eed42c6268a36b1179f432e8850edd" and
              .profile.reference_runtime_coordinate_role_verified == true and
              .profile.source_crs_datum_epsg_verified == false and
              .profile.reprojection_performed == false and
              .profile.reprojection_authorized == false and
              .profile.geographic_cross_source_equivalence_authorized == false and
              .profile.raw_provider_coordinates_returned == false and
              .profile.external_bytes_persisted == false and
              .profile.publication_authorized == false and
              .profile.model_use_authorized == false and
              (.profile.profile | type) == "object" and
              (.profile.profile.exposure_record_count | type) == "number" and
              .profile.profile.exposure_record_count >= 1 and
              .profile.profile.exposure_record_count <= 100000 and
              (.profile.profile.distinct_exposure_location_count | type) == "number" and
              .profile.profile.distinct_exposure_location_count >= 1 and
              .profile.profile.distinct_exposure_location_count <= .profile.profile.exposure_record_count and
              (.profile.profile.site_record_count | type) == "number" and
              .profile.profile.site_record_count >= 1 and
              .profile.profile.site_record_count <= 10000 and
              (.profile.profile.distinct_site_location_count | type) == "number" and
              .profile.profile.distinct_site_location_count >= 1 and
              .profile.profile.distinct_site_location_count <= .profile.profile.site_record_count and
              (.profile.profile.threshold_diagnostics | type) == "array" and
              (.profile.profile.threshold_diagnostics | length) == 7 and
              [.profile.profile.threshold_diagnostics[].threshold_km] == ["1","5","10","15","20","25","50"] and
              ([.profile.profile.threshold_diagnostics[] |
                (.associated_exposure_record_count | type) == "number" and
                (.discarded_exposure_record_count | type) == "number" and
                .associated_exposure_record_count >= 0 and
                .discarded_exposure_record_count >= 0 and
                (.associated_exposure_record_count + .discarded_exposure_record_count) == $root.profile.profile.exposure_record_count and
                (.all_exposure_records_associated | type) == "boolean" and
                .all_exposure_records_associated == (.associated_exposure_record_count == $root.profile.profile.exposure_record_count)
              ] | all) and
              .profile.profile.openquake_default_asset_hazard_distance_km == "15" and
              .profile.profile.default_distance_association == .profile.profile.threshold_diagnostics[3] and
              .profile.profile.raw_coordinates_returned == false
            else
              .failure_class == "spatial_interop_profile_failure" and .profile == null
            end)
          ' >/dev/null
          BODY="$RESULT_MARKER
          $RESULT_JSON"
          jq -n --arg body "$BODY" '{body:$body}' > "$RUNNER_TEMP/spatial-interop-comment.json"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/287/comments" \
            --input "$RUNNER_TEMP/spatial-interop-comment.json"
