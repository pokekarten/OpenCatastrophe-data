name: One-shot canonical schema projection repair

on:
  push:
    branches:
      - agent/346-esrm20-event-hazard-actions

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Regenerate and verify exact projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cdd25675f21860a2eb9d30b466414ff2e620bdec"
          test "$(git hash-object scripts/schema_reference.py)" = "325fd1962037ecd9931051939b0aea668d236b10"
          python scripts/schema_reference.py --write
          test "$(wc -c < schemas/agent-action-result-v1.schema.md)" -eq 50722
          printf '%s  %s\n' \
            'bec802c4e91efb925e7dcd4ac5d39578aa981e54c3a09ce22ba24720ba337546' \
            'schemas/agent-action-result-v1.schema.md' | sha256sum --check --strict
          test "$(git hash-object schemas/agent-action-result-v1.schema.md)" = "d8509924e246ca740a7fb37bba883b36f7ea6b9e"
          python scripts/schema_reference.py --check
          test "$(git status --porcelain=v1)" = " M schemas/agent-action-result-v1.schema.md"

      - name: Commit only generated projection and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/agent-action-result-v1.schema.md
          git rm .github/workflows/one-shot-schema-projection.yml
          files="$(git diff --cached --name-only | sort | paste -sd ' ' -)"
          test "$files" = ".github/workflows/one-shot-schema-projection.yml schemas/agent-action-result-v1.schema.md"
          git commit -m 'Regenerate agent action result schema projection'

      - name: Push verified follow-up commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
