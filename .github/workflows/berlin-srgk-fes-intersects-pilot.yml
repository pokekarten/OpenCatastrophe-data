name: Berlin SRGK original FES Intersects pilot
on:
  pull_request:
    paths:
      - research_runners/berlin_srgk_fes_intersects_pilot_v0.py
      - tests/test_berlin_srgk_fes_intersects_pilot_v0.py
      - .github/workflows/berlin-srgk-fes-intersects-pilot.yml
      - docs/research/berlin-srgk-fes-intersects-pilot-v0.md
  push:
    branches: [main]
    paths:
      - .github/workflows/berlin-srgk-fes-intersects-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-original-fes-intersects:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact revision checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned original spatial validation
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
          python -m pip check
      - name: Synthetic original source and FES intersection challenges
        run: python -m unittest tests.test_berlin_srgk_fes_intersects_pilot_v0 -v
      - name: One exact official schema and FES original source operation
        if: github.event_name != 'pull_request'
        run: python -m research_runners.berlin_srgk_fes_intersects_pilot_v0
