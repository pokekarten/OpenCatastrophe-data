name: US Census 2026 COUNTY original source integrity gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research_runners/us_census_2026_county_zip_audit_v0.py
      - tests/test_us_census_2026_county_zip_audit_v0.py
      - research_runners/us_census_2026_parish_spatial_pilot_v0.py
      - tests/test_us_census_2026_parish_spatial_pilot_v0.py
      - research_runners/us_census_2026_louisiana_64_parish_qc_v0.py
      - tests/test_us_census_2026_louisiana_64_parish_qc_v0.py
      - .github/workflows/us-census-2026-county-original-audit.yml
  # One bounded original-source run on this research branch's workflow
  # change and once after merging the reviewed workflow into main.
  # Other ordinary commits do not generate repeated 80 MB downloads.
  push:
    branches: [main, research/worldwide-parish-peril-readiness-20261101]
    paths:
      - .github/workflows/us-census-2026-county-original-audit.yml

permissions:
  contents: read

concurrency:
  group: us-census-2026-county-audit
  cancel-in-progress: false

jobs:
  source-quality:
    name: Exact Census 2026 COUNTY/Parish source inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install reviewed spatial validation runtime
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-eu-flood-spatial.txt
          python -m pip check
      - name: Strict synthetic archive, DBF, and parish polygon tests
        run: >-
          python -m unittest
          tests.test_us_census_2026_county_zip_audit_v0
          tests.test_us_census_2026_parish_spatial_pilot_v0
          tests.test_us_census_2026_louisiana_64_parish_qc_v0
          -v
      - name: One fixed official original COUNTY archive, ephemeral data only
        # Source-byte run is allowed on this one explicitly scoped research
        # PR, not on unrelated PRs or ordinary pushes; no persistent data.
        if: github.event_name != 'pull_request' || github.event.pull_request.number == 1100
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          original="$RUNNER_TEMP/tl_2026_us_county.zip"
          trap 'rm -f "$original"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 210 --retry 0 \
            --max-filesize 125000000 \
            --output "$original" \
            'https://www2.census.gov/geo/tiger/TIGER2026/COUNTY/tl_2026_us_county.zip'
          python -m research_runners.us_census_2026_county_zip_audit_v0 \
            --source-zip "$original" \
            --independent-sha256 'b527c9ba7aeb8f17ef118f026eae5e5a938aa1d00b873bc32342d0dce59321c0'
          python -m research_runners.us_census_2026_parish_spatial_pilot_v0 \
            --source-zip "$original"
          python -m research_runners.us_census_2026_louisiana_64_parish_qc_v0 \
            --source-zip "$original"
          # Compared with the independently observed first original-source
          # GitHub Actions acquisition receipt 41409919889 (2026-11-02).
          # This proves repeat bytes, not immutable publisher hosting,
          # complete spatial topology or model-input licence/admission.
          # No raw polygons, asset values or insurance data leave temp storage.
