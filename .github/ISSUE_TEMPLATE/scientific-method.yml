name: Scientific source or methodology
description: Propose or challenge a scientific interpretation, validation design or transformation.
title: "[Science]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Public-safe content only.** Do not include secrets, signed/private URLs, private endpoints, customer/claims/portfolio data, confidential files, restricted dataset bytes, proprietary model assets or private repository/chat content.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: State the claim/question, evidence, units/CRS/time/quality semantics and a falsifiable validation approach.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-content safety
      options:
        - label: I confirmed this issue contains no secrets, confidential/customer/claims/portfolio data, private repository content or restricted dataset bytes.
          required: true
