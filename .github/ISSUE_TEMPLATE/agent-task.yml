name: Agent task
description: Define one bounded, collision-safe task for a human or AI agent using public-safe context only.
title: "[Agent]: "
labels: ["agent"]
body:
  - type: markdown
    attributes:
      value: |
        Define one bounded task from current public repository state and authoritative public sources.
        Do not include credentials, confidential information, customer/claims/portfolio data, restricted dataset bytes, proprietary model assets, temporary access URLs, private infrastructure details, private chat/repository content, screenshots of restricted systems, or machine-local storage paths.

        Before claiming the task, re-read current `main`, open Issues and open Pull Requests. Do not start a competing writer on a shared/single-writer surface. For implementation work, opening an issue-scoped draft PR is the visible write claim.

        Independent work discovered during execution belongs in a new linked Agent Task Issue (`Follow-up to #N`) instead of silently expanding this task.

  - type: textarea
    id: agent_state
    attributes:
      label: Agent execution state
      description: Keep these keys stable so humans and tools can project the issue into the v1 agent-task contract. Native GitHub dependencies remain the live planning relationship; `dependencies` below is an execution snapshot.
      render: yaml
      value: |
        agent_task:
          profile_version: "1.0.0"
          task_id: <stable-task-id>
          repository: pokekarten/OpenCatastrophe-data
          state: ready
          agent_ready: true
          workstream: <short-stable-area>
          reviewed_against:
            ref: refs/heads/main
            commit: <40-character-main-sha>
            checked_at: <ISO-8601-date-time>
          shared_surfaces:
            - path/to/shared/file
          data_boundary:
            bytes_policy: metadata_only
            source_identity: <dataset/product/version or none>
          dependencies: []
          next_action: <smallest coherent next action>
          hard_stop: <condition that requires stopping rather than guessing>
          acceptance:
            criteria:
              - <independently checkable completion criterion>
            commands:
              - argv: ["python", "scripts/check_all.py"]
                purpose: validate repository definition of done
            evidence: []
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State one bounded outcome.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: List exact files/contracts/source identity and what is intentionally out of scope.
    validations:
      required: true

  - type: textarea
    id: coordination_claim
    attributes:
      label: Coordination claim
      description: Make ownership and agent-to-agent handoff discoverable from GitHub alone.
      placeholder: |
        Primary write/shared surfaces:
        - path/to/file-or-contract

        Parent/predecessor issue: none
        Blocked by: none
        Open Issue overlap check: none found / coordinated in #...
        Open PR overlap check: none found / coordinated in #...
        Planned branch: agent/<issue-number>-<slug>
        Follow-up issues: none yet
    validations:
      required: true

  - type: textarea
    id: rights
    attributes:
      label: Rights and provenance boundary
      description: For external-source work, record provider/product identity, authoritative terms evidence, intended use, and byte state. Otherwise write N/A. Unknown or ambiguous rights remain blocking.
      placeholder: |
        Provider/product identity: ...
        Authoritative licence/terms evidence: ...
        External bytes acquired: no
        External bytes committed: no
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Define independently checkable completion criteria, exact commands/evidence, and exact byte/admission state where relevant. Keep this consistent with the machine-readable acceptance block above.
    validations:
      required: true

  - type: dropdown
    id: review_tier
    attributes:
      label: Review tier
      description: Choose the smallest review tier that matches the task risk. Tier 2 is for high-impact decisions, not routine changes.
      options:
        - Tier 0 — routine/reversible; CI and builder diff review
        - Tier 1 — independent reviewer should try to falsify the change
        - Tier 2 — independent reviewer plus challenger compares a credible alternative
    validations:
      required: true

  - type: textarea
    id: review_plan
    attributes:
      label: Independent review plan
      description: State why the tier fits, what independence means for this task, and the key falsification/challenge questions. Agents sharing one GitHub account must use distinct agent/run IDs for independent roles. Required roles use state pending/completed/unavailable. Tier 1 reviewer unavailability needs an explicit maintainer decision; Tier 2 unavailable roles remain blocking unless the maintainer explicitly downgrades the task first.
      placeholder: |
        Builder agent/run ID: ...
        Independent reviewer state: pending / completed / unavailable / N/A
        Independent reviewer agent/run ID: pending / ... / N/A
        Tier 1 reviewer-unavailable reason + maintainer decision: N/A / ...
        Challenger state: pending / completed / unavailable / N/A
        Challenger agent/run ID: N/A / pending / ...
        Tier 2 unavailable role / explicit tier downgrade: N/A / ...
        Why this tier: ...
        Reviewer falsification target: ...
        Tier 2 alternative/null hypothesis: N/A / ...
        Decision criteria: ...
    validations:
      required: true

  - type: textarea
    id: coordination
    attributes:
      label: Coordination and handoff
      description: Record current main identity, overlapping work checked, shared/single-writer surfaces, evidence, checks, assumptions, blockers, byte state, linked follow-up Issues, and the next independent task.
    validations:
      required: true

  - type: checkboxes
    id: collision_safety
    attributes:
      label: Collision safety and handoff
      options:
        - label: I checked current `main`, open Issues and open Pull Requests immediately before claiming this task.
          required: true
        - label: No active writer owns the same shared/single-writer surface, or the coordination is explicitly linked above.
          required: true
        - label: I will open a draft PR as soon as there is a coherent first implementation change and repeat the exact write/shared surfaces there.
          required: true
        - label: I will create a new linked Agent Task Issue for independent follow-up work rather than silently expanding this task.
          required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Repository and data boundaries
      options:
        - label: I read the applicable `AGENTS.md` instructions and will follow the stricter rule where instructions overlap.
          required: true
        - label: This task does not use confidential or restricted material as implementation source text.
          required: true
        - label: I will not commit credentials, temporary access URLs, restricted endpoints, machine-local storage paths, or unapproved external bytes.
          required: true
        - label: I will not broaden an admission state, validation rule, provenance conclusion, scientific conclusion, or rights conclusion merely to unblock implementation.
          required: true

  - type: checkboxes
    id: public_safety
    attributes:
      label: Public-content safety
      options:
        - label: I confirmed this issue contains no credentials, confidential/customer/claims/portfolio data, restricted assets, temporary access URLs, restricted endpoints, or machine-local storage details.
          required: true
        - label: I did not paste internal working-context transcripts, private repository material, or restricted source material into this issue.
          required: true
        - label: I did not attach source dataset bytes, screenshots of restricted systems, archives, documents, or logs that may contain non-public content.
          required: true
        - label: Any fixture, example, or evidence is independently synthetic, metadata-only, or explicitly approved for the exact public redistribution scope.
          required: true
