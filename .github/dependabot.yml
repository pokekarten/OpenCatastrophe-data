version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    # This source-locked manual HU2022 replay is an audited research workflow,
    # not a rolling action dependency. Its caller uses and checkout source_ref
    # must change together only after explicit source/CI validation.
    ignore:
      - dependency-name: "pokekarten/OpenCatastrophe-data/.github/workflows/rva-nrw-hu22-daria-fresh-independent-replay.yml"
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 1
    # This isolated historical Google ARCO ERA5 requirements file is a frozen
    # source-reproduction profile, not a rolling dependency set. Exclude the
    # entire one-off manifest, not just one package (gcsfs, numpy, xarray,
    # zarr and numcodecs must be tested together before any upgrade).
    # All other pip manifests remain eligible for Dependabot updates.
    exclude-paths:
      - "requirements-google-arco-2020-original-smoke.txt"
    commit-message:
      prefix: "deps(python)"
